com hipotensão, turgência jugular e pulmões limpos. Qual é a interpretação e a conduta imediata?","a":["Choque cardiogênico por falência do ventrículo esquerdo; usar diurético","Infarto do ventrículo direito; suspender nitrato e manter pré-carga","Reação adversa ao nitrato; administrar naloxona e observar o paciente","Pericardite associada; iniciar um anti-inflamatório não esteroidal"],"c":1,"e":"A tríade hipotensão, turgência jugular e pulmões limpos após nitrato em infarto inferior sugere infarto do ventrículo direito — uma câmara dependente de volume, em que reduzir a pré-carga derruba a pressão. Cerca de um terço dos STEMI inferiores tem envolvimento do ventrículo direito, e o sinal mais sensível é o supradesnivelamento ≥ 1 mm em V4R (V1 pode acompanhar). A conduta é suspender o nitrato, evitar diuréticos e manter a pré-carga; bradiarritmias podem agravar e exigir estimulação."},{"n":"🔴","levelName":"avancado","q":"Paciente com STEMI recebe fibrinólise, mas mantém \u003cstrong>dor isquêmica e supradesnivelamento de ST\u003c/strong> sem melhora. Qual é a conduta?","a":["Repetir a dose do fibrinolítico e reavaliar em uma hora","Aguardar a troponina para confirmar o infarto antes de decidir","Transferir para centro com ICP para angioplastia de resgate","Repetir o ECG em 30 minutos e aguardar antes de decidir"],"c":2,"e":"Dor persistente com supradesnivelamento de ST que não melhora após a fibrinólise é evidência de falha de reperfusão, e o paciente deve ser transferido para um centro com capacidade de ICP para angioplastia de resgate. Sinais de reperfusão bem-sucedida incluem alívio abrupto da dor, retorno do segmento ST à linha de base e arritmias de reperfusão. Cerca de 20% dos pacientes reperfundidos com fibrinolítico sofrem reoclusão, e repetir a dose, aguardar troponina ou apenas repetir o ECG atrasa a reperfusão."}]},{"id":"08","fullTitle":"08 — AVC isquêmico agudo","shortTitle":"AVC isquêmico agudo","subtitle":"Déficit neurológico focal súbito é AVC até prova em contrário. A decisão de reperfusão se apoia em três perguntas: **quando começou** (LKW), **há sangue na TC** e **existe grande vaso ocluído**.","toc":[{"id":"sec-1-conceito-e-reconhecimento","title":"1. Conceito e reconhecimento"},{"id":"sec-2-sala-vermelha-a-sequência-que-não-pode-mudar-de-ordem","title":"2. Sala vermelha: a sequência que não pode mudar de ordem"},{"id":"sec-3-nihss","title":"3. NIHSS"},{"id":"sec-4-imagem-e-aspects","title":"4. Imagem e ASPECTS"},{"id":"sec-5-trombólise-intravenosa-ivt","title":"5. Trombólise intravenosa (IVT)"},{"id":"sec-6-janelas-estendidas-e-wake-up","title":"6. Janelas estendidas e wake-up"},{"id":"sec-7-pressão-arterial-decorar-a-sequência","title":"7. Pressão arterial — decorar a sequência"},{"id":"sec-8-glicemia-temperatura-e-oxigênio","title":"8. Glicemia, temperatura e oxigênio"},{"id":"sec-9-antiagregação-e-anticoagulação","title":"9. Antiagregação e anticoagulação"},{"id":"sec-10-trombectomia-evt","title":"10. Trombectomia (EVT)"},{"id":"sec-11-complicações-da-trombólise-e-cuidados-pós-reperfusão","title":"11. Complicações da trombólise e cuidados pós-reperfusão"},{"id":"sec-12-ait-ataque-isquêmico-transitório","title":"12. AIT — ataque isquêmico transitório"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-conceito-e-reconhecimento\">\u003ch2>1. Conceito e reconhecimento\u003c/h2>\u003cul>\u003cli>\u003cstrong>AVCi\u003c/strong> = oclusão arterial cerebral → queda de fluxo → falência energética → lesão neuronal. A \u003cstrong>maioria dos AVCs é isquêmica\u003c/strong>: cerca de \u003cstrong>80%\u003c/strong> na aula da disciplina e \u003cstrong>≈87%\u003c/strong> no material do ACLS; a \u003cstrong>hemorragia intraparenquimatória\u003c/strong> fica em torno de \u003cstrong>10%\u003c/strong>, com a \u003cstrong>HSA\u003c/strong> no restante. O AVC é a \u003cstrong>principal causa de morte no Brasil\u003c/strong> (2ª no mundo).\u003c/li>\u003cli>\u003cstrong>Core × penumbra:\u003c/strong> core é o tecido já gravemente lesado; \u003cstrong>penumbra\u003c/strong> é o tecido hipoperfundido ainda potencialmente salvável — é ela que a reperfusão tenta resgatar. 🔥 \u003cstrong>\"Tempo é cérebro\":\u003c/strong> sem reperfusão, a penumbra vira core.\u003c/li>\u003cli>\u003cstrong>Fatores de risco de alto rendimento:\u003c/strong> \u003cstrong>HAS, fibrilação atrial, diabetes, dislipidemia, tabagismo, aterosclerose\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Déficit neurológico focal súbito = AVC até prova em contrário.\u003c/strong> A suspeita é clínica: a imagem serve para excluir hemorragia, não para \"confirmar\" o AVCi.\u003c/li>\u003cli>\u003cstrong>Reconhecimento pré-hospitalar — Escala de Cincinnati\u003c/strong> (três achados):\u003cul>\u003cli>\u003cstrong>face:\u003c/strong> desvio de rima / queda facial;\u003c/li>\u003cli>\u003cstrong>braços:\u003c/strong> um braço cai ou não tem força em comparação ao outro;\u003c/li>\u003cli>\u003cstrong>fala:\u003c/strong> mistura de palavras ou palavras incompreensíveis. Serve para reconhecer o AVC, agilizar a trombólise e triar neurocirurgia; \u003cstrong>não substitui o NIHSS\u003c/strong> na chegada.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>LKW (\"last known well\")\u003c/strong> = \u003cstrong>último momento em que o paciente estava sabidamente normal\u003c/strong>. Exemplo clássico: dormiu normal às \u003cstrong>22 h\u003c/strong>, acordou às \u003cstrong>6 h\u003c/strong> com déficit → \u003cstrong>LKW = 22 h\u003c/strong>, não 6 h. É a pergunta que \u003cstrong>trava todo o fluxo\u003c/strong>: sem LKW não há janela.\u003c/li>\u003cli>\u003cstrong>Mimics\u003c/strong> que precisam ser afastados: hipoglicemia, crise epiléptica/paresia de \u003cstrong>Todd\u003c/strong>, migrânea com aura, distúrbios metabólicos, intoxicações, vestibulopatias, lesão expansiva/subdural.\u003c/li>\u003cli>No hospital, o paciente deve ser visto por médico/equipe de AVC em \u003cstrong>≤10 min\u003c/strong> da chegada; o cuidado se organiza nos \u003cstrong>8 Ds\u003c/strong> — detecção, envio, entrega, porta, dados, decisão, medicamento/dispositivo, disposição.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-sala-vermelha-a-sequência-que-não-pode-mudar-de-ordem\">\u003ch2>2. Sala vermelha: a sequência que não pode mudar de ordem\u003c/h2>\u003cpre>\u003ccode>Suspeita de AVC\n   → ABCDE\n   → monitor + acesso IV\n   → GLICEMIA\n   → LKW\n   → NIHSS + o déficit é incapacitante?\n   → TC sem contraste → há sangue?\n        → SIM: protocolo hemorrágico\n        → NÃO: avaliar IVT\n   → angio-TC crânio/pescoço → há LVO?\n   → avaliar EVT\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003cstrong>A — via aérea:\u003c/strong> proteger se rebaixamento, vômitos, disfagia ou secreções.\u003c/li>\u003cli>\u003cstrong>B — respiração:\u003c/strong> se hipóxia, O₂ para \u003cstrong>SpO₂ &gt;94%\u003c/strong>; quem não está hipóxico \u003cstrong>não recebe\u003c/strong> O₂ de rotina.\u003c/li>\u003cli>\u003cstrong>C — circulação:\u003c/strong> PA, FC e monitor; corrigir \u003cstrong>hipotensão/hipovolemia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>D — neurológico:\u003c/strong> Glasgow + pupilas + \u003cstrong>NIHSS\u003c/strong> + \u003cstrong>glicemia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>E — exposição:\u003c/strong> temperatura, trauma, sangramento, infecção.\u003c/li>\u003cli>\u003cstrong>Glicemia &lt;60 mg/dL → corrigir.\u003c/strong> Se o déficit desaparecer após a correção, pense em \u003cstrong>mimic\u003c/strong> (hipoglicemia); se persistir e for incapacitante, siga o protocolo de AVC. Dos laboratórios, a \u003cstrong>glicemia é o único exame que precisa preceder a alteplase\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Déficit incapacitante é julgamento clínico, não um número:\u003c/strong> NIHSS baixo \u003cstrong>não exclui\u003c/strong> trombólise quando o déficit limita o paciente.\u003c/li>\u003cli>\u003cstrong>Elegível para IVT + EVT → fazer as duas\u003c/strong>, sem esperar resposta da trombólise; e na suspeita de LVO, \u003cstrong>não espere a creatinina\u003c/strong> para angio-TC/perfusão.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-nihss\">\u003ch2>3. NIHSS\u003c/h2>\u003cul>\u003cli>Escala de \u003cstrong>gravidade neurológica\u003c/strong>, de \u003cstrong>0 a 42\u003c/strong>: \u003cstrong>0\u003c/strong> = sem comprometimento; \u003cstrong>1–20\u003c/strong> = leve a moderado; \u003cstrong>&gt;20\u003c/strong> = grave. Um \u003cstrong>aumento ≥2 pontos\u003c/strong> em avaliações seriadas sugere \u003cstrong>progressão\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>NIHSS baixo não exclui IVT\u003c/strong> quando o déficit é \u003cstrong>incapacitante\u003c/strong> — a escala mede gravidade, não elegibilidade.\u003c/li>\u003cli>\u003cstrong>Circulação posterior pode ser grave com NIHSS relativamente baixo\u003c/strong> (basilar, por exemplo) — o número não dá conforto.\u003c/li>\u003cli>O NIHSS entra nos critérios de \u003cstrong>EVT\u003c/strong> (\u003cstrong>≥6\u003c/strong> na circulação anterior; \u003cstrong>≥10\u003c/strong> no basilar) e na definição de \u003cstrong>AVCi menor\u003c/strong> (\u003cstrong>≤3\u003c/strong>, para a dupla antiagregante).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-imagem-e-aspects\">\u003ch2>4. Imagem e ASPECTS\u003c/h2>\u003cul>\u003cli>\u003cstrong>TC sem contraste\u003c/strong> para todos com suspeita: responde \u003cstrong>\"há sangue?\"\u003c/strong> e mostra sinais precoces, como a \u003cstrong>ACM hiperdensa\u003c/strong>. 🔥 \u003cstrong>TC normal precoce não exclui AVCi\u003c/strong> — o diagnóstico é clínico + exclusão de hemorragia.\u003c/li>\u003cli>\u003cstrong>Angio-TC crânio + pescoço:\u003c/strong> responde \u003cstrong>\"há LVO? qual vaso?\"\u003c/strong> — é o exame que planeja a \u003cstrong>trombectomia\u003c/strong>. \u003cstrong>Não esperar creatinina\u003c/strong> para angio-TC/perfusão na suspeita de LVO.\u003c/li>\u003cli>\u003cstrong>TC de perfusão:\u003c/strong> separa \u003cstrong>core × penumbra\u003c/strong>; útil principalmente na \u003cstrong>janela estendida\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>RM-DWI:\u003c/strong> isquemia aguda. \u003cstrong>DWI+/FLAIR−\u003c/strong> é sinal de \u003cstrong>relógio tecidual favorável\u003c/strong> — apoia a decisão no wake-up, mas \u003cstrong>não prova\u003c/strong> que o evento está dentro de 4,5 h.\u003c/li>\u003cli>⏱️ \u003cstrong>Tempos de imagem:\u003c/strong> o alvo atual é \u003cstrong>imagem o mais rápido possível\u003c/strong> (exemplo: \u003cstrong>≤25 min\u003c/strong>). As metas de \u003cstrong>interpretação da TC em ≤45 min\u003c/strong> e de \u003cstrong>porta-agulha ≤60 min\u003c/strong> são de \u003cstrong>2019\u003c/strong> — trate como \u003cstrong>metas históricas\u003c/strong>; no material clássico, a meta de porta-imagem era \u003cstrong>≤20 min\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>ASPECTS (0–10):\u003c/strong> quanto \u003cstrong>maior\u003c/strong>, menor a carga isquêmica; quanto \u003cstrong>menor\u003c/strong>, maior o core. 🔥 \u003cstrong>ASPECTS baixo não significa futilidade automática\u003c/strong> — é a mudança de paradigma que abriu a EVT para o large core.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-trombólise-intravenosa-ivt\">\u003ch2>5. Trombólise intravenosa (IVT)\u003c/h2>\u003cul>\u003cli>\u003cstrong>Janela convencional: ≤4,5 h\u003c/strong> do início/LKW, em paciente elegível com \u003cstrong>déficit incapacitante\u003c/strong>. O benefício cai com o tempo — quanto mais cedo, melhor.\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose\u003c/th>\u003cth>Máximo\u003c/th>\u003cth>Administração\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Alteplase\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0,9 mg/kg\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>90 mg\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>10% em bolus\u003c/strong> + restante em \u003cstrong>60 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tenecteplase (TNK)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0,25 mg/kg\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>25 mg\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>bolus único\u003c/strong> (5–10 s)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Ambas são \u003cstrong>opções na janela ≤4,5 h\u003c/strong>. \u003cstrong>TNK 0,4 mg/kg não é recomendada\u003c/strong> no AVCi.\u003c/li>\u003cli>🇧🇷 \u003cstrong>TNK no Brasil:\u003c/strong> aprovada pela ANVISA em \u003cstrong>12/2025\u003c/strong>; SAMU habilitado (Portaria GM/MS \u003cstrong>7.459/2025\u003c/strong>); \u003cstrong>incorporação no SUS ainda em evolução (2026)\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Checklist antes de trombolisar:\u003c/strong> TC \u003cstrong>sem hemorragia\u003c/strong> | déficit \u003cstrong>incapacitante\u003c/strong> | \u003cstrong>janela\u003c/strong> | \u003cstrong>glicemia\u003c/strong> | \u003cstrong>PA &lt;185/110\u003c/strong> | revisar \u003cstrong>anticoagulantes, sangramento e coagulopatia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Laboratório:\u003c/strong> plaquetas \u003cstrong>≥100.000/mm³\u003c/strong>, \u003cstrong>INR ≤1,7\u003c/strong>, \u003cstrong>aPTT ≤40 s\u003c/strong> — limiares do PCDT e das diretrizes anteriores (AHA 2019). 🔥 \u003cstrong>Sem motivo para suspeitar de coagulopatia, não atrase a IVT aguardando exames.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Sintomas leves não incapacitantes (NIHSS 0–5) não são indicação\u003c/strong> de trombólise — a recomendação não se aplica a déficit leve que não limita o paciente.\u003c/li>\u003cli>\u003cstrong>Não administrar\u003c/strong> se \u003cstrong>HBPM em dose completa nas últimas 24 h\u003c/strong> (material ACLS).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-1-o-que-contraindica\">5.1 O que contraindica\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Hemorragia na TC\u003c/strong> → não trombolisar.\u003c/li>\u003cli>\u003cstrong>PA que não cede\u003c/strong> ao controle (persistente \u003cstrong>≥185/110 mmHg\u003c/strong>) → não iniciar.\u003c/li>\u003cli>\u003cstrong>Coagulopatia/anticoagulação\u003c/strong> a avaliar: \u003cstrong>INR acima de 1,7\u003c/strong> (p. ex., 2,2), plaquetas \u003cstrong>abaixo de 100 mil\u003c/strong> e \u003cstrong>aPTT acima de 40 s\u003c/strong> são os limiares do PCDT e das diretrizes anteriores (AHA 2019).\u003c/li>\u003cli>\u003cstrong>Ressalva de completude:\u003c/strong> este material \u003cstrong>não traz a lista completa\u003c/strong> de contraindicações absolutas e relativas, e versões antigas circulam com números misturados (\u003cstrong>PAS &gt;180/PAD &gt;105\u003c/strong> versus \u003cstrong>185/110\u003c/strong>; janela de \u003cstrong>3 h\u003c/strong> versus \u003cstrong>4,5 h\u003c/strong>). Fixe o \u003cstrong>checklist\u003c/strong> e confira a diretriz vigente antes de memorizar listas prontas.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-janelas-estendidas-e-wake-up\">\u003ch2>6. Janelas estendidas e wake-up\u003c/h2>\u003cul>\u003cli>\u003cstrong>Wake-up / horário desconhecido:\u003c/strong> com \u003cstrong>DWI+/FLAIR− adequado\u003c/strong>, a IVT pode beneficiar quando administrada \u003cstrong>dentro de ≤4,5 h do reconhecimento\u003c/strong> dos sintomas. O padrão \u003cstrong>não prova cronologia\u003c/strong> — funciona como \u003cstrong>relógio tecidual\u003c/strong> favorável.\u003c/li>\u003cli>\u003cstrong>4,5–9 h do LKW\u003c/strong> (ou \u003cstrong>wake-up selecionado\u003c/strong>) com \u003cstrong>penumbra salvável\u003c/strong> e \u003cstrong>sem EVT disponível\u003c/strong> → a IVT \u003cstrong>pode beneficiar\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>LVO + penumbra, 4,5–24 h, com EVT indisponível\u003c/strong> → a IVT \u003cstrong>pode ser considerada (Classe 2b)\u003c/strong> — e \u003cstrong>não substitui a EVT\u003c/strong> quando a trombectomia está disponível.\u003c/li>\u003cli>Quem decide a janela estendida é a \u003cstrong>imagem\u003c/strong> (DWI/FLAIR no wake-up; perfusão core × penumbra) somada à seleção clínica.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-pressão-arterial-decorar-a-sequência\">\u003ch2>7. Pressão arterial — decorar a sequência\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Momento\u003c/th>\u003cth>Alvo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Antes da IVT\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>&lt;185/110 mmHg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Após IVT\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>&lt;180/105 mmHg por ≥24 h\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EVT sem IVT — antes\u003c/td>\u003ctd>\u003cstrong>≤185/110 mmHg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Durante e após a EVT\u003c/td>\u003ctd>\u003cstrong>≤180/105 mmHg por 24 h\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sem reperfusão\u003c/td>\u003ctd>geralmente \u003cstrong>não tratar se &lt;220/120 mmHg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pós-EVT recanalizado\u003c/td>\u003ctd>\u003cstrong>não perseguir PAS &lt;140 mmHg\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>🔥 \u003cstrong>Senha: 185/110 → 180/105 → 220/120.\u003c/strong>\u003c/li>\u003cli>Se tratar sem reperfusão, a redução inicial deve ser \u003cstrong>cautelosa (≈15%)\u003c/strong> — referência \u003cstrong>AHA 2019/PCDT\u003c/strong>; \u003cstrong>não existe PAM fixa específica de AVC\u003c/strong>. Corrigir hipotensão e hipovolemia faz parte do cuidado.\u003c/li>\u003cli>\u003cstrong>Não perseguir PAS &lt;140 no recanalizado:\u003c/strong> pressão baixa demais se associa a piora, não a benefício.\u003c/li>\u003cli>O alvo \u003cstrong>&lt;160/100\u003c/strong> pós-recanalização, às vezes atribuído ao PCDT, \u003cstrong>não corresponde aos documentos vigentes\u003c/strong> — não use; os documentos do MS indicam \u003cstrong>&lt;180/105\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-glicemia-temperatura-e-oxigênio\">\u003ch2>8. Glicemia, temperatura e oxigênio\u003c/h2>\u003cul>\u003cli>\u003cstrong>Glicemia &lt;60 mg/dL → tratar\u003c/strong> (dextrose). \u003cstrong>Hiperglicemia persistente\u003c/strong> nas primeiras 24 h piora o resultado → alvo \u003cstrong>140–180 mg/dL\u003c/strong>, com monitorização para não causar hipoglicemia. 🔥 \u003cstrong>Não buscar 80–130 mg/dL de forma intensiva.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Temperatura:\u003c/strong> \u003cstrong>tratar hipertermia e investigar a fonte\u003c/strong>, visando \u003cstrong>normotermia\u003c/strong>. O limiar \u003cstrong>&gt;37,5 °C\u003c/strong> é dos \u003cstrong>documentos brasileiros (PCDT)\u003c/strong> — a referência AHA trata hipertermia \u003cstrong>sem limiar numérico fixo\u003c/strong>; não atribua o número à AHA.\u003c/li>\u003cli>\u003cstrong>Oxigênio:\u003c/strong> apenas se hipóxia, para \u003cstrong>SpO₂ &gt;94%\u003c/strong>; não suplementar quem satura bem.\u003c/li>\u003cli>🔥 \u003cstrong>Senha metabólica: 60 | 140–180 | 94.\u003c/strong>\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-9-antiagregação-e-anticoagulação\">\u003ch2>9. Antiagregação e anticoagulação\u003c/h2>\u003cul>\u003cli>\u003cstrong>AAS:\u003c/strong> iniciar em \u003cstrong>24–48 h\u003c/strong> do início; \u003cstrong>após alteplase, adiar até 24 h\u003c/strong> (prática clássica).\u003c/li>\u003cli>\u003cstrong>AVCi menor, não cardioembólico, NIHSS ≤3, sem IVT:\u003c/strong> \u003cstrong>AAS + clopidogrel\u003c/strong> iniciando \u003cstrong>em até 24 h\u003c/strong> e mantendo por \u003cstrong>21 dias\u003c/strong> → depois, \u003cstrong>monoterapia\u003c/strong>. 🔥 \u003cstrong>Senha: 3–24–21\u003c/strong> (NIHSS ≤3 · início ≤24 h · 21 dias).\u003c/li>\u003cli>\u003cstrong>Após IVT:\u003c/strong> a prática clássica é \u003cstrong>TC/RM em 24 h antes de iniciar\u003c/strong> antiagregante/anticoagulante (\u003cstrong>AHA 2019\u003c/strong>). Na referência mais recente, o risco da \u003cstrong>antiagregação precoce pós-IVT é incerto (2b)\u003c/strong> — não é regra absoluta, mas a precaução clássica (TC/RM em 24 h) segue como prática segura.\u003c/li>\u003cli>\u003cstrong>Anticoagulação terapêutica precoce não é rotina para todos\u003c/strong> no AVCi agudo. A referência mais recente considera \u003cstrong>razoável (2a)\u003c/strong> anticoagulação oral precoce na \u003cstrong>FA cuidadosamente selecionada\u003c/strong>. 🔥 \u003cstrong>Antiagregante + anticoagulante associados = potencialmente prejudicial (3-Harm).\u003c/strong>\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-10-trombectomia-evt\">\u003ch2>10. Trombectomia (EVT)\u003c/h2>\u003cul>\u003cli>\u003cstrong>EVT\u003c/strong> = retirada mecânica do trombo. A elegibilidade combina \u003cstrong>clínica (NIHSS, mRS)\u003c/strong> e \u003cstrong>imagem (ASPECTS)\u003c/strong>:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cenário\u003c/th>\u003cth>Critérios\u003c/th>\u003cth>Recomendação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>0–6 h\u003c/strong>\u003c/td>\u003ctd>ICA/M1 + \u003cstrong>NIHSS ≥6\u003c/strong> + \u003cstrong>mRS 0–1\u003c/strong> + \u003cstrong>ASPECTS 3–10\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Classe I\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>6–24 h\u003c/strong>\u003c/td>\u003ctd>ICA/M1 + \u003cstrong>NIHSS ≥6\u003c/strong> + \u003cstrong>mRS 0–1\u003c/strong> + \u003cstrong>ASPECTS ≥6\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Classe I\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ASPECTS 3–5 (6–24 h)\u003c/strong>\u003c/td>\u003ctd>selecionados: \u003cstrong>&lt;80 anos\u003c/strong>, NIHSS ≥6, mRS 0–1, sem efeito de massa significativo\u003c/td>\u003ctd>\u003cstrong>Classe I (selecionados)\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ASPECTS 0–2 (≤6 h)\u003c/strong>\u003c/td>\u003ctd>mesmos critérios de seleção\u003c/td>\u003ctd>\u003cstrong>razoável — 2a\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Basilar (até 24 h)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>NIHSS ≥10\u003c/strong> + \u003cstrong>PC-ASPECTS ≥6\u003c/strong> + \u003cstrong>mRS 0–1\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Classe 1A\u003c/strong> (NIHSS 6–9 = \u003cstrong>2b\u003c/strong>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>🔥 \u003cstrong>Elegível para IVT e EVT → fazer as duas\u003c/strong>, sem esperar resposta da trombólise (não existe período de observação pós-alteplase antes de encaminhar para a EVT).\u003c/li>\u003cli>\u003cstrong>Não misturar as nomenclaturas de seleção:\u003c/strong> a faixa \u003cstrong>6–24 h\u003c/strong> da referência mais recente usa \u003cstrong>NIHSS/ASPECTS/mRS\u003c/strong>; \u003cstrong>DAWN/DEFUSE-3\u003c/strong> (volume de core e mismatch) são a seleção do \u003cstrong>PCDT (8–24 h)\u003c/strong> — lógicas diferentes, de documentos diferentes.\u003c/li>\u003cli>\u003cstrong>ASPECTS baixo não é futilidade automática\u003c/strong> — daí as faixas 3–5 e 0–2 em pacientes selecionados. Os cortes de seleção são o que mais varia entre protocolos: confira a diretriz vigente.\u003c/li>\u003cli>\u003cstrong>Não espere creatinina\u003c/strong> para angio-TC/perfusão na suspeita de LVO.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-11-complicações-da-trombólise-e-cuidados-pós-reperfusão\">\u003ch2>11. Complicações da trombólise e cuidados pós-reperfusão\u003c/h2>\u003cul>\u003cli>\u003cstrong>Sangramento intracraniano\u003c/strong> é a complicação mais temida. \u003cstrong>Cuidado com o número \"15–27%\"\u003c/strong> que circula em materiais antigos: ele mistura conceitos diferentes (micro-hemorragias preexistentes na RM, transformação hemorrágica e hemorragia sintomática) — sem fonte confiável, não serve para prova.\u003c/li>\u003cli>\u003cstrong>Sinais de alarme:\u003c/strong> \u003cstrong>cefaleia intensa + náuseas/vômitos + hipertensão + piora neurológica\u003c/strong> → suspeitar de \u003cstrong>hemorragia intracraniana\u003c/strong> → \u003cstrong>interromper a alteplase se estiver correndo + TC urgente\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Angioedema orolingual:\u003c/strong> risco maior com \u003cstrong>IECA\u003c/strong> e infartos insular/frontal. Conduta: \u003cstrong>interromper a infusão\u003c/strong>, avaliar/garantir a \u003cstrong>via aérea\u003c/strong>, administrar \u003cstrong>metilprednisolona + difenidramina + ranitidina/famotidina\u003c/strong>, dar suporte e \u003cstrong>suspender o IECA\u003c/strong> — a orientação de \"manter o IECA\" que circula em material antigo está \u003cstrong>errada\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Monitorização pós-reperfusão:\u003c/strong> PA e exame neurológico em \u003cstrong>15/15 min por 2 h → 30/30 min por 6 h → 1/1 h até 24 h\u003c/strong> — esquema clássico \u003cstrong>AHA 2019/PCDT\u003c/strong>. No material ACLS, NIHSS/pupilas/Glasgow \u003cstrong>a cada hora\u003c/strong> nas primeiras 24 h.\u003c/li>\u003cli>\u003cstrong>Rastrear disfagia antes de alimentar\u003c/strong>; monitorar glicemia, temperatura, SpO₂ e procurar complicações.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-12-ait-ataque-isquêmico-transitório\">\u003ch2>12. AIT — ataque isquêmico transitório\u003c/h2>\u003cul>\u003cli>\u003cstrong>AIT\u003c/strong> = episódio de déficit focal \u003cstrong>transitório, sem infarto\u003c/strong> — a definição tecidual substituiu a antiga (\"dura menos de 24 h\"). A maioria resolve em \u003cstrong>menos de 1 h\u003c/strong>.\u003c/li>\u003cli>🔥 \u003cstrong>12% dos AVCs são precedidos por AIT\u003c/strong> — trate com a \u003cstrong>mesma urgência\u003c/strong> de um AVC: investigar a causa e iniciar prevenção.\u003c/li>\u003cli>Déficit que \u003cstrong>melhora rapidamente\u003c/strong> (recuperação completa em minutos) → pense em \u003cstrong>AIT ou mimic\u003c/strong>; a suspeita inicial \u003cstrong>não\u003c/strong> é hemorragia, e uma PA alta durante o episódio não muda essa interpretação.\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Paciente dormiu às 22 h sem sintomas e acordou às 6 h com hemiparesia direita e afasia. Qual é o LKW e por que ele é a primeira informação a resolver?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> LKW é \u003cstrong>22 h\u003c/strong> — o último momento em que o paciente estava sabidamente normal. O horário de despertar não marca o início do AVC: o evento aconteceu em algum momento entre 22 h e 6 h. Sem esse dado não se aplica à janela da trombólise intravenosa (\u003cstrong>≤4,5 h\u003c/strong>), e é por isso que \"quando começaram os sintomas?\" é a primeira pergunta da sala vermelha. Quando a janela é desconhecida, a decisão passa a depender de imagem (DWI/FLAIR ou perfusão).\u003c/p>"},{"titleHtml":"🟢 Chega à sala vermelha um paciente com suspeita de AVC isquêmico. Descreva o fluxo inicial, do ABCDE até a decisão de reperfusão.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> ABCDE com proteção de via aérea, O₂ só se hipóxia (SpO₂ &gt;94%), monitor e acesso venoso, exame neurológico com Glasgow, pupilas e NIHSS, e \u003cstrong>glicemia\u003c/strong> — hipoglicemia \u003cstrong>&lt;60 mg/dL\u003c/strong> é corrigida e, se o déficit sumir, era mimic. Em paralelo, define-se o \u003cstrong>LKW\u003c/strong> e se o déficit é \u003cstrong>incapacitante\u003c/strong>. Segue \u003cstrong>TC sem contraste\u003c/strong> para excluir hemorragia; sem sangramento, avalia-se \u003cstrong>IVT\u003c/strong> (janela \u003cstrong>≤4,5 h\u003c/strong>). Na suspeita de oclusão de grande vaso, \u003cstrong>angio-TC\u003c/strong> de crânio/pescoço — sem esperar creatinina — e avaliação de \u003cstrong>EVT\u003c/strong>. Quem é elegível às duas terapias faz as duas.\u003c/p>"},{"titleHtml":"🟡 Paciente de 80 kg, elegível à trombólise intravenosa. Calcule a dose de alteplase e descreva como administrá-la. E se a escolha fosse tenecteplase?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Alteplase \u003cstrong>0,9 mg/kg\u003c/strong> → 80 kg × 0,9 = \u003cstrong>72 mg\u003c/strong> (abaixo do teto de \u003cstrong>90 mg\u003c/strong>, que só seria atingido em ≥100 kg). Administra-se \u003cstrong>10% em bolus\u003c/strong> (7,2 mg) e o restante (64,8 mg) em \u003cstrong>infusão de 60 min\u003c/strong>. Se a escolha fosse tenecteplase, \u003cstrong>0,25 mg/kg\u003c/strong> = \u003cstrong>20 mg\u003c/strong> (teto \u003cstrong>25 mg\u003c/strong>), em \u003cstrong>bolus único\u003c/strong> de 5–10 s. A dose de TNK \u003cstrong>0,4 mg/kg não é recomendada\u003c/strong>.\u003c/p>"},{"titleHtml":"🟡 Quais são os alvos de pressão arterial antes, durante e depois da reperfusão? Por que não perseguir PAS &lt;140 no paciente recanalizado?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Antes da IVT: \u003cstrong>&lt;185/110 mmHg\u003c/strong> — acima disso, controlar primeiro e depois trombolisar. Após a IVT: \u003cstrong>&lt;180/105 mmHg por ≥24 h\u003c/strong>. Na EVT sem IVT, \u003cstrong>≤185/110\u003c/strong> antes; durante e por 24 h depois, \u003cstrong>≤180/105\u003c/strong>. Sem nenhuma reperfusão, geralmente \u003cstrong>não tratar se &lt;220/120 mmHg\u003c/strong>; se tratar, redução cautelosa (\u003cstrong>≈15%\u003c/strong> — referência AHA 2019/PCDT). No recanalizado, \u003cstrong>não buscar PAS &lt;140\u003c/strong>: queda excessiva se associa a piora, e não há ganho demonstrado em perseguir esse alvo. Não existe PAM fixa específica de AVC; corrija hipotensão e hipovolemia.\u003c/p>"},{"titleHtml":"🟡 Quem são os candidatos à trombectomia mecânica nas primeiras 6 h e entre 6 e 24 h?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>0–6 h:\u003c/strong> oclusão de ICA/M1 com \u003cstrong>NIHSS ≥6\u003c/strong>, \u003cstrong>mRS 0–1\u003c/strong> e \u003cstrong>ASPECTS 3–10\u003c/strong> → EVT Classe I. \u003cstrong>6–24 h:\u003c/strong> os mesmos NIHSS e mRS com \u003cstrong>ASPECTS ≥6\u003c/strong> → Classe I; pacientes com \u003cstrong>ASPECTS 3–5\u003c/strong> e critérios de seleção (&lt;80 anos, sem efeito de massa significativo) também entram como Classe I, e \u003cstrong>ASPECTS 0–2 em ≤6 h\u003c/strong> é razoável (\u003cstrong>2a\u003c/strong>). O basilar tem critérios próprios: \u003cstrong>NIHSS ≥10 + PC-ASPECTS ≥6 + mRS 0–1\u003c/strong> até 24 h (\u003cstrong>1A\u003c/strong>; NIHSS 6–9 fica \u003cstrong>2b\u003c/strong>). A seleção de \u003cstrong>6–24 h\u003c/strong> usa \u003cstrong>NIHSS/ASPECTS/mRS\u003c/strong> — não misturar com DAWN/DEFUSE-3, que são a seleção do PCDT (8–24 h). Quem tem indicação das duas terapias faz \u003cstrong>IVT + EVT\u003c/strong>, sem esperar resposta da droga.\u003c/p>"},{"titleHtml":"🔴 Paciente com oclusão de grande vaso e penumbra salvável, 12 h do último momento bem conhecido, em serviço sem trombectomia disponível. O que pode ser considerado? E o que muda no wake-up?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Na janela \u003cstrong>4,5–24 h\u003c/strong> com LVO, penumbra salvável e \u003cstrong>impossibilidade de EVT\u003c/strong>, a trombólise intravenosa \u003cstrong>pode ser considerada (Classe 2b)\u003c/strong> — ela \u003cstrong>não substitui a EVT\u003c/strong> quando a trombectomia está disponível; na ausência do serviço, é uma opção a discutir caso a caso, guiada por imagem. Em \u003cstrong>4,5–9 h\u003c/strong> do LKW ou wake-up selecionado com penumbra salvável e sem EVT, a IVT também pode beneficiar. No wake-up/horário desconhecido, o padrão \u003cstrong>DWI+/FLAIR−\u003c/strong> é um \u003cstrong>relógio tecidual favorável\u003c/strong> — apoia a decisão, mas \u003cstrong>não prova\u003c/strong> que o evento está dentro de 4,5 h.\u003c/p>"},{"titleHtml":"🔴 Durante a infusão de alteplase, o paciente evolui com cefaleia intensa, náuseas e vômitos, elevação da PA e piora do déficit. Qual é a suspeita e a conduta imediata?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> O conjunto — \u003cstrong>cefaleia intensa + náuseas/vômitos + hipertensão + piora neurológica\u003c/strong> — é o sinal de alarme clássico de \u003cstrong>hemorragia intracraniana\u003c/strong> pós-trombólise. A conduta é \u003cstrong>interromper a alteplase\u003c/strong> se ainda estiver correndo e levar o paciente para \u003cstrong>TC de crânio urgente\u003c/strong>, mantendo monitorização e suporte. Se a apresentação fosse \u003cstrong>edema de lábios/língua\u003c/strong> com dificuldade de falar, a suspeita seria \u003cstrong>angioedema orolingual\u003c/strong>: interromper a infusão, avaliar/garantir a via aérea, metilprednisolona + difenidramina + ranitidina/famotidina e \u003cstrong>suspender o IECA\u003c/strong>.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Homem de 66 anos chega à sala vermelha com \u003cstrong>hemiparesia direita súbita\u003c/strong>. Qual informação define a \u003cstrong>janela de trombólise\u003c/strong> e deve ser buscada primeiro?","a":["O valor da pressão arterial medido na chegada ao hospital","O último momento em que o paciente estava sabidamente bem","A pontuação obtida na escala de coma de Glasgow do paciente","O resultado da dosagem de creatinina colhida na admissão"],"c":1,"e":"A janela é contada a partir do \u003cstrong>último momento bem conhecido (LKW)\u003c/strong> — no paciente que acorda com déficit, vale a hora de dormir, não a de acordar. É a primeira pergunta porque nenhuma outra decisão (imagem, droga, trombectomia) se aplica sem ela. A pressão arterial é ajustada ao alvo antes da droga, mas não define tempo; a escala de coma mede consciência, não cronologia; e a creatinina não decide trombólise — não se atrasa angio-TC por causa dela."},{"n":"🟢","levelName":"basico","q":"Uma equipe pré-hospitalar aplica a \u003cstrong>Escala de Cincinnati\u003c/strong> em um paciente com suspeita de AVC. Quais achados ela avalia?","a":["Pupilas, nível de consciência e os reflexos profundos","Glicemia capilar, temperatura e saturação de oxigênio","Força nos membros inferiores, coordenação e equilíbrio","Desvio de rima, queda de um braço e alteração da fala"],"c":3,"e":"A Cincinnati testa três achados rápidos: assimetria facial (\u003cstrong>desvio de rima\u003c/strong>), \u003cstrong>queda de um dos braços\u003c/strong> e \u003cstrong>fala alterada\u003c/strong> — mistura de palavras ou palavras incompreensíveis. É um teste de triagem pré-hospitalar, feito para reconhecer AVC e agilizar a trombólise, que \u003cstrong>não substitui o NIHSS\u003c/strong> na chegada. Consciência e pupilas pertencem à avaliação neurológica mais ampla; força de membros inferiores e equilíbrio não fazem parte da escala; e glicemia e saturação são medidas do ABCDE."},{"n":"🟡","levelName":"intermediario","q":"Sobre a \u003cstrong>tenecteplase no AVC isquêmico agudo\u003c/strong>, qual é o esquema recomendado na janela de até 4,5 h?","a":["0,25 mg/kg, máximo de 25 mg, em bolus único","0,90 mg/kg, máximo de 90 mg, com 10% em bolus","0,25 mg/kg, máximo de 25 mg, em infusão lenta","0,40 mg/kg, máximo de 40 mg, em bolus único"],"c":0,"e":"A tenecteplase recomendada é \u003cstrong>0,25 mg/kg, máximo de 25 mg, em bolus único\u003c/strong> — o bolus dispensa a infusão de uma hora. A dose de \u003cstrong>0,4 mg/kg não é recomendada\u003c/strong> no AVC isquêmico. A apresentação \u003cstrong>0,90 mg/kg com 10% em bolus\u003c/strong> descreve a \u003cstrong>alteplase\u003c/strong>, administrada com o restante em infusão de 60 minutos, e a tenecteplase não é dada em infusão lenta."},{"n":"🟡","levelName":"intermediario","q":"Mulher com AVC isquêmico e \u003cstrong>déficit incapacitante\u003c/strong>, último momento bem conhecido há 2 h e TC sem hemorragia. A \u003cstrong>PA é 190/110 mmHg\u003c/strong>. Qual é a conduta antes de trombolisar?","a":["Iniciar a trombólise sem tratar a PA, que não tem teto","Reduzir a PA para menos de 140/90 mmHg e trombolisar","Reduzir a PA para menos de 185/110 mmHg e trombolisar","Suspender a trombólise, pois a PA está acima do alvo"],"c":2,"e":"O alvo antes da trombólise é \u003cstrong>abaixo de 185/110 mmHg\u003c/strong>: com a pressão acima disso, controla-se primeiro e a droga pode ser administrada em seguida — o teto existe e adia a terapia, mas não a contraindica. Mirar \u003cstrong>menos de 140/90\u003c/strong> é queda excessiva e sem benefício demonstrado nesse momento. Iniciar a droga sem controlar a pressão ignora o alvo, e suspender definitivamente a trombólise por causa da PA priva a paciente de um tratamento que ela pode receber após o controle pressórico."},{"n":"🟡","levelName":"intermediario","q":"No AVC isquêmico agudo, qual é a conduta em relação à \u003cstrong>glicemia\u003c/strong> nas primeiras 24 h?","a":["Buscar de forma intensiva a faixa de 80 a 130 mg/dL","Intervir apenas se a glicemia for maior que 250 mg/dL","Manter a glicemia mais baixa possível, reduzindo a lesão","Tratar hipoglicemia &lt;60 mg/dL e buscar 140 a 180 mg/dL"],"c":3,"e":"Hipoglicemia \u003cstrong>abaixo de 60 mg/dL\u003c/strong> é corrigida — ela simula AVC e agrava a lesão. Na hiperglicemia persistente das primeiras 24 h, o alvo é \u003cstrong>140 a 180 mg/dL\u003c/strong>, monitorando para não cair em hipoglicemia; a faixa de \u003cstrong>80 a 130 mg/dL\u003c/strong> não deve ser perseguida de forma intensiva. Deixar para intervir só acima de 250 atrasa o controle, e empurrar a glicemia para baixo aumenta justamente o risco que se quer evitar."},{"n":"🟡","levelName":"intermediario","q":"Paciente com AVC isquêmico \u003cstrong>menor, não cardioembólico\u003c/strong>, NIHSS \u003cstrong>2\u003c/strong>, que não recebeu trombólise. Qual é a estratégia antiagregante inicial?","a":["AAS isolado, mantido por 21 dias, e depois clopidogrel","AAS + clopidogrel por 21 dias, iniciando em até 24 h","Anticoagulação plena imediata, seguida de AAS após 48 h","AAS + clopidogrel indefinidamente desde a admissão"],"c":1,"e":"No AVC isquêmico menor não cardioembólico (\u003cstrong>NIHSS ≤3\u003c/strong>), sem trombólise, a dupla \u003cstrong>AAS + clopidogrel\u003c/strong> iniciada \u003cstrong>em até 24 h\u003c/strong> e mantida por \u003cstrong>21 dias\u003c/strong> reduz a recorrência precoce; depois o paciente segue em monoterapia. AAS isolado subutiliza a janela de maior risco; a anticoagulação plena não é tratamento de rotina do AVCi agudo e não substitui o antiagregante nesse cenário; e manter a dupla sem prazo aumenta sangramento sem ganho estabelecido."},{"n":"🔴","levelName":"avancado","q":"Durante a infusão de alteplase, o paciente evolui com \u003cstrong>edema de lábios e língua\u003c/strong> e dificuldade para falar. Qual é a conduta?","a":["Manter a infusão e tratar apenas com anti-histamínico venoso","Aplicar adrenalina intramuscular, sem interromper a infusão","Suspender a infusão, avaliar via aérea e tratar o edema","Aguardar o término completo da infusão para tratar o edema"],"c":2,"e":"É \u003cstrong>angioedema orolingual\u003c/strong> da trombólise, com risco maior em usuários de \u003cstrong>IECA\u003c/strong> e em infartos insular/frontal. A conduta é \u003cstrong>interromper a infusão\u003c/strong>, avaliar e garantir a \u003cstrong>via aérea\u003c/strong>, administrar \u003cstrong>metilprednisolona + difenidramina + ranitidina/famotidina\u003c/strong>, dar suporte e \u003cstrong>suspender o IECA\u003c/strong>. Manter a infusão, esperar o término ou tratar só com anti-histamínico atrasa o controle de um edema que pode obstruir a via aérea."},{"n":"🔴","levelName":"avancado","q":"Paciente com AVC isquêmico de circulação anterior, \u003cstrong>4 h\u003c/strong> do início, oclusão de grande vaso (M1), \u003cstrong>NIHSS 15\u003c/strong>, mRS 0, ASPECTS 8, elegível à trombólise intravenosa. O serviço dispõe de trombectomia. Qual é a conduta?","a":["Fazer trombólise e trombectomia, sem esperar resposta da droga","Indicar somente a trombectomia, poupando o paciente da droga","Trombolisar e aguardar a resposta clínica antes de indicar EVT","Repetir a angio-TC em 6 h antes de decidir sobre a trombectomia"],"c":0,"e":"Quem é elegível às duas terapias deve \u003cstrong>receber as duas\u003c/strong>: a trombólise intravenosa não atrasa nem impede a trombectomia, e \u003cstrong>não há período de observação\u003c/strong> para ver se a droga respondeu antes de encaminhar para a EVT. Esperar a resposta clínica só perde tempo de reperfusão; pular a droga priva o paciente de uma reperfusão inicial barata; e repetir angio-TC em 6 h consome janela em um quadro com vaso ocluído já demonstrado."}]},{"id":"09","fullTitle":"09 — Emergências neurológicas","shortTitle":"Emergências neurológicas","subtitle":"A meningite meningocócica de ponta a ponta — agente, clínica, diagnóstico, tratamento e profilaxia de contatos — mais o essencial que sustenta o plantão neurológico: Glasgow pontuado, Cincinnati, exame neurológico básico, convulsões e o que separa a hemorragia subaracnóidea do hematoma intraparenquimatoso. O AVC isquêmico tem tema próprio (08) e aqui entra apenas como porta de entrada.","toc":[{"id":"sec-1-reconhecer-e-priorizar","title":"1. Reconhecer e priorizar"},{"id":"sec-2-meningite-meningocócica","title":"2. Meningite meningocócica"},{"id":"sec-3-exame-neurológico-básico-roteiro-de-8-passos","title":"3. Exame neurológico básico — roteiro de 8 passos"},{"id":"sec-4-escala-de-coma-de-glasgow","title":"4. Escala de Coma de Glasgow"},{"id":"sec-5-escala-de-cincinnati","title":"5. Escala de Cincinnati"},{"id":"sec-6-convulsões-na-emergência","title":"6. Convulsões na emergência"},{"id":"sec-7-avc-e-hemorragias-introdução","title":"7. AVC e hemorragias — introdução"},{"id":"sec-8-pegadinhas-que-mais-custam-ponto","title":"8. Pegadinhas que mais custam ponto"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-reconhecer-e-priorizar\">\u003ch2>1. Reconhecer e priorizar\u003c/h2>\u003cul>\u003cli>\u003cstrong>Principais causas\u003c/strong> de emergência neurológica: \u003cstrong>AVC, TCE, convulsões, infecções do SNC e tumores cerebrais\u003c/strong>.\u003c/li>\u003cli>Emergência neurológica exige atendimento \u003cstrong>rápido, preciso e eficiente\u003c/strong>: estabilizar e encaminhar para tratamento especializado. Nas infecções, o prognóstico depende de \u003cstrong>diagnóstico imediato + antibioticoterapia empírica precoce\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Avaliação primária — cuidado com a sigla:\u003c/strong> o material da disciplina escreve \u003cstrong>XABC\u003c/strong> (\"Airway, Breathing, Circulation\"). Nos demais temas, a avaliação primária aparece como \u003cstrong>ABCDE\u003c/strong> — registre a variante da aula sem tratá-la como sigla universal.\u003c/li>\u003cli>Em seguida, \u003cstrong>avaliação neurológica inicial\u003c/strong>: déficits motores, sensitivos e alterações do estado mental.\u003c/li>\u003cli>\u003cstrong>Meningite é doença de notificação compulsória\u003c/strong> (em \u003cstrong>24 h\u003c/strong>; surtos e óbitos, de notificação imediata).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-meningite-meningocócica\">\u003ch2>2. Meningite meningocócica\u003c/h2>\u003ch3 id=\"h-2-1-agente-e-transmissão\">2.1 Agente e transmissão\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>\u003cem>Neisseria meningitidis\u003c/strong>\u003c/em> (meningococo): \u003cstrong>diplococo Gram-negativo aeróbio\u003c/strong>.\u003c/li>\u003cli>Coloniza a \u003cstrong>nasofaringe\u003c/strong> de cerca de \u003cstrong>10% dos indivíduos saudáveis\u003c/strong> — portadores assintomáticos que também transmitem. Em algumas faixas etárias, a colonização passa de \u003cstrong>10%\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Transmissão por gotículas de saliva / contato direto com secreções da nasofaringe\u003c/strong> (de doentes e de portadores). \u003cstrong>Não\u003c/strong> é via fecal-oral nem por contato com sangue.\u003c/li>\u003cli>\u003cstrong>MM\u003c/strong> = meningococo nas meninges (espaço subaracnoideo); \u003cstrong>meningococcemia\u003c/strong> = meningococo na corrente sanguínea; \u003cstrong>MM com meningococcemia\u003c/strong> = nos dois sítios.\u003c/li>\u003cli>Perfil: mais comum em \u003cstrong>crianças e adultos jovens\u003c/strong>; a \u003cstrong>África subsaariana\u003c/strong> concentra o maior número de casos do mundo.\u003c/li>\u003cli>\u003cstrong>Sorogrupos:\u003c/strong> \u003cstrong>A, B e C\u003c/strong> causam \u003cstrong>90%\u003c/strong> das infecções; a doença invasiva também inclui \u003cstrong>W, Y e X\u003c/strong>. As vacinas disponíveis cobrem \u003cstrong>C, ACWY e B\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-fisiopatologia-em-uma-linha\">2.2 Fisiopatologia em uma linha\u003c/h3>\n\u003cul>\u003cli>Colonização da nasofaringe → corrente sanguínea → meninges → inflamação no espaço subaracnoideo → \u003cstrong>edema vasogênico + aumento da pressão intracraniana + queda do fluxo cerebral\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-3-quadro-clínico\">2.3 Quadro clínico\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Início súbito\u003c/strong>; o quadro varia com idade e duração da doença e pode começar com sintomas pouco específicos.\u003c/li>\u003cli>Clássico: \u003cstrong>febre alta, cefaleia, vômitos em jato e rigidez de nuca\u003c/strong>, com fotossensibilidade, sonolência, confusão mental, mal-estar e cansaço.\u003c/li>\u003cli>\u003cstrong>Lactentes:\u003c/strong> \u003cstrong>fontanela tensa e abaulada\u003c/strong>.\u003c/li>\u003cli>🔥 \u003cstrong>Meningococcemia — a pista está na pele:\u003c/strong> manchas \u003cstrong>vermelhas que não desaparecem à digitopressão\u003c/strong>, irregulares em tamanho e forma, com \u003cstrong>centro necrótico\u003c/strong>. Exantema viral \u003cstrong>some\u003c/strong> à digito; essas manchas \u003cstrong>não somem\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Sequelas possíveis:\u003c/strong> \u003cstrong>surdez, perda de visão, hidrocefalia, retardo mental, miocardite, choque séptico e amputações\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-4-diagnóstico\">2.4 Diagnóstico\u003c/h3>\n\u003cul>\u003cli>Suspeita \u003cstrong>clínica\u003c/strong> + confirmação \u003cstrong>laboratorial\u003c/strong> — o tratamento não espera a confirmação.\u003c/li>\u003cli>\u003cstrong>Bacterioscopia pela coloração de Gram\u003c/strong> em \u003cstrong>sangue, lesões cutâneas e, principalmente, líquor\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Cultura de sangue antes do antibiótico\u003c/strong> — regra que não pode ser perdida.\u003c/li>\u003cli>\u003cstrong>Se o paciente já está em antibiótico:\u003c/strong> \u003cstrong>pesquisa de polissacarídeos capsulares no líquor\u003c/strong> ou \u003cstrong>testes biomoleculares (PCR)\u003c/strong>.\u003c/li>\u003cli>A bioquímica do líquor (celularidade, proteína, glicose, pressão de abertura) e outras etiologias não são detalhadas aqui — este tema é centrado na forma meningocócica.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-5-tratamento\">2.5 Tratamento\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situação\u003c/th>\u003cth>Esquema\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Adulto — doença meningocócica\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Ceftriaxona 2 g IV de 12/12 h\u003c/strong>, por \u003cstrong>7 dias\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Criança &gt;2 meses — empírico\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Ceftriaxona ou cefotaxima\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Criança — confirmada\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Penicilina, ampicilina ou ceftriaxona\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Duração do tratamento:\u003c/strong> no adulto, a ceftriaxona fica por \u003cstrong>7 dias\u003c/strong>; a faixa de \u003cstrong>5–7 dias\u003c/strong> aparece nos esquemas pediátricos (penicilina, ampicilina ou ceftriaxona) — e a OMS cita \u003cstrong>5 dias\u003c/strong> em contexto de epidemia.\u003c/li>\u003cli>\u003cstrong>Resistência à penicilina:\u003c/strong> \u003cstrong>cloranfenicol ou meropenem\u003c/strong> (material da disciplina).\u003c/li>\u003cli>\u003cstrong>Corticoide e pressão intracraniana:\u003c/strong> o material associa \u003cstrong>corticoide\u003c/strong> e tratamento do \u003cstrong>aumento da pressão intracraniana\u003c/strong> — sem dose ou esquema detalhados no material da disciplina.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-6-quimioprofilaxia-contatos-e-o-próprio-doente\">2.6 Quimioprofilaxia — contatos e o próprio doente\u003c/h3>\n\u003cul>\u003cli>Indicação: \u003cstrong>contatos domiciliares e contatos íntimos\u003c/strong> (exposição a secreções — casa, dormitórios, creches, escolas).\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>Dose no adulto\u003c/th>\u003cth>Observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Rifampicina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>600 mg VO de 12/12 h, por 2 dias\u003c/strong>\u003c/td>\u003ctd>esquema clássico (10 mg/kg/dose, máx. \u003cstrong>600 mg\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Ceftriaxona\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>250 mg IM, dose única\u003c/strong>\u003c/td>\u003ctd>alternativa (\u003cstrong>≥12 anos\u003c/strong>; &lt;12 anos: 125 mg)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Ciprofloxacino\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>500 mg VO, dose única\u003c/strong>\u003c/td>\u003ctd>alternativa (\u003cstrong>≥18 anos\u003c/strong>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>🔥 \u003cstrong>O próprio doente também faz quimioprofilaxia na alta\u003c/strong> (para erradicar o estado de portador) — \u003cstrong>exceto\u003c/strong> se foi tratado com \u003cstrong>ceftriaxona ou cefotaxima\u003c/strong>, que já erradicam a colonização.\u003c/li>\u003cli>\u003cstrong>Não confundir com \u003cem>H. influenzae\u003c/em> tipo b:\u003c/strong> rifampicina \u003cstrong>600 mg de 24/24 h por 4 dias\u003c/strong> — outro esquema.\u003c/li>\u003cli>🔥 \u003cstrong>Profilaxia ≠ tratamento:\u003c/strong> \u003cstrong>2 dias\u003c/strong> de rifampicina no contato; \u003cstrong>7 dias\u003c/strong> de ceftriaxona no adulto (\u003cstrong>5–7 dias\u003c/strong> nos esquemas pediátricos).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-7-prevenção\">2.7 Prevenção\u003c/h3>\n\u003cul>\u003cli>Vacinação de grupos de risco/surtos contra \u003cstrong>C, ACWY e B\u003c/strong>; evitar aglomerações; notificação compulsória.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-exame-neurológico-básico-roteiro-de-8-passos\">\u003ch2>3. Exame neurológico básico — roteiro de 8 passos\u003c/h2>\u003col>\u003cli>\u003cstrong>História:\u003c/strong> medicações em uso, traumas, infecções prévias.\u003c/li>\u003cli>\u003cstrong>Observação geral:\u003c/strong> nível de consciência, orientação, comportamento.\u003c/li>\u003cli>\u003cstrong>Nervos cranianos:\u003c/strong> os \u003cstrong>12 pares\u003c/strong> — visão, movimentos oculares, audição, paladar, força e sensibilidade facial.\u003c/li>\u003cli>\u003cstrong>Força e tônus:\u003c/strong> apertar as mãos, levantar os braços.\u003c/li>\u003cli>\u003cstrong>Sensibilidade:\u003c/strong> estímulo \u003cstrong>tátil\u003c/strong> (toque leve) e \u003cstrong>doloroso\u003c/strong> (pinçamento suave).\u003c/li>\u003cli>\u003cstrong>Reflexos profundos:\u003c/strong> \u003cstrong>patelar e aquileu\u003c/strong>, com martelo.\u003c/li>\u003cli>\u003cstrong>Coordenação e equilíbrio:\u003c/strong> \u003cstrong>dedo-nariz\u003c/strong>, \u003cstrong>calcanhar-joelho\u003c/strong> e marcha.\u003c/li>\u003cli>\u003cstrong>Funções cerebelares:\u003c/strong> \u003cstrong>index-nariz\u003c/strong> e \u003cstrong>disdiadococinesia\u003c/strong>.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-escala-de-coma-de-glasgow\">\u003ch2>4. Escala de Coma de Glasgow\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Abertura ocular\u003c/th>\u003cth>Resposta verbal\u003c/th>\u003cth>Resposta motora\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Espontânea \u003cstrong>4\u003c/strong>\u003c/td>\u003ctd>Orientado \u003cstrong>5\u003c/strong>\u003c/td>\u003ctd>Obedece comandos \u003cstrong>6\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ao chamado \u003cstrong>3\u003c/strong>\u003c/td>\u003ctd>Confuso \u003cstrong>4\u003c/strong>\u003c/td>\u003ctd>Localiza a dor \u003cstrong>5\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>À dor \u003cstrong>2\u003c/strong>\u003c/td>\u003ctd>Palavras \u003cstrong>3\u003c/strong>\u003c/td>\u003ctd>Flete \u003cstrong>4\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ausente \u003cstrong>1\u003c/strong>\u003c/td>\u003ctd>Sons \u003cstrong>2\u003c/strong>\u003c/td>\u003ctd>Flexão anormal \u003cstrong>3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>—\u003c/td>\u003ctd>Ausente \u003cstrong>1\u003c/strong>\u003c/td>\u003ctd>Extensão \u003cstrong>2\u003c/strong> / ausente \u003cstrong>1\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Soma: \u003cstrong>3 a 15\u003c/strong>. \u003cstrong>3\u003c/strong> = sem resposta nos três componentes; \u003cstrong>15\u003c/strong> = orientado e obedecendo a comandos.\u003c/li>\u003cli>Exemplo: abre os olhos \u003cstrong>ao chamado (3)\u003c/strong> + \u003cstrong>confuso (4)\u003c/strong> + \u003cstrong>localiza a dor (5)\u003c/strong> = \u003cstrong>12 pontos\u003c/strong>.\u003c/li>\u003cli>Glasgow mede \u003cstrong>nível de consciência\u003c/strong> — não é o NIHSS (gravidade de déficit no AVC, tema 08). O material da disciplina não traz a correlação com conduta.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-escala-de-cincinnati\">\u003ch2>5. Escala de Cincinnati\u003c/h2>\u003cul>\u003cli>Triagem rápida na suspeita de AVC, usada no protocolo para: \u003cstrong>identificar sinais de AVC\u003c/strong>, \u003cstrong>agilizar a trombólise (tPA)\u003c/strong> em casos selecionados e \u003cstrong>triar para neurocirurgia\u003c/strong> (ex.: remoção de coágulos).\u003c/li>\u003cli>Avalia \u003cstrong>três achados\u003c/strong>:\u003cul>\u003cli>\u003cstrong>face:\u003c/strong> desvio de rima / queda facial;\u003c/li>\u003cli>\u003cstrong>braços:\u003c/strong> um braço não mexe ou tem menos força que o outro;\u003c/li>\u003cli>\u003cstrong>fala:\u003c/strong> mistura de palavras, palavras incompreensíveis.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>A escala, como apresentada, é qualitativa, sem pontuação\u003c/strong> — serve para reconhecer e acelerar, e \u003cstrong>não substitui\u003c/strong> a avaliação de gravidade (NIHSS).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-convulsões-na-emergência\">\u003ch2>6. Convulsões na emergência\u003c/h2>\u003cul>\u003cli>Definição: atividade elétrica \u003cstrong>anormal e excessiva\u003c/strong> no cérebro.\u003c/li>\u003cli>Causas citadas: \u003cstrong>epilepsia\u003c/strong>, \u003cstrong>febre alta em crianças (convulsão febril)\u003c/strong>, distúrbios metabólicos, infecções cerebrais, tumores cerebrais e \u003cstrong>trauma\u003c/strong>.\u003c/li>\u003cli>Durante a crise: movimentos involuntários, perda de consciência e alterações do estado mental.\u003c/li>\u003cli>Manejo da convulsão aguda: \u003cstrong>proteção das vias aéreas\u003c/strong> + \u003cstrong>anticonvulsivantes — diazepam e fenitoína\u003c/strong>; em seguida, \u003cstrong>investigar a causa\u003c/strong> e decidir sobre \u003cstrong>antiepiléptico contínuo\u003c/strong>.\u003c/li>\u003cli>O material da disciplina \u003cstrong>não traz doses\u003c/strong> de diazepam/fenitoína nem protocolo de \u003cstrong>estado de mal epiléptico\u003c/strong> (definição, duração, segunda linha); para esses pontos, consulte uma fonte específica.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-avc-e-hemorragias-introdução\">\u003ch2>7. AVC e hemorragias — introdução\u003c/h2>\u003cul>\u003cli>\u003cstrong>Definição:\u003c/strong> déficit neurológico \u003cstrong>geralmente focal\u003c/strong>, de \u003cstrong>instalação súbita ou com rápida progressão\u003c/strong>, \u003cstrong>sem outra causa aparente que não vascular\u003c/strong>, com \u003cstrong>duração maior de 24 h\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Magnitude:\u003c/strong> 2ª causa de morte no mundo e \u003cstrong>principal causa de morte no Brasil\u003c/strong>. \u003cstrong>≈80% isquêmico\u003c/strong>; \u003cstrong>≈20% hemorrágico\u003c/strong>, que se divide em \u003cstrong>HIP\u003c/strong> (intraparenquimatoso) e \u003cstrong>HSA\u003c/strong> (subaracnóidea).\u003c/li>\u003cli>\u003cstrong>Suspeitar de AVC em:\u003c/strong> déficit súbito ou de rápida progressão, paralisia de um lado do corpo, dificuldade para falar ou compreender, perda de visão, tontura/vertigem súbita, dificuldade de marcha.\u003c/li>\u003cli>Em ambos os tipos: resposta inflamatória → \u003cstrong>edema cerebral\u003c/strong> → \u003cstrong>↑ pressão intracraniana\u003c/strong> → ativação de vias de morte celular (\u003cstrong>apoptose e necrose\u003c/strong>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-7-1-hip-hsa-o-quadro-que-separa\">7.1 HIP × HSA — o quadro que separa\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003cstrong>HIP\u003c/strong>\u003c/th>\u003cth>\u003cstrong>HSA\u003c/strong>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Âncora\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>déficit neurológico focal súbito\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>cefaleia súbita, em geral intensa e holocraniana\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outros achados\u003c/td>\u003ctd>cefaleia, náuseas/vômitos, \u003cstrong>redução do nível de consciência\u003c/strong>, \u003cstrong>níveis pressóricos muito elevados\u003c/strong>, convulsão em alguns casos\u003c/td>\u003ctd>náuseas/vômitos, tonturas, \u003cstrong>sinais de irritação meníngea\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-7-2-imagem-e-líquor\">7.2 Imagem e líquor\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>TC de crânio\u003c/strong> é o exame \u003cstrong>mais utilizado\u003c/strong> e o primeiro passo: mostra \u003cstrong>hemorragia\u003c/strong>. No AVCi, a \u003cstrong>TC costuma ser normal na fase aguda\u003c/strong> — o diagnóstico é por \u003cstrong>exclusão de AVCH\u003c/strong>; a \u003cstrong>ACM hiperdensa\u003c/strong> pode ser sinal precoce.\u003c/li>\u003cli>\u003cstrong>RM é mais sensível que a TC\u003c/strong>, sobretudo nas \u003cstrong>fases mais precoces\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Suspeita de HSA com TC sem sangramento → colher líquor.\u003c/strong> O material da disciplina cita \u003cstrong>xantocromia\u003c/strong>, \u003cstrong>queda da contagem de hemácias do 1º para o 4º tubo\u003c/strong> e \u003cstrong>pressão de abertura elevada\u003c/strong>. O manejo de HSA/HIP (drogas, escalas, cirurgia) \u003cstrong>não\u003c/strong> é detalhado aqui.\u003c/li>\u003cli>\u003cstrong>Hidrocefalia aguda:\u003c/strong> acúmulo rápido de líquor → \u003cstrong>↑ pressão intracraniana\u003c/strong>; pode exigir \u003cstrong>derivação ventricular urgente\u003c/strong> ou cirurgia.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-pegadinhas-que-mais-custam-ponto\">\u003ch2>8. Pegadinhas que mais custam ponto\u003c/h2>\u003cul>\u003cli>Exantema viral \u003cstrong>some\u003c/strong> à digitopressão; mancha da \u003cstrong>meningococcemia não some\u003c/strong> e pode ter \u003cstrong>centro necrótico\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Profilaxia ≠ tratamento:\u003c/strong> rifampicina \u003cstrong>2 dias\u003c/strong> (contato) vs. ceftriaxona \u003cstrong>7 dias\u003c/strong> (doente, adulto).\u003c/li>\u003cli>\u003cstrong>Duração no adulto: ceftriaxona por 7 dias\u003c/strong> — a faixa de 5–7 dias é dos esquemas pediátricos.\u003c/li>\u003cli>\u003cstrong>\u003cem>H. influenzae\u003c/em> tipo b\u003c/strong> tem esquema próprio: rifampicina \u003cstrong>24/24 h por 4 dias\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>XABC\u003c/strong> é a sigla do material da disciplina — não misture com \u003cstrong>ABCDE\u003c/strong> sem explicar.\u003c/li>\u003cli>\u003cstrong>TC normal precoce\u003c/strong> não exclui AVCi nem HSA.\u003c/li>\u003cli>\u003cstrong>Cultura de sangue antes do antibiótico\u003c/strong>; depois dele, o caminho é \u003cstrong>polissacarídeos capsulares/PCR\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Qual é o agente da meningite meningocócica, onde ele coloniza e como é transmitido?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>\u003cem>Neisseria meningitidis\u003c/strong>\u003c/em> (meningococo), um \u003cstrong>diplococo Gram-negativo aeróbio\u003c/strong>. Coloniza a \u003cstrong>nasofaringe\u003c/strong> — cerca de \u003cstrong>10% dos indivíduos saudáveis\u003c/strong> são portadores assintomáticos e também transmitem. A transmissão é por \u003cstrong>gotículas de saliva / contato direto com secreções da nasofaringe\u003c/strong> de doentes ou portadores. É \u003cstrong>doença de notificação compulsória\u003c/strong>, e o controle inclui vacinação e quimioprofilaxia de contatos.\u003c/p>"},{"titleHtml":"🟢 Como se pontua a Escala de Coma de Glasgow? Quanto vale um paciente que abre os olhos ao chamado, está confuso e localiza a dor?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Soma de três componentes — \u003cstrong>abertura ocular (1 a 4)\u003c/strong>, \u003cstrong>resposta verbal (1 a 5)\u003c/strong> e \u003cstrong>resposta motora (1 a 6)\u003c/strong> — com total de \u003cstrong>3 a 15\u003c/strong>. Abrir os olhos ao chamado = \u003cstrong>3\u003c/strong>; confuso = \u003cstrong>4\u003c/strong>; localizar a dor = \u003cstrong>5\u003c/strong> → \u003cstrong>12 pontos\u003c/strong>. O total \u003cstrong>3\u003c/strong> significa ausência de resposta nos três componentes; \u003cstrong>15\u003c/strong>, paciente orientado e que obedece a comandos.\u003c/p>"},{"titleHtml":"🟡 Suspeita de meningite com antibiótico já iniciado antes da coleta. Como ainda é possível identificar o agente?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Por \u003cstrong>pesquisa de polissacarídeos capsulares no líquor\u003c/strong> ou por \u003cstrong>testes biomoleculares (PCR)\u003c/strong>, que não dependem de bactéria viável. A regra que não pode falhar é \u003cstrong>colher a cultura de sangue antes do antibiótico\u003c/strong>; a \u003cstrong>bacterioscopia de Gram\u003c/strong> (sangue, lesões cutâneas e, principalmente, líquor) também rende mais antes do tratamento. Suspender o antibiótico para recultivar não é aceitável — o tratamento empírico é precoce e não espera confirmação.\u003c/p>"},{"titleHtml":"🟡 Como manejar uma convulsão aguda e o que fazer depois da crise?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Durante a crise, \u003cstrong>proteger as vias aéreas\u003c/strong> e usar \u003cstrong>anticonvulsivantes — diazepam e fenitoína\u003c/strong>. Depois, \u003cstrong>investigar a causa\u003c/strong> (epilepsia, convulsão febril em crianças, distúrbios metabólicos, infecções cerebrais, tumores, trauma) e decidir sobre \u003cstrong>tratamento contínuo com antiepilépticos\u003c/strong>. O material da disciplina não traz doses nem protocolo de estado de mal epiléptico.\u003c/p>"},{"titleHtml":"🟡 Descreva a quimioprofilaxia da doença meningocócica para os contatos e para o próprio doente.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Para \u003cstrong>contatos domiciliares e íntimos\u003c/strong> (exposição a secreções): \u003cstrong>rifampicina 600 mg VO de 12/12 h por 2 dias\u003c/strong> no adulto; alternativas de dose única são \u003cstrong>ceftriaxona 250 mg IM\u003c/strong> (≥12 anos) e \u003cstrong>ciprofloxacino 500 mg VO\u003c/strong> (≥18 anos). O \u003cstrong>próprio doente também recebe quimioprofilaxia na alta\u003c/strong>, exceto se tratado com \u003cstrong>ceftriaxona ou cefotaxima\u003c/strong>, que já erradicam a colonização. Não confundir com o esquema do \u003cem>H. influenzae\u003c/em> tipo b: rifampicina \u003cstrong>24/24 h por 4 dias\u003c/strong>.\u003c/p>"},{"titleHtml":"🔴 Como o quadro clínico separa HSA de HIP? O que fazer quando a TC de crânio não mostra sangramento em uma suspeita de HSA?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>HSA:\u003c/strong> \u003cstrong>cefaleia súbita, intensa e holocraniana\u003c/strong>, náuseas, vômitos, tonturas e \u003cstrong>sinais de irritação meníngea\u003c/strong>. \u003cstrong>HIP:\u003c/strong> \u003cstrong>déficit focal súbito\u003c/strong>, cefaleia, náuseas/vômitos, \u003cstrong>redução do nível de consciência\u003c/strong>, \u003cstrong>pressão muito elevada\u003c/strong> e, às vezes, convulsão. A \u003cstrong>TC de crânio\u003c/strong> é o exame mais utilizado e responde primeiro por sangue; se a suspeita de HSA persiste sem sangramento na TC, \u003cstrong>colher líquor\u003c/strong> — o material da disciplina cita \u003cstrong>xantocromia\u003c/strong>, \u003cstrong>queda da contagem de hemácias do 1º para o 4º tubo\u003c/strong> e \u003cstrong>pressão de abertura elevada\u003c/strong>. O manejo específico de HSA/HIP não é detalhado no material.\u003c/p>"},{"titleHtml":"🔴 Lactente com febre alta, manchas que não desaparecem à digitopressão e fontanela tensa e abaulada: qual a suspeita e quais as prioridades?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Suspeita de \u003cstrong>meningite meningocócica com meningococcemia\u003c/strong> — manchas que \u003cstrong>não desaparecem à digitopressão\u003c/strong>, irregulares e com \u003cstrong>centro necrótico\u003c/strong> apontam para meningococcemia, e a \u003cstrong>fontanela tensa e abaulada\u003c/strong> é o sinal clássico no lactente. Prioridades: \u003cstrong>estabilizar\u003c/strong> (avaliação primária com suporte vital), iniciar \u003cstrong>antibioticoterapia empírica precoce\u003c/strong> (sem esperar cultura ou PCR), \u003cstrong>colher cultura antes do antibiótico\u003c/strong> quando possível, \u003cstrong>notificar\u003c/strong> (doença de notificação compulsória) e organizar a \u003cstrong>quimioprofilaxia dos contatos\u003c/strong> — mais a profilaxia do próprio doente na alta, conforme o antibiótico usado. Sequelas a lembrar: \u003cstrong>surdez, perda de visão, hidrocefalia, retardo mental, miocardite, choque séptico e amputações\u003c/strong>.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual é o agente da \u003cstrong>meningite meningocócica\u003c/strong> e como ele é transmitido?","a":["Haemophilus influenzae, por aerossóis de gotículas","Streptococcus pneumoniae, por contato com sangue","Neisseria meningitidis, por via fecal-oral na água","Neisseria meningitidis, por gotículas de saliva"],"c":3,"e":"A meningite meningocócica é causada pela \u003cem>Neisseria meningitidis\u003c/em>, um \u003cstrong>diplococo Gram-negativo\u003c/strong> que coloniza a nasofaringe de cerca de 10% dos indivíduos saudáveis e se transmite por \u003cstrong>gotículas de saliva\u003c/strong>, de doentes ou de portadores assintomáticos. As demais combinações trazem agentes que causam meningite com vias de transmissão que não correspondem ao meningococo: o pneumococo não se transmite por sangue, e a via fecal-oral pertence a outros patógenos entéricos."},{"n":"🟢","levelName":"basico","q":"Paciente \u003cstrong>abre os olhos ao chamado\u003c/strong>, está \u003cstrong>confuso\u003c/strong> e \u003cstrong>localiza o estímulo doloroso\u003c/strong>. Qual é a pontuação na \u003cstrong>Escala de Coma de Glasgow\u003c/strong>?","a":["3 + 4 + 5 = 12 pontos","4 + 4 + 5 = 13 pontos","3 + 4 + 6 = 13 pontos","2 + 4 + 5 = 11 pontos"],"c":0,"e":"A escala soma \u003cstrong>abertura ocular\u003c/strong>, \u003cstrong>resposta verbal\u003c/strong> e \u003cstrong>resposta motora\u003c/strong>: abrir os olhos ao chamado vale \u003cstrong>3\u003c/strong>, estar confuso vale \u003cstrong>4\u003c/strong> e localizar o estímulo doloroso vale \u003cstrong>5\u003c/strong> — total \u003cstrong>12\u003c/strong>. O mínimo da escala é \u003cstrong>3\u003c/strong> (nenhuma resposta nos três componentes) e o máximo é \u003cstrong>15\u003c/strong> (paciente orientado e obedecendo a comandos)."},{"n":"🟡","levelName":"intermediario","q":"Lactente com febre alta e manchas vermelhas na pele. Qual característica dessas manchas aponta para \u003cstrong>meningococcemia\u003c/strong>, e não para um exantema viral?","a":["Desaparecem à digitopressão, como nos exantemas virais","São simétricas, com bordas definidas e sem relevo","Não desaparecem à digitopressão, com centro necrótico","Poupam as palmas e as plantas, com descamação fina"],"c":2,"e":"As manchas da meningococcemia \u003cstrong>não desaparecem à digitopressão\u003c/strong>, são irregulares e podem ter \u003cstrong>centro necrótico\u003c/strong> — comportamento que as separa do eritema dos exantemas virais, que some à digito. Manchas simétricas com bordas definidas e lesões que poupam palmas e plantas descrevem outros padrões cutâneos, não o sinal clássico da meningococcemia."},{"n":"🟡","levelName":"intermediario","q":"Adulto com \u003cstrong>doença meningocócica confirmada\u003c/strong>. Qual esquema antibiótico corresponde ao recomendado para esse paciente?","a":["Ceftriaxona 2 g IV de 8 em 8 h, por 7 dias","Ceftriaxona 2 g IV de 24 em 24 h, por 14 dias","Ceftriaxona 2 g IM em dose única, na alta","Ceftriaxona 2 g IV de 12 em 12 h, por 7 dias"],"c":3,"e":"No adulto com doença meningocócica, o tratamento é \u003cstrong>ceftriaxona 2 g IV de 12 em 12 horas, por 7 dias\u003c/strong> (tabela de adultos do GVS); a faixa de 5 a 7 dias corresponde aos esquemas pediátricos, e a OMS admite 5 dias em cenários de epidemia. Intervalos de 8 horas e ciclos de 14 dias não correspondem ao esquema, e a \u003cstrong>dose única intramuscular\u003c/strong> de ceftriaxona pertence à \u003cstrong>quimioprofilaxia dos contatos\u003c/strong> — não ao tratamento do doente. Esquemas que associam penicilina G a 7 dias fixos, comuns em materiais mais antigos, não correspondem à recomendação atual."},{"n":"🟡","levelName":"intermediario","q":"Contato domiciliar adulto de um caso confirmado de \u003cstrong>doença meningocócica\u003c/strong>. Qual esquema de quimioprofilaxia está indicado para esse contato?","a":["Rifampicina 600 mg VO de 24/24 h, por 4 dias","Rifampicina 600 mg VO de 12/12 h, por 2 dias","Ceftriaxona 2 g IV de 12/12 h, por 5 dias","Ciprofloxacino 500 mg VO de 12/12 h, por 2 dias"],"c":1,"e":"A quimioprofilaxia do contato adulto é \u003cstrong>rifampicina 600 mg VO de 12 em 12 horas por 2 dias\u003c/strong>. Como alternativas de \u003cstrong>dose única\u003c/strong> existem \u003cstrong>ceftriaxona 250 mg IM\u003c/strong> (≥12 anos) e \u003cstrong>ciprofloxacino 500 mg VO\u003c/strong> (≥18 anos). O esquema de rifampicina de \u003cstrong>24 em 24 horas por 4 dias\u003c/strong> é o da profilaxia do \u003cem>Haemophilus influenzae\u003c/em> tipo b, e a ceftriaxona endovenosa de 2 g em 12/12 horas por 5 dias é tratamento do doente, não profilaxia."},{"n":"🟡","levelName":"intermediario","q":"Paciente com suspeita de meningite \u003cstrong>já recebeu antibiótico\u003c/strong> antes da coleta de líquor. Qual estratégia ainda pode identificar o agente?","a":["Cultura de sangue colhida depois do antibiótico","Bacterioscopia de Gram do líquor, ainda confiável","Pesquisa de polissacarídeos no líquor ou PCR","Repetir a cultura após suspender o antibiótico"],"c":2,"e":"Com antibiótico já em uso, a \u003cstrong>cultura\u003c/strong> e a \u003cstrong>bacterioscopia\u003c/strong> podem ficar comprometidas, e a identificação do agente passa a se apoiar na \u003cstrong>pesquisa de polissacarídeos capsulares no líquor\u003c/strong> ou em \u003cstrong>testes biomoleculares (PCR)\u003c/strong>. A cultura de sangue deve ser colhida \u003cstrong>antes\u003c/strong> do antibiótico; repeti-la depois dele aumenta a chance de resultado negativo. Suspender o antibiótico para recultivar não é aceitável diante de uma infecção potencialmente fatal."},{"n":"🔴","levelName":"avancado","q":"Adulto completou o tratamento de \u003cstrong>doença meningocócica\u003c/strong> com ceftriaxona endovenosa. Na alta, qual é a conduta em relação à quimioprofilaxia dele?","a":["Não é necessária: a ceftriaxona erradica a colonização","Ciprofloxacino 500 mg VO em dose única, antes da alta","Rifampicina 600 mg VO 12/12 h por 2 dias, como os contatos","Ceftriaxona 250 mg IM em dose única, na alta hospitalar"],"c":0,"e":"Além dos contatos, o \u003cstrong>próprio doente\u003c/strong> costuma receber quimioprofilaxia na alta para erradicar o estado de portador — a exceção são os pacientes tratados com \u003cstrong>ceftriaxona ou cefotaxima\u003c/strong>, que já cumprem essa função. Por isso, quem completou o tratamento com ceftriaxona \u003cstrong>não precisa\u003c/strong> de rifampicina, ciprofloxacino ou outra droga na alta. Esses esquemas de dose única são destinados aos \u003cstrong>contatos\u003c/strong>, não à repetição no paciente já tratado."},{"n":"🔴","levelName":"avancado","q":"Na suspeita de \u003cstrong>AVC hemorrágico\u003c/strong>, qual conjunto de achados orienta para \u003cstrong>hemorragia subaracnóidea\u003c/strong>, e não para hematoma intraparenquimatoso?","a":["Déficit focal súbito com rebaixamento e PA elevada","Cefaleia súbita holocraniana e irritação meníngea","Cefaleia progressiva com convulsões e paresia","Febre alta, rigidez de nuca e vômitos em jato"],"c":1,"e":"A hemorragia subaracnóidea se apresenta com \u003cstrong>cefaleia súbita, intensa e holocraniana\u003c/strong>, náuseas, vômitos, tonturas e \u003cstrong>sinais de irritação meníngea\u003c/strong>. A hemorragia intraparenquimatosa cursa com \u003cstrong>déficit focal súbito\u003c/strong>, rebaixamento do nível de consciência e \u003cstrong>níveis pressóricos muito elevados\u003c/strong>, às vezes com convulsão. Febre com rigidez de nuca aponta para meningite, e cefaleia progressiva com convulsões e paresia sugere causa expansiva, não sangramento agudo."}]},{"id":"10","fullTitle":"10 — Intoxicações exógenas","shortTitle":"Intoxicações exógenas","subtitle":"Estabilizar antes de investigar: CABDE no grave, XABCDE no estável — e as janelas, doses e antídotos que realmente caem em prova.","toc":[{"id":"sec-1-abordagem-inicial-reanimar-primeiro","title":"1. Abordagem inicial: reanimar primeiro"},{"id":"sec-2-descontaminação-o-que-sobreviveu","title":"2. Descontaminação: o que sobreviveu"},{"id":"sec-3-antídotos-prioritários","title":"3. Antídotos prioritários"},{"id":"sec-4-organofosforados-carbamatos","title":"4. Organofosforados × carbamatos"},{"id":"sec-5-pegadinhas-de-prova","title":"5. Pegadinhas de prova"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-abordagem-inicial-reanimar-primeiro\">\u003ch2>1. Abordagem inicial: reanimar primeiro\u003c/h2>\u003ch3 id=\"h-1-1-cabde-xabcde-a-ordem-muda-com-a-gravidade\">1.1 CABDE × XABCDE — a ordem muda com a gravidade\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Intoxicado grave ou em PCR → CABDE\u003c/strong> (C antes de A e B). Ordem: \u003cstrong>C\u003c/strong> estado hemodinâmico → \u003cstrong>A\u003c/strong> vias aéreas → \u003cstrong>B\u003c/strong> respiração → \u003cstrong>D\u003c/strong> déficit neurológico → \u003cstrong>E\u003c/strong> exposição.\u003c/li>\u003cli>\u003cstrong>Intoxicado consciente ou estável → XABCDE\u003c/strong>: a avaliação primária com o \u003cstrong>X\u003c/strong> de sangramento exsanguinante na frente, e \u003cstrong>ênfase em via aérea\u003c/strong> quando há rebaixamento com \u003cstrong>Glasgow ≤ 8\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Por que a circulação vem primeiro no intoxicado:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>PCR por toxicidade direta:\u003c/strong> em muitas intoxicações o coração para pela ação do agente, não por asfixia primária — e o sangue precisa circular para os órgãos vitais.\u003c/li>\u003cli>\u003cstrong>Colapso circulatório rápido:\u003c/strong> medicamentos, drogas ilícitas e produtos químicos causam arritmias, hipotensão severa e choque.\u003c/li>\u003cli>\u003cstrong>Tempo-resposta:\u003c/strong> compressões precoces e estabilização hemodinâmica rápida reduzem o tempo sem perfusão e melhoram a sobrevida.\u003c/li>\u003cli>\u003cstrong>Não retardar\u003c/strong> o suporte nem o contato com o centro de intoxicações por não saber especificar a substância; e não atrasar a intubação quando indicada.\u003c/li>\u003cli>\u003cstrong>Atenção:\u003c/strong> o material da disciplina chega a grafar \"ABCDE\" em trecho pré-hospitalar; para o intoxicado grave/PCR, a sequência é o \u003cstrong>CABDE\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-via-aérea-definitiva-e-a-escolha-da-curarização\">1.2 Via aérea definitiva e a escolha da curarização\u003c/h3>\n\u003cul>\u003cli>Via aérea definitiva se: \u003cstrong>Glasgow ≤ 8\u003c/strong> · \u003cstrong>pAO2 &lt; 60 mmHg\u003c/strong> ou \u003cstrong>SatO2 &lt; 90%\u003c/strong> · \u003cstrong>FR &gt; 35 irpm\u003c/strong> · incapacidade de atender comandos verbais simples. Sem oximetria, considerar todo crítico hipoxêmico.\u003c/li>\u003cli>Drogas de início rápido e meia-vida curta: \u003cstrong>midazolam, etomidato, fentanil\u003c/strong>; oxigênio para \u003cstrong>SatO2 &gt; 94%\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Evitar succinilcolina na intoxicação por inibidor de colinesterase\u003c/strong> (organofosforado ou carbamato): a pseudocolinesterase plasmática está inibida e o bloqueio despolarizante se prolonga — preferir bloqueador \u003cstrong>não despolarizante\u003c/strong> (rocurônio/vecurônio).\u003c/li>\u003cli>No \u003cstrong>digitálico\u003c/strong>, a succinilcolina é \u003cstrong>precaução\u003c/strong>: libera potássio e pode precipitar hipercalemia grave (racional de mecanismo, evidência antiga). Detalhes em 4.5.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-anamnese-os-5ws\">1.3 Anamnese: os 5Ws\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>W\u003c/th>\u003cth>Pergunta\u003c/th>\u003cth>O que buscar\u003c/th>\u003c/tr>\u
