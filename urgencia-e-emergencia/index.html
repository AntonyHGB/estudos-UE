<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Urg. Emerg.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>🚑 Urgência e Emergência — Estudos</title>
<style>
:root{
  color-scheme:light dark;
  --accent:#dc2626;
  --accent-soft:#dc262618;
  --bg:#f8fafc; --panel:#ffffff; --panel-raised:#ffffff; --panel-muted:#f1f5f9;
  --text:#0f172a; --muted:#64748b; --border:#dbe4ef; --code-bg:#eef2f7;
  --shadow:0 12px 34px rgba(15,23,42,.07); --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --green:#16a34a; --yellow:#ca8a04; --red:#dc2626;
  --bar:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#fca5a5;
    --accent-soft:#fca5a522;
    --bg:#0b1120; --panel:#111a2e; --panel-raised:#151f36; --panel-muted:#0e1729;
    --text:#e6edf7; --muted:#9aa9bd; --border:#24314a; --code-bg:#1a2440;
    --shadow:0 14px 36px rgba(0,0,0,.24); --shadow-sm:0 2px 8px rgba(0,0,0,.2);
    --green:#4ade80; --yellow:#facc15; --red:#f87171;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;background:
  radial-gradient(circle at 76% -10%,var(--accent-soft),transparent 34rem),var(--bg);color:var(--text);
  line-height:1.65;font-size:15.5px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button,a{outline-offset:3px}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}
code{background:var(--code-bg);padding:.12em .38em;border-radius:5px;font-size:.88em;
  font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace;overflow-wrap:anywhere}
p,li,td,th,.qtext,.qt{overflow-wrap:break-word}
pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;border:1px solid var(--border)}
pre code{background:none;padding:0;font-size:.85em;line-height:1.5;overflow-wrap:normal}
blockquote{margin:0 0 1em;padding:.6em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;color:var(--muted)}
blockquote p{margin:.25em 0}
hr{border:none;border-top:1px solid var(--border);margin:1.6em 0}
h1,h2,h3,h4{line-height:1.3;scroll-margin-top:80px}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--accent-soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
.ref{color:var(--accent);font-weight:600}
.cb{color:var(--accent)}

.layout{display:flex;min-height:100vh}
aside{width:280px;flex-shrink:0;background:color-mix(in srgb,var(--panel) 94%,transparent);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 14px;
  padding-bottom:max(18px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
main{flex:1;min-width:0;padding:34px clamp(18px,4vw,58px) 88px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .em{font-size:1.7em}
.brand h1{font-size:1.02em;margin:0;line-height:1.25}
.brand small{color:var(--muted);display:block;font-weight:400}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--text);text-decoration:none;font-size:.92em;margin:2px 0;min-height:40px}
.nav-item.active{background:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow-sm)}
@media (prefers-color-scheme: dark){.nav-item.active{color:#0b1120}}
.nav-item .num{font-weight:700;font-size:.82em;opacity:.65;width:20px;flex-shrink:0}
.nav-item .prog{margin-left:auto;font-size:.72em;opacity:.75;white-space:nowrap;text-align:right}
.nav-label{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 4px}

.topbar{display:none}
.scrim{display:none;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.5);
  opacity:0;transition:opacity .18s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.scrim.on{display:block;opacity:1}

.topic-head h1{font-size:1.55em;margin:.1em 0 .15em}
.topic-head .sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin:18px 0 26px;border-bottom:1px solid var(--border);flex-wrap:wrap;
  position:sticky;top:0;z-index:12;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}
.tab{padding:11px 18px;cursor:pointer;border:none;background:none;font:inherit;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{font-size:.8em;opacity:.7}

.toc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.toc b{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toc a{display:block;padding:6px 0;text-decoration:none;font-size:.93em}
.study-sec{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 28px 20px;
  margin-bottom:22px;box-shadow:var(--shadow)}
.study-sec>h2{border-bottom:2px solid var(--accent-soft);padding-bottom:.35em}

.q-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.q-tools .spacer{flex:1}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;
  padding:7px 15px;cursor:pointer;font:inherit;font-size:.85em;min-height:38px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.chip.active{color:#0b1120}}
.card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;
  margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card.l-basico{border-left-color:var(--green)}
.card.l-intermediario{border-left-color:var(--yellow)}
.card.l-avancado{border-left-color:var(--red)}
.card-q{width:100%;padding:15px 20px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;
  border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.card-q .qt{font-weight:600;flex:1}
.card-q .toggle{color:var(--muted);font-size:.82em;white-space:nowrap;padding-top:2px}
.card-a{display:none;padding:4px 22px 14px;border-top:1px dashed var(--border)}
.card.open .card-a{display:block}
.card-mark{display:flex;gap:8px;align-items:center;padding:10px 20px 14px;border-top:1px solid var(--border);
  flex-wrap:wrap;background:color-mix(in srgb, var(--panel) 70%, var(--bg))}
.card-mark span.lbl{font-size:.78em;color:var(--muted);margin-right:4px}
.mark-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-size:.85em;min-height:38px}
.mark-btn.sel-ok{background:var(--green);border-color:var(--green);color:#fff}
.mark-btn.sel-meh{background:var(--yellow);border-color:var(--yellow);color:#fff}
.mark-btn.sel-bad{background:var(--red);border-color:var(--red);color:#fff}
.q-intro{margin-bottom:18px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-style:italic}

.quiz-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.quiz-head .score{font-weight:700;font-size:1.05em}
.quiz-head .score .ok{color:var(--green)}
.quiz-head .detail{color:var(--muted);font-size:.85em;flex:1;min-width:180px}
.qz{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;
  margin-bottom:18px;box-shadow:var(--shadow);padding:16px 20px 14px}
.qz.l-basico{border-left-color:var(--green)}
.qz.l-intermediario{border-left-color:var(--yellow)}
.qz.l-avancado{border-left-color:var(--red)}
.qz .qnum{font-size:.75em;font-weight:700;color:var(--muted);letter-spacing:.05em}
.qz .qtext{font-weight:600;margin:4px 0 12px}
.alt{display:flex;width:100%;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin:8px 0;
  cursor:pointer;align-items:flex-start;transition:border-color .1s,background .1s,transform .1s;min-height:44px;
  background:transparent;color:inherit;font:inherit;text-align:left}
.alt .letter{font-weight:700;color:var(--accent);flex-shrink:0}
.alt:active{border-color:var(--accent)}
.alt.locked{cursor:default}
.alt.correct{border-color:var(--green);background:color-mix(in srgb, var(--green) 14%, var(--panel))}
.alt.correct .letter{color:var(--green)}
.alt.wrong{border-color:var(--red);background:color-mix(in srgb, var(--red) 12%, var(--panel))}
.alt.wrong .letter{color:var(--red)}
.alt.dim{opacity:.55}
.qz-exp{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:.94em;background:var(--accent-soft);border:1px solid var(--border)}
.qz-exp .verdict{font-weight:700;display:block;margin-bottom:4px}
.qz-exp .verdict.ok{color:var(--green)}
.qz-exp .verdict.nok{color:var(--red)}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:20px 0 28px}
.home-card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:17px 18px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .12s,border-color .12s,box-shadow .12s;color:inherit;text-decoration:none}
.home-card .n{font-size:.78em;font-weight:700;color:var(--accent)}
.home-card .t{font-weight:600;margin:2px 0 6px}
.home-card .s{font-size:.83em;color:var(--muted)}
.home-card .qn{font-size:.76em;color:var(--muted);margin-top:8px}
.topic-progress{height:5px;background:var(--code-bg);border-radius:99px;overflow:hidden;margin-top:12px}
.topic-progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.readme{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:0 24px;box-shadow:var(--shadow-sm)}
.readme summary{cursor:pointer;padding:17px 0;font-weight:700;color:var(--text)}
.readme-body{padding:0 2px 20px;border-top:1px solid var(--border)}

/* painel de retomada: mostra a proxima decisao antes da grade de conteudo */
.resume{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(230px,.8fr);gap:14px;margin:22px 0 14px}
.resume-main{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--panel-raised),var(--panel));
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.resume-main:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-105px;
  background:var(--accent-soft);pointer-events:none}
.eyebrow{font-size:.72em;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);font-weight:800}
.resume-main h2{font-size:1.25em;margin:.25em 0 .3em;max-width:34rem}
.resume-main p{color:var(--muted);margin:0 0 14px;max-width:38rem}
.resume-actions{display:flex;gap:8px;flex-wrap:wrap}
.resume-actions .btn{margin:0;text-decoration:none;display:inline-flex;align-items:center}
.resume-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:1.22em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:.75em;margin-top:4px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:26px}
.section-head h2{font-size:1.05em;margin:0}.section-head span{color:var(--muted);font-size:.82em}
.topic-nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.topic-nav a{display:flex;flex-direction:column;max-width:48%;padding:10px 0;text-decoration:none}
.topic-nav a:last-child{text-align:right;margin-left:auto}.topic-nav small{color:var(--muted)}

.sync-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.sync-box h3{margin:.2em 0 .5em}
.sync-box p{color:var(--muted);font-size:.92em}
.sync-box textarea{width:100%;min-height:80px;font-family:'Cascadia Code',Consolas,monospace;font-size:.82em;
  padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--code-bg);color:var(--text);resize:vertical}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:10px 18px;
  cursor:pointer;font:inherit;font-weight:600;min-height:44px;margin:6px 6px 0 0}
@media (prefers-color-scheme: dark){.btn{color:#0b1120}}
.btn.ghost{background:var(--panel);color:var(--text);border-color:var(--border)}
.note{font-size:.85em;padding:10px 14px;border-radius:9px;margin-top:10px}
.note.ok{background:color-mix(in srgb, var(--green) 15%, var(--panel));border:1px solid var(--green)}
.note.err{background:color-mix(in srgb, var(--red) 12%, var(--panel));border:1px solid var(--red)}

/* desempenho por nível */
.perf{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 20px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.perf h3{margin:.1em 0 .7em;font-size:1em}
.perf-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.9em}
.perf-row .lv{width:78px;flex-shrink:0}
.perf-row .bar{flex:1;height:9px;background:var(--code-bg);border-radius:99px;overflow:hidden;min-width:60px}
.perf-row .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.perf-row .bar i.hi{background:var(--green)}
.perf-row .bar i.mid{background:var(--yellow)}
.perf-row .bar i.lo{background:var(--red)}
.perf-row .val{width:74px;text-align:right;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums}
.perf .hint{color:var(--muted);font-size:.84em;margin:10px 0 0}
.mini-perf{font-size:.78em;color:var(--muted);margin-top:6px}

/* atalhos da home */
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 22px}
.acao{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  font:inherit;color:inherit;min-height:64px}
.acao b{font-size:.95em}
.acao span{font-size:.79em;color:var(--muted)}
.acao.destaque{border-color:var(--accent)}

/* busca */
.busca-campo{display:flex;gap:8px;margin-bottom:16px}
.busca-campo input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font:inherit;font-size:1em;min-height:46px}
.busca-campo input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hit{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 16px;
  margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.hit .onde{font-size:.74em;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.hit .tit{font-weight:600;margin:3px 0}
.hit .trecho{font-size:.87em;color:var(--muted);line-height:1.5}
mark{background:var(--accent-soft);color:var(--text);font-weight:700;padding:0 2px;border-radius:3px}

/* simulado */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.seg button{flex:1;min-width:96px;min-height:52px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);border-radius:11px;cursor:pointer;font:inherit;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{color:#0b1120}}
.sim-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:11px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sim-top .cont{font-weight:700;font-variant-numeric:tabular-nums}
.sim-top .barra{flex:1;height:7px;background:var(--code-bg);border-radius:99px;overflow:hidden;min-width:80px}
.sim-top .barra i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sim-nav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sim-nav .btn{flex:1;min-width:120px}
.alt.escolhida{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.resultado{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;
  margin-bottom:18px;box-shadow:var(--shadow);text-align:center}
.resultado .nota{font-size:2.5em;font-weight:800;line-height:1.1}
.resultado .sub{color:var(--muted)}

@media (hover:hover) and (pointer:fine){
  .nav-item:hover{background:var(--accent-soft)}
  .acao:hover{border-color:var(--accent)}
  .hit:hover{border-color:var(--accent)}
  .card-q:hover{background:var(--accent-soft)}
  .alt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .alt.locked:hover{border-color:var(--border);background:none}
  .home-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
  .alt:not(.locked):hover{transform:translateX(2px)}
}

@media (max-width: 860px){
  html{scroll-behavior:auto}
  h1,h2,h3,h4{scroll-margin-top:calc(var(--bar) + 8px)}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;height:var(--bar);
    padding:0 14px;background:color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border)}
  .topbar button{border:none;background:none;color:var(--text);font-size:1.5em;cursor:pointer;
    width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar .tb-title{font-weight:700;font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layout{display:block}
  aside{position:fixed;top:0;left:0;z-index:30;width:min(300px,86vw);transform:translateX(-100%);
    transition:transform .2s ease;border-right:1px solid var(--border)}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  main{padding:18px 16px 64px;max-width:none}
  body.locked{overflow:hidden}
  .study-sec{padding:6px 16px 14px;border-radius:12px}
  .qz{padding:14px 15px 12px}
  .card-q{padding:14px 15px}
  .card-a{padding:4px 15px 12px}
  .card-mark{padding:10px 15px 12px}
  .quiz-head{padding:12px 15px}
  .toc{padding:12px 16px}
  .readme{padding:6px 16px 14px}
  .sync-box{padding:16px}
  .chip,.mark-btn{min-height:44px;padding:10px 16px;font-size:.88em}
  .nav-item{min-height:44px;padding:11px 12px}
  .tabs{gap:2px;top:var(--bar);margin-top:12px}
  .tab{padding:11px 12px;font-size:.94em}
  .topic-head h1{font-size:1.3em}
  .home-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:1fr}.resume-stats{grid-template-columns:repeat(4,1fr)}
  .stat{padding:10px}.stat b{font-size:1em}.stat span{font-size:.68em}
}
@media (max-width:560px){
  .resume-main{padding:19px 18px}.resume-stats{grid-template-columns:1fr 1fr}
  .section-head{align-items:flex-start;flex-direction:column}.topic-nav{font-size:.9em}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>

<script id="site-data" type="application/json">{"siteKey":"urgencia-e-emergencia","title":"Urgência e Emergência","short":"Urg. Emerg.","emoji":"🚑","fp":16056,"chash":50836,"topics":[{"id":"01","fullTitle":"01 — RCP de alta qualidade e cadeia de sobrevivência","shortTitle":"RCP de alta qualidade e cadeia de sobrevivência","subtitle":"O que separa uma parada com chance de retorno da circulação de uma reanimação perdida:","toc":[{"id":"sec-1-a-cadeia-de-sobrevivência","title":"1. A cadeia de sobrevivência"},{"id":"sec-2-reconhecer-a-parada-o-gasping-engana","title":"2. Reconhecer a parada: o gasping engana"},{"id":"sec-3-rcp-de-alta-qualidade-os-números","title":"3. RCP de alta qualidade: os números"},{"id":"sec-4-desfibrilação-precoce-e-dea","title":"4. Desfibrilação precoce e DEA"},{"id":"sec-5-capnografia-medindo-a-rcp-em-tempo-real","title":"5. Capnografia: medindo a RCP em tempo real"},{"id":"sec-6-rcp-mecânica-cda-e-dli-quando-a-manual-não-dá-conta","title":"6. RCP mecânica, CDA e DLI: quando a manual não dá conta"},{"id":"sec-7-feedback-audiovisual-medir-para-corrigir","title":"7. Feedback audiovisual: medir para corrigir"},{"id":"sec-8-epidemiologia-em-números","title":"8. Epidemiologia em números"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-a-cadeia-de-sobrevivência\">\u003ch2>1. A cadeia de sobrevivência\u003c/h2>\u003cp>Nenhuma medida isolada salva uma parada: o resultado depende de uma \u003cstrong>sequência de ações encadeadas\u003c/strong>, em que um elo fraco limita todos os seguintes. Os elos:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Reconhecimento e acionamento\u003c/strong> da resposta de emergência, junto com a \u003cstrong>prevenção\u003c/strong> — identificar e tratar o paciente que está deteriorando antes do colapso.\u003c/li>\u003cli>\u003cstrong>RCP de alta qualidade imediata\u003c/strong> — as compressões começam antes de qualquer outra medida.\u003c/li>\u003cli>\u003cstrong>Desfibrilação rápida\u003c/strong> — nos ritmos chocáveis, é o choque que interrompe a arritmia.\u003c/li>\u003cli>\u003cstrong>Cuidados avançados\u003c/strong> — via aérea, acesso vascular e tratamento das causas.\u003c/li>\u003cli>\u003cstrong>Cuidados pós-parada\u003c/strong> — estabilização e tratamento da causa depois do retorno da circulação.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>O que mudou em 2025:\u003c/strong> a cadeia foi \u003cstrong>unificada\u003c/strong> para parada intra e extra-hospitalar, adulta e pediátrica, e passou a explicitar a \u003cstrong>prevenção e a preparação\u003c/strong> antes do colapso. É o elo que pode evitar a parada inteira — e o mais fácil de esquecer no dia a dia.\u003c/p>\n\u003cp>A \u003cstrong>fórmula de Utstein\u003c/strong> resume o problema de sistema: \u003cstrong>sobrevivência = ciência médica × eficiência educacional × implementação local\u003c/strong>. Protocolo excelente em sistema que não o executa rende zero.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>No hospital:\u003c/strong> desfibriladores e DEAs prontamente acessíveis, com todos treinados para usá-los; meta de \u003cstrong>primeiro choque em ≤2 min\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Prevenção que aparece nos números:\u003c/strong> \u003cstrong>59,4%\u003c/strong> dos pacientes com parada intra-hospitalar tinham \u003cstrong>sinais vitais anormais nas 4 horas anteriores\u003c/strong>. Reuniões rápidas de segurança (huddles) em pacientes de alto risco podem reduzir a parada intra-hospitalar (2025).\u003c/li>\u003cli>\u003cstrong>Fora do hospital:\u003c/strong> a central de emergência orienta leigos — \u003cstrong>RCP só com as mãos\u003c/strong> em adultos e \u003cstrong>RCP com ventilações\u003c/strong> em crianças; protocolo \u003cstrong>No-No-Go\u003c/strong>: \"Não responde? Não respira? Inicie a RCP!\".\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-reconhecer-a-parada-o-gasping-engana\">\u003ch2>2. Reconhecer a parada: o gasping engana\u003c/h2>\u003cul>\u003cli>Definição operacional de parada cardiorrespiratória: \u003cstrong>ausência de resposta + ausência de pulso + apneia ou respiração ofegante agônica\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Gasping\u003c/strong> (respiração agônica): movimentos ofegantes e irregulares, comuns nos primeiros minutos da parada e que podem persistir por \u003cstrong>mais de 1 minuto\u003c/strong>. Não são ventilação eficaz e \u003cstrong>não indicam circulação\u003c/strong>.\u003c/li>\u003cli>Para o profissional: checar respiração normal e \u003cstrong>pulso carotídeo por 5 a 10 s\u003c/strong>. Na dúvida, tratar como parada e iniciar compressões.\u003c/li>\u003cli>\u003cstrong>Cada minuto sem circulação derruba a sobrevivência em cerca de 10%\u003c/strong> até o restabelecimento do fluxo. Reconhecer é o elo que liga todos os outros.\u003c/li>\u003cli>Colapso cardiovascular: perda súbita de fluxo efetivo, que pode reverter sozinha (síncope) ou exigir intervenções (parada).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-rcp-de-alta-qualidade-os-números\">\u003ch2>3. RCP de alta qualidade: os números\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Parâmetro\u003c/th>\u003cth>Meta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Frequência\u003c/td>\u003ctd>\u003cstrong>100 a 120/min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Profundidade\u003c/td>\u003ctd>\u003cstrong>5 a 6 cm\u003c/strong> (não exceder 6 cm)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recuo\u003c/td>\u003ctd>\u003cstrong>total\u003c/strong>, sem apoiar no tórax\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fração de compressão torácica (FCT)\u003c/td>\u003ctd>\u003cstrong>≥60%\u003c/strong> do tempo de parada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pausas (checagem, choque, troca)\u003c/td>\u003ctd>\u003cstrong>≤10 s\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Troca de compressor\u003c/td>\u003ctd>a cada \u003cstrong>2 min\u003c/strong>, em cerca de \u003cstrong>5 s\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sem via aérea avançada\u003c/td>\u003ctd>relação \u003cstrong>30:2\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Com via aérea avançada\u003c/td>\u003ctd>compressões \u003cstrong>contínuas\u003c/strong> + \u003cstrong>1 ventilação a cada 6 s\u003c/strong> (10/min)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ventilação\u003c/td>\u003ctd>volume para \u003cstrong>elevação visível do tórax\u003c/strong>; evitar hipo e hiperventilação\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Por trás da tabela:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Por que 100 a 120/min:\u003c/strong> abaixo disso o débito cai; acima, profundidade e recuo pioram.\u003c/li>\u003cli>\u003cstrong>Por que 5 a 6 cm:\u003c/strong> mais raso não gera pressão de perfusão; mais fundo aumenta o risco de lesão.\u003c/li>\u003cli>\u003cstrong>Recuo total:\u003c/strong> apoiar-se no tórax impede o retorno venoso e reduz o volume da compressão seguinte.\u003c/li>\u003cli>\u003cstrong>Pausas:\u003c/strong> interrupções de \u003cstrong>40 s ou mais ao redor do choque\u003c/strong> se associam a menor sobrevida, e mesmo pausas de \u003cstrong>4 a 5 s\u003c/strong> já derrubam as pressões de perfusão. Toda pausa precisa ter motivo e duração mínima.\u003c/li>\u003cli>\u003cstrong>Fadiga:\u003c/strong> a profundidade começa a cair depois de \u003cstrong>cerca de 1 minuto\u003c/strong> de compressões, mas o socorrista só \u003cstrong>percebe\u003c/strong> a fadiga perto de \u003cstrong>5 minutos\u003c/strong>. Daí a troca programada a cada 2 min, planejada para não adicionar pausa (meta clássica: uma troca de cerca de 5 s).\u003c/li>\u003cli>\u003cstrong>Ventilação:\u003c/strong> sem via aérea avançada, 30:2 — relação aceita para leigos e profissionais na atualização de 2025. Com via aérea avançada, as compressões não param e a ventilação vira independente: \u003cstrong>10/min\u003c/strong>. Ventilar demais aumenta a pressão intratorácica e derruba o retorno venoso.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-desfibrilação-precoce-e-dea\">\u003ch2>4. Desfibrilação precoce e DEA\u003c/h2>\u003cul>\u003cli>A desfibrilação é um \u003cstrong>choque não sincronizado\u003c/strong>: não \"liga\" o coração, e sim \u003cstrong>despolariza as células em massa\u003c/strong> para que os marcapassos naturais retomem o ritmo. Indicada nos ritmos \u003cstrong>chocáveis\u003c/strong> (FV e TV sem pulso).\u003c/li>\u003cli>A chance de sucesso cai rápido com o atraso, por isso o choque é um elo próprio da cadeia. \u003cstrong>Meta: primeiro choque em ≤2 min\u003c/strong> no ambiente hospitalar; DEAs posicionados estrategicamente, com todos sabendo usá-los.\u003c/li>\u003cli>\u003cstrong>DEA × desfibrilador manual:\u003c/strong> o DEA interpreta o ritmo por computador e orienta o choque; no manual, o profissional interpreta e decide.\u003c/li>\u003cli>\u003cstrong>Enquanto o desfibrilador é preparado, não se interrompem as compressões.\u003c/strong> Eletrodos adesivos agilizam a aplicação; antes do choque, afastar todos, retirar o oxigênio do tórax e avisar em voz alta; depois, retomar as compressões imediatamente.\u003c/li>\u003cli>\u003cstrong>2025:\u003c/strong> em mulheres, pode ser aceitável \u003cstrong>ajustar o sutiã em vez de removê-lo\u003c/strong> — uma barreira a menos para desfibrilar rápido (novo).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-capnografia-medindo-a-rcp-em-tempo-real\">\u003ch2>5. Capnografia: medindo a RCP em tempo real\u003c/h2>\u003cp>Depois da via aérea avançada, a \u003cstrong>capnografia contínua\u003c/strong> acompanha a reanimação: confirma a posição do tubo, mostra a qualidade das compressões e detecta o retorno da circulação.\u003c/p>\n\u003cul>\u003cli>No início da parada, o EtCO₂ \u003cstrong>cai acentuadamente\u003c/strong> (não há transporte de CO₂).\u003c/li>\u003cli>Durante a RCP, com compressões efetivas, o EtCO₂ costuma ficar \u003cstrong>entre 10 e 20 mmHg\u003c/strong>; o alvo é \u003cstrong>≥10 mmHg, idealmente ≥20 mmHg\u003c/strong>.\u003c/li>\u003cli>Valores persistentemente \u003cstrong>&lt;10 mmHg\u003c/strong> indicam baixo débito cardíaco e \u003cstrong>pior prognóstico\u003c/strong> — melhore a qualidade da RCP e busque causas reversíveis.\u003c/li>\u003cli>Uma \u003cstrong>subida súbita e sustentada para ~35–45 mmHg\u003c/strong> sugere \u003cstrong>retorno da circulação (RCE)\u003c/strong> — a capnografia detecta isso \u003cstrong>sem precisar pausar as compressões\u003c/strong> para checar pulso.\u003c/li>\u003cli>\u003cstrong>Queda gradual\u003c/strong> da onda: \u003cstrong>fadiga do compressor\u003c/strong> — troque quem comprime.\u003c/li>\u003cli>Com \u003cstrong>linha arterial\u003c/strong>, pressão de perfusão coronária \u003cstrong>&gt;20 mmHg\u003c/strong> e pressão diastólica \u003cstrong>&gt;25 mmHg\u003c/strong> se associam a maior sucesso; a diretriz de 2025 inclui parâmetros fisiológicos entre os adjuntos para monitorar a qualidade da RCP.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-rcp-mecânica-cda-e-dli-quando-a-manual-não-dá-conta\">\u003ch2>6. RCP mecânica, CDA e DLI: quando a manual não dá conta\u003c/h2>\u003cul>\u003cli>\u003cstrong>RCP mecânica não é de uso rotineiro\u003c/strong> (2025). Pode ser considerada em \u003cstrong>cenários específicos\u003c/strong>: compressões manuais difíceis ou perigosas, equipe reduzida, RCP prolongada, hipotermia, transporte em ambulância em movimento, sala de angiografia, preparação para RCP extracorpórea — sempre com \u003cstrong>interrupções limitadas\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>RCP-CDA\u003c/strong> (compressão-descompressão ativa) e \u003cstrong>DLI\u003c/strong> (dispositivo de limite de impedância): a \u003cstrong>combinação\u003c/strong> pode ser alternativa razoável; o uso rotineiro do \u003cstrong>DLI não é recomendado\u003c/strong>.\u003c/li>\u003cli>Ideia-chave: dispositivo muda \u003cstrong>quem executa\u003c/strong> as compressões, não substitui qualidade. Se a RCP manual está boa, a mecânica não é um upgrade automático.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-feedback-audiovisual-medir-para-corrigir\">\u003ch2>7. Feedback audiovisual: medir para corrigir\u003c/h2>\u003cul>\u003cli>Dispositivos de \u003cstrong>feedback audiovisual\u003c/strong> medem frequência e profundidade em tempo real e alertam quando a equipe sai da faixa; alguns ainda filtram o artefato gerado pela própria compressão.\u003c/li>\u003cli>Usar em tempo real para otimizar a RCP é \u003cstrong>razoável\u003c/strong>. Em \u003cstrong>treinamento\u003c/strong>, são recomendados para profissionais (atualização 2025) e também para leigos (novo), com efeito de moderado a amplo nos parâmetros de qualidade.\u003c/li>\u003cli>Limite: o aparelho mede o \u003cstrong>gesto\u003c/strong> (frequência, profundidade), não o resultado clínico. Quem interpreta e corrige a equipe continua sendo humano.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-epidemiologia-em-números\">\u003ch2>8. Epidemiologia em números\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cenário\u003c/th>\u003cth>Dado\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PCREH — sobrevivência até a alta\u003c/td>\u003ctd>\u003cstrong>10,5%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCREH — alta com desfecho neurológico favorável\u003c/td>\u003ctd>\u003cstrong>8,2%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCREH — RCP iniciada por leigos\u003c/td>\u003ctd>sobrevida \u003cstrong>+13%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCREH — ritmos\u003c/td>\u003ctd>assistolia \u003cstrong>50,2%\u003c/strong>; AESP/idioventricular \u003cstrong>21,2%\u003c/strong>; FV/TVSP \u003cstrong>18,4%\u003c/strong>; não definível \u003cstrong>10,2%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCREH — DEA antes do serviço de emergência\u003c/td>\u003ctd>\u003cstrong>não aplicado em 71,1%\u003c/strong> dos casos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCRIH — testemunhada\u003c/td>\u003ctd>\u003cstrong>79,2%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCRIH — alta sem sequelas ou com sequelas mínimas\u003c/td>\u003ctd>\u003cstrong>24%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PCRIH — ritmos\u003c/td>\u003ctd>AESP \u003cstrong>52,3%\u003c/strong>; assistolia \u003cstrong>23,6%\u003c/strong>; FV/TVp \u003cstrong>16,1%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sobrevivência à alta\u003c/td>\u003ctd>PCRIH \u003cstrong>~25,6%\u003c/strong> × PCREH \u003cstrong>~10,4%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Leitura prática: \u003cstrong>o ritmo mais comum não é o chocável\u003c/strong>. A maioria das mortes depende de reconhecer a parada e comprimir bem — a desfibrilação muda o jogo, mas só quando alguém identifica o ritmo a tempo.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Você vê um adulto colapsar no corredor do hospital. Ele não responde e não tem pulso. Quais elos da cadeia de sobrevivência entram em ação, e em que ordem?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Primeiro o reconhecimento e o acionamento: pedir ajuda e o desfibrilador enquanto se inicia o básico. Em seguida, a RCP de alta qualidade — compressões imediatas a 100 a 120/min, 5 a 6 cm de profundidade, recuo total e pausas ≤10 s. A desfibrilação rápida vem na sequência (checar ritmo e chocar se for chocável, com meta de primeiro choque ≤2 min no hospital). Depois entram os cuidados avançados (via aérea, acesso, drogas e causas) e, por fim, os cuidados pós-parada. O elo da prevenção atua antes de tudo: no paciente de risco, reconhecer a deterioração evita a parada.\u003c/p>"},{"titleHtml":"🟢 O que é a respiração agônica (gasping) e por que ela é uma armadilha no reconhecimento da parada?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> São movimentos respiratórios ofegantes e irregulares, comuns nos primeiros minutos após a parada, que podem persistir por mais de um minuto. Não são ventilação eficaz nem sinal de circulação — são um reflexo do tronco encefálico em isquemia. Quem interpreta gasping como respiração pode atrasar as compressões; a regra é: inconsciente + sem pulso + apneia ou gasping = parada, iniciar RCP imediatamente.\u003c/p>"},{"titleHtml":"🟡 Numa reanimação, o compressor é trocado a cada 6 minutos e cada análise de ritmo dura 30 segundos. Que problemas isso cria e como corrigir?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Dois erros de qualidade. A troca tardia: a profundidade das compressões já cai depois de cerca de 1 minuto, e o socorrista não percebe a fadiga até perto de 5 minutos — a troca deve ser programada a cada 2 minutos. As pausas longas: interrupções devem durar no máximo 10 segundos, e a fração de compressão precisa ficar ≥60% do tempo total. A correção é treinar a troca para durar cerca de 5 segundos e encurtar as análises, retomando as compressões o quanto antes.\u003c/p>"},{"titleHtml":"🟡 Paciente intubado em RCP: o EtCO₂ se mantém em 12 mmHg e, de repente, sobe para 40 mmHg de forma sustentada. Interprete os dois valores.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> 12 mmHg está dentro da faixa usual com compressões efetivas (entre 10 e 20 mmHg), porém abaixo do alvo ideal (≥20 mmHg): as compressões geram algum débito — mantenha a qualidade e monitore; valores persistentes abaixo de 10 mmHg indicam baixo débito e pior prognóstico. A subida abrupta e sustentada para ~40 mmHg sugere retorno da circulação espontânea — uma subida para ~35–45 mmHg é o esperado com o RCE. Nesse cenário, a capnografia permite perceber o RCE sem interromper as compressões para checar pulso; a confirmação do pulso vem na checagem seguinte.\u003c/p>"},{"titleHtml":"🟡 Em que situações a RCP mecânica pode ser considerada? E o que dizer sobre a CDA e o DLI?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A RCP mecânica não é de uso rotineiro; pode ser considerada em cenários selecionados — compressões manuais difíceis ou perigosas, equipe reduzida, RCP prolongada, hipotermia, transporte em ambulância em movimento, sala de angiografia e preparação para RCP extracorpórea — sempre limitando interrupções. A RCP-CDA (compressão-descompressão ativa) combinada ao dispositivo de limite de impedância (DLI) pode ser uma alternativa razoável, mas o DLI de rotina não é recomendado. O ponto comum: o dispositivo é contexto, não substitui técnica.\u003c/p>"},{"titleHtml":"🔴 O dispositivo de feedback mostra frequência de 132/min, profundidade de 5,5 cm, fração de compressão de 55% e pausas de 15 s a cada análise. Quais correções priorizar e por quê?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A profundidade está adequada (5 a 6 cm); a frequência está um pouco alta e deve voltar para 100 a 120/min, porque acima disso as compressões ficam mais rasas e o recuo tende a ser incompleto. O problema maior é a interrupção: pausas de 15 s com fração de 55% significam quase metade do tempo sem perfusão. A meta é pausar no máximo 10 s e manter a fração ≥60%, treinando a troca de compressor para durar cerca de 5 s.\u003c/p>"},{"titleHtml":"🔴 Ao longo de dois minutos de RCP, a onda de capnografia cai gradualmente de 18 para 9 mmHg, sem mudança na ventilação ou no tubo. O que isso sugere e o que fazer?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A queda gradual da onda sugere fadiga do compressor, com perda de profundidade e de qualidade das compressões. A conduta é trocar quem comprime imediatamente (idealmente a troca já seria programada a cada 2 min), revisar profundidade, recuo e frequência, e checar a via aérea. Se, depois de corrigida a qualidade, o EtCO₂ permanecer abaixo de 10 mmHg, isso é marcador de baixo débito e pior prognóstico.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Na RCP de um adulto, qual é a meta de \u003cstrong>frequência e profundidade\u003c/strong> das compressões torácicas?","a":["100 a 120/min, com 7 a 8 cm de profundidade","60 a 100/min e 5 a 6 cm de profundidade","80 a 100/min e 3 a 4 cm de profundidade","100 a 120/min e 5 a 6 cm de profundidade"],"c":3,"e":"A meta é comprimir a \u003cstrong>100 a 120/min\u003c/strong>, com profundidade de \u003cstrong>5 a 6 cm\u003c/strong> — abaixo disso o débito cai, e acima de 6 cm o risco de lesão sobe sem ganho de perfusão. Faixas de 60 a 100/min ou de 80 a 100/min ficam lentas demais para gerar pressão adequada, e 3 a 4 cm é raso demais. O limite superior existe: 6 cm é teto, não alvo a ultrapassar."},{"n":"🟢","levelName":"basico","q":"Um adulto está inconsciente, sem pulso, com movimentos respiratórios ofegantes e irregulares (gasping). Como interpretar e conduzir?","a":["É respiração agônica: iniciar compressões e buscar o DEA","É respiração agônica: ventilar com bolsa-máscara e reavaliar","É respiração eficaz: colocar em posição lateral de segurança","É respiração eficaz: oferecer oxigênio e monitorar o pulso"],"c":0,"e":"A respiração agônica é o gasping: movimentos ofegantes e irregulares, comuns nos primeiros minutos da parada e que podem persistir por mais de um minuto. Sem pulso e sem resposta, o paciente está em parada — iniciar compressões de alta qualidade e providenciar o desfibrilador. Ventilar isoladamente, posicionar para o lado ou apenas oferecer oxigênio trata o paciente como se houvesse circulação, atrasando a única intervenção que a restabelece."},{"n":"🟡","levelName":"intermediario","q":"Segundo as diretrizes de 2025, o que mudou na \u003cstrong>cadeia de sobrevivência\u003c/strong>?","a":["Agora é separada para PCRIH e PCREH, com elos diferentes","Começa no reconhecimento da parada, sem elo de prevenção","Foi unificada e reconhece a prevenção antes da parada","Vale só para adultos; as crianças mantêm a cadeia anterior"],"c":2,"e":"A diretriz de 2025 unificou as cadeias intra e extra-hospitalares, adulta e pediátrica, e reconhece a prevenção e a preparação antes da parada. Separar as cadeias, começar no reconhecimento sem prevenção ou limitá-las a adultos repete o modelo anterior. A prevenção é o elo que pode evitar a parada inteira — e foi justamente o que a atualização destacou."},{"n":"🟡","levelName":"intermediario","q":"O dispositivo de feedback mostra fração de compressão em 55% e pausas de 15 s a cada análise de ritmo. Qual ajuste ataca diretamente o problema?","a":["Aumentar a frequência das compressões para mais de 120/min","Compensar a pausa com ventilações extras durante a análise","Aumentar a profundidade das compressões para 7 cm ou mais","Encurtar as pausas a 10 s e treinar a troca de compressor"],"c":3,"e":"A fração de compressão é o percentual do tempo de parada em que se comprime; para atingir \u003cstrong>≥60%\u003c/strong>, as pausas precisam durar \u003cstrong>≤10 s\u003c/strong> e a troca de compressor deve ser planejada para não adicionar pausa — a meta clássica é uma troca de cerca de 5 s. Aumentar frequência ou profundidade, ou ventilar durante a pausa, não devolve o tempo sem perfusão — só adiciona erro à técnica. O feedback audiovisual existe justamente para mostrar esse tipo de desvio em tempo real."},{"n":"🟡","levelName":"intermediario","q":"Após a colocação de uma \u003cstrong>via aérea avançada\u003c/strong>, como devem ser conduzidas as compressões e as ventilações?","a":["Manter a relação 30:2, pausando para cada ventilação","Compressões contínuas, com 1 ventilação a cada 6 s","Compressões contínuas, com 1 ventilação a cada 10 s","Compressões contínuas e 2 ventilações a cada 30 s"],"c":1,"e":"Com via aérea avançada, as compressões seguem contínuas e a ventilação ganha frequência própria: \u003cstrong>1 a cada 6 s\u003c/strong>, ou \u003cstrong>10 por minuto\u003c/strong>, sem pausar as compressões. Manter 30:2 depois do tubo só interrompe a circulação sem necessidade. Ventilar a cada 10 s (6/min) ou 2 vezes a cada 30 s (4/min) fica abaixo dos 10/min e compromete a ventilação-alvo."},{"n":"🟡","levelName":"intermediario","q":"Paciente intubado em RCP: o \u003cstrong>EtCO₂\u003c/strong> estava em 14 mmHg e sobe, de forma abrupta e sustentada, para 38 mmHg. Qual é a interpretação mais provável?","a":["RCP de altíssima qualidade: a faixa esperada seria 35 a 45 mmHg","Ventilação excessiva: ventilações extras elevam o CO2 expirado","Retorno da circulação: confirmar o pulso na próxima checagem","Deslocamento do tubo: a subida do CO2 indica intubação esofágica"],"c":2,"e":"Um salto abrupto e sustentado do EtCO₂ costuma marcar o \u003cstrong>retorno da circulação\u003c/strong>: com o débito retomado, mais CO2 chega aos pulmões — e a capnografia mostra isso sem interromper as compressões. A faixa de \u003cstrong>35 a 45 mmHg\u003c/strong> é a esperada \u003cstrong>depois\u003c/strong> do RCE; durante RCP de alta qualidade o valor fica bem mais baixo (10 a 20 mmHg). Ventilação excessiva derruba o CO2 expirado, e tubo em posição errada cursa com valores muito baixos, não com subida."},{"n":"🔴","levelName":"avancado","q":"Em que situação a \u003cstrong>RCP mecânica\u003c/strong> pode ser considerada, segundo as diretrizes atuais?","a":["Em cenários selecionados, como hipotermia e transporte","Somente após 30 minutos de compressões manuais sem êxito","Em qualquer paciente, desde que a equipe tenha experiência","De rotina em toda parada, para padronizar compressões"],"c":0,"e":"A RCP mecânica não é recomendada de rotina, mas pode ser considerada em situações específicas — compressões manuais difíceis ou perigosas, equipe reduzida, RCP prolongada, hipotermia, transporte — sempre limitando interrupções. Padronizá-la para toda parada, reservá-la a um marco fixo de 30 minutos ou liberá-la para qualquer paciente trata como regra o que a diretriz descreve como exceção contextual."},{"n":"🔴","levelName":"avancado","q":"Em uma FV, a equipe gasta 45 s entre parar as compressões, analisar o ritmo e aplicar cada choque. Por que isso é crítico?","a":["O tempo de análise importa apenas antes do primeiro choque aplicado","Pausas longas ao redor do choque reduzem a sobrevida; meta ≤10 s","Pausas longas são aceitáveis se a profundidade das compressões for boa","Pausar é seguro desde que a frequência das compressões esteja adequada"],"c":1,"e":"Pausas ao redor do choque de \u003cstrong>40 s ou mais\u003c/strong> se associam a menor sobrevida; a meta é interromper \u003cstrong>no máximo 10 s\u003c/strong> e retomar as compressões o quanto antes. Profundidade boa ou frequência adequada não compensam o tempo parado — as pressões de perfusão caem em segundos, e mesmo pausas de 4 a 5 s já as derrubam. E o tempo de análise importa em todos os choques, não só no primeiro."}]},{"id":"02","fullTitle":"02 — Algoritmo da parada cardíaca","shortTitle":"Algoritmo da parada cardíaca","subtitle":"Dois ritmos que pedem choque, dois que pedem compressão e droga, e um ciclo de","toc":[{"id":"sec-1-os-quatro-ritmos-de-parada","title":"1. Os quatro ritmos de parada"},{"id":"sec-2-a-sequência-do-algoritmo","title":"2. A sequência do algoritmo"},{"id":"sec-3-desfibrilação-energias","title":"3. Desfibrilação: energias"},{"id":"sec-4-drogas-na-parada-cardíaca","title":"4. Drogas na parada cardíaca"},{"id":"sec-5-via-aérea-avançada-e-ventilação","title":"5. Via aérea avançada e ventilação"},{"id":"sec-6-capnografia-no-algoritmo","title":"6. Capnografia no algoritmo"},{"id":"sec-7-causas-reversíveis-procurar-desde-cedo","title":"7. Causas reversíveis: procurar desde cedo"},{"id":"sec-8-parada-refratária-e-término-da-ressuscitação","title":"8. Parada refratária e término da ressuscitação"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-os-quatro-ritmos-de-parada\">\u003ch2>1. Os quatro ritmos de parada\u003c/h2>\u003cp>O algoritmo começa pelo monitor: o ritmo define a via inteira. São quatro, e a pergunta de entrada é sempre \u003cstrong>\"ritmo chocável?\"\u003c/strong> — \u003cstrong>FV e TV sem pulso\u003c/strong> respondem sim; \u003cstrong>assistolia e AESP\u003c/strong>, não.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ritmo\u003c/th>\u003cth>O que se vê no monitor\u003c/th>\u003cth>Choque?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Fibrilação ventricular (FV)\u003c/strong>\u003c/td>\u003ctd>atividade elétrica caótica, sem QRS organizado; \u003cstrong>grosseira ≥ 3 mm\u003c/strong>, \u003cstrong>fina &lt; 3 mm\u003c/strong> (a amplitude cai com o tempo)\u003c/td>\u003ctd>\u003cstrong>Sim\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>TV sem pulso (TVp)\u003c/strong>\u003c/td>\u003ctd>QRS largo e regular, em geral \u003cstrong>&gt; 100 bpm\u003c/strong>, sem pulso\u003c/td>\u003ctd>\u003cstrong>Sim\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Assistolia\u003c/strong>\u003c/td>\u003ctd>ausência de atividade elétrica ventricular; pode haver atividade atrial isolada (\"assistolia de onda P\")\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>AESP\u003c/strong>\u003c/td>\u003ctd>atividade elétrica organizada no monitor, sem pulso central palpável\u003c/td>\u003ctd>Não\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>A assistolia pode ser \u003cstrong>transitória\u003c/strong> — após o término de uma taquicardia, de uma desfibrilação ou de uma cardioversão. Antes de aceitá-la como definitiva, vale confirmar em mais de uma derivação e checar cabos e ganho.\u003c/li>\u003cli>\u003cstrong>Pseudo-PEA:\u003c/strong> AESP em que existe atividade mecânica, fraca demais para gerar pulso palpável — estimativas citam \u003cstrong>42–86%\u003c/strong> das PEA. Sinais indiretos: \u003cstrong>POCUS\u003c/strong>, linha arterial, EtCO₂ relativamente alto, Doppler. O prognóstico é \u003cstrong>melhor\u003c/strong> que o da AESP verdadeira.\u003c/li>\u003cli>Sobrevivência conforme o ritmo: chocável \u003cstrong>~25–30%\u003c/strong>; AESP \u003cstrong>~10–15%\u003c/strong>; assistolia \u003cstrong>&lt; 5%\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Epidemiologia básica:\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cenário\u003c/th>\u003cth>Ritmo inicial mais comum\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Extra-hospitalar\u003c/td>\u003ctd>assistolia \u003cstrong>50,2%\u003c/strong> &gt; AESP/idioventricular \u003cstrong>21,2%\u003c/strong> &gt; FV/TVSP \u003cstrong>18,4%\u003c/strong> &gt; não definível \u003cstrong>10,2%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intra-hospitalar\u003c/td>\u003ctd>AESP \u003cstrong>52,3%\u003c/strong> &gt; assistolia \u003cstrong>23,6%\u003c/strong> &gt; FV/TVp \u003cstrong>16,1%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Sobrevivência até a alta: intra-hospitalar \u003cstrong>~25,6%\u003c/strong> contra extra-hospitalar \u003cstrong>~10,4%\u003c/strong> (\u003cstrong>10,5%\u003c/strong> no geral; \u003cstrong>8,2%\u003c/strong> com desfecho neurológico favorável).\u003c/li>\u003cli>Leitura prática: \u003cstrong>o ritmo mais comum não é chocável\u003c/strong>. Na maior parte das paradas, quem muda o desfecho é reconhecer o colapso, comprimir bem e procurar a causa — o choque decide os casos em que ele é possível.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-a-sequência-do-algoritmo\">\u003ch2>2. A sequência do algoritmo\u003c/h2>\u003ch3 id=\"h-2-1-entrada-e-decisão\">2.1 Entrada e decisão\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>RCP de alta qualidade\u003c/strong> com bolsa-máscara e oxigênio; instalar \u003cstrong>monitor/desfibrilador\u003c/strong>; checar o ritmo.\u003c/li>\u003cli>\u003cstrong>Chocável →\u003c/strong> via da desfibrilação. \u003cstrong>Não chocável →\u003c/strong> via da RCP com droga e causa.\u003c/li>\u003cli>Acesso vascular, drogas e via aérea avançada são \u003cstrong>secundários\u003c/strong> ao par compressão + desfibrilação quando o ritmo é chocável.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-via-chocável-fv-tvsp-o-choque-organiza-o-ciclo\">2.2 Via chocável (FV/TVSP): o choque organiza o ciclo\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Choque.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>RCP por 2 min\u003c/strong> + estabelecer \u003cstrong>acesso IV/IO\u003c/strong>.\u003c/li>\u003cli>Checar o ritmo: se chocável, \u003cstrong>novo choque\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>RCP por 2 min\u003c/strong> + \u003cstrong>epinefrina\u003c/strong> (após o 2º choque, se o ritmo persistir) + \u003cstrong>considerar via aérea avançada e capnografia\u003c/strong>.\u003c/li>\u003cli>Checar: se chocável, \u003cstrong>novo choque\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>RCP por 2 min\u003c/strong> + \u003cstrong>amiodarona ou lidocaína\u003c/strong> + \u003cstrong>procurar e tratar causas reversíveis\u003c/strong>.\u003c/li>\u003cli>Repetir o ciclo até o retorno da circulação.\u003c/li>\u003cli>\u003cstrong>Checar o ritmo a cada 2 min\u003c/strong> (aproximadamente 5 ciclos de 30:2) e manter \u003cstrong>pausas ≤ 10 s\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Retomar a RCP imediatamente após cada choque\u003c/strong> — não se checa pulso por rotina.\u003c/li>\u003cli>Se o choque gerar \u003cstrong>ritmo organizado\u003c/strong>, aí sim checar pulso: com pulso → cuidados pós-parada; sem pulso → AESP (via não chocável); na dúvida → continuar RCP.\u003c/li>\u003cli>Se o ritmo deixa de ser chocável na checagem, seguir pelo ramo não chocável; se volta a ser, \u003cstrong>chocar\u003c/strong> e retomar o ciclo.\u003c/li>\u003c/ol>\n\u003ch3 id=\"h-2-3-via-não-chocável-assistolia-aesp-rcp-droga-causa\">2.3 Via não chocável (assistolia/AESP): RCP + droga + causa\u003c/h3>\n\u003col>\u003cli>\u003cstrong>RCP por 2 min\u003c/strong> + obter \u003cstrong>acesso IV/IO\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Epinefrina o mais cedo possível\u003c/strong> + considerar via aérea avançada e capnografia.\u003c/li>\u003cli>Checar o ritmo a cada 2 min:\u003cul>\u003cli>Tornou-se \u003cstrong>chocável\u003c/strong> → migrar para a via chocável (choque e ciclo acima).\u003c/li>\u003cli>Continua \u003cstrong>não chocável\u003c/strong> → \u003cstrong>RCP por 2 min + tratar causas reversíveis\u003c/strong> e repetir.\u003c/li>\u003c/ul>\u003c/li>\u003cli>Não se desfibrila nem se dá antiarrítmico de rotina nesta via: o tripé é \u003cstrong>compressão, epinefrina precoce e causa reversível\u003c/strong>.\u003c/li>\u003c/ol>\n\u003ch3 id=\"h-2-4-regras-que-valem-nas-duas-vias\">2.4 Regras que valem nas duas vias\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Checagem a cada 2 min\u003c/strong> com \u003cstrong>pausas ≤ 10 s\u003c/strong> — inclusive para a checagem, o choque e a troca de compressor.\u003c/li>\u003cli>Trocar o compressor \u003cstrong>a cada 2 min\u003c/strong> (em cerca de \u003cstrong>5 s\u003c/strong>): a qualidade cai antes de o socorrista perceber (a fisiologia está no tema 01).\u003c/li>\u003cli>A cada ciclo, perguntar: as compressões estão boas? Há causa reversível a corrigir? Vale continuar?\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-desfibrilação-energias\">\u003ch2>3. Desfibrilação: energias\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aparelho\u003c/th>\u003cth>Energia\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Monofásico\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>360 J\u003c/strong> em todos os choques\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bifásico\u003c/strong>\u003c/td>\u003ctd>conforme o fabricante; se desconhecido, a \u003cstrong>máxima disponível\u003c/strong> — faixa usual de \u003cstrong>120–200 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2º choque e seguintes\u003c/td>\u003ctd>\u003cstrong>equivalentes\u003c/strong> ao primeiro; doses maiores \"podem ser consideradas\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Choque recorrente\u003c/td>\u003ctd>reiniciar no \u003cstrong>último nível que desfibrilou com sucesso\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Carregar o aparelho \u003cstrong>sem interromper as compressões\u003c/strong> e retomar a RCP imediatamente depois do choque.\u003c/li>\u003cli>\u003cstrong>2025:\u003c/strong> na FV/TVSP refratária (após \u003cstrong>≥ 3 choques\u003c/strong>), a \u003cstrong>mudança de vetor\u003c/strong> do choque e a \u003cstrong>desfibrilação sequencial dupla\u003c/strong> têm \u003cstrong>utilidade não estabelecida\u003c/strong> — não são rotina.\u003c/li>\u003cli>Escolha de eletrodos, posição e impedância: tema 03.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-drogas-na-parada-cardíaca\">\u003ch2>4. Drogas na parada cardíaca\u003c/h2>\u003ch3 id=\"h-4-1-epinefrina-mesma-dose-timing-diferente-por-via\">4.1 Epinefrina: mesma dose, timing diferente por via\u003c/h3>\n\u003cul>\u003cli>Dose: \u003cstrong>1 mg IV/IO\u003c/strong> (10 mL de 1:10.000), repetida \u003cstrong>a cada 3–5 min\u003c/strong> — pode ser alinhada às checagens, a cada 4 min.\u003c/li>\u003cli>\u003cstrong>Via chocável:\u003c/strong> entra \u003cstrong>depois do 2º choque\u003c/strong>, quando o ritmo persiste. A atualização de 2025 é explícita: a droga é aceitável \u003cstrong>após a falha das tentativas iniciais de desfibrilação\u003c/strong> — o choque tem prioridade. Os estudos que embasaram a conduta usaram a epinefrina ainda mais tarde (após o 3º choque) e o momento ideal é desconhecido.\u003c/li>\u003cli>\u003cstrong>Via não chocável:\u003c/strong> \u003cstrong>o mais cedo possível\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Doses maiores não são recomendadas.\u003c/strong> Administrar em bolus rápido + \u003cstrong>20 mL de flush\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-2-antiarrítmicos-e-o-que-não-é-rotina\">4.2 Antiarrítmicos — e o que não é rotina\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>1ª dose\u003c/th>\u003cth>2ª dose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Amiodarona\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>300 mg\u003c/strong> IV/IO em bolus\u003c/td>\u003ctd>\u003cstrong>150 mg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lidocaína\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1–1,5 mg/kg\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0,5–0,75 mg/kg\u003c/strong> (cumulativo ≤ \u003cstrong>3 mg/kg\u003c/strong>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Entram na \u003cstrong>via chocável\u003c/strong>, em geral \u003cstrong>após o 3º choque\u003c/strong> que não reverteu, junto com a busca das causas reversíveis. Esquema de \u003cstrong>um ou outro\u003c/strong> — não se associam de rotina.\u003c/li>\u003cli>São mais úteis na \u003cstrong>parada testemunhada\u003c/strong>; não há evidência definindo o melhor momento em relação à epinefrina.\u003c/li>\u003cli>\u003cstrong>Magnésio:\u003c/strong> reservado à \u003cstrong>TV polimórfica com QT prolongado (torsades)\u003c/strong> e a situações específicas. \u003cstrong>Não é rotina na parada\u003c/strong> — com QT normal, não há benefício.\u003c/li>\u003cli>\u003cstrong>Vasopressina:\u003c/strong> \u003cstrong>não substitui a epinefrina\u003c/strong>; sem vantagem isolada ou combinada.\u003c/li>\u003cli>Na \u003cstrong>FV/TVSP refratária\u003c/strong>, betabloqueadores, bretílio, procainamida e sotalol têm \u003cstrong>benefício incerto\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-3-vias-de-administração-o-que-mudou-em-2025\">4.3 Vias de administração: o que mudou em 2025\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>IV primeiro\u003c/strong>; se falhar ou não for viável → \u003cstrong>IO\u003c/strong> (tíbia ou úmero). A metanálise de 2025 mostrou \u003cstrong>menos RCE sustentado com IO\u003c/strong> do que com IV — por isso a ordem importa e não se pula direto para o intraósseo.\u003c/li>\u003cli>\u003cstrong>Bolus rápido + 20 mL de flush\u003c/strong>; em veia periférica, a droga leva \u003cstrong>1–2 min\u003c/strong> até a circulação central.\u003c/li>\u003cli>\u003cstrong>A via traqueal para drogas foi REMOVIDA pela AHA 2025\u003c/strong> — absorção imprevisível. Não usar esquemas antigos de dose traqueal (a antiga recomendação de 2–2,5× a dose IV caiu): quem precisa de acesso na parada usa \u003cstrong>IV\u003c/strong> e, se necessário, \u003cstrong>IO\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-via-aérea-avançada-e-ventilação\">\u003ch2>5. Via aérea avançada e ventilação\u003c/h2>\u003cul>\u003cli>Opções: \u003cstrong>intubação endotraqueal\u003c/strong> ou \u003cstrong>dispositivo supraglótico\u003c/strong>. No algoritmo, é um \"considerar\" — não é pré-requisito dos primeiros ciclos e não deve atrasar choque nem interromper compressões.\u003c/li>\u003cli>\u003cstrong>Sem via aérea avançada:\u003c/strong> relação \u003cstrong>30:2\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Com via aérea avançada:\u003c/strong> compressões \u003cstrong>contínuas\u003c/strong> + \u003cstrong>1 ventilação a cada 6 s (10/min)\u003c/strong>.\u003c/li>\u003cli>Volume suficiente para \u003cstrong>elevação visível do tórax\u003c/strong>; evitar hipoventilação e, sobretudo, \u003cstrong>hiperventilação\u003c/strong> — ela eleva a pressão intratorácica e reduz o retorno venoso.\u003c/li>\u003cli>Confirmar e monitorar a via aérea com \u003cstrong>capnografia de onda contínua\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-capnografia-no-algoritmo\">\u003ch2>6. Capnografia no algoritmo\u003c/h2>\u003cul>\u003cli>\u003cstrong>Confirma a posição do tubo\u003c/strong> e dá a medida indireta da qualidade da RCP.\u003c/li>\u003cli>Durante a RCP, com compressões efetivas, o EtCO₂ costuma ficar \u003cstrong>entre 10 e 20 mmHg\u003c/strong>; o alvo é \u003cstrong>≥10 mmHg, idealmente ≥20 mmHg\u003c/strong>.\u003c/li>\u003cli>Valores persistentemente \u003cstrong>&lt;10 mmHg\u003c/strong> indicam baixo débito e \u003cstrong>pior prognóstico\u003c/strong> — melhore a qualidade da RCP (profundidade, frequência, recuo e via aérea) e busque causas reversíveis.\u003c/li>\u003cli>\u003cstrong>Subida súbita e sustentada para ~35–45 mmHg\u003c/strong> → provável \u003cstrong>retorno da circulação (RCE)\u003c/strong>, detectável \u003cstrong>sem precisar pausar as compressões\u003c/strong> para checar pulso.\u003c/li>\u003cli>\u003cstrong>No término da ressuscitação:\u003c/strong> no paciente \u003cstrong>intubado\u003c/strong>, a falha em atingir \u003cstrong>&gt; 10 mmHg após 20 min\u003c/strong> de suporte avançado pode ser considerada \u003cstrong>como componente de decisão multimodal\u003c/strong> (classe \u003cstrong>2b\u003c/strong>) — \u003cstrong>nunca como critério isolado\u003c/strong>; no \u003cstrong>não intubado\u003c/strong>, \u003cstrong>não se usa\u003c/strong> valor de corte de EtCO₂ para indicar término (classe \u003cstrong>3\u003c/strong>, dano).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-causas-reversíveis-procurar-desde-cedo\">\u003ch2>7. Causas reversíveis: procurar desde cedo\u003c/h2>\u003cp>Tratar a causa faz parte do ciclo nas duas vias — na não chocável, é o que muda o jogo junto com a epinefrina precoce.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>5 H:\u003c/strong> hipovolemia · hipóxia · H+ (acidose) · hipo/hipercalemia · hipotermia.\u003c/li>\u003cli>\u003cstrong>5 T:\u003c/strong> pneumotórax hipertensivo · tamponamento cardíaco · toxinas · trombose pulmonar · trombose coronária.\u003c/li>\u003cli>O manejo é dirigido à causa (descompressão por agulha, pericardiocentese, reperfusão, antídotos, correção eletrolítica) e depende do que se suspeita à beira do leito — o POCUS pode ajudar (2b). O detalhamento fica no tema 06.\u003c/li>\u003cli>Na via chocável, a busca estruturada entra formalmente no ciclo com o antiarrítmico; na não chocável, a cada nova checagem.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-parada-refratária-e-término-da-ressuscitação\">\u003ch2>8. Parada refratária e término da ressuscitação\u003c/h2>\u003ch3 id=\"h-8-1-parada-refratária\">8.1 Parada refratária\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Não há definição consensual.\u003c/strong> As formulações citadas: ausência de RCE após \u003cstrong>&gt; 30 min\u003c/strong> de RCP adequada, sem hipotermia; ou \u003cstrong>TVp/FV recorrente mesmo após &gt; 3 choques\u003c/strong> e antiarrítmicos.\u003c/li>\u003cli>Está associada a \u003cstrong>alta mortalidade\u003c/strong>. As alternativas, em pacientes \u003cstrong>selecionados\u003c/strong>, são \u003cstrong>RCP extracorpórea (ECPR)\u003c/strong> e \u003cstrong>cateterismo emergencial\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>ECPR em 2025:\u003c/strong> critérios de seleção definidos e reavaliados com frequência, canulação por profissional experiente e abordagem \u003cstrong>regionalizada\u003c/strong>; transporte durante a parada apenas para casos altamente selecionados. \u003cstrong>Não é rotina.\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-8-2-término-decisão-multimodal-e-ética\">8.2 Término: decisão multimodal e ética\u003c/h3>\n\u003cul>\u003cli>Antes de decidir, considerar: intervenções adequadas executadas, \u003cstrong>tempo colapso → início da RCP\u003c/strong>, \u003cstrong>ritmo inicial\u003c/strong>, tempo até a \u003cstrong>1ª desfibrilação\u003c/strong>, comorbidades, duração do esforço, achados do ultrassom e \u003cstrong>resposta fisiológica\u003c/strong> (EtCO₂, pressão diastólica).\u003c/li>\u003cli>\u003cstrong>Regras de término pré-hospitalar:\u003c/strong> \u003cstrong>BLS de TOR\u003c/strong> — classe \u003cstrong>1\u003c/strong>, para equipes de suporte básico quando o avançado não está disponível ou está muito atrasado; \u003cstrong>ALS de TOR\u003c/strong> — \u003cstrong>2a\u003c/strong>; \u003cstrong>regra universal\u003c/strong> em sistema escalonado (básico + avançado) — \u003cstrong>2a\u003c/strong>: PCR não presenciada pelo serviço, nenhum choque aplicado e sem RCE.\u003c/li>\u003cli>\u003cstrong>EtCO₂:\u003c/strong> componente da decisão no \u003cstrong>intubado\u003c/strong> (falha em &gt; 10 mmHg após 20 min; \u003cstrong>2b\u003c/strong>); \u003cstrong>nunca critério isolado\u003c/strong>; sem valor de corte no \u003cstrong>não intubado\u003c/strong> (\u003cstrong>classe 3\u003c/strong>, dano).\u003c/li>\u003cli>\u003cstrong>2025:\u003c/strong> os serviços devem estar preparados para \u003cstrong>terminar a ressuscitação no local\u003c/strong> e comunicar a morte; priorizar \u003cstrong>RCE sustentado antes do transporte\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Ética em primeiro plano:\u003c/strong> decisão compartilhada, diretivas antecipadas de vontade e, na ausência delas, julgamento substitutivo do representante legal. O padrão é \u003cstrong>iniciar RCP\u003c/strong> — exceto risco grave de dano físico à equipe, sinais objetivos de morte irreversível ou diretiva antecipada recusando o tratamento. Beneficência, não maleficência, autonomia, justiça e dignidade sustentam a decisão, e a presença da família durante a reanimação pode reduzir luto complicado. Em cada ciclo, \"considerar a adequação da ressuscitação contínua\".\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Quais ritmos são chocáveis e o que muda no algoritmo quando o ritmo não é chocável?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Chocáveis: \u003cstrong>FV e TV sem pulso\u003c/strong> — nelas o choque interrompe a atividade caótica, e a via do algoritmo organiza o ciclo em torno dele. Não chocáveis: \u003cstrong>assistolia e AESP\u003c/strong>; a desfibrilação não é indicada, e o tripé é RCP de alta qualidade, epinefrina o mais cedo possível e tratamento das causas reversíveis, com checagem de ritmo a cada 2 min. Se a checagem revelar ritmo chocável, o paciente migra para a via da desfibrilação. A \"assistolia de onda P\" continua sendo assistolia, e ritmo organizado sem pulso caracteriza a AESP.\u003c/p>"},{"titleHtml":"🟢 Paciente inconsciente, sem pulso, monitor em assistolia. Quais são as prioridades do algoritmo?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> RCP de alta qualidade e acesso \u003cstrong>IV\u003c/strong> — \u003cstrong>IO\u003c/strong> apenas se a IV falhar ou for inviável (e a via traqueal para drogas não é mais recomendada, desde 2025). \u003cstrong>Epinefrina 1 mg o mais cedo possível\u003c/strong>, repetida a cada 3–5 min, e considerar via aérea avançada com capnografia, sem interromper as compressões. Checar o ritmo a cada 2 min, com pausas ≤ 10 s, procurando e tratando causas reversíveis. Não há choque nem antiarrítmico de rotina; se o ritmo se tornar chocável, aplicar o choque e seguir o ciclo da via chocável.\u003c/p>"},{"titleHtml":"🟡 Na FV/TVSP que persiste, quando entram a epinefrina e o antiarrítmico?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A epinefrina entra \u003cstrong>após o 2º choque\u003c/strong>, se o ritmo persistir — a diretriz de 2025 aceita a droga após a falha das tentativas iniciais de desfibrilação, mantendo o choque como prioridade. O antiarrítmico — \u003cstrong>amiodarona 300 → 150 mg\u003c/strong> ou \u003cstrong>lidocaína 1–1,5 → 0,5–0,75 mg/kg\u003c/strong>, um ou outro — entra \u003cstrong>após o 3º choque\u003c/strong> que não reverteu, junto com o tratamento das causas reversíveis. Nas duas situações, a epinefrina segue \u003cstrong>1 mg a cada 3–5 min\u003c/strong>, com doses maiores não recomendadas. Na via não chocável, o timing é o oposto: epinefrina o mais cedo possível.\u003c/p>"},{"titleHtml":"🟡 Descreva o ciclo da via chocável nos três primeiros choques, dizendo o que entra entre eles.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Choque → RCP 2 min + acesso IV/IO → checagem → choque → RCP 2 min + epinefrina\u003c/strong> (e considerar via aérea avançada e capnografia) \u003cstrong>→ checagem → choque → RCP 2 min + amiodarona ou lidocaína + causas reversíveis\u003c/strong>. Em todas as checagens, pausas ≤ 10 s e retomada imediata da RCP após o choque; a checagem de pulso só ocorre se o ritmo virou organizado. O ciclo se repete até o RCE, com a checagem de ritmo a cada 2 min.\u003c/p>"},{"titleHtml":"🟡 Qual é o esquema de doses dos antiarrítmicos na parada — e o que dizer do magnésio e da vasopressina?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Amiodarona: 300 mg IV/IO em bolus\u003c/strong> e, se necessário, \u003cstrong>150 mg\u003c/strong>; \u003cstrong>lidocaína: 1–1,5 mg/kg\u003c/strong> e depois \u003cstrong>0,5–0,75 mg/kg\u003c/strong>, com dose cumulativa ≤ \u003cstrong>3 mg/kg\u003c/strong>. São alternativas entre si — não se associam de rotina — e entram na via chocável refratária. \u003cstrong>Magnésio não é rotina:\u003c/strong> fica reservado à TV polimórfica com QT longo (torsades) e a distúrbios específicos. \u003cstrong>Vasopressina não substitui a epinefrina\u003c/strong>, e na FV/TVSP refratária os demais candidatos (betabloqueador, bretílio, procainamida, sotalol) têm benefício incerto.\u003c/p>"},{"titleHtml":"🟡 Como a via aérea avançada muda a ventilação durante a RCP — e o que a capnografia acrescenta?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Com via aérea avançada (intubação endotraqueal ou dispositivo supraglótico), as compressões passam a ser \u003cstrong>contínuas\u003c/strong> e a ventilação vira independente: \u003cstrong>1 a cada 6 s (10/min)\u003c/strong>, com volume para elevação visível do tórax. Sem via aérea avançada, mantém-se \u003cstrong>30:2\u003c/strong>. A capnografia de onda contínua confirma a posição do tubo, mostra a qualidade da RCP (EtCO₂ baixo ou em queda pede revisão) e detecta o RCE pelo aumento súbito e sustentado da onda. A via aérea avançada é considerada no algoritmo, sem interromper compressões nem atrasar choques.\u003c/p>"},{"titleHtml":"🔴 Caso: 20 minutos de suporte avançado, paciente intubado, assistolia persistente e EtCO₂ de 8 mmHg. Como se decide o término da reanimação?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A decisão é \u003cstrong>multimodal\u003c/strong>, depois de garantir que as intervenções foram adequadas: pesar tempo colapso → RCP, ritmo inicial, tempo até a primeira desfibrilação, comorbidades, duração do esforço, ultrassom e resposta fisiológica. No \u003cstrong>intubado\u003c/strong>, a falha em atingir EtCO₂ \u003cstrong>&gt; 10 mmHg após 20 min\u003c/strong> pode ser considerada \u003cstrong>como um componente\u003c/strong> dessa decisão (classe \u003cstrong>2b\u003c/strong>) — nunca de forma isolada; no \u003cstrong>não intubado\u003c/strong>, valor de corte não deve ser usado (classe \u003cstrong>3\u003c/strong>, dano). No pré-hospitalar, as regras \u003cstrong>BLS/ALS/universal\u003c/strong> de término orientam a equipe (classe 1 para BLS quando o avançado não está disponível; \u003cstrong>2a\u003c/strong> nas demais). Por fim, entram os referenciais éticos: decisão compartilhada, diretivas antecipadas, dignidade, e a preparação do serviço para terminar no local e comunicar a morte.\u003c/p>"},{"titleHtml":"🔴 O que caracteriza a parada refratária, o que pode ser considerado e o que não é rotina nesse cenário?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Não há consenso de definição; citam-se a ausência de RCE após \u003cstrong>mais de 30 minutos\u003c/strong> de RCP adequada (sem hipotermia) e a recorrência de \u003cstrong>TVp/FV mesmo após três choques\u003c/strong> e antiarrítmicos — um cenário de alta mortalidade. Em pacientes \u003cstrong>selecionados\u003c/strong>, podem ser considerados a \u003cstrong>RCP extracorpórea\u003c/strong> — com critérios de seleção, canulação experiente e abordagem regionalizada — e o \u003cstrong>cateterismo coronário emergencial\u003c/strong>. Não são rotina: a \u003cstrong>mudança de vetor\u003c/strong> do choque e a \u003cstrong>desfibrilação sequencial dupla\u003c/strong>, de utilidade não estabelecida em 2025, e a RCP extracorpórea para todos; o transporte durante a parada fica reservado a casos altamente selecionados.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual dupla de ritmos corresponde aos \u003cstrong>ritmos chocáveis\u003c/strong> da parada cardíaca?","a":["Fibrilação ventricular e taquicardia ventricular sem pulso","Taquicardia ventricular sem pulso e assistolia de onda P","Atividade elétrica sem pulso e fibrilação ventricular fina","Assistolia e atividade elétrica sem pulso com ritmo organizado"],"c":0,"e":"Os ritmos chocáveis são a fibrilação ventricular e a taquicardia ventricular sem pulso, em que o choque interrompe a atividade caótica para os marcapassos naturais retomarem o ritmo. Assistolia e AESP são não chocáveis: nelas, o foco é RCP de alta qualidade, epinefrina precoce e correção de causas reversíveis. A assistolia de onda P continua sendo assistolia, e o ritmo organizado sem pulso caracteriza a AESP."},{"n":"🟢","levelName":"basico","q":"Paciente adulto em \u003cstrong>assistolia\u003c/strong> no monitor. Qual é a conduta imediata?","a":["Choque imediato, seguido de checagem de pulso a cada 2 minutos","Amiodarona 300 mg em bolus e nova análise do ritmo em seguida","RCP de alta qualidade e epinefrina 1 mg o mais cedo possível","Intubação orotraqueal antes de iniciar qualquer medicação"],"c":2,"e":"Na assistolia e na AESP não há choque: a prioridade é RCP de alta qualidade, com acesso IV/IO e epinefrina o mais cedo possível, além de buscar e tratar causas reversíveis. Antiarrítmicos não fazem parte da via não chocável, e a via aérea avançada é considerada sem interromper as compressões — não é etapa que precede a medicação. Se a checagem de ritmo revelar ritmo chocável, o algoritmo migra para a via da desfibrilação."},{"n":"🟡","levelName":"intermediario","q":"Na FV/TVSP que persiste, quando a \u003cstrong>epinefrina\u003c/strong> entra no algoritmo?","a":["Logo após o primeiro choque, junto com o acesso venoso","Somente após o terceiro choque, se o ritmo não reverter","Assim que houver acesso venoso, antes de um novo choque","Após o segundo choque, se o ritmo chocável persistir"],"c":3,"e":"Na via chocável, o choque vem primeiro: a epinefrina entra após o segundo choque, quando a FV ou a TV sem pulso persiste, e a atualização de 2025 reforça que ela é aceitável após a falha das tentativas iniciais de desfibrilação. O momento ideal é desconhecido, e os estudos que embasaram a conduta usaram a droga ainda mais tarde. Na via não chocável o cenário se inverte: a epinefrina deve ser administrada o mais cedo possível, sempre na dose de 1 mg a cada 3–5 minutos."},{"n":"🟡","levelName":"intermediario","q":"Depois do \u003cstrong>terceiro choque\u003c/strong>, com a FV persistindo, o que entra no ciclo de RCP?","a":["Epinefrina em dose dobrada e segundo antiarrítmico no ciclo","Amiodarona ou lidocaína e a busca de causas reversíveis","Magnésio em bolus e vasopressina no lugar da epinefrina","Somente RCP por dois minutos, sem drogas neste momento"],"c":1,"e":"No terceiro ciclo da via chocável entram a amiodarona ou a lidocaína — um ou outro, não os dois — junto com a busca e o tratamento das causas reversíveis. O magnésio não é rotina e fica reservado à torsades, e a vasopressina não substitui a epinefrina. Doses maiores de epinefrina não são recomendadas, e o ciclo não deve seguir sem drogas quando o ritmo persiste."},{"n":"🟡","levelName":"intermediario","q":"Na \u003cstrong>FV/TVSP refratária\u003c/strong>, qual é o esquema de doses dos antiarrítmicos?","a":["Amiodarona 300 → 300 mg; lidocaína 1–1,5 mg/kg em dose única","Amiodarona 150 → 300 mg; lidocaína 0,5–0,75 → 1–1,5 mg/kg","Amiodarona 300 → 150 mg; lidocaína 1–1,5 → 0,5–0,75 mg/kg","Amiodarona 150 mg em infusão; lidocaína 3 mg/kg em bolus único"],"c":2,"e":"A amiodarona começa com 300 mg em bolus e pode ser repetida com 150 mg; a lidocaína segue de 1–1,5 mg/kg para 0,5–0,75 mg/kg, com dose cumulativa de até 3 mg/kg. São alternativas entre si — não se associam de rotina — e entram na FV/TVSP refratária, ao lado do tratamento das causas reversíveis. O magnésio fica para a TV polimórfica com QT longo, e a vasopressina não substitui a epinefrina."},{"n":"🟡","levelName":"intermediario","q":"Qual é a meta de ventilação depois que a \u003cstrong>via aérea avançada\u003c/strong> está no lugar?","a":["Uma ventilação a cada 6 segundos, sem pausar as compressões","Uma ventilação a cada 3 segundos, com pausas nas compressões","Duas ventilações intercaladas com 30 compressões torácicas","Ventilação contínua com bolsa-máscara e compressões pausadas"],"c":0,"e":"Com via aérea avançada, as compressões deixam de pausar: a ventilação corre em paralelo, uma a cada 6 segundos, cerca de 10 por minuto. Sem via aérea avançada, mantém-se a relaçã
