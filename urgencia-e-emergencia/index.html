003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Who\u003c/strong>\u003c/td>\u003ctd>Quem?\u003c/td>\u003ctd>Identificação, comorbidades, medicamentos de uso, vulnerabilidades\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>What\u003c/strong>\u003c/td>\u003ctd>O quê?\u003c/td>\u003ctd>Agente tóxico — pedir rótulos e embalagens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>When\u003c/strong>\u003c/td>\u003ctd>Quando?\u003c/td>\u003ctd>Horário do evento — define a janela de descontaminação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Where\u003c/strong>\u003c/td>\u003ctd>Onde?\u003c/td>\u003ctd>Via e local da exposição\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Why\u003c/strong>\u003c/td>\u003ctd>Por quê?\u003c/td>\u003ctd>Circunstância: acidental, tentativa de suicídio, abuso, homicídio\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Completar com tipo, via e magnitude da exposição, antecedentes clínicos e psiquiátricos e atividade profissional.\u003c/li>\u003cli>História sugestiva + paciente grave \u003cstrong>sem contraindicação\u003c/strong> habilitam considerar a descontaminação gastrintestinal (seção 2) — mas a história nunca atrasa o suporte.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-ameaça-à-vida-o-empírico-e-o-exame-dirigido\">1.4 Ameaça à vida: o empírico e o exame dirigido\u003c/h3>\n\u003cul>\u003cli>Com ameaça à vida e agente desconhecido, considerar \u003cstrong>glicose hipertônica + tiamina + naloxona\u003c/strong>; tratar desde já convulsão, agitação psicomotora, arritmia ou distúrbio metabólico grave.\u003c/li>\u003cli>Exame dirigido: pele (palidez, sudorese, cianose, icterícia), hálitos e odores, tórax e abdome, temperatura, \u003cstrong>pupilas\u003c/strong> (diâmetro, simetria, reatividade), tônus, \u003cstrong>fasciculações\u003c/strong>, reflexos e nível de consciência.\u003c/li>\u003cli>\u003cstrong>Cheiro aliáceo\u003c/strong> (alho/cebola) sugere organofosforado.\u003c/li>\u003cli>Identificou a síndrome tóxica? \u003cstrong>Tratar a síndrome\u003c/strong> — é mais rápido do que esperar o exame toxicológico.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-5-síndromes-tóxicas-reconhecimento-rápido\">1.5 Síndromes tóxicas — reconhecimento rápido\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Síndrome\u003c/th>\u003cth>Pistas\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Conduta-chave\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Colinérgica\u003c/strong>\u003c/td>\u003ctd>Miose, hipersecreção (broncorreia, sialorreia, lacrimejamento, sudorese), bradicardia, fasciculações/paralisia\u003c/td>\u003ctd>Organofosforados, carbamatos\u003c/td>\u003ctd>\u003cstrong>Atropina\u003c/strong> (+ \u003cstrong>pralidoxima\u003c/strong> se organofosforado)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Anticolinérgica\u003c/strong>\u003c/td>\u003ctd>Midríase, pele e mucosas quentes e secas, rubor, hipertermia, retenção urinária, agitação, convulsão\u003c/td>\u003ctd>Beladonados, anti-histamínicos, tricíclicos\u003c/td>\u003ctd>\u003cstrong>Fisostigmina\u003c/strong> + suporte\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Simpatomimética\u003c/strong>\u003c/td>\u003ctd>Midríase, taquicardia, hipertensão, hipertermia, sudorese, agitação, convulsão\u003c/td>\u003ctd>Cocaína, anfetaminas, cafeína, teofilina\u003c/td>\u003ctd>Suporte; \u003cstrong>diazepam\u003c/strong> se convulsão/rigidez; nitroprussiato/esmolol\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hipnótico-sedativa e narcótica\u003c/strong>\u003c/td>\u003ctd>Depressão do SNC e respiratória, miose, hipotermia\u003c/td>\u003ctd>Opioides, benzodiazepínicos, barbitúricos, álcool\u003c/td>\u003ctd>\u003cstrong>Naloxona\u003c/strong>; flumazenil com critérios\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Extrapiramidal\u003c/strong>\u003c/td>\u003ctd>Distonias, contrações, fala lenta/parkinsonismo\u003c/td>\u003ctd>Haloperidol, clorpromazina, metoclopramida\u003c/td>\u003ctd>\u003cstrong>Biperideno\u003c/strong> (5 mg/mL IM) / benzodiazepínicos\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Pegadinha clássica:\u003c/strong> sudorese é efeito \u003cstrong>muscarínico\u003c/strong> (glândulas sudoríparas respondem à acetilcolina), não nicotínico.\u003c/p>\n\u003ch3 id=\"h-1-6-pistas-por-distúrbio-ecg-hipotensão-e-convulsão\">1.6 Pistas por distúrbio: ECG, hipotensão e convulsão\u003c/h3>\n\u003cp>\u003cstrong>ECG:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>QRS alargado:\u003c/strong> antidepressivos tricíclicos e cloroquina — é o achado que muda conduta (bicarbonato, e nunca flumazenil).\u003c/li>\u003cli>\u003cstrong>QT prolongado:\u003c/strong> arsênio, haloperidol, tioridazina, sotalol.\u003c/li>\u003cli>\u003cstrong>Distúrbio de condução:\u003c/strong> digoxina, lítio. \u003cstrong>Distúrbios de ritmo:\u003c/strong> betabloqueadores, bloqueadores de canal de cálcio, cocaína.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Intoxicações frequentemente associadas a hipotensão:\u003c/strong> antagonistas alfa-adrenérgicos, tricíclicos, arsênio, betabloqueadores, digoxina, fenobarbital, opioides, sulfato ferroso e bloqueadores de canal de cálcio.\u003c/p>\n\u003cp>\u003cstrong>Agentes relacionados à convulsão:\u003c/strong> tricíclicos, cocaína, hipoglicemiantes orais, insulina, isoniazida, lítio, metilxantinas, monóxido de carbono, opioides e organoclorados.\u003c/p>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-descontaminação-o-que-sobreviveu\">\u003ch2>2. Descontaminação: o que sobreviveu\u003c/h2>\u003ch3 id=\"h-2-1-princípios\">2.1 Princípios\u003c/h3>\n\u003cul>\u003cli>Interromper a exposição: retirar da área, tirar roupas contaminadas; pele → \u003cstrong>lavagem abundante com água\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Indução de vômito com xaropes não é recomendada\u003c/strong> — risco de broncoaspiração.\u003c/li>\u003cli>Decisão individual: \u003cstrong>tempo decorrido × toxicidade × proteção de via aérea\u003c/strong>. Nenhuma medida de descontaminação é rotina.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-lavagem-gástrica\">2.2 Lavagem gástrica\u003c/h3>\n\u003cul>\u003cli>Considerada \u003cstrong>somente\u003c/strong> se: (1) ingestão \u003cstrong>potencialmente fatal\u003c/strong> e (2) o procedimento couber em \u003cstrong>até 60 minutos\u003c/strong> da ingestão. Mesmo nesses casos, \u003cstrong>não é medida de rotina\u003c/strong> e o benefício clínico nunca foi confirmado em estudos controlados.\u003c/li>\u003cli>Os números clássicos — \u003cstrong>90%\u003c/strong> de recuperação em \u003cstrong>5 min\u003c/strong> e \u003cstrong>45%\u003c/strong> em \u003cstrong>10 min\u003c/strong> — vêm de \u003cstrong>estudos experimentais (animais)\u003c/strong>. Servem para mostrar a queda vertiginosa da eficácia com o tempo; \u003cstrong>não são meta clínica nem critério de indicação\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Contraindicações:\u003c/strong> via aérea desprotegida (salvo se já intubado), corrosivos, hidrocarbonetos com alto risco de aspiração; a atualização acrescenta ácido/base forte e risco de hemorragia digestiva.\u003c/li>\u003cli>\u003cstrong>Riscos:\u003c/strong> hipóxia, arritmias, laringoespasmo, perfuração esofágica, distúrbios hidroeletrolíticos e pneumonite por aspiração.\u003c/li>\u003cli>\u003cstrong>Em organofosforados:\u003c/strong> só \u003cstrong>depois da estabilização/reanimação\u003c/strong> (oxigênio, atropina, oxima) e em apresentação muito precoce, com via aérea protegida.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-3-carvão-ativado\">2.3 Carvão ativado\u003c/h3>\n\u003cul>\u003cli>Considerar em \u003cstrong>quantidade potencialmente tóxica de agente adsorvível\u003c/strong> e \u003cstrong>até 1 hora\u003c/strong> da ingestão.\u003c/li>\u003cli>Após 1 h, o benefício é de importância clínica duvidosa (não totalmente excluível) — exceções até ~\u003cstrong>4 h\u003c/strong>: \u003cstrong>ingestão maciça\u003c/strong>, formulação de \u003cstrong>liberação retardada\u003c/strong> ou trânsito lentificado (opioides, anticolinérgicos). O antigo \"2–4 h\" \u003cstrong>não é a regra geral\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Dose:\u003c/strong> \u003cstrong>1 g/kg\u003c/strong> ou dose fixa de \u003cstrong>50 g no adulto\u003c/strong>, na razão carvão:tóxico de \u003cstrong>10:1\u003c/strong>. Em pediatria, \u003cstrong>1–2 g/kg\u003c/strong> quando a quantidade é desconhecida (referência AACT: 10–25 g na criança).\u003c/li>\u003cli>\u003cstrong>Contraindicação soberana: via aérea desprotegida\u003c/strong> (risco de aspiração). Também não usar com risco de perfuração/hemorragia digestiva, endoscopia planejada, obstrução intestinal ou agentes \u003cstrong>não adsorvidos\u003c/strong> (metais, álcool, ácidos, bases, eletrólitos).\u003c/li>\u003cli>Não há comprovação de melhora de desfechos clínicos; \u003cstrong>dose única não é rotina\u003c/strong>. Múltiplas doses são outra indicação (não coberta aqui).\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-antídotos-prioritários\">\u003ch2>3. Antídotos prioritários\u003c/h2>\u003ch3 id=\"h-3-1-paracetamol-n-acetilcisteína-nac\">3.1 Paracetamol — N-acetilcisteína (NAC)\u003c/h3>\n\u003cul>\u003cli>O metabólito tóxico (\u003cstrong>NAPQI\u003c/strong>) é neutralizado pela glutationa; a NAC repõe esse substrato.\u003c/li>\u003cli>\u003cstrong>Nomograma de Rumack-Matthew\u003c/strong> (ingestão aguda única): linha de tratamento em \u003cstrong>150 µg/mL às 4 h\u003c/strong> (referência de uso corrente, ex.: MDCalc) — acima dela, indicar NAC. Com liberação prolongada ou coingestante que retarde o trânsito, \u003cstrong>repetir o nível em 6–7 h\u003c/strong>.\u003c/li>\u003cli>Esquemas:\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Via\u003c/th>\u003cth>Ataque\u003c/th>\u003cth>Manutenção\u003c/th>\u003cth>Total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Oral\u003c/strong>\u003c/td>\u003ctd>140 mg/kg\u003c/td>\u003ctd>70 mg/kg a cada 4 h \u003cstrong>× 17 doses\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>72 h / 1330 mg/kg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>IV\u003c/strong>\u003c/td>\u003ctd>150 mg/kg em 1 h\u003c/td>\u003ctd>50 mg/kg em 4 h + 100 mg/kg em 16 h\u003c/td>\u003ctd>\u003cstrong>21 h / 300 mg/kg\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Repetir a dose oral se houver vômito logo após a administração. Em \u003cstrong>70 kg\u003c/strong>, o ataque oral ≈ \u003cstrong>9,8 g\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Tempo:\u003c/strong> iniciar \u003cstrong>o quanto antes\u003c/strong> — máxima eficácia quando &lt; \u003cstrong>8 h\u003c/strong> —, mas \u003cstrong>ainda há benefício tardio\u003c/strong>, inclusive na falência hepática estabelecida.\u003c/li>\u003cli>\u003cstrong>Duração:\u003c/strong> pode \u003cstrong>estender\u003c/strong> além de 21 h se lesão hepática, INR alterado ou paracetamol persistente; critérios de suspensão incluem \u003cstrong>paracetamol &lt; 10 µg/mL\u003c/strong>, ALT/AST em queda e \u003cstrong>INR &lt; 2\u003c/strong>. Cursos mais curtos são possíveis com critérios — o \"1 a 3 dias\" corresponde às \u003cstrong>17 doses/72 h\u003c/strong>, não a um esquema solto.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-2-flumazenil-dose-teto-e-a-separação-que-cai-em-prova\">3.2 Flumazenil — dose, teto e a separação que cai em prova\u003c/h3>\n\u003cul>\u003cli>Uso considerado apenas em \u003cstrong>suspeita de superdosagem isolada de benzodiazepínico\u003c/strong>, sem sinais de tricíclico e sem os fatores de risco abaixo; \u003cstrong>não usar como teste diagnóstico\u003c/strong> de coma de origem desconhecida.\u003c/li>\u003cli>\u003cstrong>Dose titulada:\u003c/strong> \u003cstrong>0,2 mg IV em 30 s\u003c/strong> → aguardar 30 s → \u003cstrong>0,3 mg\u003c/strong> → depois \u003cstrong>0,5 mg a cada 1 min\u003c/strong>, até o teto cumulativo de \u003cstrong>3 mg\u003c/strong>. Em resposta parcial rara, até \u003cstrong>5 mg\u003c/strong>; sem resposta 5 min após 5 mg, a causa provavelmente não é benzodiazepínico.\u003c/li>\u003cli>\u003cstrong>Contraindicações formais (bula):\u003c/strong> hipersensibilidade; benzodiazepínico administrado para \u003cstrong>controle de condição potencialmente fatal\u003c/strong>; \u003cstrong>sinais de intoxicação grave por antidepressivo tricíclico\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Precauções/avisos — não são contraindicações formais:\u003c/strong> epilepsia em uso prolongado de benzodiazepínicos, dependência física, trauma craniano com hipertensão intracraniana e coingestão pró-convulsivante. O risco de convulsão se concentra em \u003cstrong>uso crônico\u003c/strong> e em \u003cstrong>overdose com sinais de tricíclico\u003c/strong> (boxed warning).\u003c/li>\u003cli>\u003cstrong>Regra prática de ECG:\u003c/strong> coma + \u003cstrong>QRS &gt; 100 ms\u003c/strong> ou \u003cstrong>R em aVR &gt; 3 mm\u003c/strong> → \u003cstrong>não usar\u003c/strong>. Na dúvida, suporte (ABC) — a maioria das superdosagens isoladas de benzodiazepínico não é fatal.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-3-tricíclicos-bicarbonato-de-sódio\">3.3 Tricíclicos — bicarbonato de sódio\u003c/h3>\n\u003cul>\u003cli>Quadro: síndrome anticolinérgica + \u003cstrong>hipotensão\u003c/strong> + convulsão + \u003cstrong>QRS largo\u003c/strong> (bloqueio de canais de sódio). ECG prognóstico: \u003cstrong>QRS &gt; 100 ms ≈ 33% de convulsões\u003c/strong>; \u003cstrong>QRS &gt; 160 ms ≈ 50% de disritmias\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Bicarbonato de sódio 8,4% = 1 mEq/mL\u003c/strong>: \u003cstrong>1–2 mEq/kg\u003c/strong> em bolus, repetível. Se necessário, infusão de \u003cstrong>150 mEq em 1 L de SG5%\u003c/strong>, titulada para \u003cstrong>pH 7,45–7,55\u003c/strong> (não ultrapassar ~7,55).\u003c/li>\u003cli>Mecanismo \u003cstrong>duplo\u003c/strong>: aporte de sódio + alcalinização do meio.\u003c/li>\u003cli>Monitorar \u003cstrong>K⁺ e Na⁺\u003c/strong>: hipocalemia é a complicação clássica (também hipernatremia, hipocalcemia e alcalose grave). O QRS pode levar \u003cstrong>24–48 h\u003c/strong> para normalizar.\u003c/li>\u003cli>\u003cstrong>Flumazenil está formalmente contraindicado\u003c/strong> nesse cenário (sinais de intoxicação grave por tricíclico): pode precipitar convulsão/estado de mal.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-4-opioides-e-metadona\">3.4 Opioides e metadona\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Naloxona\u003c/strong> reverte a depressão respiratória, mas sua ação é curta: meia-vida de \u003cstrong>30–45 min\u003c/strong> e duração de \u003cstrong>90–180 min\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Metadona:\u003c/strong> opioide de meia-vida longa (\u003cstrong>média ~24 h\u003c/strong>) → risco de \u003cstrong>renarcotização\u003c/strong> após a reversão. \u003cstrong>Observar ≥ 24 h\u003c/strong> (referência mais conservadora cita ~48 h); \u003cstrong>6 h é insuficiente\u003c/strong> — tempo que valeria para opioide de ação curta. Evidência farmacocinética/casos, sem ensaio randomizado.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-5-betabloqueador-bcc-hie-sulfonilureia-octreotida\">3.5 Betabloqueador / BCC — HIE; sulfonilureia — octreotida\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>HIE (insulina em alta dose com euglicemia)\u003c/strong> — no choque cardiogênico por \u003cstrong>betabloqueador ou bloqueador de canal de cálcio refratário\u003c/strong> a fluidos, atropina, cálcio e glucagon:\u003cul>\u003cli>Bolus de \u003cstrong>1 U/kg\u003c/strong> de insulina regular.\u003c/li>\u003cli>Infusão \u003cstrong>iniciando em 0,5–1 U/kg/h\u003c/strong>, titulando \u003cstrong>0,5 U/kg/h a cada 10–15 min\u003c/strong> (protocolos até 4 U/kg/h; relatos de 10–14 U/kg/h em refratários).\u003c/li>\u003cli>\u003cstrong>Glicose\u003c/strong> IV para manter \u003cstrong>100–200 mg/dL\u003c/strong>; vigiar \u003cstrong>K⁺ (&gt; 3,0 mEq/L)\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Não é para sulfonilureia.\u003c/strong>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Octreotida\u003c/strong> — hipoglicemia por \u003cstrong>sulfonilureia\u003c/strong> refratária à dextrose (inibe a secreção de insulina): \u003cstrong>50–100 µg SC a cada 6–8 h\u003c/strong> no adulto (dose ótima não definida); pediatria: \u003cstrong>1 µg/kg IV\u003c/strong>. Antes dela: bolus de glicose a 50% + infusão de glicose a 10%.\u003c/li>\u003cli>No betabloqueador, o \u003cstrong>glucagon\u003c/strong> (5–10 mg) é a primeira linha; sem resposta hemodinâmica, a HIE é mandatória.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-6-tabela-rápida-de-antídotos\">3.6 Tabela rápida de antídotos\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Agente\u003c/th>\u003cth>Antídoto / conduta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Opioides\u003c/td>\u003ctd>Naloxona\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Benzodiazepínicos\u003c/td>\u003ctd>Flumazenil (critérios restritos)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paracetamol\u003c/td>\u003ctd>N-acetilcisteína\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tricíclicos\u003c/td>\u003ctd>Bicarbonato de sódio\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Betabloqueadores\u003c/td>\u003ctd>Glucagon → HIE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bloqueadores de canal de cálcio\u003c/td>\u003ctd>Cálcio → HIE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sulfonilureias\u003c/td>\u003ctd>Octreotida\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Organofosforados\u003c/td>\u003ctd>Atropina + pralidoxima (após a atropina)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Carbamatos\u003c/td>\u003ctd>Atropina (oxima se agente desconhecido)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Digoxina\u003c/td>\u003ctd>Anticorpo anti-Fab (arritmias/hipercalemia)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metanol / etilenoglicol\u003c/td>\u003ctd>Fomepizol (ou etanol); hemodiálise\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cianeto\u003c/td>\u003ctd>Hidroxicobalamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metemoglobinemia\u003c/td>\u003ctd>Azul de metileno\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ferro\u003c/td>\u003ctd>Deferoxamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isoniazida\u003c/td>\u003ctd>Piridoxina (B6)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anticoagulantes\u003c/td>\u003ctd>Vitamina K1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metais pesados\u003c/td>\u003ctd>EDTA ou BAL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Síndrome anticolinérgica\u003c/td>\u003ctd>Fisostigmina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-organofosforados-carbamatos\">\u003ch2>4. Organofosforados × carbamatos\u003c/h2>\u003ch3 id=\"h-4-1-a-diferença-que-muda-o-prognóstico\">4.1 A diferença que muda o prognóstico\u003c/h3>\n\u003cul>\u003cli>Ambos \u003cstrong>inibem a acetilcolinesterase\u003c/strong> → acúmulo de acetilcolina → hiperestimulação muscarínica + nicotínica.\u003c/li>\u003cli>\u003cstrong>Organofosforados:\u003c/strong> ligação quase \u003cstrong>irreversível\u003c/strong>, com \u003cstrong>envelhecimento (aging)\u003c/strong> da enzima → intoxicação mais grave e duradoura; risco de \u003cstrong>síndrome intermediária\u003c/strong> (fraqueza muscular após a crise) e \u003cstrong>neuropatia tardia\u003c/strong>. Exemplos: malation, paration, diazinon, clorpirifós.\u003c/li>\u003cli>\u003cstrong>Carbamatos:\u003c/strong> ligação \u003cstrong>reversível\u003c/strong>; a enzima se recupera em horas → quadro geralmente menos grave. \u003cstrong>Aldicarb = \"chumbinho\"\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Tríade comum:\u003c/strong> \u003cstrong>miose + hipersecreção + tremores musculares\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-2-muscarínico-nicotínico\">4.2 Muscarínico × nicotínico\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Receptor\u003c/th>\u003cth>Efeitos\u003c/th>\u003cth>Alvo terapêutico\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Muscarínico\u003c/strong> (\"úmido\")\u003c/td>\u003ctd>Miose, broncorreia/broncoespasmo, sialorreia, lacrimejamento, sudorese, vômitos, diarreia, incontinência urinária, \u003cstrong>bradicardia e hipotensão\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Atropina\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Nicotínico\u003c/strong> (\"motor\")\u003c/td>\u003ctd>\u003cstrong>Fasciculações, cãibras, fraqueza e paralisia flácida\u003c/strong> (risco de parada respiratória); nos gânglios: taquicardia e hipertensão\u003c/td>\u003ctd>\u003cstrong>Pralidoxima\u003c/strong> (reativa a enzima)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Mnemônico muscarínico — \u003cstrong>DUMBBELS\u003c/strong>: diarreia, urina, miose, bradicardia, broncorreia/broncoespasmo, emese, lacrimejamento e salivação; a sudorese entra no mesmo quadro.\u003c/li>\u003cli>\u003cstrong>Pegadinha:\u003c/strong> \u003cstrong>sudorese é muscarínica\u003c/strong> — não classifique como sinal nicotínico.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-3-atropina-titular-até-atropinização\">4.3 Atropina — titular até atropinização\u003c/h3>\n\u003cul>\u003cli>Bloqueia \u003cstrong>somente receptores muscarínicos\u003c/strong>: seca secreções e acelera o coração; \u003cstrong>não reverte fraqueza nem paralisia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>1–3 mg IV em bolus\u003c/strong> conforme a gravidade (MSD: 2–3 mg, dobrando a cada 3–5 min; criança: 0,05 mg/kg); reavaliar \u003cstrong>a cada 5 min\u003c/strong> e \u003cstrong>dobrar\u003c/strong> a dose enquanto não houver resposta.\u003c/li>\u003cli>Titular \u003cstrong>até atropinização\u003c/strong>, com endpoint principal = \u003cstrong>secagem das secreções brônquicas\u003c/strong> (junto com \u003cstrong>FC &gt; 80 bpm\u003c/strong>, \u003cstrong>PAS &gt; 80 mmHg\u003c/strong> e tórax limpo). Depois, infusão de \u003cstrong>10–20% da dose de estabilização por hora\u003c/strong>.\u003c/li>\u003cli>Doses altas são esperadas: \u003cstrong>&gt; 100 mg em 24 h\u003c/strong> pode ser necessário. O alvo \u003cstrong>não é a midríase\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-4-pralidoxima-quando-e-quanto\">4.4 Pralidoxima — quando e quanto\u003c/h3>\n\u003cul>\u003cli>Reativa a acetilcolinesterase removendo o fosfato do organofosforado; ajuda a reverter sintomas muscarínicos e nicotínicos (força muscular, respiração). \u003cstrong>Perde eficácia após o envelhecimento\u003c/strong> — quanto mais cedo, melhor.\u003c/li>\u003cli>\u003cstrong>1–2 g IV em 15–30 min\u003c/strong>, seguidos de \u003cstrong>infusão de 8–10 mg/kg/h\u003c/strong> (ou 500 mg/h); alternativa citada pela OMS: 30 mg/kg em 20 min + 8–10 mg/kg/h. Pediatria: 20–50 mg/kg + 5–10 mg/kg/h (esquemas variam entre manuais).\u003c/li>\u003cli>\u003cstrong>Administrar após a atropina\u003c/strong> — primeiro estabiliza (oxigênio, atropina), depois a oxima — e manter até não haver necessidade de atropina por \u003cstrong>12–24 h\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Carbamatos:\u003c/strong> não sofrem envelhecimento; a oxima é geralmente \u003cstrong>dispensável e controvertida\u003c/strong>. Mas, se o \u003cstrong>agente é desconhecido\u003c/strong>, administrar — organofosforado e carbamato são \u003cstrong>clinicamente indistinguíveis\u003c/strong> na apresentação.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-5-succinilcolina-e-a-via-aérea-no-colinérgico\">4.5 Succinilcolina e a via aérea no colinérgico\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Contraindicada\u003c/strong> na intoxicação por organofosforado (e carbamato): a \u003cstrong>butirilcolinesterase plasmática\u003c/strong> está inibida e o bloqueio despolarizante se prolonga — \u003cstrong>apneia/paralisia prolongadas\u003c/strong>. Usar bloqueador \u003cstrong>não despolarizante\u003c/strong> (rocurônio/vecurônio).\u003c/li>\u003cli>Na intoxicação \u003cstrong>digitálica\u003c/strong> (hipercalemia), a succinilcolina é \u003cstrong>precaução\u003c/strong>: libera potássio e pode precipitar arritmia grave. Racional de mecanismo, com evidência direta antiga.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-pegadinhas-de-prova\">\u003ch2>5. Pegadinhas de prova\u003c/h2>\u003cul>\u003cli>\u003cstrong>CABDE no grave/PCR; XABCDE no estável\u003c/strong>; Glasgow ≤ 8 → via aérea definitiva.\u003c/li>\u003cli>\u003cstrong>Lavagem gástrica:\u003c/strong> só \u003cstrong>potencialmente fatal + ≤ 60 min\u003c/strong>; 90%/45% são dados experimentais; não é rotina.\u003c/li>\u003cli>\u003cstrong>Carvão:\u003c/strong> ≤ 1 h; \u003cstrong>1 g/kg ou 50 g\u003c/strong> no adulto; contraindicação soberana = \u003cstrong>via aérea desprotegida\u003c/strong>; não adsorve metais, álcool, ácidos, bases e eletrólitos.\u003c/li>\u003cli>\u003cstrong>NAC:\u003c/strong> \"iniciar o quanto antes; máxima eficácia &lt; 8 h\"; oral 72 h (17 doses) × IV 21 h; duração guiada por critérios.\u003c/li>\u003cli>\u003cstrong>Flumazenil:\u003c/strong> contraindicações formais são hipersensibilidade, benzodiazepínico para condição ameaçadora e sinais de tricíclico grave; epilepsia, dependência e HIC são precauções. \u003cstrong>QRS &gt; 100 ms ou R em aVR &gt; 3 mm = não usar.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Tricíclico:\u003c/strong> bicarbonato \u003cstrong>1–2 mEq/kg\u003c/strong>, alvo \u003cstrong>pH 7,45–7,55\u003c/strong>; hipocalemia é a complicação clássica.\u003c/li>\u003cli>\u003cstrong>Metadona:\u003c/strong> observar \u003cstrong>≥ 24 h\u003c/strong> (6 h não basta).\u003c/li>\u003cli>\u003cstrong>HIE é para BB/BCC; octreotida é para sulfonilureia\u003c/strong> — não trocar os cenários.\u003c/li>\u003cli>\u003cstrong>OP:\u003c/strong> atropina \u003cstrong>dobrando\u003c/strong> até \u003cstrong>secreção seca\u003c/strong>; pralidoxima \u003cstrong>após a atropina\u003c/strong>; carbamato com agente desconhecido \u003cstrong>recebe oxima\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Succinilcolina: contraindicada no OP\u003c/strong> (pseudocolinesterase) e \u003cstrong>precaução no digitálico\u003c/strong> (potássio).\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 No intoxicado grave ou em PCR, qual sequência de avaliação inicial deve ser seguida — e quando ela muda para o XABCDE?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A sequência é o \u003cstrong>CABDE\u003c/strong>: \u003cstrong>C\u003c/strong> (estado hemodinâmico) → \u003cstrong>A\u003c/strong> (vias aéreas) → \u003cstrong>B\u003c/strong> (respiração) → \u003cstrong>D\u003c/strong> (déficit neurológico) → \u003cstrong>E\u003c/strong> (exposição). O motivo é que, em muitas intoxicações, a parada decorre de \u003cstrong>toxicidade direta\u003c/strong> do agente — arritmias, hipotensão severa e colapso circulatório — e não de asfixia primária; circulação primeiro significa compressões precoces e estabilização hemodinâmica rápida. No paciente \u003cstrong>consciente ou estável\u003c/strong>, vale o \u003cstrong>XABCDE\u003c/strong> (com o X de sangramento exsanguinante), com \u003cstrong>ênfase em via aérea quando o Glasgow é ≤ 8\u003c/strong>. Suporte e contato com o centro de intoxicações não são retardados por não saber especificar a substância.\u003c/p>"},{"titleHtml":"🟢 Quais são os 5Ws da anamnese do intoxicado e o que cada pergunta busca?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Who:\u003c/strong> quem é o paciente — comorbidades, medicações de uso, vulnerabilidades. \u003cstrong>What:\u003c/strong> qual o agente (pedir rótulos e embalagens quando possível). \u003cstrong>When:\u003c/strong> horário do evento — define janelas de descontaminação. \u003cstrong>Where:\u003c/strong> via e local da exposição. \u003cstrong>Why:\u003c/strong> motivo ou circunstância — acidental, tentativa de suicídio, abuso, homicídio. Completar com tipo, via e magnitude da exposição e antecedentes clínicos e psiquiátricos. A história nunca atrasa o suporte.\u003c/p>"},{"titleHtml":"🟡 Quais critérios habilitam a lavagem gástrica, o que significam os números 90% e 45% — e qual é a janela, a dose e a contraindicação soberana do carvão ativado?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Lavagem gástrica: considerada apenas em \u003cstrong>ingestão potencialmente fatal\u003c/strong> e dentro de \u003cstrong>60 minutos\u003c/strong>; não é medida de rotina e não tem benefício clínico comprovado. Os \u003cstrong>90% em 5 min\u003c/strong> e \u003cstrong>45% em 10 min\u003c/strong> vêm de estudos \u003cstrong>experimentais\u003c/strong> — ilustram a perda rápida de eficácia com o tempo e não são meta nem critério. Contraindicações: via aérea desprotegida (salvo intubado), corrosivos, hidrocarbonetos com risco de aspiração, ácido/base forte e risco de hemorragia digestiva; no organofosforado, só após estabilização e com via aérea protegida. Carvão ativado: \u003cstrong>até 1 h\u003c/strong> da ingestão (exceções até ~4 h: ingestão maciça, liberação retardada, trânsito lentificado), dose de \u003cstrong>1 g/kg ou 50 g no adulto\u003c/strong> com razão \u003cstrong>10:1\u003c/strong> (pediatria: \u003cstrong>1–2 g/kg\u003c/strong>), contraindicado com \u003cstrong>via aérea desprotegida\u003c/strong> e para agentes não adsorvidos (metais, álcool, ácidos, bases, eletrólitos).\u003c/p>"},{"titleHtml":"🟡 Compare os esquemas oral e intravenoso da N-acetilcisteína e qual é a frase correta sobre o tempo de início?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Oral: ataque de \u003cstrong>140 mg/kg\u003c/strong> + \u003cstrong>70 mg/kg a cada 4 h por 17 doses\u003c/strong> = \u003cstrong>72 h\u003c/strong>, total \u003cstrong>1330 mg/kg\u003c/strong>; repetir a dose se houver vômito. Intravenoso: \u003cstrong>150 mg/kg em 1 h → 50 mg/kg em 4 h → 100 mg/kg em 16 h\u003c/strong>, total \u003cstrong>300 mg/kg em 21 h\u003c/strong> (ataque ≈ \u003cstrong>9,8 g\u003c/strong> em 70 kg). Indicação pelo nomograma de \u003cstrong>Rumack-Matthew\u003c/strong> na ingestão aguda única: linha de \u003cstrong>150 µg/mL às 4 h\u003c/strong>. Tempo: \u003cstrong>iniciar o quanto antes, com máxima eficácia &lt; 8 h — e ainda com benefício quando o início é tardio\u003c/strong>. A duração pode ser estendida (lesão hepática, INR, paracetamol persistente; critérios como paracetamol &lt; 10 µg/mL e INR &lt; 2) ou encurtada por critérios.\u003c/p>"},{"titleHtml":"🟡 Na suspeita de intoxicação por benzodiazepínico em coma, quais são as contraindicações formais ao flumazenil e o que é apenas precaução?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Formais (bula): \u003cstrong>hipersensibilidade\u003c/strong>, benzodiazepínico usado para controle de \u003cstrong>condição potencialmente fatal\u003c/strong> e \u003cstrong>sinais de intoxicação grave por antidepressivo tricíclico\u003c/strong>. Precauções/avisos de alto risco (não são contraindicações formais): epilepsia em uso prolongado de benzodiazepínico, dependência física, trauma craniano com hipertensão intracraniana e coingestão pró-convulsivante. Dose titulada: \u003cstrong>0,2 mg IV em 30 s → 0,3 mg após 30 s → 0,5 mg a cada 1 min\u003c/strong>, teto de \u003cstrong>3 mg\u003c/strong> (raros até \u003cstrong>5 mg\u003c/strong>). Regra de ECG: \u003cstrong>QRS &gt; 100 ms\u003c/strong> ou \u003cstrong>R em aVR &gt; 3 mm\u003c/strong> → não usar; na dúvida, suporte.\u003c/p>"},{"titleHtml":"🔴 Três casos: metadona revertida com naloxona, propranolol refratário ao glucagon e glibenclamida com hipoglicemia refratária — quais são as condutas e os detalhes que não podem falhar?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Metadona: a naloxona dura pouco (\u003cstrong>90–180 min\u003c/strong>) diante da meia-vida longa do opioide (~24 h) → risco de renarcotização; \u003cstrong>observar ≥ 24 h\u003c/strong> (referência conservadora: ~48 h); 6 h é insuficiente. Propranolol (betabloqueador) refratário — e também BCC: \u003cstrong>HIE\u003c/strong>, com bolus de \u003cstrong>1 U/kg\u003c/strong> de insulina regular, infusão \u003cstrong>iniciando em 0,5–1 U/kg/h\u003c/strong> e titulação de \u003cstrong>0,5 U/kg/h a cada 10–15 min\u003c/strong> (protocolos até 4 U/kg/h), \u003cstrong>glicose para manter 100–200 mg/dL\u003c/strong> e \u003cstrong>K⁺ &gt; 3,0 mEq/L\u003c/strong>. Glibenclamida (sulfonilureia): glicose primeiro (bolus de 50% + infusão de 10%) e \u003cstrong>octreotida 50–100 µg SC a cada 6–8 h\u003c/strong> para inibir a secreção de insulina (pediatria: 1 µg/kg IV). \u003cstrong>HIE não é para sulfonilureia; octreotida não é para betabloqueador.\u003c/strong>\u003c/p>"},{"titleHtml":"🔴 Intoxicação tricíclica com QRS alargado e hipotensão: qual é o antídoto, a dose e o alvo — e por que o flumazenil não entra?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Bicarbonato de sódio 8,4% (1 mEq/mL): 1–2 mEq/kg\u003c/strong> em bolus, repetível; se necessário, infusão de \u003cstrong>150 mEq em 1 L de SG5%\u003c/strong>, titulada para \u003cstrong>pH 7,45–7,55\u003c/strong> (sem ultrapassar isso). O mecanismo é duplo: aporte de sódio + alcalinização; monitorar \u003cstrong>K⁺ e Na⁺\u003c/strong> (hipocalemia é a complicação clássica) e lembrar que o QRS pode levar \u003cstrong>24–48 h\u003c/strong> para normalizar. Leitura do ECG: \u003cstrong>QRS &gt; 100 ms ≈ 33% de convulsões; QRS &gt; 160 ms ≈ 50% de disritmias\u003c/strong>. O flumazenil está \u003cstrong>formalmente contraindicado\u003c/strong> quando há sinais de intoxicação grave por tricíclico — pode precipitar convulsão/estado de mal — e a regra prática é não usá-lo com \u003cstrong>QRS &gt; 100 ms ou R em aVR &gt; 3 mm\u003c/strong>.\u003c/p>"},{"titleHtml":"🔴 Síndrome colinérgica por pesticida não identificado: como titular a atropina, quando e como entra a pralidoxima, e qual é a decisão sobre a succinilcolina?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Atropina: \u003cstrong>1–3 mg IV em bolus\u003c/strong> conforme a gravidade, reavaliando \u003cstrong>a cada 5 min\u003c/strong> e \u003cstrong>dobrando\u003c/strong> a dose enquanto não houver resposta, até a \u003cstrong>atropinização\u003c/strong> — endpoint principal é a \u003cstrong>secagem das secreções brônquicas\u003c/strong> (junto com FC &gt; 80 bpm, PAS &gt; 80 mmHg e tórax limpo); depois, infusão de \u003cstrong>10–20% da dose de estabilização por hora\u003c/strong> (doses &gt; 100 mg em 24 h podem ser necessárias). Pralidoxima: \u003cstrong>1–2 g IV em 15–30 min + infusão de 8–10 mg/kg/h\u003c/strong>, \u003cstrong>após a atropina\u003c/strong> e antes do envelhecimento; em carbamato é geralmente dispensável, mas \u003cstrong>administrar quando o agente é desconhecido\u003c/strong> — organofosforado e carbamato são indistinguíveis na apresentação. Succinilcolina: \u003cstrong>contraindicada\u003c/strong> (pseudocolinesterase inibida → paralisia prolongada) — usar bloqueador não despolarizante; no digitálico, a preocupação é a liberação de potássio (precaução).\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Paciente intoxicado encontrado em \u003cstrong>parada cardiorrespiratória\u003c/strong>. Qual sequência de avaliação inicial deve ser seguida?","a":["CABDE, priorizando a circulação e as compressões","ABCDE, começando pela via aérea e pela ventilação","XABCDE, priorizando a contenção de sangramentos","ACBDE, ventilando antes de checar a circulação"],"c":0,"e":"No intoxicado grave ou em PCR, a circulação vem primeiro: muitos agentes tóxicos causam arritmias, hipotensão severa e colapso circulatório, e em boa parte das intoxicações a parada decorre de toxicidade direta do agente — não de asfixia primária —, então compressões precoces e estabilização hemodinâmica rápida mudam a sobrevida. A sequência CABDE só é trocada pelo XABCDE, com o X de sangramento exsanguinante, no paciente consciente ou estável, quando a via aérea ganha ênfase se o Glasgow é ≤ 8. Começar pela via aérea ou inverter ventilações e circulação não prioriza o problema do intoxicado grave."},{"n":"🟢","levelName":"basico","q":"No intoxicado com \u003cstrong>ameaça à vida\u003c/strong> e agente ainda desconhecido, qual é o trio empírico a considerar?","a":["Flumazenil, atropina e bicarbonato de sódio","Glicose hipertônica, tiamina e naloxona","Naloxona, flumazenil e glicose hipertônica","Atropina, pralidoxima e carvão ativado"],"c":1,"e":"O trio cobre hipoglicemia, carência de tiamina e depressão respiratória por opioide — causas tratáveis no paciente com rebaixamento de causa desconhecida. Junto com ele, convulsão, agitação, arritmia e distúrbio metabólico grave já devem ser tratados. Flumazenil e fisostigmina têm indicações restritas e não compõem esse pacote; atropina, pralidoxima e carvão pertencem a cenários específicos."},{"n":"🟡","levelName":"intermediario","q":"Em qual cenário a \u003cstrong>lavagem gástrica\u003c/strong> ainda pode ser considerada?","a":["Em toda intoxicação oral, nas primeiras 4 horas da ingestão","Em ingestão de corrosivo, para reduzir a absorção do agente","Quando o carvão ativado não estiver disponível na unidade","Em ingestão potencialmente fatal, dentro de 60 minutos"],"c":3,"e":"A lavagem gástrica só é considerada em ingestão potencialmente fatal e dentro de 60 minutos — e mesmo nesses casos não é medida de rotina, com benefício clínico não confirmado em estudos controlados. Os percentuais de recuperação caem rapidamente com o tempo (90% em 5 minutos e 45% em 10 minutos em estudos experimentais) e servem como ilustração da perda de eficácia, não como alvo. Via aérea desprotegida, corrosivos e hidrocarbonetos com risco de aspiração estão entre as contraindicações; em organofosforados, a lavagem só entra depois da reanimação, com via aérea protegida. Ingestão de corrosivo contraindica — não indica — o procedimento."},{"n":"🟡","levelName":"intermediario","q":"Em qual situação o \u003cstrong>carvão ativado\u003c/strong> está contraindicado?","a":["Rebaixamento sem proteção de via aérea","Paciente intubado com via aérea protegida","Ingestão de carbamazepina há 30 minutos","Suspeita de intoxicação por paracetamol"],"c":0,"e":"O risco central do carvão é a aspiração: com rebaixamento de consciência e via aérea desprotegida, ele não deve ser administrado. Também são contraindicações o risco de perfuração ou hemorragia digestiva, a obstrução intestinal, a endoscopia planejada e os agentes não adsorvidos — metais, álcool, ácidos, bases e eletrólitos. Carbamazepina e paracetamol são adsorvidos, e a via aérea já protegida por intubação não contraindica o carvão; a janela preferencial é de até 1 hora, com dose de 1 g/kg ou 50 g no adulto e razão carvão:tóxico de 10:1."},{"n":"🟡","levelName":"intermediario","q":"Paciente de 70 kg com ingestão aguda de \u003cstrong>paracetamol\u003c/strong> e nível sérico acima da linha de tratamento. Qual é o esquema oral da N-acetilcisteína?","a":["Ataque de 140 mg/kg e 50 mg/kg a cada 6 horas, por 12 horas","Ataque de 150 mg/kg e 50 mg/kg em 4 horas, seguidos de 100 mg/kg","Ataque de 140 mg/kg e 70 mg/kg a cada 4 horas, por 17 doses","Ataque de 100 mg/kg e 50 mg/kg a cada 4 horas, por 9 doses"],"c":2,"e":"O esquema oral é ataque de 140 mg/kg, seguido de 70 mg/kg a cada 4 horas, por 17 doses adicionais — 72 horas e 1330 mg/kg no total. O esquema intravenoso é outro: 150 mg/kg em 1 hora, 50 mg/kg em 4 horas e 100 mg/kg em 16 horas (21 horas, 300 mg/kg). O nomograma de Rumack-Matthew indica o antídoto pela linha de 150 µg/mL às 4 horas na ingestão aguda única, e a regra temporal é iniciar o quanto antes, com máxima eficácia nas primeiras 8 horas — sem perder benefício quando o início é tardio. A duração pode ser encurtada ou estendida conforme critérios laboratoriais."},{"n":"🟡","levelName":"intermediario","q":"Qual é \u003cstrong>contraindicação formal\u003c/strong> ao flumazenil — e não apenas precaução?","a":["Epilepsia em uso crônico de benzodiazepínico","Dependência física crônica de benzodiazepínico","Trauma craniano com hipertensão intracraniana","Sinais de intoxicação grave por tricíclico"],"c":3,"e":"Na bula americana (FDA) e nos protocolos de toxicologia, são contraindicações formais hipersensibilidade, benzodiazepínico administrado para controle de condição potencialmente fatal e sinais de intoxicação grave por antidepressivo cíclico. Epilepsia em uso prolongado, dependência física, trauma craniano com hipertensão intracraniana e coingestão pró-convulsivante são precauções de alto risco — não contraindicações formais — e pedem decisão individualizada. O risco de convulsão se concentra no uso crônico de benzodiazepínicos e na overdose com sinais de tricíclico; na prática, o ECG orienta: não usar quando o QRS passa de 100 ms ou a onda R em aVR passa de 3 mm."},{"n":"🔴","levelName":"avancado","q":"Intoxicação tricíclica com \u003cstrong>QRS alargado\u003c/strong> e hipotensão. Qual é a medida cardíaca específica e o alvo?","a":["Bicarbonato de sódio 0,5–1 mEq/kg, com alvo de pH entre 7,30 e 7,40","Bicarbonato de sódio 1–2 mEq/kg, com alvo de pH entre 7,45 e 7,55","Cloreto de cálcio 1 g IV em bolus, com alvo de pH entre 7,50 e 7,60","Flumazenil titulado até 3 mg, com alvo de QRS abaixo de 100 ms"],"c":1,"e":"Na intoxicação tricíclica com alterações cardíacas, o antídoto é bicarbonato de sódio 8,4% — 1 mEq/mL — em bolus de 1–2 mEq/kg, repetível, com infusão de 150 mEq em 1 L de SG5% se necessário, titulada para pH entre 7,45 e 7,55. O mecanismo é duplo, com aporte de sódio e alcalinização, e a complicação clássica é a hipocalemia; potássio e sódio precisam de monitorização. Os limiares de QRS orientam o prognóstico — acima de 100 ms cerca de um terço evolui com convulsão, e acima de 160 ms cerca de metade com disritmias — e a normalização do QRS pode levar 24 a 48 horas. O flumazenil está formalmente contraindicado quando há sinais de intoxicação grave por tricíclico, pelo risco de precipitar convulsão."},{"n":"🔴","levelName":"avancado","q":"Na intoxicação por \u003cstrong>organofosforado\u003c/strong>, por que a succinilcolina deve ser evitada na intubação?","a":["O bloqueio neuromuscular é revertido pela atropina em minutos","A liberação de potássio é o motivo principal nesse quadro clínico","A pseudocolinesterase inibida prolonga o bloqueio neuromuscular","A pralidoxima potencializa o efeito do bloqueador na placa"],"c":2,"e":"A succinilcolina depende da butirilcolinesterase plasmática, que está inibida nos organofosforados e nos carbamatos: o bloqueio se prolonga, com apneia e paralisia prolongadas, e a alternativa é um bloqueador não despolarizante, como rocurônio ou vecurônio. A liberação de potássio do despolarizante é o racional para evitá-lo na intoxicação digitálica com hipercalemia — outro cenário e outra lógica. A atropina não reverte bloqueio neuromuscular, e a pralidoxima reativa a acetilcolinesterase, sem potencializar o bloqueador."}]},{"id":"11","fullTitle":"11 — Acidentes com animais peçonhentos","shortTitle":"Acidentes com animais peçonhentos","subtitle":"Ofidismo, araneísmo e escorpionismo no plantão: reconhecer o animal pela clínica, classificar a gravidade e acertar o soro e a dose — com os esquemas do PCDT vigente e as divergências entre documentos oficiais.","toc":[{"id":"sec-1-abordagem-inicial","title":"1. Abordagem inicial"},{"id":"sec-2-ofidismo","title":"2. Ofidismo"},{"id":"sec-3-araneísmo","title":"3. Araneísmo"},{"id":"sec-4-escorpionismo","title":"4. Escorpionismo"},{"id":"sec-5-resumo-de-soros-e-pegadinhas","title":"5. Resumo de soros e pegadinhas"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-abordagem-inicial\">\u003ch2>1. Abordagem inicial\u003c/h2>\u003ch3 id=\"h-1-1-reconhecer-o-animal-peçonhento-não-peçonhento\">1.1 Reconhecer o animal (peçonhento × não peçonhento)\u003c/h3>\n\u003cul>\u003cli>As serpentes peçonhentas brasileiras de maior relevância — \u003cstrong>jararaca\u003c/strong>, \u003cstrong>cascavel\u003c/strong> e \u003cstrong>surucucu\u003c/strong> — têm \u003cstrong>fosseta loreal\u003c/strong>, a estrutura termossensível entre a narina e o olho, e \u003cstrong>presas inoculadoras avantajadas\u003c/strong>. A \u003cstrong>coral\u003c/strong> (Micrurus) não tem fosseta e seus dentes inoculadores são pequenos.\u003c/li>\u003cli>Sinais externos: \u003cstrong>jararaca\u003c/strong> → cauda lisa; \u003cstrong>cascavel\u003c/strong> → chocalho na ponta da cauda; \u003cstrong>surucucu\u003c/strong> → escamas salientes, de aspecto \"eriçado\".\u003c/li>\u003cli>\u003cstrong>Coral verdadeira × falsa coral:\u003c/strong> a verdadeira tem \u003cstrong>anéis completos e tricolores\u003c/strong>; a falsa tem \u003cstrong>anéis apenas na face dorsal\u003c/strong>, é bicolor e não inocula veneno.\u003c/li>\u003cli>\u003cstrong>Epidemiologia dos ofídicos:\u003c/strong> o \u003cstrong>botrópico\u003c/strong> responde por cerca de \u003cstrong>90%\u003c/strong> dos acidentes; o \u003cstrong>elapídico\u003c/strong> é o mais raro; o \u003cstrong>crotálico\u003c/strong> é o que mais mata, pela insuficiência renal. Perfil clássico da vítima: \u003cstrong>homem, 15 a 49 anos\u003c/strong>, meio rural, picado em \u003cstrong>membro inferior\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Aranhas e escorpiões:\u003c/strong> o veneno ativa \u003cstrong>canais de sódio\u003c/strong> neuronais — dor (fibras sensitivas), descarga autonômica simpática/parassimpática e contraturas (fibras motoras).\u003c/li>\u003cli>Por região: \u003cstrong>armadeira\u003c/strong> no Sudeste; \u003cstrong>aranha marrom\u003c/strong> no Sul (PR e SC); \u003cstrong>viúva negra\u003c/strong> no Nordeste; \u003cstrong>escorpião amarelo\u003c/strong> (\u003cem>Tityus serrulatus\u003c/em>) em MG e SP, muito adaptado ao meio urbano, com picada mais comum em \u003cstrong>membros superiores\u003c/strong> e maior gravidade nos \u003cstrong>extremos de idade\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-primeiros-socorros\">1.2 Primeiros socorros\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Fazer:\u003c/strong> acalmar o paciente, manter \u003cstrong>repouso\u003c/strong> e limpar o local da picada; encaminhar para atendimento e avaliação de gravidade.\u003c/li>\u003cli>A única tentativa de reduzir a absorção do veneno é a \u003cstrong>bandagem compressiva\u003c/strong> — e \u003cstrong>nunca\u003c/strong> um torniquete.\u003c/li>\u003cli>\u003cstrong>Não fazer:\u003c/strong> \u003cstrong>torniquete\u003c/strong> (garrote), \u003cstrong>bebidas alcoólicas\u003c/strong>, \u003cstrong>amputação\u003c/strong> do membro, nem medidas caseiras que atrasem o atendimento definitivo.\u003c/li>\u003cli>Todo caso exige \u003cstrong>profilaxia antitetânica\u003c/strong> e \u003cstrong>notificação compulsória\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-soroterapia-regras-que-valem-para-todos-os-soros\">1.3 Soroterapia: regras que valem para todos os soros\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Via intravenosa\u003c/strong> é a regra; \u003cstrong>mesma dose para adultos e crianças\u003c/strong>; \u003cstrong>não fracionar\u003c/strong> a dose; infusão controlada de \u003cstrong>8 a 12 mL/min\u003c/strong>.\u003c/li>\u003cli>Exceção de preparo: o \u003cstrong>soro antielapídico\u003c/strong> deve ser \u003cstrong>diluído de 1:2 a 1:5\u003c/strong> antes da infusão.\u003c/li>\u003cli>\u003cstrong>Não usar AINE\u003c/strong> nem \u003cstrong>antibiótico profilático\u003c/strong>; para a dor, analgésico comum.\u003c/li>\u003cli>A indicação depende de \u003cstrong>animal + gravidade\u003c/strong> — nem todo acidente recebe soro: casos leves de araneísmo, de escorpionismo e do acidente elapídico ficam sem antiveneno.\u003c/li>\u003cli>Em pacientes com EAP ou ICC, \u003cstrong>cuidado com o volume\u003c/strong>: repor apenas se necessário e de forma cautelosa.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-tempo-de-observação\">1.4 Tempo de observação\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Sem sinais de envenenamento: 4 horas\u003c/strong> de observação.\u003c/li>\u003cli>\u003cstrong>Após receber soro: no mínimo 24 horas\u003c/strong> — crotálico e elapídico podem exigir \u003cstrong>24 a 72 horas\u003c/strong>, pelo risco de progressão tardia.\u003c/li>\u003cli>\u003cstrong>Escorpionismo leve sem soro: 6 a 12 horas.\u003c/strong> Esse é o cenário do clássico \"6 a 12 horas\" — não é o tempo do paciente que recebeu soro.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-ofidismo\">\u003ch2>2. Ofidismo\u003c/h2>\u003ch3 id=\"h-2-1-as-quatro-síndromes\">2.1 As quatro síndromes\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Acidente\u003c/th>\u003cth>Serpente\u003c/th>\u003cth>Veneno\u003c/th>\u003cth>Quadro-chave\u003c/th>\u003cth>Soro (leve/moderado/grave)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Botrópico\u003c/strong>\u003c/td>\u003ctd>jararaca, urutu\u003c/td>\u003ctd>proteolítico + coagulante + hemorrágico\u003c/td>\u003ctd>dor, edema, bolhas, sangramento, CIVD\u003c/td>\u003ctd>SABR/SABL/SABC — \u003cstrong>3 / 6 / 12\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Crotálico\u003c/strong>\u003c/td>\u003ctd>cascavel\u003c/td>\u003ctd>neurotóxico + miotóxico\u003c/td>\u003ctd>fácies miastênica, mialgia, urina cor de carne, IRA\u003c/td>\u003ctd>SAC (na falta, SABC) — \u003cstrong>5 / 10 / 20\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Laquético\u003c/strong>\u003c/td>\u003ctd>surucucu\u003c/td>\u003ctd>necrosante + parassimpático\u003c/td>\u003ctd>como o botrópico + bradicardia e hipotensão\u003c/td>\u003ctd>SABL — \u003cstrong>10 / 20\u003c/strong> (só moderado e grave)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Elapídico\u003c/strong>\u003c/td>\u003ctd>coral\u003c/td>\u003ctd>neurotóxico (sem ação miotóxica)\u003c/td>\u003ctd>ptose, fraqueza progressiva, falência respiratória\u003c/td>\u003ctd>SAEla IV — \u003cstrong>sem soro / 5 / 10\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-2-2-acidente-botrópico\">2.2 Acidente botrópico\u003c/h3>\n\u003cul>\u003cli>Acidente mais comum no Brasil (\u003cstrong>~90%\u003c/strong>); ações \u003cstrong>proteolítica, coagulante e hemorrágica\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Local:\u003c/strong> dor, edema progressivo, bolhas, equimoses. \u003cstrong>Sistêmico:\u003c/strong> hemorragias à distância, náuseas, vômitos, sudorese, hipotensão; \u003cstrong>CIVD\u003c/strong> e \u003cstrong>alargamento do tempo de coagulação\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Complicações:\u003c/strong> \u003cstrong>síndrome compartimental\u003c/strong> (avaliar pulso, pele fria e perda sensitivo-motora), \u003cstrong>abscesso\u003c/strong> (a boca da serpente é muito contaminada por gram-negativos), necrose, choque e IRA. Complicações locais podem exigir \u003cstrong>desbridamento e fasciotomia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Exames\u003c/strong> que acompanham a evolução: \u003cstrong>CPK\u003c/strong> (rabdomiólise), \u003cstrong>tempo de coagulação\u003c/strong> e função renal (creatinina, ureia, urina I).\u003c/li>\u003cli>\u003cstrong>Gravidade e dose (PCDT 2026):\u003c/strong> classificação pelo \u003cstrong>número de segmentos de edema\u003c/strong> (1, 2 ou 3) somado às complicações — e a \u003cstrong>coagulopatia não define gravidade nem orienta a dose\u003c/strong>. Soro antibotrópico (SABR, SABL ou SABC): \u003cstrong>3, 6 e 12 ampolas\u003c/strong>.\u003c/li>\u003cli>O esquema \u003cstrong>4/8/12\u003c/strong> circula em material antigo e \u003cstrong>não consta\u003c/strong> em documento oficial vigente; a página antiga do MS ainda exibe 2–4 / 4–8 / 12, uma adaptação do Manual de 2001.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-3-acidente-crotálico\">2.3 Acidente crotálico\u003c/h3>\n\u003cul>\u003cli>Cascavel; veneno \u003cstrong>neurotóxico e miotóxico\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Local discreto\u003c/strong> (pouca dor, parestesia, edema leve) — é o que engana.\u003c/li>\u003cli>\u003cstrong>Sistêmico:\u003c/strong> mal-estar, sudorese, sonolência ou inquietação, \u003cstrong>fácies miastênica\u003c/strong>, ptose e oftalmoplegia, visão turva, diplopia, disfagia, \u003cstrong>mialgia\u003c/strong> e \u003cstrong>urina cor de carne\u003c/strong> (mioglobinúria).\u003c/li>\u003cli>Complicação temida: \u003cstrong>IRA por rabdomiólise\u003c/strong> — o material da disciplina orienta preveni-la com \u003cstrong>hidratação venosa + manitol + bicarbonato\u003c/strong>.\u003c/li>\u003cli>Classificação por fácies miastênica/visão turva, mialgia, urina escura, oligúria/anúria e tempo de coagulação. Soro \u003cstrong>SAC\u003c/strong> (na falta, \u003cstrong>SABC\u003c/strong>): \u003cstrong>5, 10 e 20 ampolas\u003c/strong> conforme a gravidade.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-4-acidente-laquético\">2.4 Acidente laquético\u003c/h3>\n\u003cul>\u003cli>Surucucu (Lachesis), em ambientes florestais; veneno \u003cstrong>necrosante\u003c/strong> como o do botrópico \u003cstrong>+ ação parassimpática\u003c/strong>: bradicardia, hipotensão, vômitos e cólicas — pode ser confundido com o acidente botrópico.\u003c/li>\u003cli>\u003cstrong>Só existem as formas moderada e grave:\u003c/strong> soro \u003cstrong>SABL\u003c/strong> — \u003cstrong>10 ampolas\u003c/strong> no moderado e \u003cstrong>20\u003c/strong> no grave.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-5-acidente-elapídico\">2.5 Acidente elapídico\u003c/h3>\n\u003cul>\u003cli>Coral (Micrurus); o mais raro no país; veneno \u003cstrong>neurotóxico, sem ação miotóxica\u003c/strong> (diferente do crotálico).\u003c/li>\u003cli>Local discreto (dor e parestesia); sistêmico progressivo: ptose palpebral, oftalmoplegia, \u003cstrong>fácies miastênica\u003c/strong>, disfagia, fraqueza muscular e \u003cstrong>insuficiência respiratória aguda\u003c/strong>.\u003c/li>\u003cli>Esquema (classificação em três formas incorporada ao PCDT): \u003cstrong>leve sem soro\u003c/strong> — observação mínima de \u003cstrong>24 h\u003c/strong>, tratando se evoluir com miastenia; \u003cstrong>moderado 5\u003c/strong> e \u003cstrong>grave 10\u003c/strong> ampolas de \u003cstrong>SAEla IV\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Neostigmina\u003c/strong> é adjuvante nos casos com paralisia: teste terapêutico de \u003cstrong>1 a 2 mg IV\u003c/strong> no adulto (\u003cstrong>0,01 a 0,04 mg/kg\u003c/strong> na criança), \u003cstrong>sempre precedida de atropina\u003c/strong>. Todo caso deve ser tratado como \u003cstrong>potencialmente grave\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-araneísmo\">\u003ch2>3. Araneísmo\u003c/h2>\u003ch3 id=\"h-3-1-armadeira-phoneutria\">3.1 Armadeira (Phoneutria)\u003c/h3>\n\u003cul>\u003cli>Errante e agressiva; \u003cstrong>mais comum no Sudeste\u003c/strong>; pica extremidades.\u003c/li>\u003cli>\u003cstrong>Local:\u003c/strong> sinais leves. \u003cstrong>Sistêmico precoce:\u003c/strong> taquicardia, hipertensão, sudorese, agitação psicomotora, visão turva, vômitos, sialorreia, diarreia, priapismo, hipertonia — pode evoluir com hipotensão, choque e \u003cstrong>edema agudo de pulmão\u003c/strong>; o quadro é fácil de confundir com acidente ofídico. A \u003cstrong>hidratação pode piorar\u003c/strong> a congestão.\u003c/li>\u003cli>Crianças com quadro grave: \u003cstrong>leucocitose com neutrofilia, hiperglicemia, acidose metabólica\u003c/strong> e taquicardia sinusal.\u003c/li>\u003cli>Soro antiaracnídeo (\u003cstrong>SAA\u003c/strong>): \u003cstrong>leve sem soro\u003c/strong>; \u003cstrong>moderado 2 a 4\u003c/strong> ampolas; \u003cstrong>grave 5 a 10\u003c/strong>. Há \u003cstrong>divergência entre documentos oficiais\u003c/strong>: o Ofício Circular nº 2/2014 (protocolo de escassez) registra \u003cstrong>3\u003c/strong> ampolas em crianças menores de 7 anos com quadro moderado e \u003cstrong>6\u003c/strong> no grave.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-2-aranha-marrom-loxosceles\">3.2 Aranha marrom (Loxosceles)\u003c/h3>\n\u003cul>\u003cli>Predomina no \u003cstrong>Sul\u003c/strong> (PR e SC); não é agressiva e pica áreas centrais do corpo (coxa, tronco). É \"a que mais cai em prova\".\u003c/li>\u003cli>\u003cstrong>Forma cutânea (99%):\u003c/strong> \u003cstrong>placa marmórea\u003c/strong> — base eritematosa com áreas de isquemia central e zonas violáceas —, que evolui para necrose e úlcera de difícil cicatrização. As alterações cutâneas demoram \u003cstrong>horas a dias\u003c/strong> para aparecer.\u003c/li>\u003cli>\u003cstrong>Forma cutâneo-visceral (1%):\u003c/strong> hemólise → \u003cstrong>IRA\u003c/strong> por lesão tubular e \u003cstrong>CIVD\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Leve:\u003c/strong> lesão atípica — \u003cstrong>sem tratamento específico\u003c/strong>, com retorno diário por 72 h.\u003c/li>\u003cli>\u003cstrong>Moderada:\u003c/strong> \u003cstrong>prednisona por 5 dias, sem antiveneno\u003c/strong>, pelo Ofício Circular nº 2/2014 (base dos protocolos estaduais). \u003cstrong>Divergência entre materiais do próprio MS:\u003c/strong> a página atual de aranhas registra \u003cstrong>5 ampolas\u003c/strong> de soro também na forma moderada.\u003c/li>\u003cli>\u003cstrong>Grave:\u003c/strong> forma cutânea → \u003cstrong>SALox/SAA 5 ampolas + prednisona por 7 dias\u003c/strong>; cutâneo-hemolítica → \u003cstrong>10 ampolas + prednisona por 7 dias\u003c/strong>. A formulação \"7–10 dias\" de materiais mais antigos não corresponde às referências vigentes: na forma grave, \u003cstrong>7 dias\u003c/strong> (texto geral: 5 a 10 dias). IRA pode exigir \u003cstrong>diálise precoce\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-3-viúva-negra-latrodectus\">3.3 Viúva negra (Latrodectus)\u003c/h3>\n\u003cul>\u003cli>Mais comum no \u003cstrong>Nordeste\u003c/strong>; sinais locais discretos (dor leve, pápula eritematosa, sudorese localizada).\u003c/li>\u003cli>\u003cstrong>Sistêmico:\u003c/strong> \u003cstrong>contraturas e flexões dolorosas\u003c/strong> (podem simular \u003cstrong>abdome agudo\u003c/strong>), \u003cstrong>fácies latrodectísmica\u003c/strong>, taquicardia seguida de bradicardia, tremores, ansiedade, rubor de face e pescoço, hiperreflexia, retenção urinária e priapismo, ptose e edema bipalpebral; risco de EAP e de arritmias — fazer \u003cstrong>ECG seriado\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Tratamento sintomático:\u003c/strong> benzodiazepínicos, \u003cstrong>gluconato de cálcio a 10%\u003c/strong> e ECG.\u003c/li>\u003cli>\u003cstrong>Não há soro antilatrodético disponível no Brasil\u003c/strong>, e o antiaracnídeo trivalente (\u003cstrong>Loxosceles + Phoneutria + Tityus\u003c/strong>) \u003cstrong>não neutraliza\u003c/strong> o veneno da viúva negra. O soro importado por via intramuscular, descrito no Manual de 2001, \u003cstrong>não faz parte da realidade do SUS\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-escorpionismo\">\u003ch2>4. Escorpionismo\u003c/h2>\u003ch3 id=\"h-4-1-quadro-clínico\">4.1 Quadro clínico\u003c/h3>\n\u003cul>\u003cli>\u003cem>Tityus serrulatus\u003c/em> (escorpião amarelo): MG e SP, bem adaptado ao meio urbano; \u003cstrong>mais grave nos extremos de idade\u003c/strong>. No Brasil, o escorpionismo é mais frequente e mais grave que o araneísmo.\u003c/li>\u003cli>\u003cstrong>Local:\u003c/strong> dor e parestesias. \u003cstrong>Sistêmico:\u003c/strong> sudorese profusa, vômitos, sialorreia, dor abdominal, diarreia, arritmias, hipertensão ou hipotensão, ICC, choque, taquipneia, \u003cstrong>edema agudo de pulmão\u003c/strong>, agitação ou sonolência, hipertonia.\u003c/li>\u003cli>\u003cstrong>Exames\u003c/strong> que ajudam: \u003cstrong>ECG\u003c/strong> (taquicardia, bradicardia, extrassístoles, alterações de ST-T), \u003cstrong>radiografia de tórax\u003c/strong> (aumento da área cardíaca, EAP unilateral) e laboratório (leucocitose com neutrofilia, hiperglicemia, amilase, hipocalemia/hiponatremia, \u003cstrong>CPK e CK-MB\u003c/strong>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-4-2-classificação-e-tratamento-pcdt-2026\">4.2 Classificação e tratamento (PCDT 2026)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Leve:\u003c/strong> \u003cstrong>sem soro\u003c/strong>, com observação de \u003cstrong>6 a 12 h\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Moderado:\u003c/strong> soro antiescorpiônico (\u003cstrong>SAE\u003c/strong>) — \u003cstrong>3 frascos-ampolas\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Grave:\u003c/strong> \u003cstrong>6 frascos-ampolas\u003c/strong>; \u003cstrong>não ultrapassar 6\u003c/strong> no total; indicado \u003cstrong>independentemente da idade\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Após o soro: observação mínima de 24 h.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>EAP/ICC:\u003c/strong> \u003cstrong>furosemida IV\u003c/strong> + oxigênio (± ventilação); se necessário repor volume, fazê-lo de forma \u003cstrong>cautelosa\u003c/strong>, evitando sobrecarga hídrica — a regra antiga de \"não hidratar\" é uma simplificação.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-resumo-de-soros-e-pegadinhas\">\u003ch2>5. Resumo de soros e pegadinhas\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Acidente\u003c/th>\u003cth>Soro\u003c/th>\u003cth>Leve\u003c/th>\u003cth>Moderado\u003c/th>\u003cth>Grave\u003c/th>\u003cth>Ponto-chave\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Botrópico\u003c/strong>\u003c/td>\u003ctd>SABR/SABL/SABC\u003c/td>\u003ctd>3\u003c/td>\u003ctd>6\u003c/td>\u003ctd>12\u003c/td>\u003ctd>segmentos de edema definem a gravidade; coagulopatia não muda a dose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Crotálico\u003c/strong>\u003c/td>\u003ctd>SAC (ou SABC)\u003c/td>\u003ctd>5\u003c/td>\u003ctd>10\u003c/td>\u003ctd>20\u003c/td>\u003ctd>mioglobinúria → IRA; é o ofídico que mais mata\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Laquético\u003c/strong>\u003c/td>\u003ctd>SABL\u003c/td>\u003ctd>—\u003c/td>\u003ctd>10\u003c/td>\u003ctd>20\u003c/td>\u003ctd>só existem formas moderada e grave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Elapídico\u003c/strong>\u003c/td>\u003ctd>SAEla IV\u003c/td>\u003ctd>sem soro\u003c/td>\u003ctd>5\u003c/td>\u003ctd>10\u003c/td>\u003ctd>observação ≥24 h; neostigmina com atropina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Armadeira\u003c/strong>\u003c/td>\u003ctd>SAA\u003c/td>\u003ctd>sem soro\u003c/td>\u003ctd>2–4\u003c/td>\u003ctd>5–10\u003c/td>\u003ctd>Ofício 2/2014 usa 3 e 6 (divergência)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Loxosceles\u003c/strong>\u003c/td>\u003ctd>SALox/SAA\u003c/td>\u003ctd>sem soro\u003c/td>\u003ctd>prednisona 5 d\u003c/td>\u003ctd>5 ou 10\u003c/td>\u003ctd>moderado: sem antiveneno (Ofício 2/2014) × página MS; grave: 5 cutânea, 10 hemolítica, + prednisona 7 d\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Escorpião\u003c/strong>\u003c/td>\u003ctd>SAE\u003c/td>\u003ctd>sem soro\u003c/td>\u003ctd>3 frascos\u003c/td>\u003ctd>6 (máx. 6)\u003c/td>\u003ctd>6–12 h de observação é do leve; pós-soro ≥24 h\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Latrodectus\u003c/strong>\u003c/td>\u003ctd>sem soro no Brasil\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>sintomático: benzodiazepínico + gluconato de cálcio 10% + ECG\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Pegadinhas que decidem questão:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Não existe \"4/8/12\"\u003c/strong> para o botrópico: o vigente é \u003cstrong>3/6/12\u003c/strong>, com a mesma dose para adultos e crianças.\u003c/li>\u003cli>\u003cstrong>Elapídico leve não recebe soro\u003c/strong> — o \"10 ampolas para todos\" está desatualizado; moderado é \u003cstrong>5\u003c/strong> e grave é \u003cstrong>10\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Neostigmina sempre precedida de atropina\u003c/strong> nos casos com paralisia do acidente elapídico.\u003c/li>\u003cli>\u003cstrong>Latrodectus não tem soro no Brasil\u003c/strong>; o SAA trivalente não neutraliza o veneno.\u003c/li>\u003cli>\u003cstrong>Loxosceles moderado\u003c/strong>: divergência real entre o Ofício 2/2014 (só prednisona) e a página do MS (5 ampolas).\u003c/li>\u003cli>\u003cstrong>Phoneutria\u003c/strong> tem duas numerações oficiais em circulação: \u003cstrong>2–4 / 5–10\u003c/strong> (página MS) e \u003cstrong>3 / 6\u003c/strong> (Ofício 2/2014).\u003c/li>\u003cli>\u003cstrong>\"6 a 12 horas\" é do escorpião leve sem soro\u003c/strong>; quem recebe soro fica \u003cstrong>≥24 h\u003c/strong>, e crotálico/elapídico podem exigir \u003cstrong>até 72 h\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>EAP não é \"não hidratar\"\u003c/strong>: é \u003cstrong>furosemida\u003c/strong> + volume apenas se necessário e com cautela.\u003c/li>\u003cli>\u003cstrong>Sem AINE, sem antibiótico profilático\u003c/strong>; \u003cstrong>tétano\u003c/strong> e \u003cstrong>notificação\u003c/strong> em todos os casos.\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Quais são as medidas gerais — o que fazer e o que não fazer — no atendimento inicial de um acidente com animal peçonhento?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Cuidados locais (\u003cstrong>repouso\u003c/strong> e limpeza), suporte clínico e avaliação da gravidade; \u003cstrong>profilaxia antitetânica\u003c/strong> e \u003cstrong>notificação compulsória\u003c/strong> em todo caso. Se houver indicação de soro: \u003cstrong>via IV\u003c/strong>, dose \u003cstrong>igual para adultos e crianças\u003c/strong>, \u003cstrong>sem fracionar\u003c/strong>, infusão de \u003cstrong>8 a 12 mL/min\u003c/strong> (antielapídico diluído \u003cstrong>1:2 a 1:5\u003c/strong>). \u003cstrong>Não\u003c/strong> fazer torniquete, bebida alcoólica ou amputação — a \u003cstrong>bandagem compressiva\u003c/strong> é a única tentativa aceitável de reduzir a absorção, jamais o garrote. Evitar \u003cstrong>AINE\u003c/strong> e antibiótico profilático; para a dor, analgésico comum.\u003c/p>"},{"titleHtml":"🟢 Como reconhecer as serpentes peçonhentas e diferenciar a coral verdadeira da falsa coral?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> As peçonhentas de maior relevância (\u003cstrong>jararaca, cascavel e surucucu\u003c/strong>) têm \u003cstrong>fosseta loreal\u003c/strong> entre a narina e o olho e presas inoculadoras avantajadas; a jararaca tem cauda lisa, a cascavel tem chocalho e a surucucu tem escamas salientes. A \u003cstrong>coral verdadeira\u003c/strong> (Micrurus) não tem fosseta, tem \u003cstrong>anéis completos e tricolores\u003c/strong> e dentes inoculadores pequenos. A \u003cstrong>falsa coral\u003c/strong> tem \u003cstrong>anéis apenas na face dorsal\u003c/strong>, é bicolor e não inocula veneno.\u003c/p>"},{"titleHtml":"🟡 Compare o acidente botrópico e o laquético: clínica e esquema de soro.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Ambos são \u003cstrong>necrosantes\u003c/strong> (ação proteolítica): dor, edema, bolhas, equimoses, sangramento e risco de necrose e síndrome compartimental. No \u003cstrong>botrópico\u003c/strong> (jararaca/urutu, ~90% dos casos), predominam \u003cstrong>hemorragia, CIVD e alargamento do tempo de coagulação\u003c/strong>; a gravidade é classificada pelo \u003cstrong>número de segmentos de edema\u003c/strong> mais complicações — a coagulopatia não define a dose — e o soro é \u003cstrong>SABR/SABL/SABC: 3/6/12\u003c/strong>. O \u003cstrong>laquético\u003c/strong> (surucucu) adiciona \u003cstrong>ação parassimpática\u003c/strong> (bradicardia, hipotensão, vômitos) e só tem formas \u003cstrong>moderada e grave\u003c/strong>: \u003cstrong>SABL 10 e 20\u003c/strong>.\u003c/p>"},{"titleHtml":"🟡 Compare o acidente crotálico e o elapídico: veneno, quadro clínico e soroterapia.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> O \u003cstrong>crotálico\u003c/strong> (cascavel) é \u003cstrong>neurotóxico e miotóxico\u003c/strong>: local discreto, fácies miastênica, mialgia, \u003cstrong>urina cor de carne\u003c/strong> (mioglobinúria) e IRA — é o ofídico que mais mata; soro \u003cstrong>SAC: 5/10/20\u003c/strong> (na falta, SABC). O \u003cstrong>elapídico\u003c/strong> (coral) é \u003cstrong>neurotóxico sem ação miotóxica\u003c/strong>: ptose, oftalmoplegia, fraqueza progressiva e \u003cstrong>insuficiência respiratória\u003c/strong>; o esquema é \u003cstrong>leve sem soro\u003c/strong> (observação ≥24 h; tratar se evoluir com miastenia), \u003cstrong>moderado 5\u003c/strong> e \u003cstrong>grave 10\u003c/strong> ampolas de \u003cstrong>SAEla IV\u003c/strong>, com \u003cstrong>neostigmina\u003c/strong> adjuvante (\u003cstrong>1–2 mg IV\u003c/strong>, precedida de atropina) nos casos com paralisia.\u003c/p>"},{"titleHtml":"🟡 Armadeira (Phoneutria): qual é o quadro clínico e a indicação de soro, com as divergências de números?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É errante e agressiva, predomina no \u003cstrong>Sudeste\u003c/strong> e pica extremidades. O quadro \u003cstrong>sistêmico é precoce\u003c/strong> — taquicardia, hipertensão, sudorese, agitação, vômitos, priapismo, hipertonia — e pode evoluir com hipotensão, choque e \u003cstrong>EAP\u003c/strong>; simula acidente ofídico e \u003cstrong>a hidratação pode piorar\u003c/strong>. Só casos \u003cstrong>moderados/graves\u003c/strong> recebem \u003cstrong>SAA\u003c/strong>: \u003cstrong>2 a 4 ampolas no moderado\u003c/strong> e \u003cstrong>5 a 10 no grave\u003c/strong> (página atual do MS). O Ofício Circular nº 2/2014 usa \u003cstrong>3\u003c/strong> (crianças &lt;7 anos, moderado) e \u003cstrong>6\u003c/strong> (grave) — há divergência entre documentos oficiais.\u003c/p>"},{"titleHtml":"🟡 Aranha marrom (Loxosceles): formas clínicas, classificação de gravidade e tratamento — incluindo a divergência do moderado.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Predomina no \u003cstrong>Sul\u003c/strong> e causa a \u003cstrong>placa marmórea\u003c/strong> (base eritematosa com isquemia central e áreas violáceas), que evolui para necrose. Em \u003cstrong>99%\u003c/strong> é a forma cutânea; em \u003cstrong>1%\u003c/strong>, \u003cstrong>hemolítica\u003c/strong>, com IRA e CIVD. \u003cstrong>Leve:\u003c/strong> lesão atípica, sem tratamento específico (retorno diário por 72 h). \u003cstrong>Moderada:\u003c/strong> \u003cstrong>prednisona por 5 dias, sem antiveneno\u003c/strong>, pelo Ofício 2/2014 — a página do MS registra \u003cstrong>5 ampolas\u003c/strong> de soro, uma \u003cstrong>divergência entre materiais do próprio Ministério\u003c/strong>. \u003cstrong>Grave:\u003c/strong> cutânea → \u003cstrong>5 ampolas\u003c/strong> de SALox/SAA + prednisona 7 dias; cutâneo-hemolítica → \u003cstrong>10 ampolas\u003c/strong> + prednisona 7 dias.\u003c/p>"},{"titleHtml":"🔴 Viúva negra (Latrodectus): como reconhecer o quadro e por que o tratamento no Brasil é sintomático?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Predomina no \u003cstrong>Nordeste\u003c/strong>; os sinais locais são discretos e o quadro sistêmico lembra descarga autonômica: \u003cstrong>contraturas dolorosas\u003c/strong> (podem simular abdome agudo), \u003cstrong>fácies latrodectísmica\u003c/strong>, taquicardia seguida de bradicardia, tremores, sudorese, rubor de face e pescoço, hiperreflexia, retenção urinária e priapismo. O tratamento é \u003cstrong>sintomático\u003c/strong> — benzodiazepínicos, \u003cstrong>gluconato de cálcio a 10%\u003c/strong> e \u003cstrong>ECG seriado\u003c/strong> pelo risco de arritmias. \u003cstrong>Não há soro antilatrodético no Brasil\u003c/strong> e o trivalente (SAA) não neutraliza o veneno; o soro importado por via IM citado em materiais antigos não existe no SUS.\u003c/p>"},{"titleHtml":"🔴 Escorpionismo: como classificar a gravidade, qual o esquema de soro e como conduzir o EAP e a observação?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> No \u003cstrong>PCDT 2026\u003c/strong>, \u003cstrong>leve\u003c/strong> fica \u003cstrong>sem soro\u003c/strong>, com observação de \u003cstrong>6 a 12 h\u003c/strong>; \u003cstrong>moderado\u003c/strong> recebe \u003cstrong>3 frascos\u003c/strong> e \u003cstrong>grave\u003c/strong>, \u003cstrong>6\u003c/strong> (máximo \u003cstrong>6\u003c/strong>), \u003cstrong>independentemente da idade\u003c/strong>. \u003cstrong>Após o soro: ≥24 h\u003c/strong> de observação. O \u003cstrong>EAP\u003c/strong> e a ICC são tratados com \u003cstrong>furosemida IV\u003c/strong> e oxigênio (± ventilação); se houver necessidade de repor volume, fazê-lo de forma \u003cstrong>cautelosa\u003c/strong>, evitando sobrecarga hídrica. O óbito é mais provável nos \u003cstrong>extremos de idade\u003c/strong> — sobretudo em crianças.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"No acidente botrópico, qual é o número de ampolas de soro antibotrópico nas formas leve, moderada e grave, conforme o PCDT vigente?","a":["4, 8 e 12 ampolas — leve, moderado e grave","3, 6 e 12 ampolas — leve, moderado e grave","2, 4 e 8 ampolas — leve, moderado e grave","5, 10 e 20 ampolas — leve, moderado e grave"],"c":1,"e":"O PCDT de acidentes ofídicos fixa \u003cstrong>3, 6 e 12\u003c/strong> ampolas para as formas leve, moderada e grave, com a mesma dose para adultos e crianças, por via intravenosa e sem fracionar. O esquema 4/8/12 circula em material desatualizado e não consta em nenhum documento oficial vigente; a página antiga do MS ainda exibe 2 a 4 / 4 a 8 / 12, que é adaptação do Manual de 2001. A referência atual é o PCDT."},{"n":"🟢","levelName":"basico","q":"No atendimento de um acidente com animal peçonhento, qual conduta está correta?","a":["Aplicar torniquete proximal e dar bebida alcoólica","Prescrever AINE para a dor e antibiótico profilático","Fracionar o soro em várias aplicações intramusculares","Repouso, limpeza local, tétano e notificação do caso"],"c":3,"e":"O atendimento inicial é de suporte: repouso, limpeza local, \u003cstrong>profilaxia antitetânica\u003c/strong> e \u003cstrong>notificação compulsória\u003c/strong>, com soroterapia intravenosa quando indicada. Torniquete e bebida alcoólica são contraindicados, e a \u003cstrong>bandagem compressiva\u003c/strong> é a única tentativa aceitável de reduzir a absorção — jamais o garrote. O soro é intravenoso, com mesma dose para adultos e crianças, sem fracionar; também não se usam AINE nem antibiótico profilático."},{"n":"🟡","levelName":"intermediario","q":"No acidente crotálico, qual é o soro indicado e o esquema de ampolas conforme a gravidade?","a":["SAC: 5, 10 e 20 ampolas — conforme a gravidade","SAC: 3, 6 e 12 ampolas — conforme a gravidade","SABL: 10 e 20 ampolas — formas moderada e grave","SAEla: 5 e 10 ampolas — formas moderada e grave"],"c":0,"e":"O soro anticrotálico (SAC) é indicado em \u003cstrong>5, 10 ou 20\u003c/strong> ampolas conforme a gravidade, e na sua falta emprega-se o \u003cstrong>SABC\u003c/strong>. O acidente crotálico é neurotóxico e miotóxico, e a mioglobinúria com rabdomiólise é a via da insuficiência renal — por isso é o ofídico que mais mata. Os números 3/6/12 pertencem ao botrópico e 10/20 ao laquético; o elapídico usa 5 e 10 ampolas (e fica sem soro na forma leve)."},{"n":"🟡","levelName":"intermediario","q":"No acidente laquético, qual é o esquema de soro antilaquético (SABL) por forma clínica?","a":["5 e 10 ampolas — nas formas moderada e grave","10 e 20 ampolas — formas leve e moderada","10 e 20 ampolas — formas moderada e grave","6 e 12 ampolas — formas moderada e grave"],"c":2,"e":"O acidente laquético só tem formas \u003cstrong>moderada e grave\u003c/strong>: \u003cstrong>10 ampolas\u003c/strong> no moderado e \u003cstrong>20\u003c/strong> no grave, com o soro antilaquético (SABL). O veneno é necrosante como o do botrópico e adiciona ação parassimpática — bradicardia, hipotensão, vômitos e cólicas. A combinação 5 e 10 é do elapídico, e 6 e 12 não corresponde a nenhum esquema vigente."},{"n":"🟡","levelName":"intermediario","q":"No acidente elapídico, qual é a conduta com o soro nas formas leve, moderada e grave?","a":["Sem soro no moderado; 5 ampolas na grave e 10 na leve","Leve: 5; moderado: 10; grave: 20 ampolas de SAEla","10 ampolas de SAEla independentemente da gravidade","Leve: sem soro em observação; moderado: 5; grave: 10"],"c":3,"e":"O acidente elapídico tem três formas: a \u003cstrong>leve\u003c/strong> fica em observação por pelo menos 24 horas, \u003cstrong>sem soro\u003c/strong>, e recebe tratamento se evoluir com miastenia; a \u003cstrong>moderada\u003c/strong> usa \u003cstrong>5\u003c/strong> ampolas e a \u003cstrong>grave\u003c/strong>, \u003cstrong>10\u003c/strong>, de \u003cstrong>SAEla por via intravenosa\u003c/strong>. Nos casos com paralisia, a \u003cstrong>neostigmina\u003c/strong> é adjuvante e deve ser precedida de atropina, com teste terapêutico de 1 a 2 mg no adulto e 0,01 a 0,04 mg/kg na criança. \"10 ampolas para todas as formas\" está desatualizado — o veneno é neurotóxico e não tem ação miotóxica, diferente do crotálico."},{"n":"🟡","levelName":"intermediario","q":"Paciente com loxoscelismo cutâneo moderado. Qual é a conduta específica?","a":["Soro antiaracnídeo 5 ampolas e prednisona por 5 dias","Prednisona por 5 dias, sem antiveneno e com retorno","Soro antiaracnídeo 10 ampolas e prednisona por 7 dias","Somente curativo local e analgésico, sem corticoide"],"c":1,"e":"No loxoscelismo cutâneo moderado, o Ofício Circular nº 2/2014 — base dos protocolos estaduais — indica apenas \u003cstrong>prednisona por 5 dias\u003c/strong>, sem antiveneno. Há \u003cstrong>divergência entre materiais do próprio Ministério da Saúde\u003c/strong>: a página atual de aranhas registra 5 ampolas de soro também nessa forma. Na forma grave, são 5 ampolas (cutânea) ou 10 (cutâneo-hemolítica), sempre com prednisona por 7 dias; a forma leve não exige tratamento específico."},{"n":"🔴","levelName":"avancado","q":"No escorpionismo, qual é o esquema de soro antiescorpiônico nas formas moderada e grave, segundo o PCDT 2026?","a":["2 a 3 frascos no moderado, 4 a 6 no grave, máximo 6","5 frascos no moderado, 10 no grave, máximo de 10","3 frascos no moderado, 6 no grave, máximo de 6","6 frascos no moderado, 10 no grave, máximo de 10"],"c":2,"e":"O PCDT 2026 indica \u003cstrong>3 frascos-ampolas\u003c/strong> no moderado e \u003cstrong>6\u003c/strong> no grave, sem ultrapassar \u003cstrong>6\u003c/strong> no total, independentemente da idade. A observação de \u003cstrong>6 a 12 horas\u003c/strong> vale para o caso \u003cstrong>leve\u003c/strong>, que não recebe soro; quem recebe soro permanece no mínimo \u003cstrong>24 horas\u003c/strong>. No edema agudo de pulmão, a conduta é \u003cstrong>furosemida intravenosa\u003c/strong> com oxigêni
