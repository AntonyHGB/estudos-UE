 paciente está estável.\u003c/p>"},{"titleHtml":"🟡 Cite três cuidados ou pegadinhas das manobras vagais.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> (1) A massagem do seio carotídeo é feita \u003cstrong>um lado por vez, nunca bilateral e simultânea\u003c/strong>, e deve ser evitada em idosos e em pacientes com sopro ou estenose carotídea ou AVC prévio. (2) A Valsalva dura cerca de \u003cstrong>15 s\u003c/strong>, tem contraindicações (IAM recente, estenose aórtica/carotídea, glaucoma, retinopatia) e deve ser limitada a cerca de \u003cstrong>2 tentativas\u003c/strong>. (3) \u003cstrong>FA e flutter geralmente não convertem\u003c/strong> com vagais — e a elevação passiva das pernas durante a manobra aumenta a conversão (a Valsalva modificada reverte até \u003cstrong>43%\u003c/strong> das TSV).\u003c/p>"},{"titleHtml":"🟡 Fibrilação atrial com duração maior que 48 horas (ou desconhecida), paciente estável, programada cardioversão eletiva. O que a duração exige?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Anticoagulação antes da cardioversão\u003c/strong> e manutenção da anticoagulação por \u003cstrong>pelo menos 4 semanas\u003c/strong> depois, pelo risco de tromboembolismo com o retorno do ritmo. Estar estável não dispensa essa etapa: sem anticoagulação, a estratégia inicial tende a ser controle de frequência, e a decisão de ritmo passa pela avaliação do CHA2DS2-VASc. Manobras vagais não convertem FA; a cardioversão, quando indicada, usa \u003cstrong>≥200 J\u003c/strong> em bifásico.\u003c/p>"},{"titleHtml":"🔴 Caso de TV monomórfica sustentada, QRS largo e regular, paciente estável, com acesso venoso. Como conduzir e qual fármaco não pode ser usado?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Considerar \u003cstrong>adenosina para diagnóstico\u003c/strong> (regular e monomórfica), com monitorização contínua. Para terminar a TV provável, as opções de primeira linha são \u003cstrong>procainamida (20–50 mg/min), amiodarona ou sotalol\u003c/strong>; \u003cstrong>lidocaína\u003c/strong> é segunda linha. \u003cstrong>Verapamil é contraindicado\u003c/strong> na taquicardia de QRS largo, ficando reservado para quando há certeza de origem supraventricular sem via acessória — na dúvida, trate como TV. Se houver instabilidade a qualquer momento, sedação (se possível) e \u003cstrong>cardioversão sincronizada\u003c/strong> (100 J).\u003c/p>"},{"titleHtml":"🔴 TV polimórfica: por que não sincronizar, qual é o choque indicado e o que fazer nas recorrências?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A sincronização não é confiável quando cada QRS tem morfologia diferente, e a TV polimórfica é considerada sempre instável → \u003cstrong>desfibrilação imediata com choque não sincronizado de alta energia\u003c/strong>. Nas recorrências com \u003cstrong>QT longo (torsades)\u003c/strong>, \u003cstrong>magnésio IV\u003c/strong>, suspensão de drogas que prolongam o QT e correção de distúrbios eletrolíticos; sem QT prolongado, \u003cstrong>lidocaína, amiodarona e tratamento da isquemia\u003c/strong>. \u003cstrong>Magnésio de rotina não é indicado com QT normal\u003c/strong> e \u003cstrong>adenosina não deve ser usada\u003c/strong> na TV polimórfica, pelo risco de degenerar em FV. Condutas compatíveis com a AHA 2025.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Mulher de 34 anos chega com palpitações e FC 190 bpm. O monitor mostra taquicardia \u003cstrong>regular de QRS estreito, sem ondas P\u003c/strong>, e ela está consciente, com PA 118/76. Após monitorização e acesso venoso, qual é a próxima conduta?","a":["Cardioversão sincronizada imediata, com sedação se possível","Manobras vagais e, se falharem, adenosina em bolus rápido","Adenosina na dose de 12 mg de entrada, repetida uma vez","Amiodarona intravenosa como primeira medida antiarrítmica"],"c":1,"e":"Taquicardia regular de QRS estreito no paciente estável segue a sequência manobras vagais e depois adenosina, que é a droga inicial desse cenário. A dose inicial é 6 mg em bolus rápido, e não 12 mg de entrada; a cardioversão sincronizada fica reservada para instabilidade; e a amiodarona não é a primeira escolha nessa taquicardia."},{"n":"🟢","levelName":"basico","q":"Homem de 62 anos com taquicardia de QRS largo e regular, FC 165 bpm, PA 72/40 mmHg, sudorese e sonolência. Qual é a conduta imediata?","a":["Adenosina 6 mg em bolus rápido, seguida de flush de 20 mL de soro","Desfibrilação imediata com choque não sincronizado de alta energia","Cardioversão sincronizada, com sedação se houver tempo e condições","Amiodarona 150 mg intravenosa e reavaliação do ritmo em 10 minutos"],"c":2,"e":"Hipotensão com rebaixamento em taquicardia de QRS largo define instabilidade, e a conduta é a cardioversão sincronizada, com sedação se houver tempo e condições. A desfibrilação não sincronizada fica para ritmos sem QRS confiável, como a TV polimórfica; a adenosina não deve ser usada no paciente instável; e a amiodarona não pode atrasar o choque."},{"n":"🟡","levelName":"intermediario","q":"A taquicardia regular de QRS estreito não converte com manobras vagais. Qual é o esquema correto de adenosina?","a":["6 mg IV em bolus de 1–3 s e flush de 20 mL; se falhar, 12 mg","6 mg IV em infusão lenta de 1–2 minutos, sem dose de ataque","12 mg IV em bolus rápido, com flush de 20 mL, repetidos uma vez","3 mg IV em bolus inicial, repetidos a cada 2 minutos se preciso"],"c":0,"e":"A adenosina é a droga inicial da taquicardia regular de QRS estreito, e o esquema é 6 mg em bolus IV rápido de 1–3 s seguido de flush de 20 mL, subindo para 12 mg se não converter, dose que pode ser repetida uma vez. Começar com 12 mg, infundir lentamente ou usar 3 mg não corresponde ao esquema descrito. A dose cai à metade em dipiridamol, carbamazepina, transplantados e via central."},{"n":"🟡","levelName":"intermediario","q":"Sobre as manobras vagais na taquicardia supraventricular, qual afirmação está correta?","a":["A massagem carotídea bilateral simultânea é a técnica de rotina","Elevação passiva das pernas durante a Valsalva ajuda a converter","As manobras vagais costumam converter a maioria dos flutters atriais","A Valsalva deve durar 60 segundos e pode ser repetida sem limite"],"c":1,"e":"A elevação passiva das pernas durante a manobra é recomendada e aumenta a probabilidade de conversão. A massagem do seio carotídeo é feita um lado por vez, nunca bilateral, e a Valsalva dura cerca de 15 segundos, com limite de tentativas; além disso, FA e flutter geralmente não convertem com vagais — as manobras podem, no máximo, revelar o ritmo."},{"n":"🟡","levelName":"intermediario","q":"Paciente com fibrilação atrial de início desconhecido, estável, programada cardioversão eletiva. O que a duração maior que 48 h (ou desconhecida) exige?","a":["Iniciar adenosina em bolus e reavaliar a necessidade de choque","Cardioverter de imediato, pois está bem e sem instabilidade","Anticoagular apenas depois do choque, conforme o ritmo final","Anticoagulação antes da cardioversão e mantida por 4 semanas"],"c":3,"e":"FA com mais de 48 horas ou duração desconhecida exige anticoagulação antes da cardioversão e por pelo menos 4 semanas depois, pelo risco tromboembólico do retorno do ritmo. Estar estável e sem instabilidade não dispensa essa etapa; anticoagular só após o choque inverte a proteção; e a adenosina não converte fibrilação atrial."},{"n":"🟡","levelName":"intermediario","q":"Taquicardia irregular com ondas P de pelo menos três morfologias distintas, em paciente com hipóxia e distúrbio eletrolítico. Qual é a conduta?","a":["Tratar a causa de base e, se preciso, controlar a frequência","Cardioversão sincronizada elétrica para restaurar o ritmo sinusal","Adenosina 6 mg em bolus rápido para interromper o ritmo atrial","Manobras vagais seguidas de verapamil se não houver conversão"],"c":0,"e":"O quadro é uma taquicardia atrial multifocal, que não responde a manobras vagais, adenosina nem cardioversão — o tratamento é corrigir a causa de base, como hipóxia e distúrbios eletrolíticos, e controlar a frequência quando necessário (metoprolol, evitado em FEVE prejudicada ou broncoespasmo, quando a amiodarona pode ser preferida). Insistir em adenosina, choque elétrico ou vagais não resolve e retarda o tratamento da causa."},{"n":"🔴","levelName":"avancado","q":"TV monomórfica sustentada, QRS largo e regular, paciente estável, com acesso venoso. Qual opção reúne fármacos de primeira linha para terminar o ritmo?","a":["Lidocaína intravenosa isolada, por ser a opção mais eficaz","Verapamil intravenoso, pela ação rápida sobre o QRS largo","Procainamida, amiodarona ou sotalol, sob monitorização","Adenosina em dose alta, repetida até a reversão do ritmo"],"c":2,"e":"Na TV monomórfica estável, procainamida, amiodarona e sotalol são as opções de primeira linha, com o paciente monitorizado e o especialista consultado antes de associar drogas. A lidocaína é segunda linha, menos eficaz; o verapamil é contraindicado na taquicardia de QRS largo; e a adenosina tem papel diagnóstico na taquicardia monomórfica regular, pois geralmente não termina a TV."},{"n":"🔴","levelName":"avancado","q":"Paciente com TV polimórfica, hipotensão e rebaixamento do nível de consciência; o monitor mostra QRS de morfologia variável. Qual é a conduta imediata?","a":["Cardioversão sincronizada em 100 J, após sedação adequada","Magnésio IV de rotina, seguido de cardioversão sincronizada","Adenosina 6 mg em bolus rápido, antes do choque elétrico","Desfibrilação com choque não sincronizado de alta energia"],"c":3,"e":"TV polimórfica é sempre considerada instável, e o QRS de morfologia variável não permite sincronização confiável — a conduta é a desfibrilação imediata com choque não sincronizado de alta energia. A sedação não pode atrasar o choque, a adenosina é contraindicada por risco de degenerar em fibrilação ventricular, e o magnésio não é de rotina: ele fica para as torsades de pointes associadas a QT longo."}]},{"id":"06","fullTitle":"06 — Cuidados pós-parada e causas reversíveis","shortTitle":"Cuidados pós-parada e causas reversíveis","subtitle":"Depois do RCE: oxigenar sem intoxicar, sustentar a pressão, controlar a temperatura, caçar a causa reversível — e só então falar de prognóstico.","toc":[{"id":"sec-1-síndrome-pós-parada-cardíaca","title":"1. Síndrome pós-parada cardíaca"},{"id":"sec-2-oxigenação-e-ventilação","title":"2. Oxigenação e ventilação"},{"id":"sec-3-hemodinâmica","title":"3. Hemodinâmica"},{"id":"sec-4-ecg-e-angiografia-coronária","title":"4. ECG e angiografia coronária"},{"id":"sec-5-controle-direcionado-de-temperatura","title":"5. Controle direcionado de temperatura"},{"id":"sec-6-glicemia-convulsões-e-eeg","title":"6. Glicemia, convulsões e EEG"},{"id":"sec-7-prognóstico-multimodal","title":"7. Prognóstico multimodal"},{"id":"sec-8-reabilitação-e-recuperação","title":"8. Reabilitação e recuperação"},{"id":"sec-9-causas-reversíveis-os-hs-e-ts","title":"9. Causas reversíveis: os Hs e Ts"},{"id":"sec-10-resumo-de-bolso","title":"10. Resumo de bolso"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-síndrome-pós-parada-cardíaca\">\u003ch2>1. Síndrome pós-parada cardíaca\u003c/h2>\u003ch3 id=\"h-1-1-os-quatro-componentes\">1.1 Os quatro componentes\u003c/h3>\n\u003cp>O \u003cstrong>RCE\u003c/strong> (retorno da circulação espontânea) não encerra o problema: inaugura uma síndrome com quatro componentes que puxam o manejo em direções diferentes.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lesão cerebral hipóxica\u003c/strong> — o cérebro é o órgão mais sensível ao tempo de parada; é o que justifica o peso do controle de temperatura, da glicemia e da vigilância de convulsões.\u003c/li>\u003cli>\u003cstrong>Disfunção miocárdica\u003c/strong> — o coração pode ficar atordoado mesmo depois de a causa ser tratada, o que ajuda a explicar a hipotensão precoce.\u003c/li>\u003cli>\u003cstrong>Resposta de isquemia/reperfusão sistêmica\u003c/strong> — a reperfusão de todos os territórios soma uma reação sistêmica à instabilidade.\u003c/li>\u003cli>\u003cstrong>Causa precipitante persistente\u003c/strong> — a causa que levou à parada (um H ou um T) pode continuar ativa e levar a uma nova parada: procurar e tratar é parte do cuidado pós-parada, não etapa encerrada.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-as-metas-iniciais-em-um-quadro\">1.2 As metas iniciais em um quadro\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Parâmetro\u003c/th>\u003cth>Meta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Oxigenação\u003c/td>\u003ctd>O2 a 100% até mensuração confiável; depois \u003cstrong>SpO2 90–98%\u003c/strong> (PaO2 60–105)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ventilação\u003c/td>\u003ctd>\u003cstrong>PaCO2 35–45 mmHg\u003c/strong>; com via aérea avançada, \u003cstrong>10 ventilações/min\u003c/strong> (1 a cada 6 s)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pressão arterial\u003c/td>\u003ctd>\u003cstrong>PAS &gt; 90 mmHg\u003c/strong> e \u003cstrong>PAM ≥ 65 mmHg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Temperatura\u003c/td>\u003ctd>Estratégia protocolizada \u003cstrong>32–37,5 °C\u003c/strong> por \u003cstrong>≥ 36 h\u003c/strong> em quem não responde a comandos; evitar febre\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicemia\u003c/td>\u003ctd>\u003cstrong>150–180 mg/dL\u003c/strong> (evitar &lt; 70 e &gt; 180)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A diretriz de 2025 atualiza dois números em relação ao material didático: oxigenação em \u003cstrong>90–98%\u003c/strong> (não 92–98%) e temperatura em \u003cstrong>32–37,5 °C por ≥ 36 h\u003c/strong> (não 32–36 °C por ≥ 24 h). É a versão usada neste tema.\u003c/p>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-oxigenação-e-ventilação\">\u003ch2>2. Oxigenação e ventilação\u003c/h2>\u003cul>\u003cli>\u003cstrong>O2 a 100% até poder medir.\u003c/strong> Enquanto a oximetria ou a gasometria não forem confiáveis, mantém-se a maior concentração inspirada; a partir da medida confiável, o oxigênio é \u003cstrong>titulado para SpO2 90–98%\u003c/strong> (PaO2 60–105) — nem hipóxia, nem exposição desnecessária à hiperóxia.\u003c/li>\u003cli>\u003cstrong>PaCO2 35–45 mmHg.\u003c/strong> Com via aérea avançada, \u003cstrong>1 ventilação a cada 6 s\u003c/strong> (10/min), evitando ventilação excessiva.\u003c/li>\u003cli>\u003cstrong>Via aérea:\u003c/strong> considerar \u003cstrong>IOT precoce\u003c/strong>; confirmar e monitorar a posição do tubo com \u003cstrong>capnografia\u003c/strong> (onda contínua ou capnometria); radiografia de tórax após a intubação; \u003cstrong>cabeceira elevada a 30°\u003c/strong> se tolerado.\u003c/li>\u003cli>A avaliação neurológica é mais confiável \u003cstrong>sem sedação e sem bloqueio neuromuscular\u003c/strong> — quando possível, evite-os nas primeiras horas.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-hemodinâmica\">\u003ch2>3. Hemodinâmica\u003c/h2>\u003cul>\u003cli>\u003cstrong>Definição e meta:\u003c/strong> hipotensão é \u003cstrong>PAS &lt; 90 mmHg ou PAM &lt; 65 mmHg\u003c/strong>; a meta é \u003cstrong>PAS &gt; 90\u003c/strong> e \u003cstrong>PAM ≥ 65\u003c/strong>. A atualização de 2025 reforça: \u003cstrong>evitar hipotensão\u003c/strong>, mantendo \u003cstrong>PAM ≥ 65 mmHg\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Primeiro passo — volume:\u003c/strong> \u003cstrong>cristaloide IV/IO 1–2 L\u003c/strong>. Antes de subir droga, revisar causas de hipotensão que pedem outra conduta (sangramento, tamponamento, pneumotórax, causa obstrutiva).\u003c/li>\u003cli>\u003cstrong>Se persistir — vasopressor/inotrópico:\u003c/strong>\u003cul>\u003cli>\u003cstrong>Norepinefrina 0,1–0,5 mcg/kg/min\u003c/strong> — preferir veia central ou de grosso calibre; monitorar a PA a cada 2–3 min até estabilizar e depois a cada 5 min; reduzir gradualmente.\u003c/li>\u003cli>\u003cstrong>Epinefrina 2–10 mcg/min\u003c/strong> (a tabela de medicamentos cita também \u003cstrong>0,1–0,5 mcg/kg/min\u003c/strong> para a hipotensão pós-parada).\u003c/li>\u003cli>\u003cstrong>Dopamina 5–20 mcg/kg/min\u003c/strong> — corrigir a hipovolemia antes; extravasamento causa necrose; reduzir gradualmente.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Choque cardiogênico refratário:\u003c/strong> em casos altamente selecionados, a AHA 2025 considera \u003cstrong>suporte circulatório mecânico temporário\u003c/strong> (novo).\u003c/li>\u003cli>Isquemia e síndrome coronariana aguda têm tema próprio; aqui valem a regra do ECG e a indicação de angiografia da seção seguinte.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-ecg-e-angiografia-coronária\">\u003ch2>4. ECG e angiografia coronária\u003c/h2>\u003cul>\u003cli>\u003cstrong>ECG de 12 derivações o mais rápido possível\u003c/strong> depois do RCE. A AHA 2025 considera ECG e imagem (TC/ultrassom) aceitáveis nessa fase (novo).\u003c/li>\u003cli>\u003cstrong>Intervenção cardíaca de emergência\u003c/strong> quando houver \u003cstrong>STEMI\u003c/strong>, \u003cstrong>choque cardiogênico instável\u003c/strong> ou \u003cstrong>necessidade de suporte circulatório mecânico\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Angiografia coronária emergencial:\u003c/strong>\u003cul>\u003cli>\u003cstrong>recomendada\u003c/strong> quando a causa provável é cardíaca \u003cstrong>com supradesnivelamento de ST\u003c/strong>;\u003c/li>\u003cli>\u003cstrong>razoável\u003c/strong> no paciente \u003cstrong>instável\u003c/strong> (elétrica ou hemodinamicamente) e no \u003cstrong>comatoso sem STE\u003c/strong>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Número de prova:\u003c/strong> entre sobreviventes de \u003cstrong>TVp/FV com STE\u003c/strong>, doença arterial coronária em \u003cstrong>70–85%\u003c/strong>; \u003cstrong>&gt; 90%\u003c/strong> de sucesso quando a ICP é bem-sucedida.\u003c/li>\u003cli>\u003cstrong>AHA 2025 (atualização):\u003c/strong> considerar \u003cstrong>angiografia coronária antes da alta\u003c/strong> no sobrevivente com suspeita de etiologia cardíaca — especialmente \u003cstrong>ritmo inicial chocável\u003c/strong>, \u003cstrong>disfunção sistólica de VE sem explicação\u003c/strong> ou \u003cstrong>isquemia miocárdica grave\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-controle-direcionado-de-temperatura\">\u003ch2>5. Controle direcionado de temperatura\u003c/h2>\u003cul>\u003cli>\u003cstrong>Quem:\u003c/strong> quem \u003cstrong>não responde a comandos\u003c/strong> após o RCE — na formulação clássica, OHCA com qualquer ritmo inicial e PCIH com ritmo chocável.\u003c/li>\u003cli>\u003cstrong>Meta (AHA 2025):\u003c/strong> estratégia deliberada e protocolizada entre \u003cstrong>32 °C e 37,5 °C\u003c/strong>, mantida por \u003cstrong>≥ 36 h\u003c/strong>. Duas faixas válidas: \u003cstrong>hipotermia 32–34 °C\u003c/strong> ou \u003cstrong>normotermia com prevenção de febre 36–37,5 °C\u003c/strong>. Materiais mais antigos indicavam 32–36 °C por ≥ 24 h — vale a versão atual.\u003c/li>\u003cli>\u003cstrong>Evitar febre\u003c/strong> em todos; \u003cstrong>resfriamento pré-hospitalar de rotina não é recomendado\u003c/strong>.\u003c/li>\u003cli>Em paralelo: cuidado intensivo, \u003cstrong>EEG\u003c/strong>, investigação etiológica (angiografia quando apropriada) e preparação do \u003cstrong>prognóstico multimodal\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-glicemia-convulsões-e-eeg\">\u003ch2>6. Glicemia, convulsões e EEG\u003c/h2>\u003cul>\u003cli>\u003cstrong>Glicemia:\u003c/strong> manter \u003cstrong>150–180 mg/dL\u003c/strong> (abordagem da população gravemente doente); a AHA 2025 formula o alvo como \u003cstrong>evitar glicose &lt; 70 e &gt; 180 mg/dL\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Convulsões devem ser tratadas\u003c/strong> — opções citadas: \u003cstrong>valproato, levetiracetam, fosfenitoína, propofol, midazolam\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>EEG contínuo ou intermitente\u003c/strong> em quem não responde a comandos; é o EEG que dá sentido à mioclonia.\u003c/li>\u003cli>\u003cstrong>Mioclonia sem correlato no EEG: tratamento não recomendado\u003c/strong> (AHA 2025 — o risco de efeitos colaterais supera o benefício desconhecido).\u003c/li>\u003cli>\u003cstrong>Imagem:\u003c/strong> TC de crânio (conduta clássica); a AHA 2025 considera \u003cstrong>TC de cabeça até a pelve\u003c/strong> aceitável após o RCE (novo) e cita \u003cstrong>ultrassom/eco à beira do leito\u003c/strong> (novo). Na sequência de cuidados intensivos, a diretriz cita \u003cstrong>considerar antibióticos\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-prognóstico-multimodal\">\u003ch2>7. Prognóstico multimodal\u003c/h2>\u003cul>\u003cli>Em quem \u003cstrong>não segue comandos\u003c/strong>, o neuroprognóstico é \u003cstrong>multimodal\u003c/strong> e com \u003cstrong>impressões retardadas\u003c/strong>: só após \u003cstrong>≥ 72 h do RCE ou da normotermia\u003c/strong>.\u003c/li>\u003cli>Antes disso, afastar confundidores: \u003cstrong>sedação\u003c/strong>, \u003cstrong>bloqueio neuromuscular\u003c/strong> (avaliar sem eles quando possível), temperatura e distúrbios metabólicos.\u003c/li>\u003cli>\u003cstrong>Apoia prognóstico favorável:\u003c/strong> \u003cstrong>EEG contínuo com atividade de base e sem descargas nas primeiras 72 h\u003c/strong> (AHA 2025, novo).\u003c/li>\u003cli>\u003cstrong>Biomarcador:\u003c/strong> a \u003cstrong>cadeia leve de neurofilamento\u003c/strong> foi adicionada como biomarcador sérico (AHA 2025).\u003c/li>\u003cli>\u003cstrong>Nunca concluir por achado isolado\u003c/strong> — exame neurológico precoce, EEG de um único momento ou mioclonia sem correlato não decidem prognóstico. Se a família perguntar antes da janela, explique a espera e a avaliação seriada.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-reabilitação-e-recuperação\">\u003ch2>8. Reabilitação e recuperação\u003c/h2>\u003cul>\u003cli>\u003cstrong>AHA 2025 (novo):\u003c/strong> sistemas integrados que \u003cstrong>avaliam antes da alta\u003c/strong>, \u003cstrong>reavaliam necessidades\u003c/strong> e \u003cstrong>suprem de forma contínua\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Antes da alta:\u003c/strong> \u003cstrong>avaliação estruturada e encaminhamento para apoio\u003c/strong> em sofrimento emocional (atualização) — cerca de \u003cstrong>1/4\u003c/strong> dos sobreviventes apresentam sofrimento emocional; cuidadores também entram no cuidado.\u003c/li>\u003cli>Necessidades \u003cstrong>físicas, cognitivas e emocionais\u003c/strong> devem ser reavaliadas ao longo da recuperação.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-9-causas-reversíveis-os-hs-e-ts\">\u003ch2>9. Causas reversíveis: os Hs e Ts\u003c/h2>\u003cp>Revisar causas reversíveis não é só tarefa de RCP: a \u003cstrong>causa precipitante persistente\u003c/strong> é um dos componentes da síndrome pós-parada e pode desencadear nova parada. Volte à lista a cada ciclo e depois do RCE.\u003c/p>\n\u003ch3 id=\"h-9-1-os-5-h\">9.1 Os 5 H\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>H\u003c/th>\u003cth>Conduta citada\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Hipovolemia\u003c/strong>\u003c/td>\u003ctd>reposição volêmica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hipóxia\u003c/strong>\u003c/td>\u003ctd>oxigenação/ventilação eficazes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Íon hidrogênio (acidose)\u003c/strong>\u003c/td>\u003ctd>tratar a causa; bicarbonato em circunstâncias específicas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hipo/hipercalemia\u003c/strong>\u003c/td>\u003ctd>hipocalemia: reposição de potássio; hipercalemia: cálcio e/ou bicarbonato IV, insulina IV com glicose, beta-agonistas, hemodiálise\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hipotermia\u003c/strong>\u003c/td>\u003ctd>reaquecimento guiado pela temperatura central; na PCR por hipotermia, considerar reaquecimento com ECLS (escores HOPE e ICE); \u003cstrong>&lt; 28 °C sem PCR\u003c/strong> pode ser aceitável reaquecer com ECLS (AHA 2025)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Na hipercalemia, a AHA 2025 ressalva que a \u003cstrong>eficácia do cálcio IV não está bem estabelecida\u003c/strong>: usar com cautela, sem desviar das intervenções que salvam (RCP de qualidade, desfibrilação, epinefrina).\u003c/p>\n\u003ch3 id=\"h-9-2-os-5-t\">9.2 Os 5 T\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>T\u003c/th>\u003cth>Conduta citada\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tamponamento cardíaco\u003c/strong>\u003c/td>\u003ctd>pericardiocentese\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Pneumotórax hipertensivo\u003c/strong>\u003c/td>\u003ctd>descompressão por agulha / toracostomia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Toxinas\u003c/strong>\u003c/td>\u003ctd>antídotos na seção 9.3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Trombose pulmonar\u003c/strong>\u003c/td>\u003ctd>fibrinólise / embolectomia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Trombose coronária\u003c/strong>\u003c/td>\u003ctd>angiografia emergencial\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-9-3-toxinas-e-antídotos\">9.3 Toxinas e antídotos\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Toxina\u003c/th>\u003cth>Antídoto e medidas citadas\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Betabloqueador\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>glucagon IV\u003c/strong>; insulina em alta dose com glicose; cálcio; ECMO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bloqueador de cálcio\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>cálcio IV\u003c/strong>; insulina em alta dose com glicose; glucagon; ECMO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Digoxina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>anticorpos Fab\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Antidepressivo tricíclico\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>bicarbonato de sódio IV\u003c/strong>; ECMO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Opioide\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>naloxona\u003c/strong> — 0,04–0,4 mg IV/IM/IO/SC a cada 2–3 min, ou 2 mg intranasal a cada 3–5 min; o efeito do opioide costuma durar mais que o da naloxona → repetir ou infundir e monitorar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>AHA 2025 (overdose de opioides): leigos e treinados podem administrar o antagonista na PCR com suspeita de overdose, desde que não atrapalhe a RCP com ventilações; \u003cstrong>na alta\u003c/strong>, oferecer naloxona e instruções a quem foi tratado por overdose.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-10-resumo-de-bolso\">\u003ch2>10. Resumo de bolso\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Número ou conduta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Oxigênio\u003c/td>\u003ctd>100% até medida confiável → \u003cstrong>SpO2 90–98%\u003c/strong> (PaO2 60–105)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ventilação\u003c/td>\u003ctd>\u003cstrong>PaCO2 35–45\u003c/strong>; \u003cstrong>10/min\u003c/strong> (1 a cada 6 s)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pressão\u003c/td>\u003ctd>\u003cstrong>PAS &gt; 90\u003c/strong> e \u003cstrong>PAM ≥ 65\u003c/strong>; cristaloide \u003cstrong>1–2 L\u003c/strong> antes do vasopressor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vasopressores\u003c/td>\u003ctd>norepinefrina \u003cstrong>0,1–0,5 mcg/kg/min\u003c/strong>; epinefrina \u003cstrong>2–10 mcg/min\u003c/strong>; dopamina \u003cstrong>5–20 mcg/kg/min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Temperatura\u003c/td>\u003ctd>\u003cstrong>32–37,5 °C\u003c/strong> por \u003cstrong>≥ 36 h\u003c/strong> em quem não responde a comandos; evitar febre\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glicemia\u003c/td>\u003ctd>\u003cstrong>150–180 mg/dL\u003c/strong> (evitar &lt; 70 e &gt; 180)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Angiografia\u003c/td>\u003ctd>\u003cstrong>recomendada\u003c/strong> com STE; \u003cstrong>razoável\u003c/strong> se instável ou comatoso sem STE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Antídotos\u003c/td>\u003ctd>BB→glucagon; BCC→cálcio; digoxina→Fab; ADT→bicarbonato; opioide→naloxona\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Paciente intubado logo após o RCE, com oximetria ainda instável. Como conduzir o oxigênio e a ventilação, e quais são os alvos depois da mensuração confiável?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Manter \u003cstrong>O2 a 100%\u003c/strong> até obter oximetria ou gasometria confiáveis; depois \u003cstrong>titular para SpO2 90–98%\u003c/strong> (PaO2 60–105), evitando hipóxia e exposição prolongada à hiperóxia. Ventilar para \u003cstrong>PaCO2 35–45 mmHg\u003c/strong>, com \u003cstrong>10 ventilações/min\u003c/strong> (1 a cada 6 s) e sem ventilação excessiva. Confirmar o tubo com \u003cstrong>capnografia\u003c/strong>, pedir radiografia de tórax e manter a \u003cstrong>cabeceira elevada a 30°\u003c/strong> se tolerado.\u003c/p>"},{"titleHtml":"🟢 Após o RCE, o paciente está com PAS 82 mmHg e PAM 58 mmHg. Qual é a meta pressórica e a sequência de tratamento inicial?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Meta de \u003cstrong>PAS &gt; 90 mmHg\u003c/strong> e \u003cstrong>PAM ≥ 65 mmHg\u003c/strong> (a atualização de 2025 reforça: evitar hipotensão). Começar com \u003cstrong>cristaloide IV/IO 1–2 L\u003c/strong>; se a hipotensão persistir, vasopressor ou inotrópico: \u003cstrong>norepinefrina 0,1–0,5 mcg/kg/min\u003c/strong> (preferir veia central/grande), \u003cstrong>epinefrina 2–10 mcg/min\u003c/strong> ou \u003cstrong>dopamina 5–20 mcg/kg/min\u003c/strong>, titulando e monitorando a pressão. Buscar a causa da hipotensão — sangramento, tamponamento, pneumotórax e outras causas dos Hs e Ts.\u003c/p>"},{"titleHtml":"🟡 Quem entra no controle direcionado de temperatura, com qual meta, por quanto tempo — e o que a febre exige?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Quem \u003cstrong>não responde a comandos\u003c/strong> após o RCE (na formulação clássica, OHCA com qualquer ritmo inicial e PCIH com ritmo chocável). Estratégia deliberada e protocolizada com meta entre \u003cstrong>32 °C e 37,5 °C\u003c/strong>, mantida por \u003cstrong>≥ 36 h\u003c/strong>: \u003cstrong>hipotermia 32–34 °C\u003c/strong> ou \u003cstrong>normotermia com prevenção de febre 36–37,5 °C\u003c/strong>. \u003cstrong>Evitar febre\u003c/strong> em todos; \u003cstrong>resfriamento pré-hospitalar de rotina não é recomendado\u003c/strong>. Materiais mais antigos indicavam 32–36 °C por ≥ 24 h — vale a versão atual (AHA 2025).\u003c/p>"},{"titleHtml":"🟡 No pós-RCE, quando estão indicados o ECG e a angiografia coronária — inclusive no paciente comatoso sem STE?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>ECG de 12 derivações o mais rápido possível\u003c/strong>; intervenção cardíaca de emergência se \u003cstrong>STEMI\u003c/strong>, choque cardiogênico instável ou necessidade de suporte circulatório mecânico. \u003cstrong>Angiografia coronária emergencial\u003c/strong>: recomendada quando há suspeita de causa cardíaca \u003cstrong>com STE\u003c/strong>; \u003cstrong>razoável\u003c/strong> no paciente instável e no \u003cstrong>comatoso sem STE\u003c/strong>. Entre sobreviventes de TVp/FV com STE, doença arterial coronária em \u003cstrong>70–85%\u003c/strong>, com \u003cstrong>&gt; 90%\u003c/strong> de sucesso quando a ICP é bem-sucedida. A AHA 2025 acrescenta a angiografia antes da alta na suspeita de etiologia cardíaca (ritmo chocável, disfunção de VE sem explicação, isquemia grave).\u003c/p>"},{"titleHtml":"🟡 Quais são os cuidados com glicemia, convulsões e EEG no paciente que não responde a comandos?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Manter glicemia \u003cstrong>150–180 mg/dL\u003c/strong>, evitando \u003cstrong>&lt; 70 e &gt; 180 mg/dL\u003c/strong> (AHA 2025). \u003cstrong>Convulsões devem ser tratadas\u003c/strong> — opções citadas: valproato, levetiracetam, fosfenitoína, propofol e midazolam. \u003cstrong>EEG contínuo ou intermitente\u003c/strong> para monitorar; a \u003cstrong>mioclonia sem correlato no EEG não deve ser tratada\u003c/strong> (AHA 2025). Imagem: TC de crânio; a AHA 2025 considera TC de cabeça até a pelve aceitável e cita ultrassom/eco à beira do leito.\u003c/p>"},{"titleHtml":"🟡 Como conduzir o neuroprognóstico de quem não segue comandos — e o que a diretriz de 2025 destaca sobre a recuperação?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Neuroprognóstico \u003cstrong>multimodal\u003c/strong>, com \u003cstrong>impressões retardadas\u003c/strong>: só após \u003cstrong>≥ 72 h do RCE ou da normotermia\u003c/strong>, afastando confundidores como sedação e bloqueio neuromuscular (avaliar sem eles quando possível). Apoia prognóstico favorável o \u003cstrong>EEG contínuo com atividade de base e sem descargas nas primeiras 72 h\u003c/strong>; a \u003cstrong>cadeia leve de neurofilamento\u003c/strong> foi adicionada como biomarcador sérico. Nunca concluir por achado isolado. Na recuperação, a AHA 2025 destaca \u003cstrong>sistemas integrados de reabilitação\u003c/strong> que avaliam antes da alta, reavaliam necessidades e suprem de forma contínua, além de \u003cstrong>avaliação estruturada e apoio emocional antes da alta\u003c/strong> — cerca de \u003cstrong>1/4\u003c/strong> dos sobreviventes têm sofrimento emocional.\u003c/p>"},{"titleHtml":"🔴 Quais são os 5 H e os 5 T, e quais condutas são citadas para hipotermia, tamponamento e tromboses?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>5 H:\u003c/strong> hipovolemia, hipóxia, íon hidrogênio (acidose), hipo/hipercalemia e hipotermia. \u003cstrong>5 T:\u003c/strong> tamponamento cardíaco, pneumotórax hipertensivo, toxinas, trombose pulmonar e trombose coronária. Condutas: \u003cstrong>hipotermia\u003c/strong> → reaquecimento guiado pela temperatura central (na PCR por hipotermia, reaquecimento com ECLS, com os escores HOPE e ICE como os mais validados; &lt; 28 °C sem PCR pode ser aceitável com ECLS); \u003cstrong>tamponamento\u003c/strong> → pericardiocentese; \u003cstrong>trombose pulmonar\u003c/strong> → fibrinólise ou embolectomia; \u003cstrong>trombose coronária\u003c/strong> → angiografia emergencial. Para a hipercalemia, as medidas citadas são cálcio e/ou bicarbonato IV, insulina IV com glicose, beta-agonistas e hemodiálise.\u003c/p>"},{"titleHtml":"🔴 Parada com suspeita de intoxicação: quais antídotos são citados para betabloqueador, bloqueador de cálcio, digoxina, antidepressivo tricíclico e opioide?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Betabloqueador\u003c/strong> → \u003cstrong>glucagon IV\u003c/strong> (e, como alternativas, insulina em alta dose com glicose, cálcio e ECMO). \u003cstrong>Bloqueador de cálcio\u003c/strong> → \u003cstrong>cálcio IV\u003c/strong> (com insulina em alta dose com glicose, glucagon e ECMO). \u003cstrong>Digoxina\u003c/strong> → \u003cstrong>anticorpos Fab\u003c/strong>. \u003cstrong>Antidepressivo tricíclico\u003c/strong> → \u003cstrong>bicarbonato de sódio IV\u003c/strong> (e ECMO). \u003cstrong>Opioide\u003c/strong> → \u003cstrong>naloxona\u003c/strong>, 0,04–0,4 mg IV/IM/IO/SC a cada 2–3 min ou 2 mg intranasal a cada 3–5 min; como o efeito do opioide pode durar mais que o da naloxona, repetir ou infundir e monitorar.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Após o \u003cstrong>RCE\u003c/strong>, o paciente está intubado e a oximetria ainda não é confiável. Qual é a conduta com o oxigênio e a meta depois da mensuração?","a":["Titular desde o início para SpO2 entre 88% e 92%, sem hiperóxia","Manter O2 a 100% por 24 horas, sem titular a fração inspirada","Manter O2 a 100% e depois titular para SpO2 entre 90% e 98%","Usar ar ambiente desde que a saturação fique acima de 94%"],"c":2,"e":"O oxigênio a 100% é mantido só até haver oximetria ou gasometria confiáveis; depois a titulação busca \u003cstrong>SpO2 90–98%\u003c/strong> (PaO2 60–105), evitando hipóxia e exposição desnecessária à hiperóxia. Manter fração de 100% por 24 horas fixas ou titular desde o início para 88–92% são metas que não correspondem ao alvo descrito. Ar ambiente com saturação acima de 94% também não traduz a estratégia recomendada."},{"n":"🟢","levelName":"basico","q":"Após o RCE, o paciente está hipotenso, com \u003cstrong>PAS de 82 mmHg\u003c/strong>. Qual é a conduta inicial e a meta pressórica?","a":["Cristaloide 1–2 L e meta de PAS &gt; 90 e PAM ≥ 65 mmHg","Norepinefrina de imediato, com meta de PAM ≥ 65 mmHg","Cristaloide 1–2 L e meta de PAS &gt; 120 e PAM &gt; 90 mmHg","Cristaloide 1–2 L e meta de PAS ≥ 140 e PAM ≥ 90 mmHg"],"c":0,"e":"A hipotensão pós-parada é definida por PAS &lt; 90 mmHg ou PAM &lt; 65 mmHg, e a correção começa com cristaloide 1–2 L antes de partir para vasopressor. Persistindo, entram norepinefrina 0,1–0,5 mcg/kg/min, epinefrina 2–10 mcg/min ou dopamina 5–20 mcg/kg/min. Metas de PAS &gt; 120 com PAM &gt; 90, ou PAS ≥ 140 com PAM ≥ 90, vão além do alvo citado, e começar por vasopressor sem volume não segue a sequência descrita."},{"n":"🟡","levelName":"intermediario","q":"Paciente de 58 anos, comatoso e \u003cstrong>sem seguir comandos\u003c/strong> após RCE de PCR extra-hospitalar com FV inicial. Qual é a estratégia de temperatura?","a":["Resfriamento pré-hospitalar de rotina com meta fixa de 33 °C","Controle protocolizado entre 32 e 37,5 °C por no mínimo 36 h","Hipotermia profunda entre 30 e 32 °C por 12 horas seguidas","Normotermia sem controle ativo, apenas monitorando a temperatura"],"c":1,"e":"A estratégia é deliberada e protocolizada: meta entre 32 °C e 37,5 °C, mantida por pelo menos 36 horas em quem não responde a comandos, seja na faixa hipotérmica (32–34 °C) ou na normotérmica com prevenção de febre (36–37,5 °C). Hipotermia profunda de 30–32 °C por 12 horas, resfriamento pré-hospitalar de rotina e apenas monitorar a temperatura sem controle ativo não correspondem à recomendação atual. O livro didático traz 32–36 °C por pelo menos 24 h; a diretriz de 2025 atualiza para 32–37,5 °C por pelo menos 36 h."},{"n":"🟡","levelName":"intermediario","q":"Sobrevivente de PCR com \u003cstrong>FV\u003c/strong> inicial segue comatoso, sem \u003cstrong>supradesnivelamento de ST\u003c/strong> no ECG. Qual é a conduta quanto à angiografia coronária?","a":["Indicada apenas se o ECG pós-RCE mostrar supradesnivelamento de ST","Contraindicada no coma, pelo risco de sangramento intracraniano","Adiada até o despertar, para definir a causa da parada primeiro","Razoável se instável ou comatoso sem STE, na suspeita cardíaca"],"c":3,"e":"A angiografia coronária emergencial é recomendada quando há supradesnivelamento de ST com suspeita de causa cardíaca, e é razoável no paciente instável e no comatoso sem STE. Entre sobreviventes de TVp/FV com STE, doença arterial coronária aparece em 70–85%, com mais de 90% de sucesso quando a ICP é bem-sucedida. Reservar o exame apenas ao STE, contraindica-lo no coma ou adiá-lo até o despertar não corresponde à recomendação; a AHA 2025 acrescenta a angiografia antes da alta na suspeita de etiologia cardíaca."},{"n":"🟡","levelName":"intermediario","q":"Parada cardíaca com suspeita de \u003cstrong>hipercalemia\u003c/strong>. Qual conjunto de medidas é citado para tratar a causa?","a":["Cálcio e/ou bicarbonato, insulina com glicose, beta-agonista","Pericardiocentese de emergência e expansão com cristaloide","Reposição de potássio e de magnésio, com correção da volemia","Naloxona e bicarbonato para reverter os efeitos da toxina"],"c":0,"e":"As medidas citadas para a hipercalemia na parada incluem cálcio e/ou bicarbonato IV, insulina IV com glicose, beta-agonistas e hemodiálise. Reposição de potássio e magnésio é a lógica da hipocalemia; pericardiocentese pertence ao tamponamento; e naloxona, à intoxicação por opioide. A AHA 2025 ressalva que a eficácia do cálcio não está bem estabelecida e que ele não deve desviar das intervenções que salvam, como RCP de qualidade e desfibrilação."},{"n":"🟡","levelName":"intermediario","q":"Parada cardíaca refratária com suspeita de \u003cstrong>intoxicação por betabloqueador\u003c/strong>. Qual antídoto é citado para essa toxina?","a":["Naloxona em bolus repetido até reverter o quadro","Bicarbonato de sódio IV, pelo efeito na condução","Glucagon IV, com insulina em alta dose e glicose","Anticorpos Fab, que revertem a toxina no miocárdio"],"c":2,"e":"Na intoxicação por betabloqueador, as medidas citadas são glucagon IV, insulina em alta dose com glicose, cálcio e ECMO. Naloxona, bicarbonato de sódio e anticorpos Fab pertencem a outras toxinas — opioide, antidepressivo tricíclico e digoxina, respectivamente. O bicarbonato também aparece em circunstâncias específicas de acidose, mas não como antídoto do betabloqueador."},{"n":"🔴","levelName":"avancado","q":"Paciente permanece \u003cstrong>comatoso 24 h após o RCE\u003c/strong>, com abalos mioclônicos. A família pergunta sobre o prognóstico. Qual é a conduta?","a":["Basear a decisão no EEG das primeiras 24 horas, que é definitivo","Definir o prognóstico agora, com base no exame neurológico isolado","Tratar a mioclonia sem correlato no EEG, pois melhora o prognóstico","Adiar a conclusão para pelo menos 72 h, com avaliação multimodal"],"c":3,"e":"O neuroprognóstico deve ser multimodal e com impressões retardadas: pelo menos 72 horas após o RCE ou a normotermia, quando os confundidores (sedação, bloqueio neuromuscular, temperatura) já podem ser afastados. EEG contínuo com atividade de base e sem descargas nas primeiras 72 horas pode apoiar prognóstico favorável, e a cadeia leve de neurofilamento foi adicionada como biomarcador. Concluir pelo exame isolado nas primeiras 24 horas ou tratar a mioclonia sem correlato no EEG não corresponde à recomendação — mioclonia sem descargas não deve ser tratada."},{"n":"🔴","levelName":"avancado","q":"Paciente comatoso após RCE apresenta \u003cstrong>crise convulsiva generalizada\u003c/strong>; o EEG mostra descargas epileptiformes. Qual é a conduta?","a":["Tratar a crise apenas se ela se repetir nas próximas horas","Tratar a crise, com EEG contínuo ou intermitente para monitorar","Tratar a crise com bloqueio neuromuscular e sedação profunda","Não tratar: crises isoladas no pós-parada não têm significado"],"c":1,"e":"A convulsão no pós-parada deve ser tratada — valproato, levetiracetam, fosfenitoína, propofol ou midazolam — com EEG contínuo ou intermitente para monitorar. Adiar o tratamento até novas crises ou usar apenas bloqueio neuromuscular com sedação não trata a crise. A ressalva de não tratar vale para a mioclonia sem correlato no EEG, que não é o cenário de uma crise com descargas epileptiformes."}]},{"id":"07","fullTitle":"07 — Síndromes coronárias agudas","shortTitle":"Síndromes coronárias agudas","subtitle":"A dor torácica que não pode esperar: classificar pelo ECG em minutos, tratar a isquemia e escolher a reperfusão no tempo certo. Estes são os números que decidem.","toc":[{"id":"sec-1-o-espectro-da-sca","title":"1. O espectro da SCA"},{"id":"sec-2-classificação-pelo-ecg-inicial-três-grupos-três-caminhos","title":"2. Classificação pelo ECG inicial: três grupos, três caminhos"},{"id":"sec-3-os-tempos-do-departamento-de-emergência","title":"3. Os tempos do departamento de emergência"},{"id":"sec-4-oxigênio-só-para-quem-está-hipoxêmico","title":"4. Oxigênio: só para quem está hipoxêmico"},{"id":"sec-5-terapias-farmacológicas","title":"5. Terapias farmacológicas"},{"id":"sec-6-reperfusão-a-decisão-que-muda-o-desfecho","title":"6. Reperfusão: a decisão que muda o desfecho"},{"id":"sec-7-infarto-do-ventrículo-direito-rvi","title":"7. Infarto do ventrículo direito (RVI)"},{"id":"sec-8-iam-a-classificação-que-mudou-em-2026","title":"8. IAM: a classificação que mudou em 2026"},{"id":"sec-9-resumo-de-bolso","title":"9. Resumo de bolso"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-o-espectro-da-sca\">\u003ch2>1. O espectro da SCA\u003c/h2>\u003cp>\u003cstrong>Síndrome coronariana aguda (SCA)\u003c/strong> é o guarda-chuva de três quadros com a mesma origem — isquemia miocárdica aguda por instabilidade de placa e trombose coronariana:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quadro\u003c/th>\u003cth>Marcador de necrose\u003c/th>\u003cth>ECG típico\u003c/th>\u003cth>Conduta central\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Angina instável\u003c/td>\u003ctd>negativo\u003c/td>\u003ctd>sem supra de ST\u003c/td>\u003ctd>estratificar risco\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NSTEMI\u003c/td>\u003ctd>positivo (troponina)\u003c/td>\u003ctd>sem supra de ST\u003c/td>\u003ctd>estratificar risco / estratégia invasiva\u003c/td>\u003c/tr>\u003ctr>\u003ctd>STEMI\u003c/td>\u003ctd>positivo\u003c/td>\u003ctd>\u003cstrong>supra de ST\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>reperfusão imediata\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Angina instável e NSTEMI diferem essencialmente pela presença de dano celular detectável (biomarcador elevado); o caminho inicial de avaliação é o mesmo.\u003c/li>\u003cli>O STEMI corresponde à oclusão completa de uma artéria coronária epicárdica, com isquemia transmural — é o grupo mais emergente e o único em que a fibrinólise pode ter papel.\u003c/li>\u003cli>Mais da metade dos pacientes com NSTE-ACS definido pode ter \u003cstrong>ECG inicial normal ou não diagnóstico\u003c/strong> — ECG normal não exclui SCA.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Apresentação clássica:\u003c/strong> dor retroesternal em aperto, pressão ou peso, com \u003cstrong>10 minutos ou mais\u003c/strong> de duração, em repouso ou com esforço mínimo, que pode irradiar para braço, mandíbula, costas ou epigástrio. Equivalentes anginosos: dispneia nova ou de esforço aumentada (o mais comum), fadiga inexplicável, sudorese, náuseas/vômitos e síncope.\u003c/p>\n\u003cp>\u003cstrong>Apresentação atípica\u003c/strong> (mais provável em idosos, diabéticos, mulheres, doença renal crônica, demência, cirurgia cardíaca prévia e pós-operatório imediato de cirurgia não cardíaca): dispneia, fraqueza, alteração do estado mental, síncope, náuseas inexplicáveis, dor no ombro ou nas costas e desconforto abdominal ou epigástrico. Mulheres podem ter sintomas prodrômicos por semanas e descrever o desconforto de forma diferente dos homens.\u003c/p>\n\u003cp>\u003cstrong>Tempo é músculo:\u003c/strong> o intervalo que importa é o \u003cstrong>tempo total de isquemia\u003c/strong> — do início dos sintomas até a reperfusão bem-sucedida. Toda a organização do atendimento existe para encurtá-lo.\u003c/p>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-classificação-pelo-ecg-inicial-três-grupos-três-caminhos\">\u003ch2>2. Classificação pelo ECG inicial: três grupos, três caminhos\u003c/h2>\u003cp>O ECG de 12 derivações é o exame que separa os pacientes em minutos:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Achado no ECG\u003c/th>\u003cth>Grupo\u003c/th>\u003cth>O que fazer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Supra de ST em ≥2 derivações contíguas\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>STEMI\u003c/strong>\u003c/td>\u003ctd>Avaliar reperfusão imediata — ICP primária ou fibrinólise, sem retardar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Infra de ST ou alterações transitórias de ST-T\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>NSTE-ACS de alto risco\u003c/strong> (NSTEMI/angina instável)\u003c/td>\u003ctd>Leito monitorado; estratégia invasiva precoce se alto risco\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ECG normal ou alterações inespecíficas\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Risco baixo/intermediário\u003c/strong>\u003c/td>\u003ctd>Observação (unidade de dor torácica) e ECGs seriados\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Supra em II, III e/ou aVF\u003c/strong> (parede inferior) obriga a avaliar \u003cstrong>infarto do ventrículo direito\u003c/strong> — a conduta muda (seção 7).\u003c/li>\u003cli>\u003cstrong>Infra de ST aparente em V1 e V2\u003c/strong> levanta a suspeita de infarto inferobasal — derivações posteriores podem ser necessárias.\u003c/li>\u003cli>Se o ECG inicial não é diagnóstico mas a suspeita clínica é alta, \u003cstrong>repetir o ECG em 5–10 minutos\u003c/strong> ou manter monitorização contínua do segmento ST.\u003c/li>\u003cli>No NSTE-ACS com troponina elevada ou alto risco, a estratégia invasiva precoce é considerada quando há dor isquêmica refratária, desvio de ST recorrente/persistente, taquicardia ventricular, instabilidade hemodinâmica ou sinais de insuficiência cardíaca.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-os-tempos-do-departamento-de-emergência\">\u003ch2>3. Os tempos do departamento de emergência\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Alvo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Avaliação inicial\u003c/td>\u003ctd>\u003cstrong>≤10 min\u003c/strong> da chegada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ECG de 12 derivações revisado\u003c/td>\u003ctd>\u003cstrong>em 10 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Laboratório inicial (biomarcadores, eletrólitos, coagulação)\u003c/td>\u003ctd>\u003cstrong>10 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Radiografia de tórax portátil\u003c/td>\u003ctd>\u003cstrong>30 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ECGs seriados (ECG não diagnóstico + alta suspeita)\u003c/td>\u003ctd>\u003cstrong>5–10 min\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Pré-hospitalar:\u003c/strong> ECG com supra → alerta de STEMI para o hospital receptor e, onde houver protocolo, transporte direto para o laboratório de cateterismo em quem não precisa de estabilização na chegada.\u003c/li>\u003cli>A fibrinólise pré-hospitalar é razoável quando o tempo de transporte é \u003cstrong>superior a 30 minutos\u003c/strong>, em sistemas que dispõem do recurso.\u003c/li>\u003cli>O primeiro ECG não pode atrasar, e a consulta de rotina com especialista não deve retardar a decisão de reperfusão — a avaliação é clínica, rápida e paralela.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-oxigênio-só-para-quem-está-hipoxêmico\">\u003ch2>4. Oxigênio: só para quem está hipoxêmico\u003c/h2>\u003cul>\u003cli>\u003cstrong>O2 apenas se SpO2 &lt;90%\u003c/strong>: iniciar \u003cstrong>4 L/min\u003c/strong> e titular conforme a saturação.\u003c/li>\u003cli>Em paciente não hipoxêmico, oxigênio suplementar \u003cstrong>de rotina pode ser prejudicial\u003c/strong> — não administrar.\u003c/li>\u003cli>Dispneia isolada com saturação normal \u003cstrong>não\u003c/strong> é indicação.\u003c/li>\u003cli>Manter monitorização contínua do ECG e reavaliar a saturação: o alvo é corrigir hipoxemia, não levar a saturação a 100%.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-terapias-farmacológicas\">\u003ch2>5. Terapias farmacológicas\u003c/h2>\u003cp>Objetivo comum: melhorar a oferta e reduzir o consumo de oxigênio do miocárdio, aliviar a dor e estabilizar a placa.\u003c/p>\n\u003ch3 id=\"h-5-1-nitroglicerina-ntg\">5.1 Nitroglicerina (NTG)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Sublingual: 0,4 mg a cada 5 min, até 3 doses\u003c/strong> — reavaliar dor e sinais vitais a cada dose; se a dor persistir após as 3 doses, considerar \u003cstrong>NTG intravenosa\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>IV\u003c/strong> é indicada no NSTE-ACS para \u003cstrong>isquemia persistente, insuficiência cardíaca ou hipertensão\u003c/strong>; no STEMI, pode ser útil quando há hipertensão ou IC.\u003c/li>\u003cli>\u003cstrong>Contraindicações:\u003c/strong> PAS &lt;90 mmHg (ou queda ≥30 mmHg em relação à basal); bradicardia ou taquicardia acentuada; inibidor da fosfodiesterase (\u003cstrong>avanafil em 12 h, sildenafil em 24 h, tadalafil em 48 h\u003c/strong>); \u003cstrong>suspeita de infarto do ventrículo direito\u003c/strong>.\u003c/li>\u003cli>Efeitos adversos comuns: cefaleia, rubor, taquicardia, tontura e hipotensão ortostática. A hipotensão costuma responder ao decúbito e a volume.\u003c/li>\u003cli>Macete de prova: IAM inferior que fica hipotenso após nitrato — pense em RVI.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-2-morfina\">5.2 Morfina\u003c/h3>\n\u003cul>\u003cli>NSTE-ACS: \u003cstrong>1–5 mg IV\u003c/strong> (classe IIb), repetir a cada \u003cstrong>5–30 min\u003c/strong> para conforto, quando a dor persiste apesar da terapia anti-isquêmica máxima tolerada.\u003c/li>\u003cli>STEMI: \u003cstrong>4–8 mg IV\u003c/strong> inicialmente (doses menores em idosos), com incrementos de \u003cstrong>2–8 mg a cada 5–15 min\u003c/strong> — analgésico de escolha no STEMI, sobretudo quando o curso se complica com edema agudo de pulmão.\u003c/li>\u003cli>Antes de administrar: garantir \u003cstrong>naloxona e equipamento de via aérea\u003c/strong> disponíveis; bradicardia excessiva relacionada à morfina pode exigir atropina.\u003c/li>\u003cli>Efeitos: venodilatação, queda da PA, náuseas/vômitos e retardo do esvaziamento gástrico — \u003cstrong>pode atrasar a absorção dos antiplaquetários orais\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Fentanil\u003c/strong> é alternativa: início mais rápido, menor duração de ação e efeitos cardiovasculares mínimos.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-3-aspirina-e-inibidor-de-p2y12\">5.3 Aspirina e inibidor de P2Y12\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>AAS não entérica, mastigável, 162–325 mg\u003c/strong> o mais rápido possível (se não houver contraindicação); manutenção de \u003cstrong>81–162 mg/dia indefinidamente\u003c/strong>.\u003c/li>\u003cli>Se hipersensibilidade ou intolerância gastrintestinal à AAS: \u003cstrong>ataque de clopidogrel + dose de manutenção\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>P2Y12\u003c/strong> (clopidogrel ou ticagrelor; prasugrel e cangrelor também são opções): no NSTE-ACS, associado à AAS por até \u003cstrong>12 meses\u003c/strong> nos pacientes tratados com estratégia invasiva precoce ou guiada por isquemia. No STEMI: dose de ataque \u003cstrong>o mais cedo possível ou no momento da ICP\u003c/strong>; manutenção por \u003cstrong>1 ano\u003c/strong> nos pacientes que recebem stent.\u003c/li>\u003cli>Quando antiplaquetários potentes estão planejados, minimizar punções arteriais e venosas, injeções IM, cateteres e sondas; evitar acessos não compressíveis.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-4-aines-fora-da-fase-aguda\">5.4 AINEs: fora da fase aguda\u003c/h3>\n\u003cul>\u003cli>Anti-inflamatórios não esteroidais, \u003cstrong>exceto a aspirina\u003c/strong>, \u003cstrong>não devem ser iniciados na fase aguda nem mantidos\u003c/strong> em quem já os usa: o risco de eventos cardiovasculares maiores (reinfarto, hipertensão, insuficiência cardíaca e ruptura miocárdica) supera o alívio sintomático.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-5-betabloqueadores\">5.5 Betabloqueadores\u003c/h3>\n\u003cul>\u003cli>Reduzem PA, frequência cardíaca e contratilidade — e, com isso, a demanda de oxigênio do miocárdio.\u003c/li>\u003cli>\u003cstrong>Orais nas primeiras 24 h\u003c/strong> na ausência de sinais de IC, estado de baixo débito, risco de choque cardiogênico ou outras contraindicações (\u003cstrong>PR &gt;0,24 s, BAV de 2º ou 3º grau, asma ativa/doença reativa das vias aéreas\u003c/strong>).\u003c/li>\u003cli>\u003cstrong>IV\u003c/strong> é razoável na apresentação do STEMI com \u003cstrong>hipertensão ou isquemia contínua\u003c/strong>, sem contraindicações.\u003c/li>\u003cli>Fatores de risco para choque cardiogênico: \u003cstrong>idade &gt;70 anos, PAS &lt;120 mmHg, FC &gt;110 bpm\u003c/strong> e maior tempo desde o início dos sintomas — pesar antes de bloquear.\u003c/li>\u003cli>Monitorar PA, FC e ritmo após a administração.\u003c/li>\u003cli>\u003cstrong>Nunca associar BCC IV e betabloqueador IV\u003c/strong> (nem em horas próximas): risco de hipotensão grave.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-5-6-bloqueadores-de-cálcio\">5.6 Bloqueadores de cálcio\u003c/h3>\n\u003cul>\u003cli>Não dihidropiridínicos (verapamil, diltiazem) reduzem frequência cardíaca, contratilidade e condução pelo nó AV — e dilatam a coronária, o que os torna úteis na \u003cstrong>angina variante (vasoespasmo)\u003c/strong>.\u003c/li>\u003cli>No NSTE-ACS, são alternativa quando há \u003cstrong>isquemia contínua ou recorrente frequente e contraindicação ao betabloqueador\u003c/strong>, na ausência de disfunção ventricular esquerda significativa, risco aumentado de choque cardiogênico, PR &gt;0,24 s ou BAV de 2º/3º grau sem marca-passo.\u003c/li>\u003cli>Cautela com hipotensão, insuficiência cardíaca e QRS largo; nunca associados a betabloqueador intravenoso.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-reperfusão-a-decisão-que-muda-o-desfecho\">\u003ch2>6. Reperfusão: a decisão que muda o desfecho\u003c/h2>\u003ch3 id=\"h-6-1-icp-primária-preferida\">6.1 ICP primária (preferida)\u003c/h3>\n\u003cul>\u003cli>Estratégia \u003cstrong>recomendada quando pode ser realizada prontamente\u003c/strong> por equipe experiente: alvo de \u003cstrong>porta-balão ≤90 min\u003c/strong> da chegada em hospital com capacidade de ICP.\u003c/li>\u003cli>Hospital sem ICP: transferir para centro com ICP quando o intervalo \u003cstrong>primeiro contato médico–dispositivo for ≤120 min\u003c/strong>.\u003c/li>\u003cli>No STEMI com \u003cstrong>choque\u003c/strong>, a preferência é \u003cstrong>ICP ou cirurgia de revascularização\u003c/strong> — não fibrinólise.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-6-2-fibrinólise-quando-a-icp-não-chega-a-tempo\">6.2 Fibrinólise (quando a ICP não chega a tempo)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Não indicada no NSTE-ACS.\u003c/strong>\u003c/li>\u003cli>STEMI com sintomas \u003cstrong>≤12 h\u003c/strong> e previsão de ICP impossível em \u003cstrong>≤120 min do primeiro contato médico\u003c/strong>; alvo de \u003cstrong>porta-agulha ≤30 min\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>12–24 h:\u003c/strong> geralmente não recomendada; exceção — dor isquêmica persistente com supra de ST contínuo. \u003cstrong>Nunca após 24 h.\u003c/strong>\u003c/li>\u003cli>Antes de iniciar: checar contraindicações (lista de verificação) e escolher uma derivação com supra nítido para monitorar.\u003c/li>\u003cli>Durante a infusão: vigiar sangramentos (locais de punção, cortes e injeções), alterações do segmento ST, arritmias e hipotensão.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-6-3-como-saber-se-a-reperfusão-funcionou\">6.3 Como saber se a reperfusão funcionou\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Sinais de sucesso:\u003c/strong> alívio \u003cstrong>abrupto\u003c/strong> da dor; retorno do segmento ST previamente elevado à linha de base; \u003cstrong>arritmias de reperfusão\u003c/strong> — extra-sístoles, bradicardias, bloqueios, TV ou FV — que marcam a reabertura da artéria.\u003c/li>\u003cli>Mesmo com fibrinólise bem-sucedida, cerca de \u003cstrong>20%\u003c/strong> dos pacientes sofrem \u003cstrong>reoclusão\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Falha\u003c/strong> (dor que persiste + supra que não resolve) → transferir para centro com ICP para \u003cstrong>angioplastia de resgate\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-infarto-do-ventrículo-direito-rvi\">\u003ch2>7. Infarto do ventrículo direito (RVI)\u003c/h2>\u003cul>\u003cli>Suspeitar sempre que houver \u003cstrong>supra em II, III e/ou aVF\u003c/strong> (parede inferior): cerca de \u003cstrong>um terço\u003c/strong> dos STEMI inferiores tem algum envolvimento do ventrículo direito, quase sempre por oclusão da coronária direita.\u003c/li>\u003cli>ECG: o sinal mais sensível é o \u003cstrong>supra de ≥ 1 mm em V4R\u003c/strong> (derivação torácica direita); \u003cstrong>V1\u003c/strong> pode acompanhar.\u003c/li>\u003cli>Tríade hemodinâmica clássica: \u003cstrong>hipotensão + turgência jugular + pulmões limpos\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>O VD é uma câmara dependente de volume\u003c/strong>: nitratos e diuréticos reduzem a pré-carga e precipitam hipotensão. Suspeitar de RVI quando um IAM inferior fica hipotenso após nitrato.\u003c/li>\u003cli>Conduta: \u003cstrong>suspender o nitrato, evitar diuréticos e manter a pré-carga\u003c/strong> (reposição de volume conforme necessidade).\u003c/li>\u003cli>Bradiarritmias podem agravar o quadro e a \u003cstrong>estimulação temporária é frequentemente necessária\u003c/strong>; outras complicações incluem BAV, arritmias atriais e ventriculares, hipotensão que pode evoluir para choque cardiogênico e trombos no VD.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-8-iam-a-classificação-que-mudou-em-2026\">\u003ch2>8. IAM: a classificação que mudou em 2026\u003c/h2>\u003cp>A \u003cstrong>Fifth Universal Definition of Myocardial Infarction (2026)\u003c/strong>, da ESC/ACC/AHA/WHF, substituiu a classificação numérica por \u003cstrong>três tipos clínicos\u003c/strong>:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Definição\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Primário\u003c/strong>\u003c/td>\u003ctd>Apresentação \u003cstrong>espontânea\u003c/strong> por aterotrombose ou outra patologia coronária aguda — inclui dissecção, êmbolo coronário, vasoespasmo e a falha de stent ou enxerto \u003cstrong>após 30 dias\u003c/strong>, reclassificada como primária.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Secundário\u003c/strong>\u003c/td>\u003ctd>Secundário a uma condição aguda em que o \u003cstrong>desequilíbrio oferta–consumo\u003c/strong> de oxigênio revela doença coronária obstrutiva ou causa nova disfunção ventricular.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Relacionado a procedimento\u003c/strong>\u003c/td>\u003ctd>Complicação que causa \u003cstrong>oclusão coronária ou de enxerto imediata\u003c/strong> com nova disfunção ventricular, ou \u003cstrong>falha de stent/enxerto em até 30 dias\u003c/strong> de um procedimento cardíaco.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>No tipo relacionado a procedimento, o diagnóstico \u003cstrong>não depende de limiares de troponina\u003c/strong>; os critérios são iguais para procedimento percutâneo e cirúrgico.\u003c/li>\u003cli>A divisão entre com supra e sem supra de ST vem do ECG e orienta a conduta; os três tipos descrevem o \u003cstrong>mecanismo\u003c/strong> do infarto.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-9-resumo-de-bolso\">\u003ch2>9. Resumo de bolso\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Número-chave\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Avaliação inicial no DE\u003c/td>\u003ctd>\u003cstrong>≤10 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ECG revisado / laboratório inicial\u003c/td>\u003ctd>\u003cstrong>10 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Radiografia de tórax\u003c/td>\u003ctd>\u003cstrong>30 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ECGs seriados (ECG não diagnóstico + alta suspeita)\u003c/td>\u003ctd>\u003cstrong>5–10 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oxigênio\u003c/td>\u003ctd>só se \u003cstrong>SpO2 &lt;90%\u003c/strong> (4 L/min e titular)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NTG sublingual\u003c/td>\u003ctd>\u003cstrong>0,4 mg a cada 5 min, até 3 doses\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AAS\u003c/td>\u003ctd>\u003cstrong>162–325 mg\u003c/strong> mastigável; manutenção \u003cstrong>81–162 mg/dia\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Morfina\u003c/td>\u003ctd>NSTE-ACS \u003cstrong>1–5 mg IV\u003c/strong>; STEMI \u003cstrong>4–8 mg IV\u003c/strong> (+2–8 mg a cada 5–15 min)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ICP primária\u003c/td>\u003ctd>\u003cstrong>porta-balão ≤90 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transferência para ICP\u003c/td>\u003ctd>primeiro contato–dispositivo \u003cstrong>≤120 min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fibrinólise\u003c/td>\u003ctd>\u003cstrong>porta-agulha ≤30 min\u003c/strong>; sintomas \u003cstrong>≤12 h\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reoclusão pós-fibrinólise\u003c/td>\u003ctd>\u003cstrong>~20%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Como o ECG inicial divide as síndromes coronarianas agudas em três grupos — e o que muda na conduta de cada um?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Supra de ST em duas ou mais derivações contíguas define o \u003cstrong>STEMI\u003c/strong>, o grupo mais emergente, que segue para avaliação de reperfusão mecânica (ICP) ou farmacológica (fibrinólise). Infra de ST ou alterações transitórias de ST-T com dor sugerem \u003cstrong>NSTE-ACS de alto risco\u003c/strong> (NSTEMI/angina instável), que exige leito monitorado e estratificação para estratégia invasiva precoce quando indicada. ECG normal ou com alterações inespecíficas corresponde ao grupo de \u003cstrong>risco baixo/intermediário\u003c/strong>, com observação em unidade de dor torácica e ECGs seriados se a suspeita clínica permanecer alta. Além disso, supra em II, III e/ou aVF pede avaliação para infarto do ventrículo direito.\u003c/p>"},{"titleHtml":"🟢 Quando o oxigênio suplementar está indicado no paciente com SCA, e por que a administração rotineira deve ser evitada?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A indicação é \u003cstrong>SpO2 abaixo de 90%\u003c/strong>: nesse caso, iniciar com \u003cstrong>4 L/min\u003c/strong> e titular conforme a saturação. Em paciente não hipoxêmico, o oxigênio de rotina pode ser prejudicial e não deve ser administrado — dispneia isolada com saturação normal não é critério. Manter monitorização contínua e reavaliar a saturação: o objetivo é corrigir hipoxemia, não atingir 100%.\u003c/p>"},{"titleHtml":"🟡 Qual é o esquema da nitroglicerina sublingual e quais contraindicações precisam ser checadas antes de administrá-la?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>0,4 mg sublingual a cada 5 minutos, até 3 doses\u003c/strong>, reavaliando dor e sinais vitais a cada administração. Se a dor persistir após as três doses, considerar NTG intravenosa — indicada no NSTE-ACS para isquemia persistente, insuficiência cardíaca ou hipertensão, e útil no STEMI com hipertensão ou IC. Contraindicações: \u003cstrong>PAS &lt;90 mmHg ou queda ≥30 mmHg\u003c/strong> em relação à basal, bradicardia ou taquicardia acentuada, uso de inibidor da fosfodiesterase (\u003cstrong>avanafil em 12 h, sildenafil em 24 h, tadalafil em 48 h\u003c/strong>) e \u003cstrong>suspeita de infarto do ventrículo direito\u003c/strong>. Efeitos adversos comuns incluem cefaleia, rubor, taquicardia, tontura e hipotensão ortostática.\u003c/p>"},{"titleHtml":"🟡 Além do nitrato, quais são as medidas farmacológicas iniciais no paciente com SCA? Inclua o antiplaquetário, a analgesia e a classe formalmente contraindicada.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>AAS não entérica e mastigável, 162–325 mg\u003c/strong>, o mais rápido possível, com manutenção de \u003cstrong>81–162 mg/dia indefinidamente\u003c/strong> (na hipersensibilidade ou intolerância gastrintestinal, ataque de clopidogrel seguido de manutenção). O \u003cstrong>inibidor de P2Y12\u003c/strong> (clopidogrel ou ticagrelor) entra associado à AAS por até \u003cstrong>12 meses\u003c/strong> no NSTE-ACS tratado com estratégia invasiva precoce ou guiada por isquemia; no STEMI, a dose de ataque o mais cedo possível ou no momento da ICP, com manutenção por \u003cstrong>1 ano\u003c/strong> nos pacientes com stent. Para a dor persistente, \u003cstrong>morfina\u003c/strong>: 1–5 mg IV no NSTE-ACS (repetível a cada 5–30 min) e 4–8 mg IV com incrementos de 2–8 mg a cada 5–15 min no STEMI, doses menores em idosos, com naloxona e material de via aérea disponíveis; fentanil é alternativa. \u003cstrong>AINEs (exceto AAS) não devem ser iniciados nem mantidos na fase aguda\u003c/strong>, pelo aumento de eventos cardiovasculares maiores.\u003c/p>"},{"titleHtml":"🟡 Como escolher entre ICP primária e fibrinólise no STEMI, e quais são os tempos-alvo de cada estratégia?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A \u003cstrong>ICP primária\u003c/strong> é preferida quando pode ser realizada prontamente por equipe experiente, com alvo de \u003cstrong>porta-balão ≤90 minutos\u003c/strong> da chegada; em hospital sem ICP, transferir quando o intervalo \u003cstrong>primeiro contato médico–dispositivo for ≤120 minutos\u003c/strong>. A \u003cstrong>fibrinólise\u003c/strong> é a alternativa quando não há ICP em até 120 minutos do primeiro contato: indicada com sintomas \u003cstrong>≤12 h\u003c/strong>, com alvo de \u003cstrong>porta-agulha ≤30 minutos\u003c/strong>. Entre \u003cstrong>12 e 24 h\u003c/strong> geralmente não é recomendada — exceção para dor isquêmica persistente com supra contínuo — e \u003cstrong>nunca após 24 h\u003c/strong>. Em choque, a preferência é ICP ou cirurgia; e fibrinólise \u003cstrong>não tem papel no NSTE-ACS\u003c/strong>.\u003c/p>"},{"titleHtml":"🟡 A Fifth Universal Definition of MI (2026) mudou a classificação do infarto. Quais são os três tipos clínicos e o que caracteriza cada um?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Primário\u003c/strong> — apresentação espontânea por aterotrombose ou outra patologia coronária aguda; inclui dissecção, êmbolo coronário, vasoespasmo e a falha de stent ou enxerto \u003cstrong>após 30 dias\u003c/strong>, reclassificada como primária. \u003cstrong>Secundário\u003c/strong> — desequilíbrio entre oferta e consumo de oxigênio por uma condição aguda alternativa que revela doença coronária obstrutiva ou causa nova disfunção ventricular. \u003cstrong>Relacionado a procedimento\u003c/strong> — complicação que causa oclusão coronária ou de enxerto imediata com nova disfunção, ou falha de stent/enxerto em \u003cstrong>até 30 dias\u003c/strong> de um procedimento cardíaco; nesse tipo o diagnóstico não depende de limiares de troponina e os critérios valem igualmente para procedimento percutâneo e cirúrgico. A classificação substitui a numeração anterior.\u003c/p>"},{"titleHtml":"🔴 Homem de 62 anos com STEMI inferior recebe nitroglicerina sublingual e evolui com PA 82/50 mmHg, turgência jugular e pulmões limpos. O que está acontecendo e como conduzir?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> O quadro sugere \u003cstrong>infarto do ventrículo direito\u003c/strong>, que complica cerca de \u003cstrong>um terço\u003c/strong> dos STEMI inferiores e deve ser suspeitado sempre que houver supra em II, III e/ou aVF. O VD é uma câmara \u003cstrong>dependente de volume\u003c/strong>: a nitroglicerina reduz a pré-carga e precipita a hipotensão — o mesmo vale para diuréticos. A conduta é \u003cstrong>suspender o nitrato, evitar diuréticos e manter a pré-carga\u003c/strong> (reposição de volume conforme necessidade), lembrando que bradiarritmias podem agravar o quadro e que a estimulação temporária é frequentemente necessária. O sinal eletrocardiográfico mais sensível é o supra de \u003cstrong>≥ 1 mm em V4R\u003c/strong>; \u003cstrong>V1\u003c/strong> pode acompanhar.\u003c/p>"},{"titleHtml":"🔴 Paciente com STEMI faz fibrinólise, mas mantém dor isquêmica e supradesnivelamento de ST sem melhora. Como reconhecer a falha e qual é a conduta? Quais sinais indicariam sucesso da reperfusão?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A persistência da dor e do supra de ST após a fibrinólise, sem os sinais de reperfusão, indica \u003cstrong>falha\u003c/strong> — o paciente deve ser transferido para um centro com capacidade de ICP para \u003cstrong>angioplastia de resgate\u003c/strong>. Os sinais de \u003cstrong>reperfusão bem-sucedida\u003c/strong> são: alívio \u003cstrong>abrupto\u003c/strong> da dor, retorno do segmento ST à linha de base e \u003cstrong>arritmias de reperfusão\u003c/strong> (extra-sístoles, bradicardias, bloqueios, TV ou FV), que surgem com a reabertura da artéria. Mesmo quando a fibrinólise é bem-sucedida, cerca de \u003cstrong>20%\u003c/strong> dos pacientes sofrem reoclusão. Vale lembrar que a fibrinólise \u003cstrong>não é indicada no NSTE-ACS\u003c/strong>.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Paciente com dor torácica isquêmica chega ao pronto-socorro. Qual achado no ECG inicial define o grupo com indicação de avaliar \u003cstrong>reperfusão imediata\u003c/strong>?","a":["Supradesnivelamento de ST em duas derivações contíguas","Inversão de onda T em uma única derivação precordial","Infradesnivelamento de ST em duas derivações contíguas","ECG normal, desde que a troponina esteja elevada no momento"],"c":0,"e":"O supradesnivelamento de ST em duas ou mais derivações contíguas define o STEMI, o grupo em que se decide entre reperfusão mecânica e farmacológica. Infradesnivelamento de ST e alterações transitórias de ST-T marcam o NSTE-ACS de alto risco, e o ECG normal ou inespecífico fica no grupo de risco baixo/intermediário, com observação e ECGs seriados. Troponina elevada com ECG sem supra caracteriza NSTEMI, não o grupo do STEMI."},{"n":"🟢","levelName":"basico","q":"Paciente com suspeita de SCA chega com \u003cstrong>SpO2 de 96%\u003c/strong> em ar ambiente. Qual é a conduta quanto ao oxigênio?","a":["Administrar O2 a 4 L/min e manter até a saturação chegar a 100%","Não administrar O2 de rotina; só se SpO2 cair abaixo de 90%","Administrar O2 em máscara com reservatório para todo suspeito","Suplementar O2 se houver dispneia, mesmo com saturação normal"],"c":1,"e":"O oxigênio suplementar de rotina pode ser prejudicial em pacientes com saturação normal; a indicação é SpO2 abaixo de 90%, quando se começa com 4 L/min e se titula. Dispneia isolada com saturação normal não é indicação, e máscara com reservatório para todos expõe quem não está hipoxêmico. Manter monitorização contínua e reavaliar a saturação."},{"n":"🟡","levelName":"intermediario","q":"Sobre a \u003cstrong>nitroglicerina sublingual\u003c/strong> na SCA, qual é o esquema correto e uma contraindicação formal?","a":["0,4 mg sublingual em dose única; repetir só após betabloqueador","0,4 mg sublingual a cada 15 min, até 6 doses; evitar se a pressão subir","0,4 mg sublingual a cada 5 min, até 6 doses; evitar se houver cefaleia","0,4 mg sublingual a cada 5 min, até 3 doses; evitar na suspeita de RVI"],"c":3,"e":"O esquema é 0,4 mg sublingual a cada 5 minutos, até 3 doses. As contraindicações incluem pressão sistólica abaixo de 90 mmHg (ou queda de 30 mmHg ou mais em relação à basal), bradicardia ou taquicardia acentuada, uso recente de inibidor da fosfodiesterase (avanafil em 12 h, sildenafil em 24 h, tadalafil em 48 h) e suspeita de infarto do ventrículo direito. Cefaleia é efeito adverso esperado, não contraindicação; intervalos de 15 minutos, seis doses ou dose única não correspondem ao esquema."},{"n":"🟡","levelName":"intermediario","q":"Além de obter o ECG de 12 derivações, quais itens devem estar concluídos \u003cstrong>em até 10 minutos\u003c/strong> da chegada do paciente com suspeita de SCA?","a":["Avaliação inicial, revisão do ECG e coleta de exames","Coleta de exames, radiografia de tórax e monitorização","Avaliação inicial, revisão do ECG e radiografia de tórax","Revisão do ECG, radiografia de tórax e parecer clínico"],"c":0,"e":"Em até 10 minutos da chegada, a avaliação inicial deve estar feita, o ECG de 12 derivações revisado e o laboratório inicial colhido. A radiografia de tórax tem alvo de 30 minutos, não de 10, e a monitorização é contínua, não um item com prazo. O parecer de especialista não faz parte dos itens com prazo de 10 minutos e não deve atrasar a conduta."},{"n":"🟡","levelName":"intermediario","q":"Paciente com STEMI dá entrada em hospital \u003cstrong>com laboratório de hemodinâmica\u003c/strong>, com dor iniciada há 90 minutos. Qual é a estratégia de reperfusão preferida e o tempo-alvo?","a":["Fibrinólise imediata, pois a janela de 12 horas está aberta","Fibrinólise imediata e transferência após 24 horas do início","ICP primária, com porta-balão de até 90 minutos da chegada","ICP primária apenas se houver falha da fibrinólise inicial"],"c":2,"e":"Em hospital com capacidade de ICP e apresentação recente, a intervenção coronária percutânea primária é a estratégia recomendada, com alvo de porta-balão de até 90 minutos. A fibrinólise fica para quando a ICP não pode ser feita em até 120 minutos do primeiro contato médico, com porta-agulha de até 30 minutos — e não é indicada no NSTE-ACS. Aguardar 24 horas ou reservar a ICP para o resgate após falha da fibrinólise inverte a lógica da escolha inicial."},{"n":"🟡","levelName":"intermediario","q":"A \u003cstrong>Fifth Universal Definition of Myocardial Infarction (2026)\u003c/strong> passou a classificar o infarto do miocárdio em três tipos clínicos. Quais são eles?","a":["Aterotrombótico, embólico e vasoespástico isolado","Tipos 1 a 5, conforme a definição universal anterior","Com supra de ST, sem supra de ST e angina instável","Primário, secundário e relacionado a procedimento"],"c":3,"e":"A definição de 2026 (ESC/ACC/AHA/WHF) substitui a classificação numérica anterior e adota três tipos: primário, por aterotrombose ou outra patologia coronária aguda espontânea; secundário, por desequilíbrio entre oferta e consumo de oxigênio em uma condição aguda alternativa; e relacionado a procedimento, quando há complicação coronária em até 30 dias de um procedimento cardíaco. A divisão entre com supra e sem supra de ST vem do ECG e orienta a conduta, sem substituir essa classificação de mecanismo."},{"n":"🔴","levelName":"avancado","q":"Homem de 62 anos com STEMI inferior recebe \u003cstrong>nitroglicerina sublingual\u003c/strong> e evolui
