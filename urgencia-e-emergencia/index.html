o, repondo volume de forma cautelosa para evitar sobrecarga — a página antiga do MS (2 a 3 e 4 a 6) não deve ser usada."},{"n":"🔴","levelName":"avancado","q":"Após picada de aranha, paciente com dor intensa, contraturas musculares, sudorese e ansiedade, quadro compatível com latrodectismo. Qual é a conduta específica possível no Brasil?","a":["Tratamento sintomático: benzodiazepínico, cálcio e ECG","Soro antiaracnídeo trivalente, 2 a 4 ampolas por via IV","Soro antiescorpiônico, 3 frascos, com observação de 24 h","Soro antilatrodético importado, por via intramuscular"],"c":0,"e":"Não há \u003cstrong>soro antilatrodético disponível no Brasil\u003c/strong>, e o antiaracnídeo trivalente (Loxosceles, Phoneutria e Tityus) \u003cstrong>não neutraliza\u003c/strong> o veneno da viúva negra. O tratamento é \u003cstrong>sintomático\u003c/strong>: benzodiazepínico, \u003cstrong>gluconato de cálcio a 10%\u003c/strong> e \u003cstrong>ECG seriado\u003c/strong>, pelo risco de distúrbios de condução e arritmias. O soro importado por via intramuscular citado em materiais antigos (Manual de 2001) não faz parte da realidade do SUS."}]},{"id":"12","fullTitle":"12 — Tromboembolismo pulmonar (TEP)","shortTitle":"Tromboembolismo pulmonar (TEP)","subtitle":"A nova classificação clínica AHA/ACC 2026 (categorias A–E + modificador R): do TEP incidental que vai para casa ao choque com parada cardíaca — critérios objetivos, escores de gravidade e o que cada categoria muda na conduta.","toc":[{"id":"sec-1-a-classificação-que-mudou-o-tep","title":"1. A classificação que mudou o TEP"},{"id":"sec-2-diagnóstico-e-estratificação","title":"2. Diagnóstico e estratificação"},{"id":"sec-3-tratamento","title":"3. Tratamento"},{"id":"sec-4-pegadinhas","title":"4. Pegadinhas"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-a-classificação-que-mudou-o-tep\">\u003ch2>1. A classificação que mudou o TEP\u003c/h2>\u003ch3 id=\"h-1-1-o-documento\">1.1 O documento\u003c/h3>\n\u003cul>\u003cli>O \u003cstrong>2026 AHA/ACC/Multisociedade Guideline for the Evaluation and Management of Acute Pulmonary Embolism in Adults\u003c/strong> — com ACCP, ACEP, CHEST, SCAI, SHM, SIR, SVM e SVN — foi publicado em \u003cstrong>19/02/2026\u003c/strong> e é a \u003cstrong>primeira diretriz clínica da AHA/ACC dedicada ao TEP agudo\u003c/strong>.\u003c/li>\u003cli>A novidade central é a \u003cstrong>\"Acute Pulmonary Embolism Clinical Categories\"\u003c/strong>: \u003cstrong>5 categorias (A–E) com subcategorias\u003c/strong>, da menor para a maior gravidade, para refinar a estratificação de gravidade, o prognóstico e a decisão terapêutica.\u003c/li>\u003cli>O eixo mudou: o que classifica é a \u003cstrong>repercussão clínico-fisiológica\u003c/strong> — sobretudo o \u003cstrong>comprometimento do ventrículo direito (VD)\u003c/strong> — e não uma medida anatômica isolada do trombo.\u003c/li>\u003cli>A categoria é atribuída pelo \u003cstrong>achado mais grave\u003c/strong> entre clínica, laboratório e imagem, e o paciente pode \u003cstrong>mudar de categoria durante a evolução\u003c/strong>: reavalie.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-as-categorias-a-e\">1.2 As categorias A–E\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Categoria\u003c/th>\u003cth>Conceito\u003c/th>\u003cth>Achados-núcleo\u003c/th>\u003cth>Conduta de internação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>A\u003c/strong>\u003c/td>\u003ctd>TEP subclínico\u003c/td>\u003ctd>Incidental e assintomático\u003c/td>\u003ctd>\u003cstrong>Alta direta do pronto-socorro\u003c/strong>, sem internação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>B\u003c/strong>\u003c/td>\u003ctd>Sintomático, baixo risco\u003c/td>\u003ctd>Escore de gravidade baixo: \u003cstrong>PESI I–II (≤85)\u003c/strong> ou \u003cstrong>sPESI = 0\u003c/strong> ou \u003cstrong>Hestia = 0\u003c/strong> ou \u003cstrong>Bova ≤4\u003c/strong>; subgrupos B1–B2 (subsegmentar vs. não subsegmentar)\u003c/td>\u003ctd>\u003cstrong>Alta hospitalar precoce\u003c/strong> geralmente recomendada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>C\u003c/strong>\u003c/td>\u003ctd>Sintomático, gravidade elevada\u003c/td>\u003ctd>Escore elevado: \u003cstrong>PESI III–V (&gt;85)\u003c/strong>, \u003cstrong>sPESI ≥1\u003c/strong>, \u003cstrong>Hestia ≥1\u003c/strong>, \u003cstrong>Bova &gt;4\u003c/strong>; subdividida por VD e biomarcadores (C1–C3)\u003c/td>\u003ctd>\u003cstrong>Internar\u003c/strong> e otimizar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>D\u003c/strong>\u003c/td>\u003ctd>Falência cardiopulmonar incipiente\u003c/td>\u003ctd>D1: hipotensão transitória; D2: \u003cstrong>choque oculto\u003c/strong> (normotenso com hipoperfusão)\u003c/td>\u003ctd>\u003cstrong>Internar\u003c/strong>; considerar terapias avançadas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>E\u003c/strong>\u003c/td>\u003ctd>Falência cardiopulmonar manifesta\u003c/td>\u003ctd>E1: hipotensão persistente/recorrente com choque cardiogênico; E2: choque refratário ou parada cardíaca\u003c/td>\u003ctd>\u003cstrong>Reperfusão/terapias avançadas\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Modificador respiratório \"R\":\u003c/strong> acrescenta-se \u003cstrong>R\u003c/strong> à subcategoria quando há \u003cstrong>hipoxemia, taquipneia ou necessidade de oxigênio suplementar\u003c/strong> — aplica-se às categorias \u003cstrong>C, D e E\u003c/strong> (ex.: \u003cstrong>C3R\u003c/strong>, \u003cstrong>D2R\u003c/strong>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-as-subcategorias-que-decidem-a-conduta\">1.3 As subcategorias que decidem a conduta\u003c/h3>\n\u003cp>\u003cstrong>Categoria C — o VD e os biomarcadores:\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Subcategoria\u003c/th>\u003cth>VD\u003c/th>\u003cth>Biomarcadores\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>C1\u003c/strong>\u003c/td>\u003ctd>normal\u003c/td>\u003ctd>normais\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>C2\u003c/strong>\u003c/td>\u003ctd>alterado \u003cstrong>ou\u003c/strong>\u003c/td>\u003ctd>≥1 alterado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>C3\u003c/strong>\u003c/td>\u003ctd>alterado \u003cstrong>e\u003c/strong>\u003c/td>\u003ctd>≥1 alterado\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>VD avaliado por \u003cstrong>angio-TC ou ecocardiograma\u003c/strong>; biomarcadores = \u003cstrong>troponina ou BNP\u003c/strong>.\u003c/li>\u003cli>C3 é a faixa de maior gravidade dentro de C — e a que concentra as decisões difíceis.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Categoria D — a inovação do \"choque oculto\":\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>D1 — hipotensão transitória:\u003c/strong> PAS \u003cstrong>&lt;90 mmHg\u003c/strong>, \u003cstrong>ou\u003c/strong> queda \u003cstrong>&gt;40 mmHg\u003c/strong> com duração \u003cstrong>&lt;15 min\u003c/strong>, \u003cstrong>ou\u003c/strong> resposta a volume IV.\u003c/li>\u003cli>\u003cstrong>D2 — choque oculto:\u003c/strong> paciente \u003cstrong>normotenso\u003c/strong> com sinais de hipoperfusão — qualquer um: \u003cstrong>lactato &gt;2 mmol/L\u003c/strong>, lesão renal aguda, diurese \u003cstrong>&lt;0,5 mL/kg/h\u003c/strong>, alteração do nível de consciência, índice cardíaco \u003cstrong>&lt;2,2 L/min/m²\u003c/strong>, PAM \u003cstrong>&lt;60 mmHg\u003c/strong>, aumento do escore/estágio de choque (\u003cstrong>SCAI\u003c/strong>, \u003cstrong>CPES\u003c/strong>).\u003c/li>\u003cli>A D é onde o TEP \"engana\": o manguito pode estar normal enquanto a reserva do VD já está no limite. A disfunção grave de VD entra pelo escore composto de choque (CPES), não como critério literal de D2.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Categoria E — falência manifesta:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>E1:\u003c/strong> hipotensão \u003cstrong>recorrente ou persistente\u003c/strong> com choque cardiogênico.\u003c/li>\u003cli>\u003cstrong>E2:\u003c/strong> \u003cstrong>choque refratário\u003c/strong> ou \u003cstrong>parada cardíaca\u003c/strong>; \u003cstrong>VA-ECMO\u003c/strong> é \u003cstrong>2a\u003c/strong> aqui.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-o-que-a-classificação-não-é\">1.4 O que a classificação não é\u003c/h3>\n\u003cul>\u003cli>Não é uma \u003cstrong>substituição mundial\u003c/strong> das classificações vigentes: é a nomenclatura \u003cstrong>do próprio guideline\u003c/strong>. A classificação da \u003cstrong>ESC 2019\u003c/strong> (baixo/intermediário/alto risco) continua em uso — espere conviver com as duas linguagens e saiba traduzir.\u003c/li>\u003cli>Não classifique pelo \u003cstrong>tamanho ou pela quantidade anatômica de trombo\u003c/strong> isoladamente: os critérios que definem as categorias são clínicos, laboratoriais e de imagem do \u003cstrong>VD\u003c/strong>.\u003c/li>\u003cli>O \u003cstrong>D-dímero ajustado pela idade é alternativa ao YEARS\u003c/strong> — não um substituto universal de todos os algoritmos diagnósticos.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-diagnóstico-e-estratificação\">\u003ch2>2. Diagnóstico e estratificação\u003c/h2>\u003ch3 id=\"h-2-1-probabilidade-clínica-e-d-dímero\">2.1 Probabilidade clínica e D-dímero\u003c/h3>\n\u003cul>\u003cli>Sequência prática: \u003cstrong>probabilidade clínica\u003c/strong> → \u003cstrong>D-dímero\u003c/strong> para excluir em probabilidade \u003cstrong>baixa/intermediária (≤50%)\u003c/strong> → \u003cstrong>angio-TC\u003c/strong> se D-dímero positivo ou probabilidade alta.\u003c/li>\u003cli>\u003cstrong>D-dímero ajustado pela idade:\u003c/strong> em \u003cstrong>maiores de 50 anos\u003c/strong>, o limiar é \u003cstrong>idade × 10 µg/L (FEU)\u003c/strong>. Exemplos: 60 anos → \u003cstrong>600 µg/L\u003c/strong>; 72 anos → \u003cstrong>720 µg/L\u003c/strong>. Valor \u003cstrong>abaixo\u003c/strong> do limiar exclui TEP e dispensa a imagem.\u003c/li>\u003cli>\u003cstrong>YEARS:\u003c/strong> recomendado (\u003cstrong>2a, B-R\u003c/strong>) para identificar quem \u003cstrong>não precisa de imagem\u003c/strong>; o D-dímero ajustado é a \u003cstrong>alternativa\u003c/strong> ao YEARS — são estratégias alternativas, não etapas empilháveis.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-escores-de-gravidade-quem-pode-ir-para-casa\">2.2 Escores de gravidade — quem pode ir para casa\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Escore\u003c/th>\u003cth>Baixo risco (Categoria B)\u003c/th>\u003cth>Escore elevado (Categoria C)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>PESI\u003c/strong>\u003c/td>\u003ctd>classes I–II / \u003cstrong>≤85\u003c/strong>\u003c/td>\u003ctd>classes III–V / \u003cstrong>&gt;85\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>sPESI\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>≥1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hestia\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>≥1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bova\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>≤4\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>&gt;4\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>PESI, sPESI e Hestia são recomendados (1, B-R)\u003c/strong> para identificar baixo risco nas categorias A/B e sustentar a decisão de alta precoce.\u003c/li>\u003cli>\u003cstrong>Bova\u003c/strong> pontua: PAS 90–100 mmHg (2), troponina elevada (2), disfunção de VD (2) e FC ≥110 bpm (1).\u003c/li>\u003cli>Nenhum desses escores mede o VD diretamente — por isso, diante de escore elevado, a próxima etapa é \u003cstrong>biomarcador + imagem do VD\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-3-o-que-medir-na-categoria-c\">2.3 O que medir na Categoria C\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>≥1 biomarcador\u003c/strong> (troponina ou BNP) + \u003cstrong>avaliação do VD\u003c/strong> (angio-TC ou ecocardiograma) para separar C1, C2 e C3.\u003c/li>\u003cli>A subdivisão não é acadêmica: define a intensidade de monitorização e a discussão de terapias avançadas.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-tratamento\">\u003ch2>3. Tratamento\u003c/h2>\u003ch3 id=\"h-3-1-anticoagulação-a-base-de-todos\">3.1 Anticoagulação — a base de todos\u003c/h3>\n\u003cul>\u003cli>Indicada em \u003cstrong>todos os pacientes\u003c/strong>, salvo contraindicação; o que muda entre as categorias é a \u003cstrong>via, o local e a intensidade\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Parenteral:\u003c/strong> \u003cstrong>heparina de baixo peso molecular (HBPM/LMWH) preferida à não fracionada (UFH) (1)\u003c/strong> quando a terapia parenteral inicial é necessária — categorias \u003cstrong>C, D e E1\u003c/strong>; em \u003cstrong>E2\u003c/strong>, LMWH ou UFH.\u003c/li>\u003cli>\u003cstrong>Oral:\u003c/strong> \u003cstrong>DOAC preferido a varfarina (1)\u003c/strong> quando elegível, para prevenir recorrência e reduzir sangramento maior.\u003c/li>\u003cli>\u003cstrong>Fase estendida:\u003c/strong> manter além dos \u003cstrong>3–6 meses\u003c/strong> iniciais no primeiro TEP \u003cstrong>sem fator de risco reversível maior\u003c/strong> e naqueles com \u003cstrong>fator de risco persistente\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-2-trombólise-sistêmica-a-tabela-que-resume\">3.2 Trombólise sistêmica — a tabela que resume\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Categoria\u003c/th>\u003cth>Classe\u003c/th>\u003cth>Leitura\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>E1–E2\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a\u003c/strong>\u003c/td>\u003ctd>Razoável sobre anticoagulação isolada (reduz mortalidade e recorrência)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>D1–D2\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2b\u003c/strong>\u003c/td>\u003ctd>Pode ser considerada para evitar deterioração\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>C3\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2b (incerta)\u003c/strong>\u003c/td>\u003ctd>Pode ser considerada; benefício incerto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A1–C2\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>3: Harm\u003c/strong>\u003c/td>\u003ctd>Não usar: risco de sangramento maior e hemorragia intracraniana\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Se a trombólise sistêmica for escolhida, uma \u003cstrong>dose reduzida pode ser considerada (2b)\u003c/strong> para reduzir o risco de sangramento.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-3-cateter-cirurgia-e-suporte\">3.3 Cateter, cirurgia e suporte\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Estratégia\u003c/th>\u003cth>Recomendação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Trombólise por cateter (CDT)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a só em E1\u003c/strong>; \u003cstrong>2b em D1–D2\u003c/strong>; benefício \u003cstrong>incerto em C2–C3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Trombectomia mecânica (MT)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a só em E1\u003c/strong>; \u003cstrong>2b em D1–D2\u003c/strong>; benefício \u003cstrong>incerto em C2–C3\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Embolectomia cirúrgica\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a em E1\u003c/strong>; \u003cstrong>2b em D1–D2\u003c/strong>; \u003cstrong>3: No Benefit em E2 fora de suporte circulatório mecânico\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>VA-ECMO\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a em E2\u003c/strong> (choque refratário), para estabilizar; em quem já está em ECMO, o benefício de terapias adicionais não está estabelecido\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Trombo livre in-transit (AD/VD)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2a em C3–E2\u003c/strong> para terapia avançada sobre anticoagulação isolada\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>CDT × MT:\u003c/strong> sem superioridade estabelecida entre as duas; a CDT pode ser considerada sobre a trombólise sistêmica para reduzir sangramento maior, com eficácia incerta.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-4-pert-internação-e-seguimento\">3.4 PERT, internação e seguimento\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>PERT (Pulmonary Embolism Response Team): avaliação recomendada (Classe 1) nas categorias C–E\u003c/strong> para agilizar e qualificar a decisão. Pacientes A/B com múltiplas comorbidades também podem se beneficiar.\u003c/li>\u003cli>\u003cstrong>Onde tratar:\u003c/strong> \u003cstrong>A\u003c/strong> = alta direta do pronto-socorro; \u003cstrong>B\u003c/strong> = alta hospitalar precoce; \u003cstrong>C, D e E\u003c/strong> = \u003cstrong>internação\u003c/strong> para otimizar o tratamento.\u003c/li>\u003cli>\u003cstrong>Pós-alta:\u003c/strong> contato na \u003cstrong>primeira semana\u003c/strong>, consulta dedicada \u003cstrong>até 3 meses\u003c/strong> e triagem de sintomas/limitação funcional \u003cstrong>a cada visita por pelo menos 1 ano\u003c/strong> — objetivo: detectar \u003cstrong>doença tromboembólica pulmonar crônica (CTEPD)\u003c/strong> e outras causas de dispneia.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-pegadinhas\">\u003ch2>4. Pegadinhas\u003c/h2>\u003cul>\u003cli>\u003cstrong>TEP incidental e assintomático é Categoria A\u003c/strong> — não é \"TEP pequeno\": pode ir para casa.\u003c/li>\u003cli>\u003cstrong>\"Está normotenso\" não afasta gravidade:\u003c/strong> D2 é o choque oculto. Procure \u003cstrong>lactato, diurese, consciência\u003c/strong> — a reserva do VD pode estar no limite com o manguito normal.\u003c/li>\u003cli>\u003cstrong>Trombólise é 3: Harm até C2\u003c/strong>, não \"contraindicada em todo risco intermediário\": em \u003cstrong>C3\u003c/strong> o benefício é \u003cstrong>incerto\u003c/strong> (2b).\u003c/li>\u003cli>\u003cstrong>Cateter é 2a apenas em E1\u003c/strong>; em D1–D2 é 2b e em C2–C3 é incerto — \"intermediário-alto com deterioração\" não é indicação 2a de cateter.\u003c/li>\u003cli>\u003cstrong>D-dímero ajustado é alternativa ao YEARS\u003c/strong>, não substituto universal.\u003c/li>\u003cli>\u003cstrong>Não classifique pela anatomia do trombo\u003c/strong> e não trate a classificação AHA/ACC como substituta da ESC 2019.\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 O que caracteriza a Categoria A e qual é a conduta quanto à internação?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É o \u003cstrong>TEP subclínico\u003c/strong> — achado \u003cstrong>incidental e assintomático\u003c/strong> em imagem feita por outro motivo. A conduta é \u003cstrong>alta direta do pronto-socorro, sem internação\u003c/strong>, mantendo anticoagulação oral quando indicada (DOAC preferido a varfarina). Trombólise não se aplica a essa faixa (\u003cstrong>3: Harm\u003c/strong> até C2).\u003c/p>"},{"titleHtml":"🟢 O que define a Categoria B e como ela se diferencia de A e C?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A Categoria B é o \u003cstrong>TEP sintomático com escore de gravidade baixo\u003c/strong> — PESI I–II (≤85), sPESI = 0, Hestia = 0 ou Bova ≤4 — e nela a \u003cstrong>alta hospitalar precoce\u003c/strong> é geralmente recomendada. Diferente de A (assintomático, alta direta do PS) e de C (escore elevado, internação e subdivisão por VD/biomarcadores).\u003c/p>"},{"titleHtml":"🟡 Diferencie D1 e D2 com os critérios objetivos e a conduta comum.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>D1\u003c/strong> é a hipotensão \u003cstrong>transitória\u003c/strong>: PAS &lt;90 mmHg, ou queda &gt;40 mmHg por &lt;15 min, ou resposta a volume IV. \u003cstrong>D2\u003c/strong> é o \u003cstrong>choque oculto\u003c/strong>: paciente normotenso com critérios de hipoperfusão — lactato &gt;2 mmol/L, lesão renal aguda, diurese &lt;0,5 mL/kg/h, alteração de consciência, índice cardíaco &lt;2,2 L/min/m², PAM &lt;60 mmHg ou escore/estágio de choque mais alto (SCAI, CPES). Em ambas: internação e consideração de \u003cstrong>terapias avançadas (2b)\u003c/strong>.\u003c/p>"},{"titleHtml":"🟡 Como investigar TEP com probabilidade baixa/intermediária? Explique o D-dímero ajustado e o YEARS.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Usar o D-dímero para \u003cstrong>excluir\u003c/strong> antes da imagem: em maiores de 50 anos, o limiar é \u003cstrong>idade × 10 µg/L (FEU)\u003c/strong> — aos 72 anos, \u003cstrong>720 µg/L\u003c/strong>; abaixo do limiar, TEP excluído e angio-TC dispensada. O \u003cstrong>YEARS\u003c/strong> é a outra estratégia recomendada (\u003cstrong>2a, B-R\u003c/strong>) para identificar quem não precisa de imagem. Os dois são \u003cstrong>alternativas\u003c/strong> — o D-dímero ajustado não substitui universalmente o YEARS.\u003c/p>"},{"titleHtml":"🔴 Quais as classes de recomendação para trombólise sistêmica em A1–C2, C3, D1–D2 e E1–E2? E para cateter/cirurgia?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Trombólise sistêmica: \u003cstrong>3: Harm em A1–C2\u003c/strong>; \u003cstrong>2b com benefício incerto em C3\u003c/strong>; \u003cstrong>2b em D1–D2\u003c/strong>; \u003cstrong>2a em E1–E2\u003c/strong>; dose reduzida pode ser considerada (2b) para reduzir sangramento. Cateter: \u003cstrong>trombólise por cateter e trombectomia mecânica são 2a apenas em E1\u003c/strong> e \u003cstrong>2b em D1–D2\u003c/strong>, com benefício \u003cstrong>incerto em C2–C3\u003c/strong>. Cirurgia: \u003cstrong>2a em E1\u003c/strong>, \u003cstrong>2b em D1–D2\u003c/strong> e \u003cstrong>3: No Benefit em E2 fora de suporte mecânico\u003c/strong>; \u003cstrong>VA-ECMO é 2a em E2\u003c/strong>.\u003c/p>"},{"titleHtml":"🔴 Cenário E2: choque refratário ou parada cardíaca. O que fazer e qual é a armadilha cirúrgica?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Reperfusão/estabilização: \u003cstrong>trombólise sistêmica 2a (E1–E2)\u003c/strong> e \u003cstrong>VA-ECMO 2a em E2\u003c/strong> para estabilizar hemodinâmica e oxigenação. A armadilha: \u003cstrong>embolectomia cirúrgica é 3: No Benefit em E2 fora de suporte circulatório mecânico\u003c/strong>, e, em quem já está em VA-ECMO, o benefício de terapias avançadas adicionais \u003cstrong>não está estabelecido\u003c/strong>. Trombo in-transit acrescenta indicação de terapia avançada (\u003cstrong>2a em C3–E2\u003c/strong>).\u003c/p>"},{"titleHtml":"🟡 Em que categorias o PERT está indicado e como é a reavaliação pós-alta?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A \u003cstrong>avaliação por PERT é Classe 1 nas categorias C–E\u003c/strong> (A/B com múltiplas comorbidades também podem se beneficiar). Quanto à internação: A = alta do PS, B = alta precoce, C–E = internar. Pós-alta: contato na \u003cstrong>primeira semana\u003c/strong>, consulta \u003cstrong>até 3 meses\u003c/strong> e triagem de sintomas e limitação funcional \u003cstrong>a cada visita por pelo menos 1 ano\u003c/strong>, para detectar CTEPD e outras causas de dispneia.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Um paciente de 62 anos faz \u003cstrong>angio-TC de tórax\u003c/strong> para investigar um nódulo pulmonar e o exame mostra \u003cstrong>TEP subsegmentar incidental\u003c/strong>, sem qualquer sintoma. Ele está estável e sem comorbidades relevantes. Qual é a conduta indicada pela classificação AHA/ACC 2026?","a":["Internação breve em enfermaria, com reavaliação em 48 horas","Trombólise sistêmica imediata para prevenir deterioração","Internação para heparina não fracionada em bomba de infusão","Alta direta do pronto-socorro, sem internação hospitalar"],"c":3,"e":"A Categoria A é o TEP subclínico, incidental e assintomático: alta direta do pronto-socorro, sem internação, mantendo anticoagulação oral quando indicada. Trombólise é 3: Harm nessa faixa (A1–C2), e a internação prolongada ou a heparina não fracionada de rotina não se aplicam — quando a via parenteral é necessária, a preferência é por heparina de baixo peso molecular."},{"n":"🟢","levelName":"basico","q":"Um paciente com TEP confirmado tem sintomas, está hemodinamicamente estável e não apresenta disfunção de VD. Qual conjunto de achados o coloca na \u003cstrong>Categoria B\u003c/strong>, na qual a alta hospitalar precoce é geralmente recomendada?","a":["Escore de gravidade baixo, como PESI ≤ 85 ou sPESI = 0","Hipotensão transitória que responde rapidamente a volume","Lactato elevado com necessidade de vasopressor contínuo","PAS abaixo de 90 mmHg mantida após ressuscitação volêmica"],"c":0,"e":"A Categoria B é o TEP sintomático com escore de gravidade baixo — PESI ≤ 85 (classes I–II), sPESI = 0, Hestia = 0 ou Bova ≤ 4 — e a alta hospitalar precoce é geralmente recomendada. Hipotensão transitória que responde a volume descreve a subcategoria D1; hipotensão persistente define a Categoria E; e lactato elevado com hipoperfusão aponta para o choque oculto de D2, todos com internação."},{"n":"🟡","levelName":"intermediario","q":"Na classificação AHA/ACC 2026, a Categoria C é o TEP sintomático com \u003cstrong>escore de gravidade elevado\u003c/strong>. Quais achados definem as subcategorias \u003cstrong>C1, C2 e C3\u003c/strong>?","a":["Escore de choque e necessidade de suporte circulatório","Tempo de sintomas e tamanho do trombo na angiotomografia","Disfunção do VD e elevação de biomarcadores cardíacos","Sinais de TVP associada e dosagem sérica de D-dímero"],"c":2,"e":"As subcategorias C1–C3 combinam a função do ventrículo direito (angio-TC ou ecocardiograma) e biomarcadores cardíacos (troponina ou BNP): C1 tem VD e biomarcadores normais, C2 tem VD alterado ou pelo menos um biomarcador alterado, e C3 tem VD alterado com biomarcador alterado. Tempo de sintomas, tamanho do trombo na angiotomografia, TVP associada e D-dímero não entram nessa subdivisão; escore de choque e suporte circulatório pertencem às categorias D e E."},{"n":"🟡","levelName":"intermediario","q":"Paciente com TEP confirmado, \u003cstrong>normotenso\u003c/strong>, mas com lactato de 3 mmol/L, oligúria e confusão mental leve. Como esse quadro é classificado nas categorias clínicas AHA/ACC 2026?","a":["E2, pelo choque refratário e parada cardíaca iminente","D1, pela hipotensão transitória que responde a volume","E1, pela hipotensão persistente com choque cardiogênico","D2, pela hipoperfusão com pressão arterial ainda normal"],"c":3,"e":"Pressão arterial normal com critérios de hipoperfusão — lactato &gt; 2 mmol/L, lesão renal aguda, oligúria, alteração de consciência, índice cardíaco &lt; 2,2 L/min/m² ou PAM &lt; 60 mmHg — define o choque oculto da subcategoria D2. D1 exige hipotensão transitória (PAS &lt; 90 mmHg, queda &gt; 40 mmHg por menos de 15 minutos ou resposta a volume); E1 e E2 são a falência manifesta, com hipotensão persistente ou choque refratário/parada. Reconhecer D2 importa porque são pacientes que parecem estáveis no manguito, mas já têm a reserva do VD no limite e entram na discussão de terapias avançadas."},{"n":"🟡","levelName":"intermediario","q":"Na estratificação do TEP agudo, qual conjunto de limiares define \u003cstrong>escore clínico elevado\u003c/strong> — a marca da Categoria C entre os pacientes sintomáticos?","a":["Escore de choque elevado com lactato acima de 2 mmol/L","PESI acima de 85, sPESI ≥ 1, Hestia ≥ 1 ou Bova &gt; 4","Troponina negativa, VD normal e sem necessidade de O2","PAS &lt; 90 mmHg, lactato &gt; 2 e diurese &lt; 0,5 mL/kg/hora"],"c":1,"e":"Escore de gravidade elevado é o que tira o paciente sintomático do grupo de baixo risco: PESI &gt; 85 (classes III–V), sPESI ≥ 1, Hestia ≥ 1 ou Bova &gt; 4 — a marca da Categoria C, com indicação de internação. Lactato, diurese e pressão arterial entram no reconhecimento da falência cardiopulmonar incipiente (Categoria D), e troponina negativa com VD normal descreve o extremo de menor gravidade dentro de C, não o escore que a define."},{"n":"🟡","levelName":"intermediario","q":"Mulher de \u003cstrong>72 anos\u003c/strong> com suspeita de TEP e probabilidade clínica baixa ou intermediária (≤ 50%) está sem contraindicações. Qual estratégia a diretriz AHA/ACC 2026 apoia para tentar \u003cstrong>evitar a angio-TC\u003c/strong>?","a":["D-dímero convencional, sem qualquer ajuste pela idade","Angio-TC imediata, sem depender do resultado do exame","D-dímero ajustado à idade, que aqui vale 720 µg/L (FEU)","Repetir o D-dímero convencional antes de decidir a imagem"],"c":2,"e":"Em probabilidade baixa ou intermediária (≤ 50%), um D-dímero abaixo do limiar ajustado pela idade — idade × 10 µg/L em maiores de 50 anos, ou seja, 720 µg/L aos 72 anos (unidades FEU) — exclui TEP e dispensa a imagem. O YEARS é a outra estratégia recomendada (2a) para identificar quem não precisa de imagem, e a diretriz trata o D-dímero ajustado como alternativa ao YEARS, não como substituto universal. Angio-TC imediata sem D-dímero expõe a radiação e contraste desnecessários, e repetir o exame convencional em 24 horas não é estratégia de exclusão."},{"n":"🔴","levelName":"avancado","q":"Paciente com TEP e \u003cstrong>hipotensão persistente\u003c/strong> com choque cardiogênico (Categoria E1), com risco de sangramento aceitável. Qual conjunto de condutas tem respaldo de \u003cstrong>Classe 2a\u003c/strong> nesse cenário?","a":["Trombólise sistêmica, cateter ou trombectomia","Anticoagulação isolada em UTI, sem intervenção","Embolectomia cirúrgica só com contraindicação","Dose reduzida de trombolítico, como rotina"],"c":0,"e":"Em E1 — hipotensão persistente ou recorrente com choque cardiogênico — a trombólise sistêmica é 2a (assim como em E2), e a trombólise por cateter e a trombectomia mecânica também são 2a, restritas a E1 (2b em D1–D2); a embolectomia cirúrgica segue a mesma lógica em E1. Anticoagulação isolada não é a estratégia preferida nesse cenário, a cirurgia não depende de contraindicação à trombólise, e a dose reduzida de trombolítico é opção 2b para reduzir sangramento, não conduta de rotina."},{"n":"🔴","levelName":"avancado","q":"Paciente com TEP sintomático, PESI classe IV, com \u003cstrong>disfunção de VD e troponina elevada\u003c/strong>, normotenso e sem sinais de hipoperfusão (Categoria C3). Como a diretriz AHA/ACC 2026 encara a \u003cstrong>trombólise sistêmica\u003c/strong> nesse cenário?","a":["Indicada de rotina, com redução da mortalidade comprovada","Benefício incerto: pode ser considerada, fora da rotina","Contraindicada pelo risco de hemorragia intracraniana","Reservada a quem tem contraindicação à anticoagulação"],"c":1,"e":"Em C3 a evidência para trombólise sistêmica é incerta (2b): pode ser considerada em casos selecionados, sem ser conduta de rotina, e a decisão costuma passar pela avaliação do PERT. O 3: Harm por sangramento maior e hemorragia intracraniana vale até C2; a partir de D1–D2 a trombólise pode ser considerada (2b) e em E1–E2 é razoável (2a). Em C3, a base do tratamento é anticoagulação plena com monitorização e reavaliação frequente para detectar deterioração."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
DATA.readmeHtml = "<p>Material de estudo de Urgência e Emergência (5º ano de medicina), no formato do site: resumos conceituais, quiz de múltipla escolha com correção imediata e questões abertas com autoavaliação.</p>\n<hr>\n<h2 id=\"h-como-usar-este-material\">Como usar este material</h2>\n<p><strong>1. Faça o diagnóstico antes de ler.</strong> Cada questão aberta tem um nível:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Marca</th><th>Nível</th><th>O que significa</th></tr></thead><tbody><tr><td>🟢</td><td><strong>Básico</strong></td><td>Conduta inicial e definições que não podem falhar.</td></tr><tr><td>🟡</td><td><strong>Intermediário</strong></td><td>Escolha entre condutas, doses e indicações.</td></tr><tr><td>🔴</td><td><strong>Avançado</strong></td><td>Cenário com armadilha, priorização e contraindicação.</td></tr></tbody></table></div>\n<p>Responda em voz alta antes de revelar a resposta. Acertar lendo é reconhecer; acertar respondendo é saber.</p>\n<p><strong>2. Use o quiz para medir.</strong> A aba <strong>Quiz</strong> corrige na hora. Erros entram em <strong>🔁 Revisar erros</strong>.</p>\n<p><strong>3. Deixe a revisão espaçada decidir a ordem.</strong> Tema com 90% ou mais de acerto volta em 14 dias; com 70% ou menos, em 3. A home marca o que está devendo.</p>\n<p><strong>4. Simulado mistura os temas</strong> e não entrega o gabarito até o fim — é o que mais se parece com a prova.</p>\n<h2 id=\"h-estrutura-dos-arquivos\">Estrutura dos arquivos</h2>\n<ul><li><code>NN-*.md</code> — resumos e questões abertas de um tema (a fonte de verdade do conteúdo);</li><li><code>quiz.json</code> — questões de múltipla escolha, com a chave do tema;</li><li><code>index.html</code>, <code>manifest.webmanifest</code>, <code>sw.js</code>, <code>icon-*.png</code> — <strong>gerados</strong> por <code>node build-site.mjs</code>; nunca editar à mão.</li></ul>\n<p>As regras completas de autoria e publicação estão no <code>README.md</code> da raiz do projeto.</p>";
const SKEY = 'estudos:' + DATA.siteKey;
const LETTERS = ['A','B','C','D','E'];

/* localStorage seguro: em modo privado do iOS o acesso pode lancar excecao,
   e sem esta guarda o site inteiro morreria com tela em branco. */
const LS = (function(){
  try {
    var t = '__probe__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return { ok: true, get: function(k){ return localStorage.getItem(k); },
             set: function(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
             del: function(k){ try { localStorage.removeItem(k); } catch(e){} } };
  } catch (e) {
    var mem = {};
    return { ok: false, get: function(k){ return k in mem ? mem[k] : null; },
             set: function(k,v){ mem[k] = String(v); },
             del: function(k){ delete mem[k]; } };
  }
})();

if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

var ordemRevisao = LS.get(SKEY + ':ordem') === '1';
function toggleOrdem(){
  ordemRevisao = !ordemRevisao;
  LS.set(SKEY + ':ordem', ordemRevisao ? '1' : '0');
  renderHome();
}
function getMark(t, i){ return LS.get(SKEY + ':' + t + ':' + i) || ''; }
function setMark(t, i, v){ var k = SKEY + ':' + t + ':' + i; if (v) LS.set(k, v); else LS.del(k); }
function getQuizAns(t, i){ var v = LS.get(SKEY + ':quiz:v3:' + t + ':' + i); return v === null ? null : +v; }
function setQuizAns(t, i, v){ LS.set(SKEY + ':quiz:v3:' + t + ':' + i, String(v)); }
function clearQuiz(t){
  var top = DATA.topics.find(function(x){ return x.id === t; });
  if (top) top.quiz.forEach(function(_, i){ LS.del(SKEY + ':quiz:v3:' + t + ':' + i); });
}
function topicProgress(t){
  var done = 0;
  t.cards.forEach(function(c, i){ if (getMark(t.id, i)) done++; });
  return { done: done, total: t.cards.length };
}
function quizProgress(t){
  var answered = 0, correct = 0;
  t.quiz.forEach(function(q, i){
    var a = getQuizAns(t.id, i);
    if (a !== null){ answered++; if (a === q.c) correct++; }
  });
  return { answered: answered, correct: correct, total: t.quiz.length };
}

/* ---------- codigo de progresso (transferencia entre aparelhos) ----------
   Empacota em bits: 2 por questao aberta (vazio/ok/parcial/errei) e 3 por
   questao de quiz (nao respondida + ate 5 alternativas). Resultado em
   base64url cabe folgado numa URL ou numa mensagem. */
var MARKS = ['', 'ok', 'meh', 'bad'];
function b64url(bytes){
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  var s = str.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function encodeProgress(){
  var bits = [];
  var push = function(val, n){ for (var b = n - 1; b >= 0; b--) bits.push((val >> b) & 1); };
  push(4, 8);                    // versao do formato (4 = com hash do conteudo)
  push(DATA.fp & 0xffff, 16);    // impressao digital do layout (temas e contagens)
  push(DATA.chash & 0xffff, 16); // hash do conteudo das questoes
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(_, i){ push(MARKS.indexOf(getMark(t.id, i)) < 0 ? 0 : MARKS.indexOf(getMark(t.id, i)), 2); });
  });
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(_, i){
      var a = getQuizAns(t.id, i);
      push(a === null ? 0 : Math.min(a + 1, 7), 3);
    });
  });
  var bytes = new Uint8Array(Math.ceil(bits.length / 8));
  for (var i = 0; i < bits.length; i++) if (bits[i]) bytes[i >> 3] |= 128 >> (i & 7);
  return b64url(bytes);
}
function decodeProgress(code){
  var bytes;
  try { bytes = unb64url(code.trim()); } catch (e) { return { error: 'Código inválido — confira se foi copiado por inteiro.' }; }
  var pos = 0;
  var read = function(n){ var v = 0; for (var k = 0; k < n; k++){ var bit = (bytes[pos >> 3] >> (7 - (pos & 7))) & 1; v = (v << 1) | bit; pos++; } return v; };
  var payload = 0;
  DATA.topics.forEach(function(t){ payload += t.cards.length * 2 + t.quiz.length * 3; });
  if (bytes.length * 8 < 24) return { error: 'Código incompleto para este material.' };
  var ver = read(8);
  if (ver !== 3 && ver !== 4) return { error: 'Código de formato antigo ou desconhecido — gere um novo na tela "Levar progresso".' };
  if (bytes.length * 8 < (ver === 4 ? 40 : 24) + payload) return { error: 'Código incompleto para este material.' };
  var fp = read(16);
  var chash = ver === 4 ? read(16) : null;
  var marks = [], quiz = [], nMarks = 0, nQuiz = 0, invalidas = 0;
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(_, i){ var v = read(2); marks.push([t.id, i, MARKS[v]]); if (v) nMarks++; });
  });
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(q, i){
      var v = read(3);
      // Alternativa fora do intervalo da questão: ignora, não aplica.
      if (v > 0 && v - 1 >= q.a.length){ invalidas++; return; }
      quiz.push([t.id, i, v]); if (v) nQuiz++;
    });
  });
  return {
    ver: ver,
    fpMatch: fp === (DATA.fp & 0xffff),
    conteudoOk: chash === null ? null : chash === (DATA.chash & 0xffff),
    marks: marks, quiz: quiz, nMarks: nMarks, nQuiz: nQuiz, invalidas: invalidas
  };
}
function applyProgress(p){
  p.marks.forEach(function(m){ setMark(m[0], m[1], m[2]); });
  p.quiz.forEach(function(q){ if (q[2] > 0) setQuizAns(q[0], q[1], q[2] - 1); else LS.del(SKEY + ':quiz:v3:' + q[0] + ':' + q[1]); });
}
function avisoVersao(p){
  if (p.ver === 3) return '\n\nObs.: código no formato antigo — não dá para conferir se o conteúdo das questões mudou desde então.';
  if (!p.fpMatch) return '\n\nATENÇÃO: este código foi gerado para uma versão diferente do material (temas ou quantidades mudaram). As marcações podem ficar trocadas.';
  if (p.conteudoOk === false) return '\n\nATENÇÃO: as questões foram reescritas desde que este código foi gerado. As marcações valem, mas as respostas do quiz podem não corresponder mais.';
  return '';
}
function notaInvalidas(p){
  return p.invalidas ? '\n\n' + p.invalidas + ' resposta(s) com alternativa fora do intervalo serão ignoradas.' : '';
}
// Aceita link (?p=...), código puro e o backup em JSON ({v, site, code}).
function extrairCodigo(raw){
  var link = raw.match(/[?&]p=([A-Za-z0-9_-]+)/);
  if (link) return { code: link[1] };
  var t = raw.trim();
  if (t.charAt(0) === '{'){
    var obj;
    try { obj = JSON.parse(t); } catch (e) { return { error: 'O texto parece um backup (.json), mas está corrompido — baixe de novo e tente importar.' }; }
    if (!obj || typeof obj.code !== 'string' || !obj.code.trim()) return { error: 'JSON sem o campo "code" — não parece um backup deste material.' };
    return { code: obj.code.trim(), site: typeof obj.site === 'string' ? obj.site : '' };
  }
  return { code: t };
}

/* ---------- desempenho por nivel ----------
   A media geral esconde o que importa: dar 90% no basico e 30% no avancado
   soma um numero confortavel que nao diz se voce esta pronto. */
var NIVEIS = ['🟢','🟡','🔴'];
var NOME_NIVEL = { '🟢':'Básico', '🟡':'Intermediário', '🔴':'Avançado' };

function statsNivel(topicoId){
  var acc = { '🟢':{ok:0,n:0,tot:0}, '🟡':{ok:0,n:0,tot:0}, '🔴':{ok:0,n:0,tot:0} };
  DATA.topics.forEach(function(t){
    if (topicoId && t.id !== topicoId) return;
    t.quiz.forEach(function(q, i){
      var nv = acc[q.n]; if (!nv) return;
      nv.tot++;
      var a = getQuizAns(t.id, i);
      if (a !== null){ nv.n++; if (a === q.c) nv.ok++; }
    });
  });
  return acc;
}
function barraPerf(st){
  var h = '';
  NIVEIS.forEach(function(nv){
    var s = st[nv];
    var pct = s.n ? Math.round(100 * s.ok / s.n) : 0;
    var cls = !s.n ? '' : pct >= 75 ? 'hi' : pct >= 50 ? 'mid' : 'lo';
    h += '<div class="perf-row"><span class="lv">' + nv + ' ' + NOME_NIVEL[nv] + '</span>' +
         '<span class="bar"><i class="' + cls + '" style="width:' + (s.n ? pct : 0) + '%"></i></span>' +
         '<span class="val">' + (s.n ? pct + '% (' + s.ok + '/' + s.n + ')' : '—') + '</span></div>';
  });
  return h;
}
function miniPerf(topicoId){
  var st = statsNivel(topicoId), partes = [];
  NIVEIS.forEach(function(nv){
    var s = st[nv];
    if (s.tot) partes.push(nv + ' ' + (s.n ? s.ok + '/' + s.n : '—'));
  });
  return partes.join(' · ');
}

/* ---------- o que precisa de revisao ---------- */
function quizErrados(){
  var out = [];
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(q, i){
      var a = getQuizAns(t.id, i);
      if (a !== null && a !== q.c) out.push({ t: t.id, i: i });
    });
  });
  return out;
}
function abertasRevisar(){
  var out = [];
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(c, i){
      var m = getMark(t.id, i);
      if (m === 'meh' || m === 'bad') out.push({ t: t.id, i: i, m: m });
    });
  });
  return out;
}

/* ---------- repeticao espacada leve ----------
   Sem virar Anki: guarda quando o tema foi tocado pela ultima vez e usa o
   desempenho para decidir quem esta devendo revisao primeiro. */
function marcarRevisao(tid){ LS.set(SKEY + ':rev:' + tid, String(Date.now())); }
function infoRevisao(t){
  var ts = LS.get(SKEY + ':rev:' + t.id);
  var qp = quizProgress(t);
  var acc = qp.answered ? qp.correct / qp.answered : null;
  if (!ts) return { dias: null, acc: acc, devendo: qp.answered > 0, prio: qp.answered ? 5 : 0 };
  var dias = Math.floor((Date.now() - (+ts)) / 86400000);
  // Desempenho ruim encurta o intervalo: 70% ou menos pede revisao em 3 dias.
  var limite = acc === null ? 7 : acc <= 0.7 ? 3 : acc <= 0.9 ? 7 : 14;
  return { dias: dias, acc: acc, devendo: dias >= limite, prio: dias / limite };
}
function temasDevendo(){
  return DATA.topics.filter(function(t){ return t.quiz.length && infoRevisao(t).devendo; });
}
function textoRevisao(t){
  var r = infoRevisao(t);
  if (r.dias === null) return '';
  if (r.dias === 0) return 'revisado hoje';
  if (r.dias === 1) return 'revisado ontem';
  return 'há ' + r.dias + ' dias';
}

function resumoGeral(){
  var r = { total:0, feitos:0, quizTotal:0, quizRespondido:0, quizAcertos:0, temas:0 };
  DATA.topics.forEach(function(t){
    var tocado = false;
    r.quizTotal += t.quiz.length;
    t.quiz.forEach(function(q,i){
      var a = getQuizAns(t.id,i);
      if (a !== null){ r.quizRespondido++; tocado = true; if (a === q.c) r.quizAcertos++; }
    });
    t.cards.forEach(function(_,i){ r.total++; if (getMark(t.id,i)){ r.feitos++; tocado = true; } });
    if (tocado) r.temas++;
  });
  r.total += r.quizTotal;
  r.feitos += r.quizRespondido;
  return r;
}

function proximaAcao(){
  var pendentes = quizErrados().length + abertasRevisar().length;
  if (pendentes) return { href:'#revisar', titulo:'Revisar o que ainda não fixou', texto:pendentes + ' questão(ões) pedindo uma nova tentativa.', botao:'Abrir revisão' };
  var devendo = temasDevendo();
  if (devendo.length) return { href:'#topic/' + devendo[0].id + '/quiz', titulo:'Revisar ' + devendo[0].shortTitle, texto:'Este tema chegou à data de revisão espaçada.', botao:'Revisar agora' };
  var emAndamento = DATA.topics.find(function(t){
    var qp = quizProgress(t);
    var marcadas = t.cards.reduce(function(n,_,i){ return n + (getMark(t.id,i) ? 1 : 0); },0);
    var feitos = qp.answered + marcadas, total = t.quiz.length + t.cards.length;
    return feitos > 0 && feitos < total;
  });
  if (emAndamento){
    var qp = quizProgress(emAndamento);
    var aba = qp.answered < emAndamento.quiz.length ? '/quiz' : '/questoes';
    return { href:'#topic/' + emAndamento.id + aba, titulo:'Continuar ' + emAndamento.shortTitle, texto:'Você já começou este tema. Feche o ciclo antes de abrir outro.', botao:'Retomar tema ' + emAndamento.id };
  }
  var novo = DATA.topics.find(function(t){
    return !t.quiz.some(function(_,i){ return getQuizAns(t.id,i) !== null; }) &&
      !t.cards.some(function(_,i){ return !!getMark(t.id,i); });
  });
  if (novo) return { href:'#topic/' + novo.id, titulo:'Começar por ' + novo.shortTitle, texto:'Leia o resumo e tente explicar os conceitos antes de abrir as respostas.', botao:'Começar tema ' + novo.id };
  return { href:'#simulado', titulo:'Testar retenção sem contexto', texto:'Você percorreu o material. Agora misture os temas para medir domínio real.', botao:'Abrir simulado' };
}

/* ---------- navegacao lateral ---------- */
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
  document.body.classList.remove('locked');
}
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('on');
  document.body.classList.add('locked');
}
document.getElementById('menuBtn').addEventListener('click', function(){
  var open = document.getElementById('sidebar').classList.contains('open');
  if (open) closeSidebar(); else openSidebar();
});
document.getElementById('scrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSidebar(); });

function renderSidebar(activeId){

function renderSync(){
  renderSidebar('sync');
