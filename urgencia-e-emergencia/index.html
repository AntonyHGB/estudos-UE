o 30:2. Ventilar demais eleva a pressão intratorácica e reduz o retorno venoso, e a capnografia de onda contínua confirma o tubo e ajuda a monitorar a qualidade."},{"n":"🔴","levelName":"avancado","q":"Após três choques, epinefrina e amiodarona, a FV persiste. Qual conduta tem \u003cstrong>utilidade não estabelecida\u003c/strong> nesse cenário?","a":["Buscar e tratar as causas reversíveis durante a reanimação","Mudança de vetor do choque e desfibrilação sequencial dupla","RCP de alta qualidade com checagem de ritmo a cada 2 minutos","Amiodarona ou lidocaína, conforme a sequência do algoritmo"],"c":1,"e":"A diretriz de 2025 marcou como utilidade não estabelecida a desfibrilação com mudança de vetor e a desfibrilação sequencial dupla na FV/TVSP refratária. As demais condutas são parte do algoritmo: RCP de alta qualidade, checagem a cada 2 minutos, antiarrítmico após o terceiro choque e busca das causas reversíveis. Em pacientes selecionados, a RCP extracorpórea e o cateterismo emergencial podem ser considerados, mas nunca de rotina."},{"n":"🔴","levelName":"avancado","q":"Paciente intubado em parada refratária: após 20 minutos de suporte avançado, o ETCO₂ não passa de 8 mmHg. Como esse dado deve pesar na decisão de término?","a":["Autoriza o término imediato quando confirmado duas vezes","É o critério decisivo para encerrar a reanimação do intubado","Só tem valor preditivo no paciente que não está intubado","Entra como componente de decisão multimodal, nunca isolado"],"c":3,"e":"A falha em atingir ETCO₂ acima de 10 mmHg após 20 minutos de suporte avançado, no paciente intubado, pode ser considerada como um componente de uma decisão multimodal — nunca como critério isolado. No paciente não intubado, um valor de corte de ETCO₂ não deve ser usado para indicar término, o que é uma recomendação contra (classe 3). A capnografia também confirma a via aérea e detecta o retorno da circulação, mas o término se decide pelo conjunto: tempo, ritmo, comorbidades, resposta fisiológica e aspectos éticos."}]},{"id":"03","fullTitle":"03 — Drogas e terapias elétricas de emergência","shortTitle":"Drogas e terapias elétricas de emergência","subtitle":"Desfibrilação, cardioversão sincronizada e marcapasso transcutâneo; e as drogas de emergência com dose, via e indicação. O tema é técnica: **quanto, por onde e como**.","toc":[{"id":"sec-1-terapias-elétricas","title":"1. Terapias elétricas"},{"id":"sec-2-drogas-de-emergência","title":"2. Drogas de emergência"},{"id":"sec-3-números-de-bolso","title":"3. Números de bolso"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-terapias-elétricas\">\u003ch2>1. Terapias elétricas\u003c/h2>\u003cp>Três ferramentas com lógicas diferentes:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Terapia\u003c/th>\u003cth>Sincronia\u003c/th>\u003cth>Para quê\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Desfibrilação\u003c/strong>\u003c/td>\u003ctd>assincronizada\u003c/td>\u003ctd>FV e TV sem pulso\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Cardioversão\u003c/strong>\u003c/td>\u003ctd>cronometrada no QRS\u003c/td>\u003ctd>ritmos com QRS identificável e comprometimento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Marcapasso transcutâneo\u003c/strong>\u003c/td>\u003ctd>estimulação contínua\u003c/td>\u003ctd>bradicardia sintomática refratária à atropina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A diferença que decide tudo: a \u003cstrong>desfibrilação não sincroniza\u003c/strong>; a \u003cstrong>cardioversão sincroniza no QRS\u003c/strong>; o \u003cstrong>marcapasso não choca\u003c/strong> — estimula.\u003c/p>\n\u003ch3 id=\"h-1-1-desfibrilação-choque-sem-sincronia\">1.1 Desfibrilação: choque sem sincronia\u003c/h3>\n\u003cp>O choque não é o que \"liga\" o coração de volta. Ele despolariza ao mesmo tempo um grande número de células do miocárdio e interrompe a atividade caótica; quem retoma o comando são os \u003cstrong>marcapassos naturais\u003c/strong> do próprio coração. Por isso a desfibrilação depende de um miocárdio que ainda responda — o que ela elimina é a FV ou a TV sem pulso, não a causa da parada.\u003c/p>\n\u003cul>\u003cli>É um choque \u003cstrong>assincronizado\u003c/strong>: em \u003cstrong>FV\u003c/strong> e na \u003cstrong>TV sem pulso\u003c/strong> não há QRS confiável para o aparelho reconhecer e disparar em cima.\u003c/li>\u003cli>\u003cstrong>Manual × automática (DEA):\u003c/strong> no desfibrilador manual, o profissional interpreta o ritmo e decide; no DEA, o aparelho analisa e orienta.\u003c/li>\u003cli>\u003cstrong>Eletrodos de adulto\u003c/strong> para \u003cstrong>&gt; 10 kg\u003c/strong> (aproximadamente \u003cstrong>&gt; 1 ano\u003c/strong>).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Energias (desfibrilação):\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aparelho\u003c/th>\u003cth>Energia\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Monofásico\u003c/td>\u003ctd>\u003cstrong>360 J\u003c/strong> em todos os choques\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bifásico\u003c/td>\u003ctd>conforme o \u003cstrong>fabricante\u003c/strong>; se desconhecido, a \u003cstrong>dose máxima\u003c/strong> disponível\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2º choque e seguintes\u003c/td>\u003ctd>equivalentes ao 1º; doses \u003cstrong>maiores podem ser consideradas\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Choque recorrente\u003c/td>\u003ctd>reiniciar no \u003cstrong>último nível que desfibrilou com sucesso\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Faixa usual citada para o primeiro choque bifásico: \u003cstrong>120–200 J\u003c/strong>. Não são rotina em 2025 — \u003cstrong>utilidade não estabelecida\u003c/strong>: desfibrilação com \u003cstrong>mudança de vetor\u003c/strong> (FV/TVSP refratária após ≥ 3 choques) e \u003cstrong>desfibrilação sequencial dupla\u003c/strong>.\u003c/p>\n\u003ch3 id=\"h-1-2-cardioversão-sincronizada-o-choque-no-qrs\">1.2 Cardioversão sincronizada: o choque no QRS\u003c/h3>\n\u003cp>A cardioversão dispara o choque \u003cstrong>cronometrado no QRS\u003c/strong>, para não incidir no \u003cstrong>período vulnerável da onda T\u003c/strong> — que poderia desencadear FV. Ela exige um \u003cstrong>QRS identificável\u003c/strong> e é usada quando o ritmo rápido compromete o paciente, ou quando vagais e drogas falharam ou são contraindicados.\u003c/p>\n\u003cp>\u003cstrong>Energia inicial (bifásico):\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ritmo\u003c/th>\u003cth>Energia inicial\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fibrilação atrial\u003c/td>\u003ctd>\u003cstrong>≥ 200 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flutter atrial\u003c/td>\u003ctd>\u003cstrong>200 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Taquicardia de QRS estreito\u003c/td>\u003ctd>\u003cstrong>100 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TV monomórfica\u003c/td>\u003ctd>\u003cstrong>100 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TV polimórfica\u003c/td>\u003ctd>\u003cstrong>choque não sincronizado de alta energia\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>O que não se sincroniza:\u003c/strong> ritmos desorganizados (\u003cstrong>TV polimórfica\u003c/strong>) e ritmos \u003cstrong>sem pulso\u003c/strong> (\u003cstrong>FV/TV sem pulso\u003c/strong>) — nesses, choque \u003cstrong>não sincronizado\u003c/strong>. Em 2025, a energia inicial da FA subiu para \u003cstrong>≥ 200 J\u003c/strong>: os valores baixos herdados da prática antiga ficaram para trás.\u003c/p>\n\u003cp>\u003cstrong>Técnica e cuidados:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Sedação sempre que possível\u003c/strong> — sem atrasar o choque do paciente crítico.\u003c/li>\u003cli>\u003cstrong>Reavaliar a sincronia após cada choque:\u003c/strong> o aparelho pode perder o sincronismo; se houver atraso e a condição for crítica, partir para \u003cstrong>choques não sincronizados\u003c/strong>.\u003c/li>\u003cli>Se o primeiro choque falhar, \u003cstrong>escalonar a energia\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Complicações possíveis:\u003c/strong> assistolia, bloqueio AV, bradicardia e \u003cstrong>FV pós-cardioversão\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-marcapasso-transcutâneo-tcp-estimular-não-chocar\">1.3 Marcapasso transcutâneo (TCP): estimular, não chocar\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Indicação:\u003c/strong> bradicardia sintomática que \u003cstrong>não responde à atropina\u003c/strong> ou na espera do marcapasso definitivo. Em paciente com sinais de choque e sem acesso vascular, \u003cstrong>começar o TCP imediatamente\u003c/strong>.\u003c/li>\u003cli>A \u003cstrong>corrente de estimulação é menor\u003c/strong> que a usada na desfibrilação e na cardioversão.\u003c/li>\u003cli>É \u003cstrong>doloroso\u003c/strong> — analgesia/sedação fazem parte do uso.\u003c/li>\u003cli>\u003cstrong>Confirmar as duas capturas:\u003c/strong>\u003cul>\u003cli>\u003cstrong>Elétrica:\u003c/strong> picos de estimulação antes de cada QRS.\u003c/li>\u003cli>\u003cstrong>Mecânica:\u003c/strong> pulso femoral palpável depois do QRS.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Erro comum:\u003c/strong> não reconhecer que \u003cstrong>não há captura\u003c/strong> e manter o paciente \"dependente\" de um estímulo que não gera contração.\u003c/li>\u003cli>Em 2025: na bradicardia persistente instável refratária a drogas, pode-se considerar \u003cstrong>marcapasso transvenoso temporário\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-a-técnica-do-choque-eletrodos-impedância-e-sequência\">1.4 A técnica do choque: eletrodos, impedância e sequência\u003c/h3>\n\u003cp>\u003cstrong>Eletrodos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Posição típica \u003cstrong>anterolateral\u003c/strong> (esterno-ápice); alternativa \u003cstrong>anteroposterior\u003c/strong> (ou infraescapular).\u003c/li>\u003cli>Em mulheres, \u003cstrong>elevar a mama esquerda\u003c/strong> para o eletrodo não apoiar no tecido mamário — eletrodo sobre a mama aumenta a impedância.\u003c/li>\u003cli>\u003cstrong>Remover adesivos transdérmicos e pomadas\u003c/strong> e limpar a pele — \u003cstrong>sem álcool\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Impedância transtorácica alta = choques falhos.\u003c/strong> Contato ruim, resíduo de adesivo e posição inadequada são causas corrigíveis.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Sequência:\u003c/strong>\u003c/p>\n\u003col>\u003cli>RCP \u003cstrong>contínua enquanto o desfibrilador carrega\u003c/strong>.\u003c/li>\u003cli>No carregamento, todos se afastam \u003cstrong>exceto quem comprime\u003c/strong>; o compressor solta ao final.\u003c/li>\u003cli>Checar ritmo chocável, avisar \u003cstrong>\"Liberar!\"\u003c/strong>, olhar \u003cstrong>360°\u003c/strong> e garantir \u003cstrong>oxigênio fora do tórax\u003c/strong>.\u003c/li>\u003cli>Aplicar o choque.\u003c/li>\u003cli>\u003cstrong>Retomar a RCP imediatamente\u003c/strong> — sem pausa para checar pulso. Se apareceu ritmo organizado, então checar pulso; sem pulso = AESP; dúvida = reiniciar RCP.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Pausa peri-choque longa custa sobrevida:\u003c/strong> pausas ≥ \u003cstrong>40 s\u003c/strong> estão associadas a menos sobrevida; mesmo \u003cstrong>4–5 s\u003c/strong> já derrubam as pressões de perfusão.\u003c/p>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-drogas-de-emergência\">\u003ch2>2. Drogas de emergência\u003c/h2>\u003ch3 id=\"h-2-1-vias-de-administração\">2.1 Vias de administração\u003c/h3>\n\u003cp>\u003cstrong>IV/IO — a preferida na parada:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Bolus rápido + 20 mL de flush.\u003c/strong> Em veia periférica, a droga leva cerca de \u003cstrong>1–2 min\u003c/strong> para chegar à circulação central — o flush é o que empurra o volume retido no cateter e na veia.\u003c/li>\u003cli>Em 2025: \u003cstrong>tentar IV primeiro\u003c/strong>; IO é aceitável se a IV falhar ou for inviável (a metanálise de 2025 mostrou menos RCE sustentado com IO do que com IV).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Via traqueal — não é rota recomendada:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>A \u003cstrong>AHA 2025 removeu\u003c/strong> a recomendação de administração de fármacos por via endotraqueal — a absorção é imprevisível.\u003c/li>\u003cli>Na parada: \u003cstrong>IV primeiro\u003c/strong>; \u003cstrong>IO quando a IV for inviável ou falhar\u003c/strong>. A via traqueal não é alternativa para administrar drogas.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-vasopressores-cronotrópicos-e-antídotos\">2.2 Vasopressores, cronotrópicos e antídotos\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>Dose e via\u003c/th>\u003cth>Uso principal\u003c/th>\u003cth>Cuidados\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Epinefrina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1 mg IV/IO\u003c/strong> na parada (10 mL de 1:10.000) + flush de 20 mL, a cada \u003cstrong>3–5 min\u003c/strong>; infusão \u003cstrong>2–10 mcg/min\u003c/strong>; pós-parada \u003cstrong>0,1–0,5 mcg/kg/min\u003c/strong>\u003c/td>\u003ctd>parada cardíaca; bradicardia e hipotensão sintomáticas; hipotensão pós-parada\u003c/td>\u003ctd>doses maiores não são recomendadas; não usar na mesma linha de soluções alcalinas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Norepinefrina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0,1–0,5 mcg/kg/min\u003c/strong> IV/IO contínuo\u003c/td>\u003ctd>hipotensão pós-parada, após bolus de fluido\u003c/td>\u003ctd>preferir veia central/grande; PA a cada 2–3 min até estabilizar, depois a cada 5 min; reduzir gradualmente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Dopamina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>5–20 mcg/kg/min\u003c/strong> IV contínuo (começar em 5; +5 a cada 2 min)\u003c/td>\u003ctd>bradicardia refratária à atropina, na espera do marcapasso; hipotensão pós-RCE\u003c/td>\u003ctd>corrigir hipovolemia antes; extravasamento causa necrose; reduzir gradualmente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Isoproterenol\u003c/strong>\u003c/td>\u003ctd>bolus \u003cstrong>20–60 mcg\u003c/strong> → \u003cstrong>10–20 mcg\u003c/strong>, ou infusão \u003cstrong>1–20 mcg/min\u003c/strong>\u003c/td>\u003ctd>bradicardia refratária à atropina; torsades refratária ao magnésio\u003c/td>\u003ctd>evitar em isquemia coronariana\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Atropina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1 mg IV em bolus\u003c/strong>, repetido a cada \u003cstrong>3–5 min\u003c/strong>, máximo \u003cstrong>3 mg\u003c/strong>\u003c/td>\u003ctd>primeira linha na bradicardia sintomática (sinusal, parada sinusal, bloqueio no nó AV)\u003c/td>\u003ctd>não usar doses menores nem infusão lenta (\u003cstrong>bradicardia paradoxal\u003c/strong>); provavelmente ineficaz em BAV 2º grau tipo II e 3º grau e em coração transplantado; cautela no SCA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Naloxona\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0,04–0,4 mg\u003c/strong> IV/IM/IO/SC a cada \u003cstrong>2–3 min\u003c/strong>; intranasal \u003cstrong>2 mg\u003c/strong> a cada \u003cstrong>3–5 min\u003c/strong>\u003c/td>\u003ctd>reversão de opioides, inclusive na suspeita de overdose\u003c/td>\u003ctd>o opioide costuma durar mais que a naloxona → repetir ou infundir e monitorar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-2-3-antiarrítmicos-e-controle-de-frequência\">2.3 Antiarrítmicos e controle de frequência\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>Dose e via\u003c/th>\u003cth>Uso principal\u003c/th>\u003cth>Cuidados\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Adenosina\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>6 mg IV rápido (1–3 s)\u003c/strong>; sem resposta em \u003cstrong>1–2 min\u003c/strong> → \u003cstrong>12 mg\u003c/strong> (pode repetir 12 mg uma vez); \u003cstrong>20 mL de SF\u003c/strong> após cada dose\u003c/td>\u003ctd>TSV regular estável; TSV instável na preparação da cardioversão; taquicardia de QRS largo regular monomórfica estável (auxílio diagnóstico)\u003c/td>\u003ctd>evitar em QRS largo instável, irregular ou polimórfico; \u003cstrong>metade da dose\u003c/strong> em dipiridamol, carbamazepina, transplantados ou via central; doses maiores em teofilina/cafeína\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Amiodarona\u003c/strong>\u003c/td>\u003ctd>TVp/FV refratária: \u003cstrong>300 mg IV/IO\u003c/strong> em bolus → \u003cstrong>150 mg\u003c/strong> se necessário; outras: \u003cstrong>150 mg em 10 min\u003c/strong> (repetível a cada 10 min) → \u003cstrong>10–50 mg/h por 24 h\u003c/strong>; total ≤ \u003cstrong>2,2 g/24 h\u003c/strong>\u003c/td>\u003ctd>TVp/FV refratária; TV monomórfica; controle de ritmo/frequência\u003c/td>\u003ctd>hipotensão, bradicardia e bloqueio AV; prolonga PR/QRS/QT; evitar em FA/flutter pré-excitado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lidocaína\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1–1,5 mg/kg IV/IO\u003c/strong>; repetir \u003cstrong>0,5–0,75 mg/kg\u003c/strong> a cada 5–10 min; cumulativa ≤ \u003cstrong>3 mg/kg\u003c/strong>; manutenção \u003cstrong>1–4 mg/min\u003c/strong>\u003c/td>\u003ctd>alternativa à amiodarona na TVp/FV refratária; TV monomórfica estável\u003c/td>\u003ctd>segunda linha na TV (menos eficaz que procainamida e amiodarona)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Procainamida\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>20–50 mg/min IV\u003c/strong> (ou \u003cstrong>100 mg a cada 5 min\u003c/strong>) até converter, hipotensão, \u003cstrong>QRS &gt; 50% mais largo\u003c/strong> ou dose total \u003cstrong>17 mg/kg\u003c/strong>; manutenção \u003cstrong>1–4 mg/min\u003c/strong>\u003c/td>\u003ctd>TV monomórfica\u003c/td>\u003ctd>monitorar ECG e PA; evitar em QT longo e insuficiência cardíaca\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sotalol\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1,5 mg/kg (100 mg) IV em 5 min\u003c/strong>\u003c/td>\u003ctd>TV monomórfica estável / taquicardia de QRS largo estável\u003c/td>\u003ctd>QT a cada \u003cstrong>2–4 h\u003c/strong>; se \u003cstrong>QT ≥ 0,5 s\u003c/strong>, reduzir ou interromper; evitar em QT longo, hipocalemia, IC e insuficiência renal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Magnésio\u003c/strong>\u003c/td>\u003ctd>sem pulso: \u003cstrong>1–2 g IV/IO em 5–20 min\u003c/strong>; com pulso: \u003cstrong>1–2 g em 50–100 mL por 5–60 min\u003c/strong>\u003c/td>\u003ctd>TV polimórfica com \u003cstrong>QT prolongado (torsades)\u003c/strong>; hipomagnesemia grave/cardiotoxicidade\u003c/td>\u003ctd>antídoto é o \u003cstrong>cálcio\u003c/strong>; \u003cstrong>não usar de rotina\u003c/strong> na parada (sem benefício com QT normal)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Betabloqueadores\u003c/strong>\u003c/td>\u003ctd>dose titulada conforme o agente\u003c/td>\u003ctd>TSV estável recorrente; controle de frequência em FA/flutter sem IC e sem pré-excitação\u003c/td>\u003ctd>não são rotina na 1ª hora pós-RCE; \u003cstrong>não associar BCC IV + betabloqueador IV\u003c/strong> (hipotensão grave)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>BCC — diltiazem\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>15–20 mg (0,25 mg/kg) em 2 min\u003c/strong>; repique \u003cstrong>20–25 mg (0,35 mg/kg)\u003c/strong>\u003c/td>\u003ctd>controle de frequência; TSV quando indicado\u003c/td>\u003ctd>evitar em hipotensão (PAS &lt; \u003cstrong>90\u003c/strong>), IC, QRS largo e pré-excitação; contraindicação em BAV 2º/3º grau\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>BCC — verapamil\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2,5–5 mg\u003c/strong> → \u003cstrong>5–10 mg\u003c/strong>, até \u003cstrong>20 mg\u003c/strong>\u003c/td>\u003ctd>idem\u003c/td>\u003ctd>mesmos cuidados; \u003cstrong>verapamil/diltiazem são dano\u003c/strong> na taquicardia de QRS largo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-2-4-como-escolher-onde-cada-droga-se-encaixa\">2.4 Como escolher: onde cada droga se encaixa\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Adenosina\u003c/strong> — primeira escolha na taquicardia regular de QRS estreito. Na taquicardia de QRS largo \u003cstrong>regular, monomórfica e estável\u003c/strong>, serve de auxílio diagnóstico: geralmente não afeta a TV, mas desacelera ou converte a TSV com aberrância.\u003c/li>\u003cli>\u003cstrong>Atropina\u003c/strong> — mais eficaz quando o bloqueio é \u003cstrong>no nó AV\u003c/strong> (QRS estreito); é improvável que funcione em bloqueio \u003cstrong>abaixo do nó\u003c/strong> (QRS largo), onde se prefere estimulação ou agonistas beta.\u003c/li>\u003cli>\u003cstrong>Antiarrítmicos de TV:\u003c/strong> \u003cstrong>procainamida, amiodarona e sotalol\u003c/strong> são primeira linha; \u003cstrong>lidocaína\u003c/strong> é segunda linha. Antes de associar um segundo antiarrítmico, consultar especialista.\u003c/li>\u003cli>\u003cstrong>Epinefrina\u003c/strong> — o vasopressor da parada e a infusão titulável da bradicardia/hipotensão.\u003c/li>\u003cli>\u003cstrong>Norepinefrina e dopamina\u003c/strong> — perfusão quando a hipotensão persiste depois do volume.\u003c/li>\u003cli>\u003cstrong>Isoproterenol\u003c/strong> — alternativa quando a atropina falha, inclusive no coração transplantado, em que a atropina é ineficaz.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-5-armadilhas-efeitos-adversos-e-o-que-não-é-rotina\">2.5 Armadilhas, efeitos adversos e o que não é rotina\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Magnésio não é rotina na parada\u003c/strong> — reservado à TV polimórfica com QT longo e a distúrbios específicos. Com QT normal, não há benefício.\u003c/li>\u003cli>\u003cstrong>Vasopressina não substitui nem supera a epinefrina\u003c/strong> (sem vantagem isolada ou combinada).\u003c/li>\u003cli>Na \u003cstrong>FV/TVSP refratária\u003c/strong>, \"mais vasopressor\" não é a resposta: betabloqueadores, bretílio, procainamida e sotalol têm \u003cstrong>benefício incerto\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>BCC IV + betabloqueador IV\u003c/strong> juntos: hipotensão grave — não associar.\u003c/li>\u003cli>\u003cstrong>Adenosina\u003c/strong> em ritmo \u003cstrong>instável, irregular ou polimórfico\u003c/strong>: risco de hipotensão, TV e FV — é dano nesse cenário.\u003c/li>\u003cli>\u003cstrong>Amiodarona\u003c/strong> em \u003cstrong>FA/flutter pré-excitado\u003c/strong>: evitar.\u003c/li>\u003cli>\u003cstrong>Naloxona:\u003c/strong> o efeito reverte, mas o opioide continua — vigiar e repetir.\u003c/li>\u003cli>\u003cstrong>Dopamina:\u003c/strong> extravasamento causa necrose; corrigir hipovolemia antes de começar.\u003c/li>\u003cli>\u003cstrong>Amiodarona em infusão:\u003c/strong> vigiar hipotensão e bradicardia/bloqueio AV; o QT prolonga.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-números-de-bolso\">\u003ch2>3. Números de bolso\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Número\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Desfibrilação monofásica\u003c/td>\u003ctd>\u003cstrong>360 J\u003c/strong> em todos os choques\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Desfibrilação bifásica\u003c/td>\u003ctd>fabricante; desconhecido → \u003cstrong>máximo\u003c/strong>; usual \u003cstrong>120–200 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FA / flutter\u003c/td>\u003ctd>\u003cstrong>≥ 200 J\u003c/strong> / \u003cstrong>200 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRS estreito / TV monomórfica\u003c/td>\u003ctd>\u003cstrong>100 J\u003c/strong> / \u003cstrong>100 J\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Via IV/IO\u003c/td>\u003ctd>bolus + \u003cstrong>20 mL\u003c/strong> de flush\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Via traqueal\u003c/td>\u003ctd>\u003cstrong>não é rota recomendada\u003c/strong> para drogas (AHA 2025); priorizar \u003cstrong>IV\u003c/strong> e, se inviável ou falha, \u003cstrong>IO\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adenosina\u003c/td>\u003ctd>\u003cstrong>6 mg → 12 mg\u003c/strong> (repetir 12 mg 1×), flush de 20 mL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amiodarona na parada\u003c/td>\u003ctd>\u003cstrong>300 mg → 150 mg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lidocaína\u003c/td>\u003ctd>\u003cstrong>1–1,5 mg/kg → 0,5–0,75 mg/kg\u003c/strong> (cumulativa ≤ 3 mg/kg)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Procainamida\u003c/td>\u003ctd>interromper se \u003cstrong>QRS &gt; 50% mais largo\u003c/strong>, hipotensão ou \u003cstrong>17 mg/kg\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sotalol\u003c/td>\u003ctd>interromper se \u003cstrong>QT ≥ 0,5 s\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atropina\u003c/td>\u003ctd>\u003cstrong>1 mg IV em bolus a cada 3–5 min\u003c/strong> (máximo 3 mg)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Epinefrina\u003c/td>\u003ctd>\u003cstrong>1 mg a cada 3–5 min\u003c/strong>; infusão \u003cstrong>2–10 mcg/min\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Norepinefrina / dopamina\u003c/td>\u003ctd>\u003cstrong>0,1–0,5\u003c/strong> / \u003cstrong>5–20 mcg/kg/min\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>","questionsIntroHtml":"\u003cp>Responda em voz alta antes de revelar. As respostas trazem o essencial: números, sequência e as armadilhas de cada intervenção.\u003c/p>","cards":[{"titleHtml":"🟢 Por que a desfibrilação é um choque assincronizado — e o que o choque faz com o coração?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque em \u003cstrong>FV\u003c/strong> e na \u003cstrong>TV sem pulso\u003c/strong> não se sincroniza: na FV não há QRS organizado para o aparelho reconhecer, e nos ritmos sem pulso a prioridade é chocar imediatamente. O choque não \"liga\" o coração: ele despolariza as células ao mesmo tempo e interrompe a atividade caótica, para que os \u003cstrong>marcapassos naturais\u003c/strong> retomem o ritmo. É o oposto da cardioversão, que cronometra o choque no QRS justamente para não incidir no período vulnerável da onda T.\u003c/p>"},{"titleHtml":"🟢 Onde ficam os eletrodos e qual preparo da pele reduz choques falhos?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Posição típica \u003cstrong>anterolateral\u003c/strong> (esterno-ápice), com alternativa \u003cstrong>anteroposterior\u003c/strong> (ou infraescapular); eletrodos de adulto para \u003cstrong>&gt; 10 kg\u003c/strong> (≈ \u003cstrong>&gt; 1 ano\u003c/strong>). Antes do choque: \u003cstrong>remover adesivos transdérmicos e pomadas\u003c/strong> e limpar a pele — \u003cstrong>sem álcool\u003c/strong>; em mulheres, \u003cstrong>elevar a mama esquerda\u003c/strong> para o eletrodo não apoiar no tecido mamário. \u003cstrong>Impedância transtorácica alta = choques falhos\u003c/strong>, então contato, posição e pele limpa são o preparo que evita falha.\u003c/p>"},{"titleHtml":"🟡 Monte a tabela de energias: desfibrilação e cardioversão.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Desfibrilação: monofásico \u003cstrong>360 J\u003c/strong> em todos os choques; bifásico conforme o fabricante e, se desconhecido, a \u003cstrong>dose máxima\u003c/strong> — faixa usual de \u003cstrong>120–200 J\u003c/strong>, com o 2º choque e os seguintes equivalentes ou maiores; no choque recorrente, usar o \u003cstrong>último nível que funcionou\u003c/strong>. Cardioversão: \u003cstrong>FA ≥ 200 J\u003c/strong>, \u003cstrong>flutter 200 J\u003c/strong>, \u003cstrong>taquicardia de QRS estreito 100 J\u003c/strong>, \u003cstrong>TV monomórfica 100 J\u003c/strong>; \u003cstrong>TV polimórfica\u003c/strong> e \u003cstrong>FV/TV sem pulso\u003c/strong> vão para \u003cstrong>choque não sincronizado\u003c/strong>.\u003c/p>"},{"titleHtml":"🟡 Como administrar drogas durante a parada — e qual é o papel da via traqueal?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Pela via \u003cstrong>IV/IO\u003c/strong>, bolus rápido seguido de \u003cstrong>20 mL de flush\u003c/strong>; em veia periférica, a droga leva cerca de \u003cstrong>1–2 min\u003c/strong> para chegar à circulação central. Em 2025, priorizar \u003cstrong>IV\u003c/strong>; \u003cstrong>IO\u003c/strong> quando a IV falhar ou for inviável. A \u003cstrong>via traqueal não é rota recomendada\u003c/strong>: o AHA 2025 removeu a administração de fármacos por via endotraqueal, pela absorção imprevisível — os esquemas antigos de dose traqueal não devem ser usados.\u003c/p>"},{"titleHtml":"🟡 Adenosina: qual é o esquema, quando ela ajuda e quando é perigosa?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>6 mg IV em bolus rápido (1–3 s)\u003c/strong>, seguidos de \u003cstrong>20 mL de SF\u003c/strong>; sem resposta em \u003cstrong>1–2 min\u003c/strong>, \u003cstrong>12 mg\u003c/strong> — que pode ser repetido uma vez. Ela ajuda na \u003cstrong>TSV regular estável\u003c/strong>, na TSV instável enquanto se prepara a cardioversão e como \u003cstrong>auxílio diagnóstico\u003c/strong> na taquicardia de QRS largo regular, monomórfica e estável. É perigosa (dano) no \u003cstrong>QRS largo instável, irregular ou polimórfico\u003c/strong> — pode causar hipotensão, TV e FV. Em dipiridamol, carbamazepina, transplantados ou via central, a dose inicial é \u003cstrong>metade\u003c/strong>; com teofilina ou cafeína, doses maiores.\u003c/p>"},{"titleHtml":"🔴 Caso: fibrilação atrial com instabilidade. Descreva a cardioversão — energia, sedação e o que reavaliar a cada choque.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Choque \u003cstrong>sincronizado\u003c/strong> com energia inicial \u003cstrong>≥ 200 J\u003c/strong> no bifásico (atualização de 2025; \u003cstrong>100 J\u003c/strong> é a energia da TV monomórfica e da taquicardia de QRS estreito). \u003cstrong>Sedação sempre que possível\u003c/strong>, sem atrasar o choque no paciente crítico; se o primeiro choque falhar, \u003cstrong>escalonar\u003c/strong>. Após \u003cstrong>cada\u003c/strong> choque, \u003cstrong>reavaliar a sincronia\u003c/strong> — o aparelho pode perder o sincronismo; se houver atraso na sincronização e o paciente estiver crítico, usar \u003cstrong>choques não sincronizados\u003c/strong>. Lembrar das complicações: assistolia, bloqueio AV, bradicardia e FV pós-cardioversão.\u003c/p>"},{"titleHtml":"🔴 Caso: bradicardia sintomática refratária à atropina; marcapasso transcutâneo instalado. Como confirmar que está funcionando — e o que costuma dar errado?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Confirmar as duas capturas: \u003cstrong>elétrica\u003c/strong> (picos de estimulação antes de cada QRS) e \u003cstrong>mecânica\u003c/strong> (pulso femoral palpável). O erro clássico é \u003cstrong>não reconhecer a ausência de captura\u003c/strong> e manter o paciente dependente de um estímulo ineficaz. O TCP usa corrente \u003cstrong>menor\u003c/strong> que a desfibrilação/cardioversão e é \u003cstrong>doloroso\u003c/strong> — analgesia e sedação fazem parte. Se a bradicardia persistir instável apesar das drogas, avaliar \u003cstrong>marcapasso transvenoso temporário\u003c/strong> (2025).\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual é a diferença entre \u003cstrong>desfibrilação\u003c/strong> e \u003cstrong>cardioversão sincronizada\u003c/strong>?","a":["A desfibrilação sincroniza o choque no QRS; a cardioversão não","As duas sincronizam o choque, e muda apenas a energia escolhida","A cardioversão sincroniza o choque no QRS; a desfibrilação não","A cardioversão trata a FV; a desfibrilação, a taquicardia estável"],"c":2,"e":"A cardioversão entrega o choque cronometrado no QRS, para não incidir no período vulnerável da onda T, e exige um QRS identificável para o aparelho sincronizar. A desfibrilação é assincronizada — é o choque da FV e da TV sem pulso, ritmos em que não se sincroniza. Trocar quem sincroniza, dizer que as duas sincronizam ou inverter as indicações (cardioversão na FV e desfibrilação na taquicardia estável) erra a definição e o uso de cada uma."},{"n":"🟢","levelName":"basico","q":"Na parada cardíaca, como se administra uma droga pela via \u003cstrong>IV/IO\u003c/strong>?","a":["Bolus fracionado em 5 min, seguido de flush de 20 mL de soro","Infusão lenta, seguida de 20 mL de flush para diluir a droga","Bolus rápido, seguido de 10 mL de flush, para limpar o cateter","Bolus rápido, seguido de 20 mL de flush e retomada da RCP"],"c":3,"e":"Na parada, a droga vai em bolus rápido seguido de 20 mL de flush, com a RCP mantida — esse volume empurra o medicamento da veia periférica até a circulação central, um trajeto que leva cerca de 1–2 min. Infundir lento, fracionar a dose em minutos ou reduzir o flush atrasam a chegada da droga, que é exatamente o que não se pode perder nesse cenário."},{"n":"🟡","levelName":"intermediario","q":"Qual é a regra de energia na desfibrilação em aparelhos \u003cstrong>monofásico\u003c/strong> e \u003cstrong>bifásico\u003c/strong>?","a":["Monofásico: 200 J; bifásico: 360 J fixos em qualquer tentativa","Monofásico: 360 J; bifásico: conforme o fabricante ou a dose máxima","Monofásico: 120 J; e no bifásico, conforme o fabricante ou dose máxima","Monofásico: 360 J; e no bifásico, 120 J fixos no primeiro choque"],"c":1,"e":"No monofásico, a energia é 360 J em todos os choques; no bifásico, segue o fabricante e, quando ele não informa, usa-se a dose máxima disponível, podendo o segundo choque e os seguintes serem equivalentes ou maiores. Por isso 120 J ou 200 J não são a regra do monofásico, e o bifásico não tem energia fixa: nem 120 J nem 360 J fixos correspondem à recomendação."},{"n":"🟡","levelName":"intermediario","q":"Na parada cardíaca, a \u003cstrong>punção venosa periférica\u003c/strong> falhou. Qual é a via para administrar as drogas?","a":["Insistir em novas punções venosas periféricas até obter o acesso","Administrar pela via traqueal, com dose igual ou maior que a IV","Trocar para a via intraóssea, puncionando a tíbia ou o úmero","Instilar a droga pela via traqueal, com 10 mL e a dose dobrada"],"c":2,"e":"Pela recomendação de 2025, a via traqueal não é mais rota para fármacos na parada: a ordem é IV primeiro e, se a IV falhar ou for inviável, a intraóssea — na tíbia ou no úmero. Insistir em novas punções periféricas só adia as drogas, e os esquemas antigos de via traqueal (dose igual ou maior, 10 mL de instilação) não devem mais ser usados. A absorção por essa via é imprevisível."},{"n":"🟡","levelName":"intermediario","q":"Qual preparo do tórax e dos eletrodos está correto antes de um choque?","a":["Remover os adesivos e as pomadas, e limpar a pele sem usar álcool","Limpar a pele com álcool e manter adesivos de medicação no tórax","Posição anterolateral, pele seca e adesivos transdérmicos mantidos","Passar álcool na pele e pôr o eletrodo sobre a mama esquerda"],"c":0,"e":"O preparo correto é remover adesivos transdérmicos e pomadas e limpar a pele — sem álcool — antes de aplicar os eletrodos, que vão na posição típica anterolateral; resíduos e contato ruim elevam a impedância transtorácica e favorecem choques falhos. Manter adesivos no tórax interpõe material entre a pele e o eletrodo, e apoiar o eletrodo no tecido mamário é o que se evita ao elevar a mama esquerda."},{"n":"🟡","levelName":"intermediario","q":"Qual achado exige interromper a infusão de \u003cstrong>procainamida\u003c/strong>?","a":["QT ≥ 0,5 s no monitor, hipocalemia ou dose total de 17 mg/kg","QRS &gt; 50% mais largo, hipotensão ou dose total de 17 mg/kg","QRS &gt; 50% mais largo, hipotensão ou dose total de 30 mg/kg","QT ≥ 0,5 s no monitor, hipocalemia ou dose total de 3 mg/kg"],"c":1,"e":"Na procainamida, a infusão é interrompida se o QRS alargar mais de 50% do basal, se houver hipotensão ou se a dose total atingir 17 mg/kg; a manutenção segue em 1–4 mg/min. O critério de QT ≥ 0,5 s na vigência de hipocalemia é do sotalol, e 3 mg/kg é o limite cumulativo da lidocaína — são números vizinhos, mas de outras drogas."},{"n":"🔴","levelName":"avancado","q":"Cardioversão sincronizada de \u003cstrong>fibrilação atrial\u003c/strong> com instabilidade: qual conduta descreve energia e técnica?","a":["50 J no bifásico, observando se é preciso ressincronizar após cada choque","≥200 J no bifásico, sem checar a sincronia entre os choques seguintes","100 J no bifásico, com sedação obrigatória antes de todos os choques","≥200 J no bifásico, com atenção para ressincronizar após cada choque"],"c":3,"e":"A energia inicial da fibrilação atrial é ≥200 J no bifásico (atualização de 2025) — 100 J corresponde à taquicardia de QRS estreito e à TV monomórfica, e 50 J fica abaixo até disso. Após cada choque sincronizado, o aparelho pode perder a sincronia, então a ressincronização precisa ser reavaliada antes do próximo. A sedação é desejável sempre que possível, mas não pode ser um requisito obrigatório que atrase o choque no paciente instável."},{"n":"🔴","levelName":"avancado","q":"No marcapasso transcutâneo, o que confirma que a estimulação está capturando o coração?","a":["Pico elétrico antes de cada QRS e pulso femoral palpável depois","Alívio dos sintomas, mesmo sem picos elétricos visíveis no monitor","Pico elétrico antes de cada QRS, mesmo sem pulso femoral presente","QRS estreito no monitor, independente do pulso femoral palpável"],"c":0,"e":"A captura tem duas faces: a elétrica, com o pico de estimulação antes de cada QRS, e a mecânica, com pulso femoral palpável depois dele. Ver o pico sem pulso é o erro clássico de tomar por captura um estímulo que não gera contração; alívio dos sintomas ou um QRS estreito no monitor não substituem a checagem do pulso. O TCP costuma ser doloroso, por isso analgesia e sedação fazem parte do uso."}]},{"id":"04","fullTitle":"04 — Bradiarritmias","shortTitle":"Bradiarritmias","subtitle":"FC baixa é sinal, não diagnóstico: quando tratar, onde a atropina falha e como confirmar a captura do marcapasso.","toc":[{"id":"sec-1-definição-e-classificação","title":"1. Definição e classificação"},{"id":"sec-2-tratamento-o-algoritmo","title":"2. Tratamento — o algoritmo"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-definição-e-classificação\">\u003ch2>1. Definição e classificação\u003c/h2>\u003ch3 id=\"h-1-1-o-corte-de-frequência\">1.1 O corte de frequência\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Bradicardia: FC &lt; 60 bpm\u003c/strong> no adulto.\u003c/li>\u003cli>Muitos toleram \u003cstrong>50–60 bpm\u003c/strong> sem queixa; os sintomas costumam aparecer \u003cstrong>abaixo de 50 bpm\u003c/strong>.\u003c/li>\u003cli>A pergunta que abre o algoritmo não é o número, e sim: \u003cstrong>a frequência é apropriada para a condição clínica?\u003c/strong>\u003c/li>\u003cli>Referência prática: \u003cstrong>FC abaixo de 50 bpm acompanhada de sinais ou sintomas moderados a graves geralmente requer tratamento\u003c/strong>.\u003c/li>\u003cli>Sem sintomas, não se trata — monitora-se. Trata-se o paciente, não o monitor.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-bradicardia-absoluta-relativa\">1.2 Bradicardia absoluta × relativa\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Absoluta:\u003c/strong> FC \u003cstrong>&lt; 60 bpm\u003c/strong> no ritmo de base — o problema está no próprio ritmo (doença do nó SA, betabloqueadores, bloqueios AV).\u003c/li>\u003cli>\u003cstrong>Relativa:\u003c/strong> FC \u003cstrong>&gt; 60 bpm\u003c/strong>, porém insuficiente para a demanda do momento — o problema está na demanda ou na causa (hipovolemia, choque, febre, dor).\u003c/li>\u003cli>Na relativa, a conduta é \u003cstrong>corrigir a causa\u003c/strong>; atropina não conserta demanda alta.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-ritmos-de-escape\">1.3 Ritmos de escape\u003c/h3>\n\u003cul>\u003cli>Quando o nó SA para ou o impulso não chega aos ventrículos, o sistema de condução assume com um \u003cstrong>ritmo de escape\u003c/strong>:\u003cul>\u003cli>\u003cstrong>juncional\u003c/strong> (nó AV): \u003cstrong>40–60 bpm\u003c/strong>, \u003cstrong>QRS estreito\u003c/strong>;\u003c/li>\u003cli>\u003cstrong>ventricular\u003c/strong> (Purkinje/miocárdio): \u003cstrong>20–40 bpm\u003c/strong>, \u003cstrong>QRS largo (≥ 0,12 s)\u003c/strong>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>A mesma frequência pode ocorrer nos dois — \u003cstrong>é a largura do QRS que indica quem está no comando\u003c/strong>.\u003c/li>\u003cli>Quanto mais baixo o escape, mais grave: o ventricular é o último recurso do coração e costuma vir com má perfusão.\u003c/li>\u003cli>Larguras de referência: \u003cstrong>QRS ≤ 0,11 s é normal\u003c/strong>; \u003cstrong>a partir de 0,12 s é largo\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Sem pulso não é bradicardia\u003c/strong> — é parada; siga o algoritmo da PCR (AESP).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-bloqueios-av-bav\">1.4 Bloqueios AV (BAV)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>1º grau:\u003c/strong> PR \u003cstrong>acima de 0,20 s\u003c/strong> (o normal é \u003cstrong>0,12–0,20 s\u003c/strong>), com todas as ondas P conduzindo. Há atraso, não pausa; por si só, não explica uma bradicardia sintomática.\u003c/li>\u003cli>\u003cstrong>2º grau Mobitz I (Wenckebach):\u003c/strong> o PR \u003cstrong>aumenta progressivamente\u003c/strong> até uma onda P deixar de conduzir; tende a ser um bloqueio \u003cstrong>no nó AV\u003c/strong>, com \u003cstrong>QRS estreito\u003c/strong>. Costuma ser menos ameaçador e responder à atropina.\u003c/li>\u003cli>\u003cstrong>2º grau Mobitz II:\u003c/strong> o PR permanece \u003cstrong>fixo\u003c/strong> e, de repente, uma P não conduz; tende a ser um bloqueio \u003cstrong>abaixo do nó\u003c/strong> (infranodal), com \u003cstrong>QRS largo\u003c/strong>, e \u003cstrong>pode evoluir de forma súbita para BAV total\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>2:1:\u003c/strong> apenas uma P conduz a cada duas; \u003cstrong>não há PRs consecutivos para comparar\u003c/strong>, então não dá para classificar em Mobitz I ou II apenas pelo traçado.\u003c/li>\u003cli>\u003cstrong>3º grau (BAV total):\u003c/strong> nenhuma P conduz — \u003cstrong>ondas P regulares dissociadas dos QRS\u003c/strong>; frequência e largura dependem do escape (juncional 40–60/estreito ou ventricular 20–40/largo); tem \u003cstrong>indicação de marcapasso permanente\u003c/strong>; se instável, trate como bradicardia sintomática grave.\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bloqueio\u003c/th>\u003cth>PR\u003c/th>\u003cth>Condução\u003c/th>\u003cth>Nível típico\u003c/th>\u003cth>O que esperar\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>1º grau\u003c/strong>\u003c/td>\u003ctd>acima de 0,20 s\u003c/td>\u003ctd>todas as P conduzem\u003c/td>\u003ctd>nó AV\u003c/td>\u003ctd>atraso sem pausa; pouco ameaçador\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>2º Mobitz I\u003c/strong>\u003c/td>\u003ctd>cresce a cada batimento\u003c/td>\u003ctd>uma P falha após \"desgaste\"\u003c/td>\u003ctd>nó AV\u003c/td>\u003ctd>costuma responder à atropina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>2º Mobitz II\u003c/strong>\u003c/td>\u003ctd>fixo\u003c/td>\u003ctd>falha súbita de uma P\u003c/td>\u003ctd>infranodal\u003c/td>\u003ctd>pode virar BAV total de repente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>3º grau\u003c/strong>\u003c/td>\u003ctd>sem relação com o QRS\u003c/td>\u003ctd>nenhuma P conduz\u003c/td>\u003ctd>variável\u003c/td>\u003ctd>marcapasso permanente\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-1-5-causas-para-procurar\">1.5 Causas para procurar\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Do coração:\u003c/strong> IAM, pericardite/miocardite, doença do nó SA, pós-transplante cardíaco.\u003c/li>\u003cli>\u003cstrong>Medicamentos:\u003c/strong> betabloqueadores, bloqueadores de cálcio, digoxina, amiodarona.\u003c/li>\u003cli>\u003cstrong>Fora do coração:\u003c/strong> hipotermia, hipotireoidismo, hipertensão intracraniana e tumores do SNC, reflexo do seio carotídeo, cirurgia ocular, apneia do sono, idade (degeneração do sistema de condução).\u003c/li>\u003cli>\u003cstrong>Reversíveis do atendimento (Hs e Ts):\u003c/strong> hipovolemia, hipóxia, hipotermia, hipo/hipercalemia, acidose, tamponamento, pneumotórax hipertensivo, TEP, SCA e toxinas.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-6-avaliação-do-paciente-sintomático\">1.6 Avaliação do paciente sintomático\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Sinais e sintomas moderados a graves\u003c/strong> (procurar ativamente): alteração aguda do estado mental, IC aguda, hipotensão, dor torácica isquêmica contínua, congestão pulmonar, falta de ar, sinais de choque, síncope/pré-síncope, pulsos fracos, fraqueza, diaforese, tontura, fadiga.\u003c/li>\u003cli>\u003cstrong>FC &lt; 50 bpm com esses achados geralmente requer tratamento.\u003c/strong>\u003c/li>\u003cli>Ao mesmo tempo: monitor, \u003cstrong>ECG de 12 derivações sem atrasar a terapia\u003c/strong>, O2 se a oxigenação estiver inadequada, acesso IV, glicemia se o estado mental estiver alterado.\u003c/li>\u003cli>Procurar e tratar a causa enquanto se decide a medida — bradicardia pode ser a primeira manifestação de IAM, hipóxia ou intoxicação.\u003c/li>\u003c/ul>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-tratamento-o-algoritmo\">\u003ch2>2. Tratamento — o algoritmo\u003c/h2>\u003ch3 id=\"h-2-1-quando-não-tratar\">2.1 Quando NÃO tratar\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Assintomático:\u003c/strong> nenhum tratamento específico; monitorar e investigar a causa.\u003c/li>\u003cli>\u003cstrong>Sintomático, mas estável:\u003c/strong> monitorar e reavaliar; se os sintomas forem intermitentes, considerar monitorização ambulatorial.\u003c/li>\u003cli>\u003cstrong>Bradicardia relativa:\u003c/strong> tratar a causa (volume, por exemplo) — não é caso de atropina.\u003c/li>\u003cli>\u003cstrong>Com choque e sem acesso venoso:\u003c/strong> \u003cstrong>estimulação transcutânea imediata\u003c/strong> — não esperar o acesso.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-2-atropina-primeira-linha-na-bradicardia-sintomática\">2.2 Atropina — primeira linha na bradicardia sintomática\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Dose: 1 mg IV em bolus, repetido a cada 3–5 minutos, com máximo de 3 mg\u003c/strong> (algoritmo AHA 2025 da bradicardia adulta).\u003c/li>\u003cli>\u003cstrong>Não usar doses menores nem infundir devagar:\u003c/strong> risco de \u003cstrong>bradicardia paradoxal\u003c/strong> — o efeito vira contra o objetivo.\u003c/li>\u003cli>\u003cstrong>Onde tende a funcionar:\u003c/strong> bradicardia sinusal, parada sinusal e bloqueio \u003cstrong>no nó AV\u003c/strong> (QRS estreito).\u003c/li>\u003cli>\u003cstrong>Onde tende a falhar:\u003c/strong> BAV de \u003cstrong>2º grau tipo II\u003c/strong> e de \u003cstrong>3º grau\u003c/strong> (lesão abaixo do nó, QRS largo) — nesses casos, preferir estimulação ou beta-adrenérgicos.\u003c/li>\u003cli>\u003cstrong>Coração transplantado:\u003c/strong> ineficaz (sem inervação vagal); \u003cstrong>isoproterenol\u003c/strong> é a opção citada, com a aminofilina aparecendo como alternativa à atropina.\u003c/li>\u003cli>\u003cstrong>Cautela na SCA.\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-3-se-a-atropina-não-resolver\">2.3 Se a atropina não resolver\u003c/h3>\n\u003cul>\u003cli>Escolher: \u003cstrong>estimulação transcutânea OU dopamina OU epinefrina OU isoproterenol\u003c/strong> — e considerar \u003cstrong>especialista\u003c/strong> e \u003cstrong>marcapasso transvenoso\u003c/strong>.\u003cul>\u003cli>\u003cstrong>dopamina:\u003c/strong> 5–20 mcg/kg/min (iniciar em 5 e aumentar 5 a cada 2 min, titulando pela PA);\u003c/li>\u003cli>\u003cstrong>epinefrina:\u003c/strong> 2–10 mcg/min titulada;\u003c/li>\u003cli>\u003cstrong>isoproterenol:\u003c/strong> 20–60 mcg em bolus → 10–20 mcg ou infusão de 1–20 mcg/min (evitar em isquemia coronariana).\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>AHA 2025:\u003c/strong> na bradicardia persistente instável refratária a drogas, pode ser aceitável avaliar o \u003cstrong>marcapasso transvenoso temporário\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-4-marcapasso-transcutâneo-tcp-não-basta-ligar-é-preciso-co\">2.4 Marcapasso transcutâneo (TCP) — não basta ligar, é preciso conferir\u003c/h3>\n\u003cul>\u003cli>Indicação: bradicardia sintomática que não responde à atropina ou na espera do definitivo; \u003cstrong>imediato no choque sem acesso\u003c/strong>.\u003c/li>\u003cli>A \u003cstrong>corrente de estimulação é menor\u003c/strong> que a de desfibrilação/cardioversão; sobe-se até capturar.\u003c/li>\u003cli>\u003cstrong>Captura elétrica:\u003c/strong> espículas antes de cada QRS.\u003c/li>\u003cli>\u003cstrong>Captura mecânica:\u003c/strong> \u003cstrong>pulso femoral\u003c/strong> — a prova de que o estímulo gerou contração.\u003c/li>\u003cli>\u003cstrong>Erro clássico:\u003c/strong> não reconhecer que \u003cstrong>não há captura\u003c/strong> e seguir com o paciente mal perfundido, confiando no monitor.\u003c/li>\u003cli>\u003cstrong>É doloroso:\u003c/strong> analgesia/sedação sempre que o contexto permitir.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-2-5-o-que-não-fazer\">2.5 O que não fazer\u003c/h3>\n\u003cul>\u003cli>Aplicar medidas de taquiarritmia (adenosina, cardioversão sincronizada, manobras vagais) em bradicardia.\u003c/li>\u003cli>Tratar assintomático, ou tratar bradicardia relativa como se fosse absoluta.\u003c/li>\u003cli>Fracionar atropina ou infundir lentamente — a dose é \u003cstrong>1 mg em bolus\u003c/strong>.\u003c/li>\u003cli>Esquecer a causa reversível — o número só melhora de verdade quando a causa é tratada.\u003c/li>\u003cli>Confiar no marcapasso sem checar pulso: \u003cstrong>captura elétrica ≠ captura mecânica\u003c/strong>.\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Paciente de 58 anos, assintomático, com FC de 56 bpm em ritmo sinusal e boa perfusão. Qual é a definição de bradicardia e por que este caso não exige tratamento?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Bradicardia é \u003cstrong>FC &lt; 60 bpm\u003c/strong>; muitos adultos toleram \u003cstrong>50–60 bpm\u003c/strong> sem sintomas, e é \u003cstrong>abaixo de 50\u003c/strong> que eles costumam aparecer. A decisão não sai do número isolado: a pergunta é se a frequência é apropriada para a condição clínica. Sinais ou sintomas moderados a graves (alteração aguda do estado mental, hipotensão, dor torácica isquêmica contínua, IC, sinais de choque, síncope/pré-síncope, pulsos fracos, fraqueza) com FC abaixo de 50 geralmente exigem tratamento. Sem sintomas, a conduta é monitorar e investigar causas — não administrar atropina.\u003c/p>"},{"titleHtml":"🟢 Descreva o ritmo de escape juncional e o ventricular: origem, frequência e largura do QRS. Em qual deles o paciente tende a ficar mais grave?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> O escape \u003cstrong>juncional\u003c/strong> nasce no nó AV: \u003cstrong>40–60 bpm\u003c/strong> e \u003cstrong>QRS estreito\u003c/strong>. O \u003cstrong>ventricular\u003c/strong> nasce nas fibras de Purkinje/miocárdio: \u003cstrong>20–40 bpm\u003c/strong> e \u003cstrong>QRS largo (≥ 0,12 s)\u003c/strong>. A mesma frequência pode ocorrer nos dois, então é a largura do QRS que separa um do outro. O ventricular é o escape mais lento e mais baixo na hierarquia — coração em último recurso, tipicamente com instabilidade —, enquanto o juncional costuma sustentar melhor o débito.\u003c/p>"},{"titleHtml":"🟡 Bradicardia sintomática: qual é o esquema da atropina, por que não se usam doses menores ou infusão lenta e em quais situações ela tende a falhar?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>1 mg IV em bolus, repetido a cada 3–5 minutos, com máximo de 3 mg\u003c/strong> (algoritmo AHA 2025 da bradicardia adulta). Doses menores ou administração lenta podem causar \u003cstrong>bradicardia paradoxal\u003c/strong>, piorando o quadro. A atropina tende a funcionar quando o problema está no nó SA ou no nó AV: bradicardia sinusal, parada sinusal e bloqueios de \u003cstrong>QRS estreito\u003c/strong>. Tende a falhar nos bloqueios \u003cstrong>abaixo do nó\u003c/strong> (BAV de 2º grau tipo II e de 3º grau com QRS largo) e no \u003cstrong>coração transplantado\u003c/strong>, pela ausência de inervação vagal. Nesses cenários, as opções preferidas são marcapasso transcutâneo ou beta-adrenérgicos — no transplantado, isoproterenol.\u003c/p>"},{"titleHtml":"🟡 A bradicardia sintomática persiste apesar da atropina em dose máxima. Quais são as opções do algoritmo e como se confirma que o marcapasso transcutâneo está capturando?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> As opções são \u003cstrong>estimulação transcutânea OU dopamina OU epinefrina OU isoproterenol\u003c/strong>, considerando também um especialista e o marcapasso transvenoso. Doses do algoritmo: dopamina \u003cstrong>5–20 mcg/kg/min\u003c/strong> (início em 5, aumentando 5 a cada 2 min), epinefrina \u003cstrong>2–10 mcg/min\u003c/strong> titulada e isoproterenol \u003cstrong>20–60 mcg\u003c/strong> em bolus, seguido de \u003cstrong>10–20 mcg\u003c/strong> ou infusão de \u003cstrong>1–20 mcg/min\u003c/strong>. No TCP, a captura elétrica aparece como espículas antes de cada QRS; a captura mecânica é confirmada pelo \u003cstrong>pulso femoral\u003c/strong>. Como o estímulo é doloroso, analgesia/sedação devem ser consideradas — e não reconhecer a falta de captura é o erro clássico.\u003c/p>"},{"titleHtml":"🔴 Homem de 72 anos chega sonolento, PA 62/40, FC de 36 bpm; o ECG mostra BAV de 2º grau tipo II com QRS largo, e ainda não há acesso venoso. Qual é a conduta imediata e por que a atropina não é a aposta principal aqui?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Com sinais de choque e \u003cstrong>sem acesso\u003c/strong>, inicia-se a \u003cstrong>estimulação transcutânea imediatamente\u003c/strong> — esperar o acesso para dar atropina atrasa a perfusão. Além disso, o BAV de 2º grau tipo II costuma ser um bloqueio \u003cstrong>abaixo do nó\u003c/strong>, no qual a atropina é pouco confiável, e há risco de progressão súbita para BAV total. O caminho é: TCP agora, acesso e drogas de apoio (dopamina, epinefrina ou isoproterenol), especialista e marcapasso transvenoso se necessário.\u003c/p>"},{"titleHtml":"🔴 Um traçado mostra BAV 2:1 com PR de 0,26 s nos batimentos conduzidos. Por que não se pode classificá-lo em Mobitz I ou II apenas por esse ECG, e por que isso importa?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> No 2:1 só há \u003cstrong>um PR a cada duas ondas P\u003c/strong> — sem PRs consecutivos, não dá para ver se o intervalo aumenta progressivamente (padrão do Mobitz I) nem confirmar a constância típica do Mobitz II. A classificação não sai do traçado isolado. Isso importa porque a expectativa muda: a resposta à atropina é mais provável se o bloqueio for nodal, enquanto um bloqueio infranodal (típico do Mobitz II) falha mais à atropina e pode evoluir de forma súbita para BAV total — o que pesa na escolha entre atropina e estimulação. Diante de instabilidade, trate como bradicardia sintomática grave, sem esperar a classificação.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Paciente de 62 anos chega com \u003cstrong>FC de 54 bpm\u003c/strong> em ritmo sinusal, PA 128/76, boa perfusão e assintomático. Qual é a conduta?","a":["Indicar marcapasso transvenoso pela frequência baixa, sem sintomas","Fornecer atropina IV, 1 mg em bolus, repetida a cada 3 a 5 minutos","Iniciar dopamina em infusão contínua agora, para subir a frequência","Apenas monitorar, pois é assintomática e não requer tratamento"],"c":3,"e":"A bradicardia assintomática não exige tratamento: a conduta é monitorar e buscar causas. O que costuma indicar tratamento é a FC abaixo de 50 bpm acompanhada de sinais ou sintomas moderados a graves. Atropina, dopamina e estimulação pertencem ao cenário sintomático — a atropina quando há sintomas persistentes, a dopamina e o marca-passo quando há instabilidade ou falha da atropina. Tratar o número, e não o paciente, expõe a riscos sem benefício esperado."},{"n":"🟢","levelName":"basico","q":"Paciente estável com \u003cstrong>FC de 45 bpm\u003c/strong>, ritmo regular, \u003cstrong>QRS estreito\u003c/strong> e nenhuma onda P visível no monitor. Qual é o ritmo mais provável?","a":["Ritmo de escape ventricular, com QRS largo e FC de 20 a 40","Ritmo de escape juncional, QRS estreito e FC de 40 a 60","Bloqueio AV total, com escape ventricular de QRS largo","Bradicardia sinusal, com ondas P ocultas pela linha de base"],"c":1,"e":"QRS estreito e frequência entre 40 e 60 por minuto definem o escape juncional, gerado no nó AV. O escape ventricular é mais lento (20 a 40 por minuto) e de QRS largo, incompatível com o traçado descrito. Bloqueio AV total exigiria ondas P regulares dissociadas dos QRS, e a bradicardia sinusal pressupõe ondas P identificáveis — nenhuma das duas explica um traçado sem P."},{"n":"🟡","levelName":"intermediario","q":"Na bradicardia sintomática, por que a atropina deve ser dada em \u003cstrong>1 mg em bolus\u003c/strong> e não em doses menores ou em infusão lenta?","a":["Doses baixas não atingem concentração útil no músculo cardíaco","Doses baixas saturam receptores e bloqueiam a dose seguinte","Doses baixas de atropina podem causar bradicardia paradoxal","Doses baixas têm meia-vida curta e exigem infusão contínua"],"c":2,"e":"Doses menores ou administradas lentamente podem causar bradicardia paradoxal — o oposto do efeito desejado. O esquema correto é 1 mg IV em bolus, repetido a cada 3 a 5 minutos, até o máximo de 3 mg. Concentração cardíaca insuficiente, saturação de receptores e meia-vida curta não explicam a regra, e não há indicação de infusão contínua de atropina na bradicardia."},{"n":"🟡","levelName":"intermediario","q":"Em qual destas situações a atropina costuma ser \u003cstrong>eficaz\u003c/strong> para melhorar a frequência cardíaca?","a":["Bradicardia sinusal, parada sinusal ou bloqueio no nó AV","BAV de 3º grau com escape ventricular lento de QRS largo","Coração transplantado, cuja inervação vagal está ausente","BAV de 2º grau tipo II com QRS largo, por lesão infranodal"],"c":0,"e":"A atropina funciona melhor quando o problema está no nó SA ou no nó AV — bradicardia sinusal, parada sinusal e bloqueios de QRS estreito. Bloqueios abaixo do nó (BAV de 2º grau tipo II e de 3º grau com QRS largo) respondem mal, e nesses casos a preferência é estimulação ou beta-adrenérgicos. No coração transplantado ela é ineficaz pela ausência de inervação vagal, sendo o isoproterenol a opção citada."},{"n":"🟡","levelName":"intermediario","q":"A bradicardia sintomática persiste apesar da \u003cstrong>atropina em dose máxima\u003c/strong>. Quais opções são adequadas enquanto se considera um especialista?","a":["Adenosina em bolus, cardioversão sincronizada ou manobras vagais","Estimulação transcutânea, dopamina, epinefrina ou isoproterenol","Amiodarona, betabloqueador ou bloqueador de cálcio intravenoso","Desfibrilação imediata e compressões contínuas até reavaliar o ritmo"],"c":1,"e":"Quando a atropina falha, o algoritmo oferece estimulação transcutânea ou dopamina (5 a 20 mcg/kg/min) ou epinefrina (2 a 10 mcg/min) ou isoproterenol, considerando também o marca-passo transvenoso. Adenosina, cardioversão e manobras vagais pertencem às taquiarritmias; amiodarona, betabloqueador e bloqueador de cálcio poderiam aprofundar a bradicardia; e desfibrilação com compressões é o algoritmo da parada, para o paciente sem pulso."},{"n":"🟡","levelName":"intermediario","q":"No marcapasso transcutâneo, o que confirma a \u003cstrong>captura mecânica\u003c/strong> e não apenas a elétrica?","a":["Espículas regulares antes de cada complexo QRS no monitor","Aumento da amplitude do QRS nas derivações do monitor","Melhora clínica visível logo após o começo do estímulo","Pulso femoral palpável sincronizado com cada estímulo"],"c":3,"e":"A captura elétrica corresponde às espículas do gerador antes de cada QRS; a mecânica é o estímulo que gera contração de verdade, confirmada pelo pulso — o femoral é o clássico. Melhora clínica e amplitude do QRS não confirmam captura por si sós. O erro comum é não reconhecer a ausência de captura e manter o paciente sem débito apesar do estímulo no monitor."},{"n":"🔴","levelName":"avancado","q":"Homem de 72 anos, sonolento, PA 62/40, FC de 36 bpm. O ECG mostra \u003cstrong>BAV de 2º grau tipo II\u003c/strong> com QRS largo. Ainda não há acesso venoso. Qual é a conduta imediata?","a":["Iniciar estimulação transcutânea sem esperar o acesso","Aplicar cardioversão sincronizada pelo QRS largo do ECG","Aguardar o acesso venoso para dar atropina e reavaliar","Administrar adenosina em bolus para esclarecer o ritmo"],"c":0,"e":"Na bradicardia com sinais de choque e sem acesso, a estimulação transcutânea deve começar de imediato — esperar o acesso atrasa a perfusão. Além disso, o BAV de 2º grau tipo II é um bloqueio abaixo do nó, no qual a atropina é pouco confiável mesmo com acesso disponível. Cardioversão sincronizada e adenosina são condutas de taquiarritmias e não revertem bradicardia."},{"n":"🔴","levelName":"avancado","q":"Um ECG com \u003cstrong>BAV 2:1\u003c/strong> mostra PR de 0,26 s antes de cada QRS conduzido. Por que não se classifica esse bloqueio em Mobitz I ou Mobitz II?","a":["Porque a pausa bloqueada apaga o PR da onda que falhou","Porque o PR fixo de 0,26 s já define sozinho o tipo II","Porque não há PRs seguidos para comparar a progressão","Porque o 2:1 costuma esconder uma onda P no QRS anterior"],"c":2,"e":"No bloqueio 2:1 só existe um intervalo PR a cada duas ondas P: sem PRs consecutivos, não dá para ver se o intervalo aumenta progressivamente (padrão de Mobitz I) nem afirmar a constância típica do tipo II. Por isso o traçado 2:1 não permite a classificação apenas pelos PRs. Supor o PR fixo como definição do tipo II, imaginar encurtamento progressivo ou atribuir a falha a uma onda P oculta não resolve essa impossibilidade de comparação."}]},{"id":"05","fullTitle":"05 — Taquiarritmias","shortTitle":"Taquiarritmias","subtitle":"Taquicardia com pulso: as perguntas que decidem a conduta — instável? QRS estreito ou largo? regular ou irregular? — e as doses, energias e contraindicações que separam o certo do quase.","toc":[{"id":"sec-1-abordagem-inicial","title":"1. Abordagem inicial"},{"id":"sec-2-instável-cardioversão-sincronizada","title":"2. Instável: cardioversão sincronizada"},{"id":"sec-3-qrs-estreito-regular-manobras-vagais-e-adenosina","title":"3. QRS estreito regular: manobras vagais e adenosina"},{"id":"sec-4-qrs-estreito-irregular-fa-flutter-e-mat","title":"4. QRS estreito irregular: FA, flutter e MAT"},{"id":"sec-5-qrs-largo-monomórfico","title":"5. QRS largo monomórfico"},{"id":"sec-6-qrs-largo-polimórfico-tv-polimórfica-e-torsades","title":"6. QRS largo polimórfico: TV polimórfica e torsades"},{"id":"sec-7-resumo-de-bolso","title":"7. Resumo de bolso"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-abordagem-inicial\">\u003ch2>1. Abordagem inicial\u003c/h2>\u003ch3 id=\"h-1-1-taquicardia-é-sinal-não-diagnóstico\">1.1 Taquicardia é sinal, não diagnóstico\u003c/h3>\n\u003cul>\u003cli>Definição didática: \u003cstrong>FC &gt; 100 bpm\u003c/strong>. Mas o número isolado não decide conduta: a primeira pergunta é se a frequência é apropriada para a condição clínica (febre, dor, hipovolemia, hipóxia, ansiedade).\u003c/li>\u003cli>\u003cstrong>A taquicardia mais comum no pronto-socorro é a sinusal\u003c/strong> — e o tratamento dela é a causa, não o antiarrítmico. Causas frequentes (Caixa 6.1): IAM agudo, febre, hipóxia, desidratação/hipovolemia, dor, infecção, hipertireoidismo, insuficiência cardíaca, TEP, choque, cafeína, nicotina, estimulantes (cocaína, anfetaminas) e medicamentos como epinefrina, atropina e dopamina.\u003c/li>\u003cli>Enquanto avalia o ritmo, procure e trate causas reversíveis (os Hs e Ts).\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-as-perguntas-na-ordem-certa\">1.2 As perguntas na ordem certa\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Tem pulso?\u003c/strong> Sem pulso → algoritmo de parada cardíaca; FV e TV sem pulso pedem desfibrilação. Este tema trata do paciente com pulso.\u003c/li>\u003cli>\u003cstrong>Está estável ou instável?\u003c/strong> Instabilidade é decisão clínica, não número de FC — mas a partir de ~\u003cstrong>150 bpm\u003c/strong> com sintomas graves o cenário costuma ser instável.\u003c/li>\u003cli>\u003cstrong>QRS estreito (≤ 0,11 s) ou largo (≥ 0,12 s)?\u003c/strong> Se largo: \u003cstrong>monomórfico ou polimórfico?\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Regular ou irregular?\u003c/strong>\u003c/li>\u003c/ol>\n\u003cp>Sinais e sintomas moderados a graves que definem instabilidade: estado mental agudamente alterado, insuficiência cardíaca aguda ou congestão pulmonar, hipotensão/choque, dor torácica isquêmica contínua, dispneia, síncope ou pré-síncope, pulsos fracos, diaforese e fraqueza.\u003c/p>\n\u003ch3 id=\"h-1-3-o-mapa-do-algoritmo\">1.3 O mapa do algoritmo\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cenário\u003c/th>\u003cth>Conduta central\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Instável, com pulso\u003c/td>\u003ctd>\u003cstrong>Cardioversão sincronizada\u003c/strong> (sedação se possível); adenosina só se regular e de QRS estreito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Estável, QRS estreito, regular\u003c/td>\u003ctd>Manobras vagais → adenosina → verapamil/diltiazem ou betabloqueador\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Estável, QRS estreito, irregular\u003c/td>\u003ctd>FA/flutter/MAT — conduta da seção 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Estável, QRS largo, monomórfico\u003c/td>\u003ctd>Adenosina diagnóstica; procainamida/amiodarona/sotalol\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRS largo polimórfico/torsades\u003c/td>\u003ctd>Tratar como instável → desfibrilação; magnésio se QT longo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sem pulso\u003c/td>\u003ctd>Algoritmo de parada cardíaca (fora do escopo deste tema)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-2-instável-cardioversão-sincronizada\">\u003ch2>2. Instável: cardioversão sincronizada\u003c/h2>\u003cul>\u003cli>Paciente \u003cstrong>com pulso + sinais de instabilidade\u003c/strong> → interromper a taquicardia com \u003cstrong>cardioversão sincronizada\u003c/strong>: o choque é disparado durante o QRS, evitando o período vulnerável da onda T, que poderia desencadear fibrilação ventricular.\u003c/li>\u003cli>\u003cstrong>Sedação se o tempo e as condições permitirem\u003c/strong> — ela nunca atrasa o choque de quem está degradando. Na TV polimórfica, avaliar o estado mental ao considerar a sedação, porque o choque não pode esperar.\u003c/li>\u003cli>Energias usuais em bifásico (seguir o fabricante; ~100 J para TV instável):\u003cul>\u003cli>Fibrilação atrial: \u003cstrong>≥ 200 J\u003c/strong>\u003c/li>\u003cli>Flutter atrial: \u003cstrong>200 J\u003c/strong>\u003c/li>\u003cli>Taquicardia de QRS estreito: \u003cstrong>100 J\u003c/strong>\u003c/li>\u003cli>TV monomórfica: \u003cstrong>100 J\u003c/strong>\u003c/li>\u003cli>TV polimórfica: \u003cstrong>não sincronizar\u003c/strong> — choque não sincronizado de alta energia (ajuste máximo do fabricante)\u003c/li>\u003c/ul>\u003c/li>\u003cli>Se o aparelho não sincronizar e a condição for crítica → aplicar \u003cstrong>choques não sincronizados\u003c/strong>.\u003c/li>\u003cli>Adenosina pode ser considerada se a taquicardia for regular e de QRS estreito, enquanto o desfibrilador é preparado — sem atrasar a cardioversão.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-qrs-estreito-regular-manobras-vagais-e-adenosina\">\u003ch2>3. QRS estreito regular: manobras vagais e adenosina\u003c/h2>\u003ch3 id=\"h-3-1-manobras-vagais\">3.1 Manobras vagais\u003c/h3>\n\u003cul>\u003cli>Massagem do seio carotídeo: \u003cstrong>5–10 s\u003c/strong>; pode repetir no lado oposto depois de \u003cstrong>1–2 min\u003c/strong>; \u003cstrong>nunca bilateral e simultânea\u003c/strong>; evitar em idosos, em quem já teve AVC e em quem tem sopro ou estenose carotídea.\u003c/li>\u003cli>Valsalva: \u003cstrong>15 s\u003c/strong>; contraindicada em IAM recente, estenose aórtica ou carotídea, glaucoma e retinopatia; limitar a cerca de \u003cstrong>2 tentativas\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>A elevação passiva das pernas durante a manobra aumenta a conversão\u003c/strong> — a Valsalva modificada reverte até \u003cstrong>43%\u003c/strong> das taquicardias supraventriculares.\u003c/li>\u003cli>Tenha à beira do leito oxigênio, sucção, desfibrilador e antiarrítmicos; monitore o ECG continuamente.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-2-adenosina\">3.2 Adenosina\u003c/h3>\n\u003cul>\u003cli>Droga inicial da taquicardia regular de QRS estreito: \u003cstrong>6 mg IV em bolus rápido (1–3 s)\u003c/strong>; sem resposta em 1–2 min → \u003cstrong>12 mg\u003c/strong>; pode repetir \u003cstrong>12 mg\u003c/strong> mais uma vez. Cada dose é seguida de \u003cstrong>flush de 20 mL\u003c/strong> de soro fisiológico.\u003c/li>\u003cli>Reduzir a dose à metade: dipiridamol, carbamazepina, coração transplantado e acesso venoso central.\u003c/li>\u003cli>Não usar se instável, irregular ou polimórfica — risco de hipotensão, TV e FV. Na TV de origem ventricular, geralmente não altera o ritmo; é por isso que no QRS largo ela tem papel diagnóstico, não terapêutico.\u003c/li>\u003cli>Se a adenosina falhar ou a arritmia recorrer: verapamil/diltiazem ou betabloqueador.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-3-3-wpw-para-não-cair-na-armadilha\">3.3 WPW, para não cair na armadilha\u003c/h3>\n\u003cul>\u003cli>Via acessória conecta átrios e ventrículos; no ritmo sinusal há \u003cstrong>PR curto + onda delta + QRS largo\u003c/strong>. Na taquicardia por reentrada (AVRT), o QRS costuma ser \u003cstrong>estreito\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Verapamil é contraindicado na taquicardia de QRS largo\u003c/strong>, exceto quando há certeza de origem supraventricular sem via acessória.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-qrs-estreito-irregular-fa-flutter-e-mat\">\u003ch2>4. QRS estreito irregular: FA, flutter e MAT\u003c/h2>\u003cul>\u003cli>\u003cstrong>Manobras vagais geralmente não convertem FA nem flutter\u003c/strong> — no máximo revelam o ritmo (por exemplo, as ondas F do flutter).\u003c/li>\u003cli>Fibrilação atrial e flutter: avaliar o CHA2DS2-VASc e decidir entre controle de frequência e de ritmo. \u003cstrong>Anticoagular antes da cardioversão quando a duração é &gt; 48 h ou desconhecida\u003c/strong>, e manter anticoagulação por \u003cstrong>pelo menos 4 semanas\u003c/strong> após a cardioversão.\u003c/li>\u003cli>\u003cstrong>MAT (taquicardia atrial multifocal):\u003c/strong> pelo menos \u003cstrong>3 focos\u003c/strong> atriais ectópicos. Tratar a causa (hipóxia, acidose, distúrbios eletrolíticos); \u003cstrong>não responde a vagais, adenosina nem cardioversão\u003c/strong>; para controle de frequência, metoprolol — evitá-lo em FEVE prejudicada ou doença broncoespástica, quando a amiodarona pode ser preferida.\u003c/li>\u003cli>Taquicardia sinusal: tratar a causa.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-qrs-largo-monomórfico\">\u003ch2>5. QRS largo monomórfico\u003c/h2>\u003cul>\u003cli>\"Taquicardia de complexo largo\": \u003cstrong>FC &gt; 150/min + QRS ≥ 0,12 s\u003c/strong>. Quatro mecanismos: origem ventricular, aberrância de condução (BRD/BRE), via acessória e marca-passo. \u003cstrong>Na dúvida, trate como TV.\u003c/strong>\u003c/li>\u003cli>Estável, regular e monomórfico: considerar \u003cstrong>adenosina para diagnóstico\u003c/strong> (geralmente não altera a TV; se for taquicardia supraventricular com aberrância, pode desacelerar ou converter) e monitorar o ECG continuamente.\u003c/li>\u003cli>Terminar farmacologicamente (TV provável): \u003cstrong>procainamida (20–50 mg/min), amiodarona ou sotalol são as opções de primeira linha\u003c/strong>; \u003cstrong>lidocaína é segunda linha\u003c/strong> (menos eficaz). Consultar o especialista antes de associar outro antiarrítmico.\u003c/li>\u003cli>\u003cstrong>Verapamil é contraindicado\u003c/strong> na taquicardia de QRS largo. \u003cstrong>Adenosina é contraindicada\u003c/strong> se instável, irregular ou polimórfica (pode causar hipotensão, TV ou FV).\u003c/li>\u003cli>Instável → sedação (se possível) + cardioversão sincronizada; na TV monomórfica, a energia usual é \u003cstrong>100 J\u003c/strong>.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-6-qrs-largo-polimórfico-tv-polimórfica-e-torsades\">\u003ch2>6. QRS largo polimórfico: TV polimórfica e torsades\u003c/h2>\u003cul>\u003cli>\u003cstrong>Toda TV polimórfica é considerada instável\u003c/strong> — hemodinâmica e eletricamente. Episódios podem recorrer, tornar-se sustentados ou degenerar em FV.\u003c/li>\u003cli>QRS de morfologias diferentes não permitem sincronização confiável → \u003cstrong>desfibrilação imediata com choque não sincronizado de alta energia\u003c/strong>. A desfibrilação costuma terminar o episódio, mas pode não evitar recorrências.\u003c/li>\u003cli>\u003cstrong>Torsades de pointes (QT longo):\u003c/strong> \u003cstrong>magnésio IV\u003c/strong>; suspender drogas que prolongam o QT; corrigir distúrbios eletrolíticos.\u003c/li>\u003cli>Recorrências na ausência de QT prolongado: lidocaína, amiodarona e tratamento da isquemia; \u003cstrong>magnésio de rotina não é indicado quando o QT é normal\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Adenosina não deve ser usada na TV polimórfica\u003c/strong> (pode degenerar para FV).\u003c/li>\u003cli>Conduta compatível com a \u003cstrong>AHA 2025\u003c/strong> (suporte avançado de vida em adultos): TV polimórfica é sempre instável → desfibrilação imediata; choque não sincronizado de alta energia; magnésio pode ser considerado nas torsades de pointes.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-7-resumo-de-bolso\">\u003ch2>7. Resumo de bolso\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>Papel e números-chave\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Adenosina\u003c/td>\u003ctd>TSV regular estreita: \u003cstrong>6 → 12 → 12 mg\u003c/strong>, bolus de \u003cstrong>1–3 s\u003c/strong>, flush de \u003cstrong>20 mL\u003c/strong>; diagnóstico na TV monomórfica estável\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verapamil / diltiazem\u003c/td>\u003ctd>Alternativa na TSV estreita após adenosina; \u003cstrong>contraindicados no QRS largo\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Betabloqueador\u003c/td>\u003ctd>Alternativa na TSV estreita; metoprolol na MAT (cautela em FEVE baixa/broncoespasmo)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Procainamida\u003c/td>\u003ctd>TV monomórfica estável: \u003cstrong>20–50 mg/min\u003c/strong> IV, primeira linha\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amiodarona / sotalol\u003c/td>\u003ctd>TV monomórfica estável (primeira linha); amiodarona também nas recorrências de polimórfica sem QT longo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lidocaína\u003c/td>\u003ctd>TV monomórfica: \u003cstrong>segunda linha\u003c/strong>; recorrências de polimórfica sem QT longo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Magnésio\u003c/td>\u003ctd>Torsades de pointes/QT longo; \u003cstrong>não\u003c/strong> de rotina com QT normal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Energias\u003c/td>\u003ctd>FA \u003cstrong>≥200 J\u003c/strong>; flutter \u003cstrong>200 J\u003c/strong>; QRS estreito \u003cstrong>100 J\u003c/strong>; TV monomórfica \u003cstrong>100 J\u003c/strong>; polimórfica = não sincronizado, alta energia\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Homem de 28 anos com palpitações súbitas, FC 190 bpm, taquicardia regular de QRS estreito sem ondas P, PA 124/78, consciente e orientado. Qual é a sequência de conduta inicial?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Estabelecer monitorização, oxigênio se indicado, acesso venoso e ECG de 12 derivações; como está estável, começar por \u003cstrong>manobras vagais\u003c/strong> (massagem carotídea de 5–10 s unilateral ou Valsalva de 15 s). Se não converter, \u003cstrong>adenosina 6 mg\u003c/strong> em bolus rápido com flush de 20 mL, subindo para \u003cstrong>12 mg\u003c/strong> se necessário (repetível uma vez). Se falhar ou recorrer, verapamil/diltiazem ou betabloqueador; cardioversão sincronizada fica reservada para instabilidade.\u003c/p>"},{"titleHtml":"🟢 Qual é a diferença prática entre cardioversão sincronizada e desfibrilação?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A \u003cstrong>cardioversão sincronizada\u003c/strong> é para o paciente \u003cstrong>com pulso e instável\u003c/strong>, quando existe QRS identificável para o aparelho sincronizar o choque (TV monomórfica, FA/flutter, algumas taquicardias de QRS estreito) — o choque cai durante o QRS, fora do período vulnerável da onda T. A \u003cstrong>desfibrilação\u003c/strong> é para \u003cstrong>sem pulso\u003c/strong> (FV/TV sem pulso) ou quando o QRS não é sincronizável, como na \u003cstrong>TV polimórfica\u003c/strong>: choque não sincronizado de alta energia. Energias usuais em bifásico: \u003cstrong>≥200 J\u003c/strong> para FA, \u003cstrong>200 J\u003c/strong> para flutter, \u003cstrong>100 J\u003c/strong> para TV monomórfica e taquicardia estreita.\u003c/p>"},{"titleHtml":"🟡 Qual é o esquema correto da adenosina e quando a dose deve ser reduzida à metade?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>6 mg\u003c/strong> IV em bolus rápido (\u003cstrong>1–3 s\u003c/strong>), seguido de \u003cstrong>flush de 20 mL\u003c/strong>; sem resposta em 1–2 min, \u003cstrong>12 mg\u003c/strong>; pode repetir \u003cstrong>12 mg\u003c/strong> uma vez. A dose cai à metade em uso de \u003cstrong>dipiridamol ou carbamazepina\u003c/strong>, em \u003cstrong>coração transplantado\u003c/strong> e quando o acesso é \u003cstrong>venoso central\u003c/strong>. Não usar em taquicardia instável, irregular ou polimórfica; na TV de origem ventricular a adenosina geralmente não altera o ritmo — serve para diagnóstico quando ela é regular, monomórfica e o
